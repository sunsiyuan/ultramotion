<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ultramotion — motion templates for AI agents</title>
<meta name="description" content="Open-source motion templates for AI agents. One prompt to a finished video, music included.">
<link rel="preload" href="assets/fonts/schibsted-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Schibsted Grotesk，SIL OFL 1.1（assets/fonts/OFL.txt）。可变字重，一个子集一个文件 */
@font-face { font-family: 'Schibsted Grotesk'; font-style: normal; font-weight: 400 700; font-display: swap;
  src: url(assets/fonts/schibsted-grotesk-latin-ext.woff2) format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
@font-face { font-family: 'Schibsted Grotesk'; font-style: normal; font-weight: 400 700; font-display: swap;
  src: url(assets/fonts/schibsted-grotesk-latin.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
:root { --wall: #1f1f23; --raised: #2a2a2f; --bone: #ecebe6; --dim: #9c9aa3; --hair: rgba(236,235,230,.12);
  --font: "Schibsted Grotesk", system-ui, "PingFang SC", sans-serif; }
* { box-sizing: border-box; }
html { background: var(--wall); }
body { margin: 0; color: var(--bone); font: 400 16px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--bone); outline-offset: 3px; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 0 32px; }

nav .wrap { display: flex; align-items: center; gap: 32px; height: 72px; font-size: 15px; }
.logo { font-weight: 700; font-size: 18px; letter-spacing: -.02em; margin-right: auto; }
nav .link { color: var(--dim); }
nav .link:hover { color: var(--bone); }
nav button { all: unset; cursor: pointer; color: var(--dim); }
nav button:hover { color: var(--bone); }

header .wrap { padding-top: 96px; display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 32px; }
h1, h2 { text-wrap: balance; }
h1 { margin: 0; font-size: clamp(48px, 7.2vw, 104px); font-weight: 500; line-height: .95; letter-spacing: -.045em; max-width: 9.5em; }
.lede { margin: 0 0 10px; max-width: 22em; color: var(--dim); font-size: 17px; }

/* 首屏的片子：每条下面一根真实的进度条和时间码 */
.reel { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-top: 72px; padding: 0 4px; }
.reel video { display: block; width: 100%; aspect-ratio: 9 / 16; object-fit: cover; border-radius: 10px; background: var(--raised); }
.reel .track { height: 2px; background: var(--hair); margin-top: 12px; }
.reel .track i { display: block; height: 100%; width: 0; background: var(--bone); }
.reel .cap { display: flex; justify-content: space-between; padding: 8px 2px 0; font-size: 13px; color: var(--dim); }
.reel .tc { font-variant-numeric: tabular-nums; }

section .wrap { padding-top: 144px; }
h2 { margin: 0 0 32px; font-size: clamp(28px, 3.2vw, 40px); font-weight: 500; letter-spacing: -.03em; line-height: 1.1; }

.styles { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 32px 20px; }
.style video { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 10px; background: var(--raised); }
.style p { display: flex; justify-content: space-between; margin: 14px 0 0; }
.style p span { color: var(--dim); font-size: 14px; }

.bench-style + .bench-style { margin-top: 112px; }
.bench-style > h3 { margin: 0 0 6px; font-size: 26px; font-weight: 500; letter-spacing: -.02em; }
.prompt { margin: 0 0 32px; font-size: 14px; color: var(--dim); }
.prompt summary { cursor: pointer; list-style: none; display: inline-block; }
.prompt summary::-webkit-details-marker { display: none; }
.prompt summary:hover { color: var(--bone); }
.prompt p { margin: 12px 0 0; max-width: 64ch; white-space: pre-line; line-height: 1.6; padding-left: 14px; border-left: 1px solid var(--hair); }
.bench { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; }
.bench h3 { margin: 0 0 16px; font-size: 17px; font-weight: 500; }
.bench h3 span { color: var(--dim); font-weight: 400; margin-left: 8px; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pair video { display: block; width: 100%; aspect-ratio: 9 / 16; object-fit: cover; border-radius: 10px; background: #000; }
.pair p { margin: 10px 0 0; font-size: 13px; color: var(--dim); }
.pair .with p { color: var(--bone); }

/* 声音：视频都静音自动播（浏览器只允许这样），右下角喇叭点了才出声，同一时间只响一条 */
.vid { position: relative; display: block; }
.snd { all: unset; position: absolute; right: 10px; bottom: 10px; width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
  display: grid; place-items: center; background: rgba(31,31,35,.62); color: var(--bone); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.snd:hover { background: rgba(31,31,35,.85); }
.snd svg { width: 18px; height: 18px; }
.snd .on, .snd[aria-pressed=true] .off { display: none; }
.snd[aria-pressed=true] .on { display: block; }

.install { display: flex; align-items: center; gap: 24px; max-width: 640px; border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair); padding: 18px 0; }
.install code { flex: 1; font: 15px ui-monospace, "SF Mono", Menlo, monospace; overflow-x: auto; white-space: nowrap; }
.install button { all: unset; cursor: pointer; font-weight: 500; }
footer .wrap { padding: 144px 32px 48px; display: flex; justify-content: space-between; color: var(--dim); font-size: 14px; }

@media (max-width: 900px) {
  header .wrap { grid-template-columns: 1fr; padding-top: 48px; }
  .reel { grid-template-columns: repeat(6, 44vw); overflow-x: auto; scroll-snap-type: x mandatory; margin-top: 40px; }
  .reel > div { scroll-snap-align: start; }
  .bench { grid-template-columns: 1fr; gap: 48px; }
  nav .link { display: none; }
  section .wrap { padding-top: 96px; }
}
</style>
</head><body>
<nav><div class="wrap">
  <a class="logo" href="#">ultramotion</a>
  <a class="link" href="#styles" data-t="navStyles"></a><a class="link" href="#benchmark" data-t="navBench"></a>
  <button id="lang"></button><a class="link" href="https://github.com/sunsiyuan/ultramotion">GitHub</a>
</div></nav>

<header><div class="wrap"><h1 data-t="h1"></h1><p class="lede" data-t="lede"></p></div></header>
<div class="reel" id="reel"></div>

<section id="styles"><div class="wrap">
  <h2 data-t="styles"></h2>
  <div class="styles" id="styleCards"></div>
</div></section>

<section id="benchmark"><div class="wrap">
  <h2 data-t="bench"></h2>
  <div id="benchAll"></div>
</div></section>

<section id="install"><div class="wrap">
  <h2 data-t="install"></h2>
  <div class="install"><code>npx skills add sunsiyuan/ultramotion</code><button id="copy" data-t="copy"></button></div>
</div></section>

<footer><div class="wrap"><span>ultramotion</span><a href="https://github.com/sunsiyuan/ultramotion">GitHub</a></div></footer>

<script>
const T = {
  en: { navStyles: 'Styles', navBench: 'Benchmark', h1: 'Motion templates for AI agents.', lede: 'Open source. One prompt to a finished video, music included.',
        styles: 'Styles', bench: 'Same prompt, without and with the skill',
        without: 'Without skill', with: 'With skill',
        viewPrompt: 'View the prompt', install: 'Install', copy: 'Copy', copied: 'Copied', other: '中文', soundOn: 'Play with sound', soundOff: 'Mute',
        clips: ['Title', 'Gig promo', 'App UI', 'Quote card', 'Data', 'Countdown'] },
  zh: { navStyles: '风格', navBench: '对比', h1: '给 AI 用的动效模板', lede: '开源。一句话，做出带配乐的完整视频。',
        styles: '风格', bench: '同一句提示词，没使用 skill 和使用 skill',
        without: '没使用 skill', with: '使用 skill',
        viewPrompt: '查看提示词', install: '安装', copy: '复制', copied: '已复制', other: 'EN', soundOn: '打开声音', soundOff: '静音',
        clips: ['片头', '演出宣传', 'App 界面', '引语卡', '数据', '倒数'] },
};
let lang = new URLSearchParams(location.search).get('lang') || localStorage.getItem('lang') || 'en';
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;     // 要求少动画时，视频不自动播
const play = v => { if (!still) v.play().catch(() => {}); };

// 声音：每条视频包一层，右下角放一个喇叭。点开一条，其余全部静音；点开的那条从头放（对比测试那一块四条一起从头放）
const ICON = '<svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m22 9-6 6m0-6 6 6"/></svg>'
  + '<svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
function muteAll() {
  document.querySelectorAll('video').forEach(v => { v.muted = true; });
  document.querySelectorAll('.snd').forEach(b => { b.setAttribute('aria-pressed', 'false'); b.setAttribute('aria-label', T[lang].soundOn); });
}
function addSound(root) {
  root.querySelectorAll('video:not([data-snd])').forEach(v => {
    v.dataset.snd = 1;
    const wrap = document.createElement('span'); wrap.className = 'vid'; v.before(wrap); wrap.append(v);
    const b = document.createElement('button'); b.className = 'snd'; b.innerHTML = ICON;
    b.setAttribute('aria-pressed', 'false'); b.setAttribute('aria-label', T[lang].soundOn); wrap.append(b);
    b.onclick = e => {
      e.preventDefault(); e.stopPropagation();
      const was = !v.muted; muteAll(); if (was) return;
      const block = v.closest('[data-bench]');
      if (block) block.restart(); else { v.currentTime = 0; v.play().catch(() => {}); }
      v.muted = false; b.setAttribute('aria-pressed', 'true'); b.setAttribute('aria-label', T[lang].soundOff);
    };
  });
}

// 风格表：网站上跟风格有关的东西都从这里读，加一个风格 = 加一行。
// 片子按语言换文件：v.en / v.zh 是文件名后缀（液态玻璃原版是中文、英文版带 -en；动感排版原版是英文、中文版带 -zh）。
// bench：对比测试做完、导出到 assets/compare/<id>/ 之后才设 true
const STYLES = [
  { id: 'liquid-glass', name: { en: 'Liquid Glass', zh: '液态玻璃' }, meta: { en: '9:16, 120 BPM', zh: '9:16，120 BPM' }, v: { en: '-en', zh: '' }, cover: ['showcase', 8.6], bench: true },
  { id: 'kinetic-type', name: { en: 'Kinetic Type', zh: '动感排版' }, meta: { en: '9:16, 128 BPM', zh: '9:16，128 BPM' }, v: { en: '', zh: '-zh' }, cover: ['showcase', 2.2], bench: true },
];
const STYLE = Object.fromEntries(STYLES.map(s => [s.id, s]));
// 首屏：两个风格的片子穿插着放，每条从有内容的那一秒开始；最后一个值 = 这条没有分语言的版本（画面里没字）
const CLIPS = [['liquid-glass', 'opener', 1.4], ['kinetic-type', 'showcase', 2.2], ['liquid-glass', 'search', 2.9],
               ['kinetic-type', 'quote', 4.2], ['liquid-glass', 'data', 4.6], ['kinetic-type', 'countdown', 1.4]];
document.getElementById('styleCards').innerHTML = STYLES.map(st => `<a class="style" href="https://github.com/sunsiyuan/ultramotion/tree/main/skills/${st.id}">
  <video data-style="${st.id}" data-clip="${st.cover[0]}" data-t0="${st.cover[1]}" muted loop playsinline data-auto></video>
  <p><b data-name="${st.id}"></b><span data-meta="${st.id}"></span></p></a>`).join('');
const reel = document.getElementById('reel');
reel.innerHTML = CLIPS.map(([st, n, t]) => `<div><video data-style="${st}" data-clip="${n}" data-t0="${t}" muted loop playsinline data-auto></video>
  <div class="track"><i></i></div><div class="cap"><span></span><span class="tc"></span></div></div>`).join('');
addSound(document.getElementById('styleCards')); addSound(reel);
const mmss = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
(function tick() {
  reel.querySelectorAll(':scope > div').forEach(d => {
    const v = d.querySelector('video'); if (!v.duration) return;
    d.querySelector('i').style.width = (v.currentTime / v.duration * 100) + '%';
    d.querySelector('.tc').textContent = `${mmss(v.currentTime)} / ${mmss(v.duration)}`;
  });
  requestAnimationFrame(tick);
})();
// 片子跟着语言换文件
function setClips() {
  document.querySelectorAll('video[data-clip]').forEach(v => {
    const st = STYLE[v.dataset.style], src = `assets/${st.id}/${v.dataset.clip}${st.v[lang]}.mp4#t=${v.dataset.t0}`;
    if (v.getAttribute('src') !== src) { v.src = src; play(v); }
  });
}

// 对比：每个做过对比测试的风格一块，依次排下来（风格名 · 提示词 · 两组四条视频）。
// 一块里的四条一起从头放，短的停在最后一帧，等四条都放完再一起重来。
// 只放视频，不放数字
const bench = {};                                     // 风格 → 已经读到的那份对比数据
function renderBench() {
  const t = T[lang], list = STYLES.filter(st => st.bench && bench[st.id]);
  document.getElementById('benchAll').innerHTML = list.map(st => `<div class="bench-style" data-bench="${st.id}"><h3>${st.name[lang]}</h3>
    <details class="prompt"><summary>${t.viewPrompt}</summary><p></p></details><div class="bench">${bench[st.id].map(g => {
      const [agent, model] = g.name.split('·').map(x => x.trim());
      return `<div><h3>${agent}<span>${model}</span></h3><div class="pair">
        <div><video src="${g.before.video}" muted playsinline></video><p>${t.without}</p></div>
        <div class="with"><video src="${g.after.video}" muted playsinline></video><p>${t.with}</p></div>
      </div></div>`;
    }).join('')}</div></div>`).join('');
  list.forEach(st => {
    const block = document.querySelector(`[data-bench="${st.id}"]`);
    block.querySelector('.prompt p').textContent = bench[st.id][0].prompt;
    const vs = [...block.querySelectorAll('video')], restart = () => vs.forEach(v => { v.currentTime = 0; v.play().catch(() => {}); });
    block.restart = restart;
    vs.forEach(v => v.addEventListener('ended', () => { if (vs.every(x => x.ended)) restart(); }));
    if (!still) restart();
  });
  addSound(document.getElementById('benchAll'));
}

function apply() {
  const t = T[lang];
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = t[el.dataset.t]);
  reel.querySelectorAll('.cap span:first-child').forEach((el, i) => el.textContent = t.clips[i]);
  document.querySelectorAll('[data-name]').forEach(el => el.textContent = STYLE[el.dataset.name].name[lang]);
  document.querySelectorAll('[data-meta]').forEach(el => el.textContent = STYLE[el.dataset.meta].meta[lang]);
  document.getElementById('lang').textContent = t.other;
  muteAll();
  setClips();
  loadBench();
}
// 对比数据按 风格 + 语言 读：assets/compare/<风格>/compare.<语言>.json，没有英文那份就退回中文
function loadBench() {
  const want = STYLES.filter(st => st.bench);
  Promise.all(want.map(st => {
    const base = `assets/compare/${st.id}/compare.`;
    return fetch(base + lang + '.json').then(r => r.ok ? r.json() : fetch(base + 'zh.json').then(r => r.json())).then(g => { bench[st.id] = g; });
  })).then(renderBench);
}
document.getElementById('lang').onclick = () => { lang = lang === 'en' ? 'zh' : 'en'; localStorage.setItem('lang', lang); apply(); };
document.getElementById('copy').onclick = e => { navigator.clipboard.writeText(document.querySelector('.install code').textContent); e.target.textContent = T[lang].copied; };
apply();
</script>
</body></html>
