<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>中国每年出生多少人 · 1949—2025</title>
<style>html,body{margin:0;background:#f2eee6}canvas{display:block;width:100vw;height:100vh;object-fit:contain}</style></head>
<body><canvas></canvas>
<script src="../trend.js"></script>
<script>
const T = Trend, { seg, oc, io, cl, lerp } = T;
window.__scene = T.withData(['data/births-china.json'], ([D]) => {
  const S = D.series, B = Object.fromEntries(S), W = 1080, H = 1920;
  const PAPER = '#f2eee6', INK = '#1b1a18', GREY = '#c4bcae', RED = '#c8372d', MUTE = 'rgba(27,26,24,.5)', SERIF = '"Songti SC", "STSong", serif';
  // a year of data per column; the column for year y grows while the clock runs from y to y + 1
  const E = T.create({ width: W, height: H, time: [
    [0, 1949.0], [2.6, 1949.5], [5.0, 1958.6], [8.0, 1962.0], [10.0, 1964.0], [12.0, 1964.0],
    [14.6, 1979.8], [16.0, 1981.0], [17.6, 1988.0], [19.6, 1988.0], [22.2, 2016.2], [23.6, 2017.0], [27.6, 2026.0], [36, 2026.0]] });
  const box = [100, 700, 905, 1590];
  const DE = D.deaths, Dd = Object.fromEntries(DE), wan = v => Math.round(v / 1e4);       // every number on screen comes from here
  const low = S.reduce((p, q) => q[1] < p[1] ? q : p), top = S.reduce((p, q) => q[1] > p[1] ? q : p);
  const more = S.filter(([y, v]) => Dd[y] > v).map(([y]) => y);                             // years with more deaths than births
  const since = more.filter(y => y > 2000)[0];
  const beats = [
    { t: [0, 4.6], text: '1949 年以来，\n中国每年出生多少人' },
    { t: [5.5, 9.3], text: `三年困难时期，\n${more[0]} 年死的比生的多`, years: [1959, 1960, 1961] },
    { t: [9.5, 13.6], text: `${top[0]} 年，${wan(top[1])} 万人出生，\n至今最多`, years: [top[0]] },
    { t: [14.4, 16.9], text: '1980 年，提倡\n一对夫妇只生一个孩子', years: [1980] },
    { t: [17.1, 20.8], text: '1987 年又一个高峰：\n1963 年那批孩子当了父母', years: [1987] },
    { t: [21.4, 24.0], text: `2016 年全面二孩，\n回升到 ${wan(B[2016])} 万`, years: [2016] },
    { t: [24.2, E.tAt(since) - .1], text: '之后九年，\n少了一半多', years: [2017, 2018, 2019, 2020, 2021] },
    { t: [E.tAt(since), 27.6], text: `${since} 年起，\n每年死的比生的多`, years: more.filter(y => y >= since) },
    { t: [27.8, 36], text: `${low[0]} 年：${wan(low[1])} 万，\n1949 年以来最少`, years: [low[0]] },
  ];
  const beatA = (b, t) => seg(t, b.t[0], b.t[0] + .45) * (1 - seg(t, b.t[1] - .35, b.t[1]));
  const flags = [
    { y: 1961, text: `1961 · ${wan(B[1961])} 万`, at: 7.4, out: 9.4, side: 1, dy: -150 },
    { y: top[0], text: `${top[0]} · ${wan(top[1])} 万`, sub: '历史最高', at: 10.0, out: 36, side: 1, dy: -70, keep: .55 },
    { y: 1987, text: `1987 · ${wan(B[1987])} 万`, at: 17.6, out: 21.0, side: 1, dy: -80 },
    { y: 2016, text: `2016 · ${wan(B[2016])} 万`, at: 23.4, out: 24.4, side: -1, dy: -120 },
    { y: low[0], text: `${low[0]} · ${wan(low[1])} 万`, at: 27.6, out: 36, side: -1, dy: -150 },
  ];

  const draw = (c, t) => {
    const now = E.realAt(t);
    // the axis follows what is standing: the top grows as the tallest column grows
    let tallest = 0; S.forEach(([y, v]) => { tallest = Math.max(tallest, v * oc(cl(now - y))); });
    const F = T.frame({ box, t: [1948.4, 2025.6], v: [0, Math.max(2.3e7, tallest * 1.1)] });
    const lit = new Set(); beats.forEach(b => { if (b.years && beatA(b, t) > .5) b.years.forEach(y => lit.add(y)); });
    const end = seg(t, 29.4, 31.4);                                           // the closing comparison: 1963 against 2025

    const cur = T.current(S, now);
    c.save(); T.camera(c, { cx: 540, cy: 1590, z: 1 + .045 * io(seg(t, 0, 36)) });              // a slow push in, the whole way
    T.year(c, cur.t + cl(now - cur.t, 0, .999), { x: 500, y: 1520, size: 400, color: 'rgba(27,26,24,.05)' });
    T.grid(c, F, { format: v => v ? `${v / 1e4} 万` : '0', color: 'rgba(27,26,24,.1)', label: 'rgba(27,26,24,.42)', size: 24, minGap: 150, side: 'out' });
    T.columns(c, S, now, F, { width: .74, color: (y) => lit.has(y) || (end > 0 && (y === 1963 || y === 2025)) ? RED : y === 1963 && t > 13.6 ? '#b0a796' : GREY });
    // deaths, as a thin dark line over the columns: where it rises above them, more people died than were born
    const dh = T.line(c, DE, now, F, { color: 'rgba(27,26,24,.75)', width: 3, head: '#1b1a18', glow: false, clip: false });
    if (dh) T.text(c, '死亡', dh.x + 12, dh.y - 12, { size: 26, weight: 700, color: INK });
    T.timeAxis(c, F, { values: [1950, 1960, 1970, 1980, 1990, 2000, 2010, 2020], color: 'rgba(27,26,24,.45)', size: 26 });

    // the line at 2025's level, drawn back across every year: all of them stand above it
    if (t > 29.4) { const y = F.Y(B[2025]), x1 = F.X(2025), x0 = lerp(x1, F.X(1949) - 8, io(seg(t, 29.4, 31.4)));
      c.save(); c.strokeStyle = RED; c.lineWidth = 3; c.setLineDash([10, 9]); c.beginPath(); c.moveTo(x1, y); c.lineTo(x0, y); c.stroke(); c.restore(); }

    flags.forEach(f => { const a = oc(seg(t, f.at, f.at + .4)) * (1 - seg(t, f.out - .3, f.out) * (1 - (f.keep || 0))); if (a <= 0) return;
      T.flag(c, F, f.y, B[f.y], { text: f.text, sub: f.sub, side: f.side, dy: f.dy, a, size: 30, color: f.y === 1963 && t > 13.6 && end <= 0 ? '#8d8576' : RED, dot: 0 }); });
    c.restore();

    // the number: births in the year the clock is on
    const yr = cur.t, v = cur.v;
    T.text(c, '中国 · 每年出生人口', 100, 172, { size: 30, weight: 700, color: RED });
    const w = T.counter(c, Math.round(v / 1e4), { x: 96, y: 330, size: 168, color: INK, font: T.SANS, weight: 800 });
    T.text(c, '万人', 110 + w, 328, { size: 46, weight: 600, color: INK });
    T.text(c, `${Math.max(1949, yr)} 年出生`, 100, 392, { size: 30, weight: 500, color: MUTE });

    beats.forEach(b => { const a = beatA(b, t); if (a <= 0) return; b.text.split('\n').forEach((l, i) => T.text(c, l, 100, 520 + i * 70, { size: 54, weight: 700, font: SERIF, color: INK, a, rise: 14 })); });
    const a2 = seg(t, 31.0, 31.6);
    if (a2 > 0) { T.text(c, `比 1961 年还少 ${wan(B[1961] - low[1])} 万`, 100, 1712, { size: 40, weight: 700, color: RED, a: a2, rise: 10 });
      T.text(c, `同一年死亡 ${wan(Dd[low[0]])} 万，比出生多 ${wan(Dd[low[0]] - low[1])} 万`, 100, 1772, { size: 40, weight: 700, color: INK, a: seg(t, 31.8, 32.4), rise: 10 }); }
    T.source(c, '数据：国家统计局历年公布的出生和死亡人口', { y: 1850, color: 'rgba(27,26,24,.4)' });
    T.finish(c, t, { grain: .05, vignette: .12 });
  };

  // the data plays the tune: each year's column sounds a note, higher for more births (A minor pentatonic), merged when the years fly by
  const scale = [0, 3, 5, 7, 10], pitch = v => { const k = Math.round((v - 7.5e6) / (3.0e7 - 7.5e6) * 14); return 57 + 12 * Math.floor(k / 5) + scale[k % 5]; };
  const notes = []; let last = -1;
  S.forEach(([y, v]) => { const tt = E.tAt(y + .02); if (tt - last < .11) return; last = tt; notes.push({ t: tt, m: pitch(v), d: .9, inst: 'piano', v: .42 }); });
  // a quiet bed: low sustained chords, one under each part of the story
  [[0, 45, 52, 57], [5.0, 41, 48, 57], [9.6, 48, 55, 64], [14.4, 45, 52, 60], [17.4, 43, 50, 59], [21.4, 41, 48, 57], [24.2, 40, 47, 55], [27.6, 38, 45, 53], [31.2, 33, 45, 52]]
    .forEach(([t0, ...ms], i, A) => ms.forEach(m => notes.push({ t: t0, m, d: (A[i + 1] ? A[i + 1][0] : 36) - t0 + .4, inst: 'slowstrings', v: .22 })));
  notes.push({ t: 10.05, m: 81, d: 2.2, inst: 'celesta', v: .35 }, { t: 27.7, m: 57, d: 3, inst: 'piano', v: .5 }, { t: 31.1, m: 45, d: 4.5, inst: 'piano', v: .45 });
  return T.scene(E, draw, { duration: 36, background: PAPER,
    music: { notes, dynamics: { slowstrings: [[0, .5], [10, .7], [24, .55], [30, .8], [35, .3]] } },
    sounds: [{ t: 29.4, kind: 'whoosh', dur: 2, v: .25 }] });
});
</script></body></html>
