<!doctype html>
<meta charset="utf-8">
<title>Lowtide Supply — Capsule 07 “Marble” (drop reel)</title>
<style>html, body { margin: 0; background: #000; } canvas { display: block; max-width: 100vw; max-height: 100vh; margin: auto; }</style>
<canvas></canvas>
<script src="../glitch.js"></script>
<script>
// A Reels / Stories teaser for an LA streetwear label's capsule drop, built on four marble heads from the Met
// (media/met-*.jpg — The Metropolitan Museum of Art, Open Access, public domain: 248804 herm, 251515 Aphrodite?,
// 250678 Herakles, 248901 youth). The signal is bad from the first frame to the last: the broken state jumps on the
// plucked notes, the hi-hat rolls and the snare, the marble melts in pixel-sorted streaks under the long notes, each head is dragged into
// the next by a datamosh on the snare. It ends frozen on the last head, the beat skipping, then static and black.
const G = Glitch, W = 1080, H = 1920;
const BPM = 140, BEAT = 60 / BPM, BAR = BEAT * 4, S16 = BEAT / 4, T0 = .25;
const BARS = 7, FREEZE = T0 + BAR * 6 + BEAT * 2, DROP_T = T0 + BAR * 7, DUR = DROP_T + .6;
const COBALT = '#2338ff', WHITE = '#f5f5f2';
const COND = '"Avenir Next Condensed", "DIN Condensed", Impact, sans-serif';

// ---- the beat: half-time at 140 — kick, a snare on 3, hats with rolls, a sub under it, a plucked line in E minor ----
const notes = [];
const N = (t, m, d, inst, v) => notes.push({ t, m, d, inst, v });
const ROLL = { 1: [12, 13, 14, 15], 3: [6, 7, 14, 15], 4: [12, 13, 14, 15], 5: [2, 3, 10, 11, 12, 13, 14, 15] };
const SUB = [40, 40, 43, 38, 40, 36, 35], PL = [[64, 67, 71], [64, 67, 71], [67, 71, 74], [62, 66, 69], [64, 67, 71], [60, 64, 67], [59, 63, 66]];
for (let b = 0; b < BARS; b++) {
  const t0 = T0 + b * BAR;
  N(t0, 36, .3, 'kick', .9); if (b % 2) N(t0 + 10 * S16, 36, .3, 'kick', .75);
  if (b >= 1) N(t0 + 8 * S16, 38, .2, 'snare', .7);
  for (let s = 0; s < 16; s += 2) N(t0 + s * S16, 42, .04, 'hat', .3);
  for (const s of ROLL[b] || []) for (let k = 0; k < 2; k++) N(t0 + s * S16 + k * S16 / 2, 42, .03, 'hat', .22 + k * .05);
  N(t0, SUB[b], BAR * .9, 'synthbass', .75);
  PL[b].forEach((m, i) => N(t0 + (i * 3 + 2) * S16, m, BEAT * 1.5, 'pluck', .55));
  if (b === 2 || b === 5) N(t0 + 12 * S16, PL[b][2] + 2, BEAT * 1.8, 'pluck', .5);
}
const times = inst => notes.filter(n => n.inst === inst).map(n => n.t);
const snares = times('snare'), rolls = times('hat').filter(t => notes.some(n => n.inst === 'hat' && Math.abs(n.t - t - S16 / 2) < 1e-6));
const longPluck = notes.filter(n => n.inst === 'pluck' && n.d > BEAT * 1.6).map(n => n.t);

// ---- the picture: one head per two bars, swapped on the snare; type on cobalt slabs ----
const HEADS = [['herm', .5, .42], ['aphrodite', .5, .45], ['herakles', .5, .45], ['youth', .5, .44]];
const swaps = [snares[0], snares[2], snares[4]];                // heads change on these snares
const headAt = t => swaps.filter(s => t >= s).length;

function slab(c, text, x, y, size, pad = 18) {
  c.font = `700 ${size}px ${COND}`; const w = c.measureText(text).width;
  c.fillStyle = COBALT; c.fillRect(x - pad, y - size * .82 - pad * .5, w + pad * 2, size * .98 + pad);
  c.fillStyle = WHITE; c.fillText(text, x, y);
}

window.__scene = G.scene(async () => {
  await G.fonts([`700 120px ${COND}`]);
  const img = Object.fromEntries(await Promise.all(HEADS.map(async ([n]) => [n, await G.image(`media/met-${n}.jpg`)])));
  const glitches = [
    { t: 0, kind: 'unstable', d: DROP_T, amt: .7, steps: [...times('pluck'), ...rolls, ...snares].sort((a, b) => a - b), rest: .15, seed: 3 },
    ...swaps.map((t, i) => ({ t, kind: 'mosh', d: BEAT * 1.6, seed: 4 + i })),           // each head dragged into the next
    ...longPluck.map((t, i) => ({ t, kind: 'sort', d: BEAT * 1.5, amt: 1.2, seed: 9 + i })),  // marble melting under the long notes
    { t: snares[1], kind: 'blocks', amt: 1.2, seed: 15, area: { x: 0, y: 1380, w: W, h: 260 } },
    { t: snares[3], kind: 'hit', amt: 1.2, seed: 16 },
    { t: snares[5], kind: 'burst', amt: 1.1, seed: 17 },
    { t: FREEZE, kind: 'freeze', d: DROP_T - FREEZE, seed: 18 },                          // stops on the last head; the beat skips
    { t: DROP_T, kind: 'drop', d: .25, amt: 1, seed: 19 },
  ];
  const freeze = glitches.filter(g => g.kind === 'freeze');
  return {
    width: W, height: H, duration: DUR,
    draw: (c, t) => {
      if (t >= DROP_T + .25) { c.fillStyle = '#000'; c.fillRect(0, 0, W, H); return; }
      const i = headAt(t), [name, fx, fy] = HEADS[i], since = t - ([0, ...swaps][i]);
      c.fillStyle = '#111'; c.fillRect(0, 0, W, H);
      c.filter = 'grayscale(1) contrast(1.25)';
      G.cover(c, img[name], { x: 0, y: 0, w: W, h: H, fx, fy, zoom: 1.05 + since * .025 });
      c.filter = 'none';
      c.textAlign = 'left';
      slab(c, 'LOWTIDE SUPPLY', 70, 190, 64);
      if (t >= swaps[0]) slab(c, 'CAPSULE 07', 70, 1500, 150, 22);
      if (t >= swaps[1]) slab(c, 'MARBLE', 70, 1690, 190, 22);
      if (t >= swaps[2]) { slab(c, 'SAT 10.18 — 10AM PT', 70, 300, 56); slab(c, 'ONLINE + FAIRFAX AVE', 70, 390, 56); }
    },
    glitches,
    look: { chroma: 1 },
    sounds: [...G.sounds(glitches.filter(g => g.kind !== 'freeze'), DUR, { music: false }), ...G.sounds(freeze, DUR)],
    music: { notes },
  };
});
</script>
