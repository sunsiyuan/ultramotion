<!doctype html>
<meta charset="utf-8">
<title>盆地 第 19 夜 — 小红书活动海报</title>
<style>html, body { margin: 0; background: #000; } canvas { display: block; max-width: 100vw; max-height: 100vh; margin: auto; }</style>
<canvas></canvas>
<script src="../glitch.js"></script>
<script>
// 成都玉林一个地下 club 的 techno 夜，发在小红书的 3:4 活动海报。整条都是坏的信号：画面从第一帧就带着错位，
// 坏的状态跟着合成器和弦的切分点跳，阵容一个个被撕进来；军鼓滚奏时每一下军鼓换一种坏法，
// 进主段落时整张海报翻色、重新排版，坏得更狠；最后一下和弦响着，海报第一次完全干净。
const G = Glitch, W = 1080, H = 1440;
const BPM = 128, BEAT = 60 / BPM, BAR = BEAT * 4, S16 = BEAT / 4;
const DROP = BAR * 4, END = BAR * 6, DUR = END + .9;
const RED = '#ff3a12', INK = '#100d0b', CREAM = '#f4ecdc';
const HEI = '"Lantinghei SC", "PingFang SC", sans-serif', LAT = '"Avenir Next Condensed", "DIN Condensed", sans-serif';
const LINEUP = [['23:00', '阿夜'], ['01:00', 'LIN KAI'], ['03:30', '七号仓 B2B 小树']];

// ---- 音乐：128 bpm 的 techno，底鼓四拍、反拍踩镲、拍手、滚动的合成贝斯，和弦踩在切分上（A 小调 → F）----
const notes = [], stabs = [];
const N = (t, m, d, inst, v) => notes.push({ t, m, d, inst, v });
for (let b = 0; b < 6; b++) {
  const t0 = b * BAR, fill = b === 3;
  for (let q = 0; q < 4; q++) {
    const t = t0 + q * BEAT;
    if (!(fill && q >= 2)) N(t, 36, .2, 'kick', .9);
    if (b >= 1 && !(fill && q >= 2)) N(t + BEAT / 2, 42, .05, 'hat', .35);
    if (b >= 2 && (q === 1 || q === 3) && !(fill && q === 3)) N(t, 39, .1, 'clap', .5);
  }
  if (b >= 1) for (const s of [2, 6, 10, 14]) if (!(fill && s > 8)) N(t0 + s * S16, b >= 4 ? 29 : 33, S16 * 1.6, 'synthbass', .7);
  if (fill) for (let i = 0; i < 8; i++) N(t0 + BEAT * 2 + i * S16, 38, .08, 'snare', .25 + i * .08);
  const ch = b >= 4 ? [53, 57, 60, 64] : [57, 60, 64, 67];
  for (const s of (fill ? [3, 6] : [3, 6, 11])) { const t = t0 + s * S16; stabs.push(t); ch.forEach((m, k) => N(t + k * .004, m, S16 * 1.3, 'keys', b ? .55 : .35)); }
}
[57, 60, 64, 67].forEach((m, k) => N(END + k * .004, m, 1.2, 'keys', .6));          // 最后一下和弦，响到干净的海报上
N(END, 36, .3, 'kick', .9);
const FILL = BAR * 3 + BEAT * 2;
const snares = notes.filter(n => n.inst === 'snare').map(n => n.t);
const after = stabs.filter(s => s >= DROP);
const bassHits = notes.filter(n => n.inst === 'synthbass' && n.t >= DROP).map(n => n.t);

function ticker(c, t, y, fg, bg) {
  c.fillStyle = bg; c.fillRect(0, y - 46, W, 64);
  c.fillStyle = fg; c.font = `600 40px ${LAT}`; c.textAlign = 'left';
  const s = 'BASIN 盆地  ·  TECHNO ALL NIGHT  ·  10.25 SAT  ·  玉林 B1  ·  ';
  c.font = `700 38px ${HEI}`;
  const w = c.measureText(s).width, x0 = -((t * 140) % w);
  for (let x = x0; x < W; x += w) c.fillText(s, x, y);
}

function before(c, t) {                                     // 前四小节：红底黑字，盆地竖排，阵容一个个进来
  c.fillStyle = RED; c.fillRect(0, 0, W, H);
  c.fillStyle = INK; c.font = `900 520px ${HEI}`; c.textAlign = 'left'; c.textBaseline = 'alphabetic';
  c.fillText('盆', 34, 560); c.fillText('地', 34, 1100);
  c.font = `700 34px ${HEI}`; c.fillText('第 19 夜', 640, 120);
  c.font = `600 46px ${LAT}`; c.fillText('TECHNO ALL NIGHT', 640, 180);
  c.fillRect(640, 210, 400, 6);
  LINEUP.forEach(([time, name], i) => {
    const t0 = stabs[3 + i * 3]; if (t < t0) return;
    const y = 330 + i * 190;
    c.font = `600 40px ${LAT}`; c.fillStyle = INK; c.fillText(time, 640, y);
    c.font = `900 ${name.length > 6 ? 56 : 84}px ${HEI}`; c.fillText(G.decode(name, t, t0, .3), 640, y + 90);
  });
  c.font = `700 40px ${HEI}`; c.fillText('10.25 周六', 640, 1010); c.fillText('23:00 → 06:00', 640, 1066);
  ticker(c, t, 1380, RED, INK);
}

function afterDrop(c, t) {                                  // 主段落：黑底红字，盆地横过来，信息压在下面
  c.fillStyle = INK; c.fillRect(0, 0, W, H);
  c.fillStyle = RED; c.textAlign = 'left'; c.textBaseline = 'alphabetic';
  c.font = `900 500px ${HEI}`; c.fillText('盆地', 30, 520);
  c.fillStyle = CREAM; c.font = `600 120px ${LAT}`; c.fillText('10.25 SAT', 48, 700);
  c.font = `900 72px ${HEI}`; c.fillText('23:00 → 次日 06:00', 48, 810);
  c.fillStyle = RED; c.fillRect(48, 860, 984, 6);
  c.fillStyle = CREAM; c.font = `700 52px ${HEI}`;
  LINEUP.forEach(([time, name], i) => { c.fillText(name, 48, 960 + i * 76); });
  c.font = `700 40px ${HEI}`; c.fillStyle = RED;
  c.fillText('玉林 · 地下一层', 640, 960); c.fillText('预售 ¥100', 640, 1036); c.fillText('现场 ¥150', 640, 1112);
  ticker(c, t, 1380, INK, RED);
}

window.__scene = G.scene(async () => {
  await G.fonts([`900 520px ${HEI}`, `700 40px ${HEI}`, `600 46px ${LAT}`]);
  const glitches = [
    { t: 0, kind: 'unstable', d: BAR, amt: .45, steps: stabs, seed: 2 },                 // 第一小节：和弦轻轻进来，信号已经是坏的
    { t: BAR, kind: 'unstable', d: FILL - BAR, amt: .6, steps: stabs, seed: 5 },         // 跟着和弦的切分点换一种坏法
    ...LINEUP.map((_, i) => ({ t: stabs[3 + i * 3], kind: 'tear', amt: 1.1, seed: 10 + i, area: { x: 600, y: 250 + i * 190, w: 480, h: 190 } })),
    { t: FILL, kind: 'unstable', d: DROP - FILL, amt: .95, steps: snares, rest: 0, seed: 7 },   // 军鼓滚奏：每一下军鼓换一种坏法
    { t: FILL + BEAT, kind: 'sort', d: BEAT, amt: 1.1, seed: 8 },
    { t: DROP, kind: 'burst', d: BEAT, amt: 1.2, seed: 9 },                             // 进主段落
    { t: DROP + BEAT, kind: 'unstable', d: END - DROP - BEAT, amt: 1.1, steps: [...after, ...bassHits].sort((a, b) => a - b), rest: .18, seed: 13 },
    { t: BAR * 5, kind: 'blocks', amt: 1.2, seed: 21, area: { x: 0, y: 890, w: W, h: 280 } },
    { t: BAR * 5 + BEAT * 3, kind: 'hit', amt: 1.2, seed: 23 },
  ];
  return {
    width: W, height: H, duration: DUR,
    draw: (c, t) => t < DROP ? before(c, t) : afterDrop(c, t),
    glitches,
    sounds: G.sounds(glitches, DUR, { music: false }),
    music: { notes },
  };
});
</script>
