<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Where a federal dollar went, fiscal 2025</title>
<style>html,body{margin:0;background:#f3f4f6}canvas{display:block;width:100vw;height:100vh;object-fit:contain}</style></head>
<body><canvas></canvas>
<script src="../units.js"></script>
<script>
const U = Units, { seg, oc, io, cl, lerp } = U;
window.__scene = U.withData(['data/us-outlays-fy2025.json'], ([D]) => {
  const W = 1920, H = 1080, E = U.create({ width: W, height: H });
  const GROUND = '#f3f4f6', INK = '#1d2742', DIM = '#d3d7df', ACC = '#d93a2b', MUTE = 'rgba(29,39,66,.55)';
  const F = D.by_function, T = D.total_outlays, cent = v => v / T * 100, bn = v => v >= 1e12 ? `$${(v / 1e12).toFixed(2)} trillion` : `$${Math.round(v / 1e9)} billion`;

  // ---- 1 square = 1¢ of every dollar; the categories from Treasury's budget functions ----
  const named = { 'Social Security': F['Social Security'], 'Medicare': F['Medicare'], 'Medicaid & other health': F['Health'], 'Interest on the debt': F['Net Interest'],
    'Military': F['National Defense'], 'Income support': F['Income Security'], 'Veterans': F['Veterans Benefits and Services'] };
  named['Everything else'] = T - Object.values(named).reduce((p, q) => p + q, 0);                 // the rest, net of offsetting receipts
  const order = Object.keys(named).filter(k => k !== 'Everything else').sort((a, b) => named[b] - named[a]).concat(['Everything else']);
  const sq = U.split(Object.fromEntries(order.map(k => [k, named[k]])), 100);
  const nasa = D.nasa / T * 100;                                                                  // 0.35 of one square
  // the squares; the last cent of "everything else" is drawn as 100 small squares, NASA's share of them filled
  const units = U.list(sq, 'cat'), small = Math.round(nasa * 100);
  Object.assign(units.filter(u => u.cat === 'Everything else').pop(), { nasa: true, part: nasa, grain: 10 });
  const C = U.crowd(units);
  const nasaLast = u => u.nasa ? 1 : 0;

  // ---- the world: a floor at y = 930, the camera moves over it ----
  const FLOOR = 900, cell = 56, size = 47;
  const k0 = C.state(.3, U.grid(100, { x: 1300, y: FLOOR, cols: 10, cell: 52, size: 44, anchor: 'bc' }), { order: nasaLast, stagger: 1.5, dur: .9, wave: 'y' });
  const piles = U.side(sq, { box: [150, 300, 1820, FLOOR], cell, size, cols: 3 });
  const k1 = C.state(4.8, piles, { by: u => u.cat, order: nasaLast, dur: 1.5, stagger: 1.3 });
  // Social Security stands in one column next to NASA's sliver; everything else steps back
  const rest = Object.fromEntries(order.filter(k => k !== 'Social Security').map(k => [k, sq[k]]));
  const piles2 = U.side(rest, { box: [150, 300, 1380, FLOOR], cell, size, cols: 3 });
  const ssCol = U.grid(sq['Social Security'], { x: 1720, y: FLOOR, cols: 1, cell, size, anchor: 'bc' });
  const nasaAt = { slots: [{ x: 1570, y: FLOOR - cell / 2, s: size }] };
  const k2 = C.state(26.6, Object.assign({}, piles2, { 'Social Security': ssCol, nasa: nasaAt }), { by: u => u.nasa ? 'nasa' : u.cat, order: nasaLast, dur: 1.4, stagger: .6, wave: 'near' });
  const ssBox = C.target('Social Security', k2), top = ssBox.y0;

  const spot = U.spotlight([
    [6.0, 11.6, u => u.cat === 'Social Security'],
    [12.4, 18.2, u => u.cat === 'Interest on the debt'],
    [19.0, 43, u => u.nasa],
    [27.4, 43, u => u.cat === 'Social Security'],
  ]);

  // ---- camera: still for the overview; then down to the floor beside NASA, up the Social Security column, and back out ----
  const cam = U.track([[0, { x: 960, y: 540, z: 1 }], [27.0, { x: 960, y: 540, z: 1 }], [28.8, { x: 1640, y: FLOOR - 120, z: 2.4 }], [30.0, { x: 1640, y: FLOOR - 120, z: 2.4 }],
    [33.4, { x: 1640, y: top + 120, z: 2.4 }], [35.0, { x: 1640, y: top + 120, z: 2.4 }], [37.0, { x: 960, y: 540, z: 1 }]]);

  const beats = [
    { t: [.5, 4.6], big: bn(T), head: 'Every dollar the U.S. government spent in fiscal 2025', sub: 'Federal outlays, October 2024 to September 2025' },
    { t: [6.0, 11.6], big: `${cent(F['Social Security']).toFixed(1)}¢`, head: 'Social Security', sub: `${bn(F['Social Security'])}, the largest single share` },
    { t: [12.4, 18.2], big: `${cent(F['Net Interest']).toFixed(1)}¢`, head: 'Interest on the debt', sub: `${bn(F['Net Interest'])}, more than the military's ${cent(F['National Defense']).toFixed(1)}¢ (${bn(F['National Defense'])})` },
    { t: [19.0, 26.2], big: `${nasa.toFixed(2)}¢`, head: 'NASA', sub: `${bn(D.nasa)}: ${small} of the 100 small squares in one cent` },
    { t: [29.4, 35.4], big: `${Math.round(F['Social Security'] / D.nasa)}×`, head: 'Social Security, measured in NASAs', sub: `${bn(F['Social Security'])} ÷ ${bn(D.nasa)}` },
    { t: [36.4, 42], big: '', head: `Of every dollar: ${cent(F['Social Security']).toFixed(1)}¢ to Social Security,\na third of a cent to NASA`, sub: '' },
  ];
  const beatA = (b, t) => seg(t, b.t[0], b.t[0] + .5) * (1 - seg(t, b.t[1] - .4, b.t[1]));

  const world = (c, t) => {
    c.fillStyle = 'rgba(29,39,66,.25)'; c.fillRect(-2000, FLOOR + 6, 6000, 2);                              // the floor
    C.draw(c, t, { shape: 'square', color: (u, tt) => spot.color(u, tt, { ink: INK, dim: DIM, accent: ACC }), front: u => !!u.nasa });
  };
  const draw = (c, t) => {
    const cm = cam(t);
    c.save(); U.camera(c, cm, W, H);
    world(c, t);
    // names and cents under the piles
    const a1 = seg(t, 6.0, 6.6) * (1 - seg(t, 26.4, 26.9));
    if (a1 > 0) order.forEach(k => { const b = C.target(k, k1), lit = spot.k({ cat: k }, t), col = lit > .5 ? ACC : INK;
      U.text(c, `${cent(named[k]).toFixed(1)}¢`, b.cx, FLOOR + 52, { size: 30, weight: 800, font: U.SANS, color: col, align: 'center', a: a1 });
      U.text(c, k, b.cx, FLOOR + 86, { size: 20, weight: 600, color: lit > .5 ? ACC : MUTE, align: 'center', a: a1 }); });
    // the magnifying glass over the split square
    const g = seg(t, 19.6, 20.4) * (1 - seg(t, 25.8, 26.4)), piece = C.now(t).find(p => p.u.nasa);
    if (g > 0 && piece) { const lx = piece.x - 300, ly = piece.y - 330, la = seg(t, 20.6, 21.0) * g;
      U.lens(c, { x: lerp(lx - 140, lx, oc(g)), y: lerp(ly - 120, ly, oc(g)), r: 190, focus: [piece.x, piece.y], zoom: 5.1, a: g, rim: INK, glass: GROUND, handle: Math.PI * .22, draw: cc => world(cc, t) });
      U.text(c, '1 square = 1¢', lx - 250, ly - 60, { size: 26, weight: 600, color: MUTE, align: 'right', a: la });
      U.text(c, `NASA = ${small} small squares`, lx - 250, ly - 20, { size: 30, weight: 800, color: ACC, align: 'right', a: la });
      U.text(c, `${nasa.toFixed(2)}¢ of every dollar`, lx - 250, ly + 18, { size: 26, weight: 600, color: MUTE, align: 'right', a: la }); }
    // the climb: a ruler counting NASAs up the column, the top named
    const a2 = seg(t, 29.0, 29.6) * (1 - seg(t, 41, 42));
    if (a2 > 0) { const per = cell * (D.nasa / T * 100);                                              // one NASA's height in this column
      U.ruler(c, { x: ssBox.x1 + 16, y0: FLOOR, y1: top, every: per, label: i => i && i % 10 === 0 ? `${i} NASAs` : '', color: 'rgba(29,39,66,.5)', size: 9, a: a2 });
      U.text(c, 'NASA', 1570, FLOOR + 40, { size: 14, weight: 800, color: ACC, align: 'center', a: a2 });
      U.text(c, 'Social Security', ssBox.cx, top - 18, { size: 16, weight: 800, color: ACC, align: 'center', a: a2 }); }
    c.restore();

    // what is said, on the screen (not in the world)
    beats.forEach(b => { const a = beatA(b, t); if (a <= 0) return; const r = (1 - oc(a)) * 14;
      if (!b.big) { U.text(c, b.head, 110, 150 + r, { size: 56, weight: 800, font: U.SANS, color: INK, a, lineHeight: 1.2 }); return; }
      U.text(c, b.head, 110, 118 + r, { size: 34, weight: 700, color: b === beats[0] ? INK : ACC, a });
      U.counter(c, 0, { x: 104, y: 250 + r, size: 120, color: b === beats[0] ? INK : ACC, a, format: () => b.big });
      U.text(c, b.sub, 110, 312 + r, { size: 28, weight: 500, color: MUTE, a }); });
    U.legend(c, `= 1¢ of every dollar, about ${bn(T / 100)}`, { x: 110, y: 388, shape: 'square', size: 30, color: INK, ink: MUTE, text: 24, a: seg(t, 2.4, 3.0) * (1 - seg(t, 26.6, 27.2)) });
    U.source(c, 'Source: U.S. Treasury, Monthly Treasury Statement, September 2025 (net outlays by budget function; NASA from outlays by agency)', { x: 1810, y: 1050, size: 18, color: 'rgba(29,39,66,.42)', align: 'right' });
    U.finish(c, t, { grain: .035, vignette: .05 });
  };

  // ---- sound: piano and plucked strings, a rising pluck line on the climb ----
  const mus = [], P = (t, m, d, v, inst) => mus.push({ t, m, d, inst, v });
  const prog = [[0, [52, 59, 64]], [4.8, [48, 55, 64]], [12.4, [45, 52, 60]], [19.0, [50, 57, 62]], [26.6, [47, 54, 59]], [29.4, [48, 55, 64]], [35.0, [52, 59, 64]]];
  prog.forEach(([t0, ch], i) => { const t1 = i + 1 < prog.length ? prog[i + 1][0] : 42;
    P(t0, ch[0], t1 - t0 + .4, .26, 'piano'); P(t0 + .02, ch[1], t1 - t0 + .4, .2, 'piano'); P(t0 + .04, ch[2], t1 - t0 + .4, .2, 'piano');
    if (i !== 4 && i !== 5) for (let x = t0 + .33, j = 0; x < t1 - .3; x += .67, j++) P(x, ch[j % 3] + 12, .6, .16, 'pluck'); });
  for (let j = 0; j < 14; j++) P(30.0 + j * .24, [64, 66, 67, 69, 71, 72, 74][j % 7] + (j >= 7 ? 12 : 0) - 12, .4, .2 + j * .008, 'pluck');   // up the column
  [6.1, 12.5, 19.7].forEach(t0 => P(t0, 88, 1.6, .24, 'celesta'));
  P(33.6, 76, 2.4, .26, 'celesta');
  const sounds = [k0, k1, k2].flatMap(k => C.taps(k, { kind: 'tap', v: .13, max: 14 })).concat([{ t: 27.1, kind: 'whoosh', dur: 1.6, v: .16 }, { t: 35.2, kind: 'whoosh', dur: 1.8, v: .14 }]);
  return U.scene(E, draw, { duration: 42, background: GROUND, music: { notes: mus }, sounds });
});
</script></body></html>
