<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas></canvas>
<script src="../ink.js"></script>
<script>
/* 白露 · 秋天到了，露水凝结，雁往南飞。
   一滴墨落在纸上，化成最近的山；远山一层层从雾里浮出来，一层比一层淡；
   镜头从高处的天空慢慢往下，到水面；雁阵从右上飞过，水上一叶小舟慢慢漂，芦苇在风里摇；最后题字、落印。 */
const I = Ink.create({ width: 1080, height: 2300, view: [1080, 1920] });
const { seg, ease, vn } = Ink;
// 远山三层：越远越淡、越晚浮出来；最近一层由那滴墨化开
const far = Ink.ridge(1310, [[180, 300, 160], [520, 420, 200], [900, 260, 170]], { rough: 22, seed: 1 });
const mid = Ink.ridge(1440, [[640, 300, 150], [980, 360, 180]], { rough: 26, seed: 2 });
const near = Ink.ridge(1580, [[250, 560, 150], [480, 300, 120]], { rough: 34, seed: 3 });
I.mountain(far, { x0: -100, x1: 1180, ink: .42, edge: .45, edgeWidth: 8, fall: 90, mistAt: 250, at: 3.2, speed: 420, cun: 6, texture: .3 });
I.mountain(mid, { x0: 300, x1: 1180, ink: .7, edge: .8, edgeWidth: 8, fall: 80, mistAt: 220, at: 4.6, speed: 460, cun: 8 });
I.mountain(near, { x0: -100, x1: 700, ink: 1.15, edge: 1.4, edgeWidth: 10, fall: 70, mistAt: 300, at: .6, speed: 260, from: [260, 1100], cun: 16, texture: .45 });
I.dots(Array.from({ length: 22 }, (_, i) => { const x = 60 + i * 26 + Math.sin(i * 3) * 10; return [x, near(x) + 6]; }), { size: 5, ink: 1.8, at: 2.8, dur: 1.2 });
// 近岸的芦苇：焦墨几笔，尾端飞白；苇叶撇出去
const reeds = [];
for (let i = 0; i < 9; i++) { const x = 760 + i * 30 + I.R() * 20, top = 1560 + I.R() * 200, lean = (I.R() - .3) * 110, at = 6.8 + i * .12;
  reeds.push([[[x, 2300], [x + lean * .3, (2300 + top) / 2], [x + lean, top]], { width: 7, ink: 1.6, dry: .55, at, dur: .7 }]); }
for (let i = 0; i < 6; i++) { const x = 760 + I.R() * 260, y = 1800 + I.R() * 300, s = I.R() > .5 ? 1 : -1;
  reeds.push([[[x, y], [x + s * 70, y - 46], [x + s * 150, y - 52]], { width: 11, ink: 1.3, dry: .6, at: 7.8 + i * .1, dur: .5 }]); }
I.strokes(reeds);
// 水：几道淡墨横扫，表示水面
I.strokes(Array.from({ length: 5 }, (_, i) => { const y = 1880 + i * 70, x0 = 80 + i * 40; return [[[x0, y], [x0 + 300 + i * 30, y + 4]], { width: 4, ink: .5, dry: .7, at: 6.2 + i * .15, dur: .5 }]; }));
// 活的东西：雁阵从右上往左下飞；小舟在水上漂；芦苇在风里摇（芦花一点点淡墨）
I.live((g, t) => {
  const u = seg(t, 5, 17); if (u > 0) { const cx = 1000 - u * 900, cy = 560 + u * 160;
    g.strokeStyle = '#fff'; g.lineCap = 'round'; g.lineWidth = 5;
    [[0, 0], [40, 32], [80, 64], [-38, 34], [-76, 68], [120, 96]].forEach(([dx, dy], i) => { const x = cx + dx, y = cy + dy, f = Math.sin(t * 7 + i) * 8;
      g.beginPath(); g.moveTo(x - 24, y - 4 + f); g.quadraticCurveTo(x - 10, y - 6, x, y); g.quadraticCurveTo(x + 10, y - 6, x + 24, y - 4 + f); g.stroke(); }); }
  const bx = 200 + t * 9, by = 1960 + Math.sin(t * .9) * 4;                               // a small boat with a figure
  g.fillStyle = '#fff'; g.beginPath(); g.moveTo(bx - 60, by); g.quadraticCurveTo(bx, by + 18, bx + 66, by - 4); g.lineTo(bx + 50, by + 6); g.quadraticCurveTo(bx, by + 22, bx - 50, by + 8); g.fill();
  g.globalAlpha = .9; g.beginPath(); g.ellipse(bx + 8, by - 22, 7, 16, 0, 0, Ink.TAU); g.fill(); g.beginPath(); g.arc(bx + 8, by - 44, 6, 0, Ink.TAU); g.fill();
  g.globalAlpha = .35; g.lineWidth = 2; g.strokeStyle = '#fff'; for (let k = 0; k < 3; k++) { const r = ((t * .6 + k / 3) % 1); g.globalAlpha = .35 * (1 - r); g.beginPath(); g.ellipse(bx, by + 14, 70 + r * 120, 8 + r * 10, 0, 0, Ink.TAU); g.stroke(); }
  g.globalAlpha = .25 * seg(t, 8.5, 9.5); for (let i = 0; i < 7; i++) { const x = 820 + i * 34 + Math.sin(t * 1.3 + i) * 10, y = 1600 + (i % 3) * 60; g.beginPath(); g.ellipse(x, y, 10, 18, .4 + Math.sin(t + i) * .3, 0, Ink.TAU); g.fill(); }
});
I.mist([{ y: 1560, height: 70, speed: 18, amount: .8 }, { y: 1760, height: 60, speed: -14, amount: .6 }, { y: 1300, height: 90, speed: 10, amount: .55 }]);
I.camera(t => { const u = ease(seg(t, 0, 16)); return { x: 540 - u * 20, y: 960 + u * 420, zoom: 1 + u * .06 }; });
I.text('白露', { x: 930, y: 230, size: 130, at: 11.5, per: .35 });
I.text('露从今夜白', { x: 800, y: 220, size: 50, at: 12.6, per: .18 });
I.seal('白露', { x: 930, y: 520, size: 96, at: 14.2 });
const notes = [], beat = 60 / 60, pent = [62, 64, 66, 69, 71, 74, 76];
for (let i = 0; i < 16; i++) { const t = .8 + i * 1.05 + (i % 3 === 2 ? .3 : 0); notes.push({ t, m: pent[[0, 2, 4, 3, 1, 2, 5, 4, 3, 2, 1, 0, 2, 4, 3, 0][i]], d: 2.4, inst: 'pluck', v: .4 }); }
[[0, 50], [6, 47], [12, 45]].forEach(([t, m]) => notes.push({ t, m, d: 7, inst: 'pad', v: .26 }));
notes.push({ t: 14.2, m: 74, d: 3, inst: 'bell', v: .3 });
window.__scene = Ink.scene(I, { duration: 18, music: { notes }, sounds: [{ t: .55, kind: 'thud' }, { t: 14.2, kind: 'thud' }] });
</script></body></html>
