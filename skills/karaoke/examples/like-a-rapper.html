<!doctype html>
<meta charset="utf-8">
<title>Like A Rapper — Donnie Ozone (verse clip)</title>
<style>html,body{margin:0;background:#000}canvas{display:block;max-width:100vw;max-height:100vh}</style>
<canvas></canvas>
<script src="../karaoke.js"></script>
<script>
/* A rap verse cut for Reels / TikTok: the first verse and hook of Donnie Ozone's “Like A Rapper” over Alex Beroza's remix (both CC BY 3.0).
   The word times come from lyrics.py run on the a cappella (media/like-a-rapper.json); the remix carries the same vocal 10.31 s later,
   so the page shifts the times instead of aligning the busy mix.
   Each bar is a justified stack of heavy condensed capitals, every row stretched to the full width, so short words come out huge.
   Not yet rapped: hollow outlines. Rapped: solid, with a hard edge running through the word at the rapper's speed.
   Every bar ends on the same yellow row, LIKE A RAPPER; the rhymes inside the bar fill coral. The next bar waits small below;
   when the bar ends it jumps up into place. */
const K = Karaoke, S = K.create({ width: 1080, height: 1920 });
const FONT = '"Avenir Next Condensed", "Futura", Impact, sans-serif';
const FROM = 9.408, OFFSET = 10.31;                        // the clip starts at remix 9.408 s (a bar line); vocal = a cappella + 10.31 s
const WHITE = '#f4f1ea', HOOK = '#ffd21f', RHYME = '#ff5a43', BG = '#0c0c0d';
// how each bar breaks into rows (word counts), and which words rhyme
const ROWS = [[4, 3, 2, 3], [2, 3, 2, 3], [2, 2, 3, 3], [3, 3, 2, 3], [2, 1], [3, 3, 3]];
const RHYMES = [[4, 8], [4, 6], [4, 6], [2, 5, 7], [], []];
const X = 64, WIDTH = S.W - 2 * X, TOP = 500, NEXT_Y = 1390, NEXT_K = .42;

let T, BARS;
const ready = Promise.all([K.load('media/like-a-rapper.json'), K.fonts([`800 100px ${FONT}`])]).then(([d]) => {
  T = K.shift(d, OFFSET - FROM);
  const c = S.ctx;
  BARS = T.lines.map((line, i) => {
    line.words.forEach((w, k) => { w.hook = /^(like|a|rapper[,]?)\s*$/i.test(w.text) && k >= line.words.length - 3 || i === 5; w.rhyme = RHYMES[i].includes(k); });
    let k = 0, y = 0; const rows = [];
    for (const n of ROWS[i]) {
      const sub = { ...line, words: line.words.slice(k, k + n).map(w => ({ ...w, text: w.text.toUpperCase() })) }; k += n;
      sub.words[sub.words.length - 1].text = sub.words[sub.words.length - 1].text.trimEnd();
      const L = K.layout(c, sub, { font: FONT, weight: 800, size: 200, x: 0, y: 0, maxWidth: WIDTH, fit: 'fill', tracking: -2 });
      y += (rows.length ? 26 : 0) + L.ascent * .98;           // stack on cap height, tight
      rows.push({ L, y });
    }
    return { line, rows, height: y, t0: line.t0, t1: line.t1 };
  });
});

const UNSUNG = { stroke: 'rgba(244,241,234,.62)', strokeWidth: 1.6 };
const SUNG = w => { const c = w.src.hook ? HOOK : w.src.rhyme ? RHYME : WHITE; return { fill: c, stroke: c, strokeWidth: 1.6 }; };
// when bar j takes the top: just as bar j-1's last word ends (the rap leaves almost no gap)
const promote = j => Math.min(BARS[j].t0 - .06, Math.max(BARS[j - 1].t1 - .04, BARS[j].t0 - .3));
const MOVE = .2;

function drawBar(c, b, x, y, k, a, t, live) {
  if (a <= 0) return;
  c.save(); c.globalAlpha *= a; c.translate(x, y); c.scale(k, k);
  for (const r of b.rows) {
    const L = K.moved(r.L, 0, r.y);
    if (live) K.sing(c, L, t, { unsung: UNSUNG, sung: SUNG, edge: 2 });
    else K.sing(c, L, -1, { unsung: UNSUNG, sung: SUNG });
  }
  c.restore();
}

window.__scene = K.scene(S, (c, t) => {
  c.fillStyle = BG; c.fillRect(0, 0, S.W, S.H);
  // film grain, fixed per frame
  c.save(); c.globalAlpha = .05; for (let i = 0; i < 260; i++) { const h = K.hash(i + Math.floor(t * 30) * 997); c.fillStyle = h > .5 ? '#fff' : '#000'; c.fillRect(K.hash(i * 3.1 + h) * S.W, K.hash(i * 7.7 + h) * S.H, 3, 3); } c.restore();

  // credit line at the top
  c.save(); c.font = `600 34px ${FONT}`; c.letterSpacing = '6px'; c.fillStyle = 'rgba(244,241,234,.7)';
  c.fillText('DONNIE OZONE — LIKE A RAPPER', X, 150);
  c.font = `500 26px ${FONT}`; c.letterSpacing = '4px'; c.fillStyle = 'rgba(244,241,234,.42)'; c.fillText('ALEX BEROZA REMIX', X, 192); c.restore();

  // which bar is on top, and how far the jump to the next one has got
  let j = 0; for (let k = 1; k < BARS.length; k++) if (t >= promote(k)) j = k;
  const m = j > 0 ? K.ease.out(K.seg(t, promote(j), promote(j) + MOVE)) : 1;
  const intro = K.ease.out(K.seg(t, .2, .9)), outro = 1 - K.ease.sine(K.seg(t, BARS[5].t1 + 1.2, BARS[5].t1 + 1.8));
  // the bar leaving: up and out
  if (j > 0 && m < 1) drawBar(c, BARS[j - 1], X, TOP - 340 * m, 1, (1 - m) * (1 - m), t, true);
  // the bar on top: coming up from the preview spot
  drawBar(c, BARS[j], X, K.lerp(NEXT_Y, TOP, m), K.lerp(NEXT_K, 1, m), intro * outro, t, true);
  // the next bar, small and hollow, waiting
  if (j + 1 < BARS.length) drawBar(c, BARS[j + 1], X, NEXT_Y + (1 - m) * 60, NEXT_K, intro * m * .9, t, false);

  // end card: the credit the licence asks for
  const e = K.ease.sine(K.seg(t, BARS[5].t1 + 1.6, BARS[5].t1 + 2.3));
  if (e > 0) {
    c.save(); c.globalAlpha = e; c.fillStyle = WHITE; c.font = `800 120px ${FONT}`; c.letterSpacing = '-2px';
    c.fillText('LIKE A RAPPER', X, 860);
    c.font = `500 38px ${FONT}`; c.letterSpacing = '3px'; c.fillStyle = 'rgba(244,241,234,.75)';
    ['Vocals  Donnie Ozone', 'Remix  Alex Beroza', 'CC BY 3.0  ·  ccmixter.org/files/AlexBeroza/36164'].forEach((s, k) => c.fillText(s, X, 960 + k * 60));
    c.restore();
  }
}, {
  duration: 21.0 + 3.6, background: BG, ready: [ready],
  music: { file: 'media/like-a-rapper-mix.mp3', from: 0, gain: .75, fadeIn: .05, fadeOut: .1 },
  timeline: [],
});
</script>
