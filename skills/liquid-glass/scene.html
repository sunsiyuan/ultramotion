<!doctype html>
<html><head><meta charset="utf-8"><title>Liquid Glass</title>
<style>html,body{margin:0;background:#111;height:100%;display:grid;place-items:center;overflow:hidden}canvas{display:block;height:100vh;width:auto}</style>
</head><body><canvas id="gl" width="1080" height="1920"></canvas>
<script>
/* 液态玻璃。画面是 t 的纯函数：seek(t) 摆出第 t 秒，逐帧渲染跟实时播放是同一个画面。
   ?cut=showcase  16 秒风格展示（带 HUD）
   ?cut=opener    4 秒开场，&title=第一行|第二行 改字；最后一帧 = bg 第一帧，两段直接接得上
   ?cut=bg        16 秒无缝循环背景，中间留给人和字幕
   ?rec=1         渲染用（不自动播放）

   一层层叠：背景渐变（shader 里算）→ 层 A（玻璃后面的字，会被折射）→ 玻璃 → 层 B（玻璃上的图标、HUD）。
   玻璃 = 一组圆角矩形的 SDF 做 smooth union（靠近就融成一滴、拉开就拉丝断开），
   折射 = 沿 SDF 法线往里偏移采样，越靠边偏得越多，RGB 三路偏移量略不同出色散。 */
const Q = new URLSearchParams(location.search);
const CUT = Q.get('cut') || 'showcase';
const W = 1080, H = 1920, CX = W / 2, CY = H / 2;
const BPM = 120, LOOP = 16;
const TITLE = (Q.get('title') || '一句提示词|真能出片？').split('|');
const TOP = Q.get('layout') === 'top';                               // ?layout=top 开场标题放上三分之一，下面留给真人
const FONT = '"SF Pro Display", system-ui, "PingFang SC", sans-serif';
const EN = Q.get('lang') === 'en', tr = (zh, en) => EN ? en : zh;  // ?lang=en 画面里的字换英文（配 HeyGen 出的英文配音）
const DARK = Q.get('theme') === 'dark';                              // ?theme=dark 暗黑模式，任何一段都能套
const INK = DARK ? '#f4f3fa' : '#1b1b22', ink = a => DARK ? `rgba(244,243,250,${a})` : `rgba(27,27,34,${a})`;

/* ---------- 工具 ---------- */
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => cl((t - a) / (b - a));
const lerp = (a, b, u) => a + (b - a) * u;
const io = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const oc = u => 1 - Math.pow(1 - u, 3);
const spr = (t, a, d = .8) => t <= a ? 0 : 1 - Math.exp(-5 * (t - a) / d) * Math.cos(7.5 * (t - a) / d);   // 带回弹，峰值约 1.12
const TAU = Math.PI * 2;
const box = (x, y, w, h, r, c = [0, 0, 0, 0]) => ({ x, y, w: Math.max(w, .01), h: Math.max(h, .01), r: Math.max(0, Math.min(r, w, h)), c });
const circle = (x, y, r, c) => box(x, y, r, r, r, c);
/* 关键帧路径：[[t, x, y], …]，段内 io 缓动，段间停住 */
function path(keys, t) {
  if (t <= keys[0][0]) return [keys[0][1], keys[0][2]];
  for (let i = 1; i < keys.length; i++) {
    const [t1, x1, y1] = keys[i], [t0, x0, y0] = keys[i - 1];
    if (t <= t1) { const u = io(seg(t, t0, t1)); return [lerp(x0, x1, u), lerp(y0, y1, u)]; }
  }
  const k = keys[keys.length - 1]; return [k[1], k[2]];
}
/* 移动中的玻璃：顺着速度方向拉长、横向收窄 —— 液体感主要靠这一下 */
function moving(keys, t, r) {
  const [x, y] = path(keys, t), [xa, ya] = path(keys, t - .02), [xb, yb] = path(keys, t + .02);
  const vx = (xb - xa) / .04, vy = (yb - ya) / .04, s = cl(Math.hypot(vx, vy) / 2600) * .28;
  const hor = Math.abs(vx) >= Math.abs(vy);
  return hor ? box(x, y, r * (1 + s), r * (1 - s * .45), r * (1 - s * .45)) : box(x, y, r * (1 - s * .45), r * (1 + s), r * (1 - s * .45));
}

/* ---------- 字 ---------- */
/* 一行字逐字动画。fx(i, n) → {dx, dy, a, blur, s}；字放在层 A 就会被玻璃折射 */
function text(ctx, str, x, y, { size = 200, weight = 700, color = INK, track = -.02, fx = null, align = 'center', maxW = 900 } = {}) {
  ctx.save();
  const font = sz => { ctx.font = `${weight} ${sz}px ${FONT}`; ctx.letterSpacing = `${track * sz}px`; };
  font(size); ctx.textBaseline = 'middle'; ctx.fillStyle = color;
  const w0 = ctx.measureText(str).width;
  if (w0 > maxW) font(size * maxW / w0);                             // 一行太长就整行缩到 maxW 宽
  const chars = [...str], total = ctx.measureText(str).width;
  let cx = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
  chars.forEach((ch, i) => {
    const w = ctx.measureText(ch).width;
    const f = fx ? fx(i, chars.length) : {};
    const a = f.a ?? 1;
    if (a > .003) {
      ctx.save(); ctx.globalAlpha = a;
      if (f.blur > .3) ctx.filter = `blur(${f.blur.toFixed(1)}px)`;
      ctx.translate(cx + w / 2 + (f.dx || 0), y + (f.dy || 0)); ctx.scale(f.s ?? 1, f.s ?? 1);
      ctx.textAlign = 'center'; ctx.fillText(ch, 0, 0); ctx.restore();
    }
    cx += w;
  });
  ctx.restore();
  return total;
}
/* 入场：从下面浮上来、由糊变清；出场：往旁边一抹带拖影 */
const enter = (t, t0, step = .05, dur = .5) => (i) => {
  const u = oc(seg(t, t0 + i * step, t0 + i * step + dur));
  return { dy: (1 - u) * 90, a: u, blur: (1 - u) * 18 };
};
const both = (t, t0, t1, step = .05) => (i, n) => {
  const e = enter(t, t0, step)(i), u = io(seg(t, t1 + (n - 1 - i) * .03, t1 + (n - 1 - i) * .03 + .35));
  return { dy: e.dy, dx: u * 160, a: e.a * (1 - u), blur: e.blur + u * 30 };
};
function hud(ctx, scene, idx, n) {
  ctx.save();
  ctx.font = `600 24px ${FONT}`; ctx.letterSpacing = '6px'; ctx.fillStyle = ink(.55); ctx.textBaseline = 'middle';
  ctx.textAlign = 'left'; ctx.fillText('LIQUID GLASS', 72, 120); ctx.fillText(scene, 72, H - 120);
  ctx.textAlign = 'right'; ctx.fillText(`0${idx} / 0${n}`, W - 72, 120); ctx.fillText(`${BPM} BPM`, W - 72, H - 120);
  for (let i = 0; i < n; i++) {
    ctx.beginPath(); ctx.arc(W - 72 - 205 - (n - 1 - i) * 20, H - 121, 4.5, 0, TAU);
    ctx.fillStyle = i === idx - 1 ? '#3b7bf6' : ink(.25); ctx.fill();
  }
  ctx.restore();
}

/* ---------- 图标（层 B，画在玻璃上） ---------- */
function icon(ctx, kind, x, y, s, color, a = 1) {
  if (a < .003) return;
  ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = ctx.strokeStyle = color; ctx.lineWidth = 5; ctx.lineCap = ctx.lineJoin = 'round';
  ctx.beginPath();
  if (kind === 'play') { ctx.moveTo(-13, -20); ctx.lineTo(22, 0); ctx.lineTo(-13, 20); ctx.closePath(); ctx.fill(); }
  if (kind === 'heart') {
    ctx.moveTo(0, 20); ctx.bezierCurveTo(-34, -2, -22, -30, 0, -14); ctx.bezierCurveTo(22, -30, 34, -2, 0, 20); ctx.fill();
  }
  if (kind === 'share') {
    ctx.moveTo(-14, -4); ctx.lineTo(-14, 20); ctx.lineTo(14, 20); ctx.lineTo(14, -4);
    ctx.moveTo(0, 8); ctx.lineTo(0, -24); ctx.moveTo(-10, -14); ctx.lineTo(0, -24); ctx.lineTo(10, -14); ctx.stroke();
  }
  if (kind === 'home') { ctx.moveTo(-18, -2); ctx.lineTo(0, -18); ctx.lineTo(18, -2); ctx.moveTo(-13, -6); ctx.lineTo(-13, 17); ctx.lineTo(13, 17); ctx.lineTo(13, -6); ctx.stroke(); }
  if (kind === 'search') { ctx.arc(-4, -4, 13, 0, TAU); ctx.moveTo(6, 6); ctx.lineTo(18, 18); ctx.stroke(); }
  if (kind === 'chart') { for (const [bx, bh] of [[-14, 14], [0, 30], [14, 22]]) { ctx.moveTo(bx, 17); ctx.lineTo(bx, 17 - bh); } ctx.stroke(); }
  if (kind === 'user') { ctx.arc(0, -8, 9, 0, TAU); ctx.moveTo(-17, 19); ctx.quadraticCurveTo(0, -4, 17, 19); ctx.stroke(); }
  if (kind === 'wifi') { for (const r of [8, 18, 28]) { ctx.moveTo(-r * .72, 10 - r * .7); ctx.arc(0, 10, r, -Math.PI * .75, -Math.PI * .25); } ctx.stroke(); ctx.beginPath(); ctx.arc(0, 10, 3.5, 0, TAU); ctx.fill(); }
  if (kind === 'moon') { ctx.arc(0, 0, 16, .9, TAU - .9 + 2 * Math.PI, false); ctx.arc(12, -8, 13, TAU - .9 + .3, .9 + .4, true); ctx.fill(); }
  if (kind === 'note') { ctx.moveTo(-6, 14); ctx.lineTo(-6, -18); ctx.lineTo(16, -22); ctx.lineTo(16, 10); ctx.stroke(); ctx.beginPath(); ctx.arc(-12, 14, 7, 0, TAU); ctx.arc(10, 10, 7, 0, TAU); ctx.fill(); }
  if (kind === 'sun') { ctx.arc(0, 0, 9, 0, TAU); ctx.fill(); ctx.beginPath(); for (let k = 0; k < 8; k++) { const q = k * TAU / 8; ctx.moveTo(Math.cos(q) * 15, Math.sin(q) * 15); ctx.lineTo(Math.cos(q) * 21, Math.sin(q) * 21); } ctx.stroke(); }
  if (kind === 'sound') { ctx.moveTo(-18, -7); ctx.lineTo(-9, -7); ctx.lineTo(2, -17); ctx.lineTo(2, 17); ctx.lineTo(-9, 7); ctx.lineTo(-18, 7); ctx.closePath(); ctx.fill(); ctx.beginPath(); ctx.arc(4, 0, 12, -.8, .8); ctx.stroke(); }
  if (kind === 'torch') { ctx.moveTo(-9, -20); ctx.lineTo(9, -20); ctx.lineTo(6, -6); ctx.lineTo(6, 20); ctx.lineTo(-6, 20); ctx.lineTo(-6, -6); ctx.closePath(); ctx.stroke(); }
  ctx.restore();
}
function label(ctx, str, x, y, size, color, a = 1, weight = 600, align = 'left') {
  if (a < .003) return;
  ctx.save(); ctx.globalAlpha = a; ctx.font = `${weight} ${size}px ${FONT}`; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillText(str, x, y); ctx.restore();
}

/* ---------- 背景循环里的几颗玻璃珠（周期 16 秒，开场最后一帧落在它的 t=0） ---------- */
function bgOrbs(T) {
  const a = TAU * T / LOOP;
  return [
    circle(850 + 34 * Math.sin(a), 330 + 46 * Math.sin(2 * a), 124 + 8 * Math.sin(a + 1)),
    circle(190 + 46 * Math.sin(a + 2), 1520 + 70 * Math.cos(a), 158 + 10 * Math.cos(2 * a)),
    circle(360 + 120 * Math.cos(a), 1745 + 40 * Math.sin(a), 64 + 8 * Math.sin(2 * a + 1)),
    circle(940 + 26 * Math.cos(2 * a), 1210 + 60 * Math.sin(a + .5), 46),
  ];
}

/* ---------- 三段时间线：t → 这一帧的全部状态 ---------- */
const CUTS = {
  showcase: {
    duration: 16,
    drops: [.2, 1.0, 1.75, 2.55, 7.25, 7.47, 7.69, 7.91, 8.13, 9.3, 9.9, 12.8, 15.0],
    cues: [{ t: 3.0, kind: 'whoosh', d: .8 }, { t: 3.55, kind: 'whoosh', d: 1 }, { t: 5.2, kind: 'whoosh', d: 1 },
      { t: 8.4, kind: 'click', d: .2 }, { t: 8.75, kind: 'click', d: .2 }, { t: 10.7, kind: 'blip', d: .2 }, { t: 11.4, kind: 'blip', d: .2 },
      { t: 12.1, kind: 'blip', d: .2 }, { t: 13.65, kind: 'whoosh', d: 1.2 }, { t: 14.2, kind: 'chime', d: 1.5 }, { t: 6.4, kind: 'sweep', d: .6 }],
    frame: showcase,
  },
  opener: {
    duration: 4,
    drops: [.05, 2.95],
    cues: [{ t: .55, kind: 'whoosh', d: .9 }, { t: 1.95, kind: 'whoosh', d: .9 }, { t: 2.8, kind: 'sweep', d: .5 }],
    frame: opener,
  },
  bg: { duration: LOOP, drops: [], cues: [], frame: T => ({ bgT: T, shapes: bgOrbs(T), k: 90, refr: 52, mag: 1.08, bev: 50 }) },
  plain: { duration: LOOP, drops: [], cues: [], frame: T => ({ bgT: T, shapes: [] }) },          // 只有流动的渐变，垫在别的画面底下用
};

function showcase(t) {
  const F = { bgT: t, shapes: [], k: 70, refr: 58, mag: 1.1, bev: 46, A: [], B: [] };
  if (t < 3.0) {                                                     // 01 MORPH：一滴 → 拉成胶囊 → 分成三颗按钮 → 收回
    const pop = spr(t, .2, .7), m = spr(t, 1.0, .8), sp = spr(t, 1.75, .9), mg = io(seg(t, 2.55, 3.0));
    const hw = lerp(lerp(95, 230, m), 80, cl(sp)) * pop, hh = lerp(95, 80, m) * pop;
    F.shapes.push(box(CX, CY, hw * (1 - mg) + lerp(80, 150, mg) * mg, lerp(hh, 150, mg), 999));
    const xs = [-210, 0, 210], ic = ['play', 'heart', 'share'], col = [INK, '#ff375f', INK];
    if (t > 1.75) xs.forEach((x, i) => {
      F.shapes.push(circle(CX + x * sp * (1 - mg), CY, 80 * (1 - mg * .4)));
      const a = seg(t, 1.95 + i * .06, 2.15 + i * .06) * (1 - seg(t, 2.45, 2.6));
      F.B.push(c => icon(c, ic[i], CX + x * sp * (1 - mg), CY, .4 + .6 * spr(t, 1.95 + i * .06, .5), col[i], a));
    });
    F.hud = ['MORPH', 1];
  } else if (t < 6.8) {                                              // 02 REFRACT：透镜扫过字
    const keys = [[3.0, CX, CY], [3.5, CX - 300, CY - 125], [4.6, CX + 300, CY - 125], [4.9, CX + 300, CY + 125], [6.0, CX - 300, CY + 125], [6.8, CX - 145, CY - 290]];
    F.shapes.push(moving(keys, t, lerp(150, 130, io(seg(t, 6.1, 6.8)))));
    F.A.push(c => text(c, 'Liquid', CX, CY - 125, { size: 230, fx: both(t, 3.05, 6.25) }));
    F.A.push(c => text(c, 'Glass', CX, CY + 125, { size: 230, fx: both(t, 3.2, 6.35) }));
    F.mag = 1.16; F.refr = 48; F.hud = ['REFRACT', 2];
  } else if (t < 9.9) {                                              // 03 BLEND：一块长出五块，再全部融回一滴
    const P = [[-145, -290], [145, -290], [-145, 0], [145, 0], [-145, 290], [145, 290]].map(([x, y]) => [CX + x, CY + y]);
    const tints = [[.20, .50, 1, .92 * seg(t, 8.4, 8.55)], null, null, null, null, [1, .82, .1, .92 * seg(t, 8.75, 8.9)]];
    const names = [['wifi', 'Wi-Fi', 'Home'], ['moon', 'Focus', 'Off'], ['note', 'Glass Hearts', 'Nova Bloom'], ['sun', 'Light', '72%'], ['sound', 'Sound', '40%'], ['torch', 'Torch', 'Off']];
    const col = io(seg(t, 9.3, 9.9)); F.k = lerp(lerp(64, 24, seg(t, 8.2, 8.6)), 150, col);
    for (let i = 0; i < 6; i++) {
      const tb = 7.03 + .22 * i;
      if (i > 0 && t < tb) continue;
      let [x, y] = P[i], s = 130;
      if (i === 0) { const u = io(seg(t, 6.8, 7.1)); s = lerp(130, 130, u); }
      else { const u = oc(seg(t, tb, tb + .45)); x = lerp(P[i - 1][0], x, u); y = lerp(P[i - 1][1], y, u); s = 130 * lerp(.3, 1, spr(t, tb, .6)); }
      x = lerp(x, CX, col); y = lerp(y, CY, col); s = lerp(s, 120, col);
      const tn = tints[i] ? [...tints[i].slice(0, 3), tints[i][3] * (1 - col)] : undefined;
      F.shapes.push(box(x, y, s, s, lerp(56, 120, col), tn));
      const a = seg(t, tb + .25, tb + .45) * (1 - seg(t, 9.15, 9.3));
      const on = i === 0 ? seg(t, 8.4, 8.55) : 0, dark = i === 5 ? seg(t, 8.75, 8.9) : 0;
      const tk = on > .5 ? '#ffffff' : INK;
      F.B.push(c => {
        icon(c, names[i][0], x - s + 62, y - s + 66, 1, tk, a);
        label(c, names[i][1], x - s + 34, y + s - 70, 30, tk, a);
        label(c, names[i][2], x - s + 34, y + s - 34, 24, on > .5 ? 'rgba(255,255,255,.75)' : ink(.5), a, 500);
      });
    }
    F.hud = ['BLEND', 3];
  } else if (t < 12.8) {                                             // 04 NAVIGATE：一滴摊成标签栏，选中块像水一样滑
    const u = spr(t, 9.9, .8), y = CY + 170;
    F.shapes.push(box(CX, lerp(CY, y, cl(u)), lerp(120, 420, u), lerp(120, 92, u), 999));
    F.A.push(c => text(c, 'Fluid.', CX, CY - 190, { size: 250, fx: both(t, 10.15, 12.5) }));
    const xs = [-315, -105, 105, 315], ic = ['home', 'search', 'chart', 'user'], nm = ['Home', 'Search', 'Activity', 'Profile'];
    const moves = [[10.7, 0, 1], [11.4, 1, 3], [12.1, 3, 2]];
    let sel = 0, stretch = 0;
    for (const [tm, from, to] of moves) if (t > tm) { const v = io(seg(t, tm, tm + .42)); sel = lerp(from, to, v); stretch = Math.sin(Math.PI * v) * Math.abs(to - from); }
    const ia = seg(t, 10.3, 10.6) * (1 - seg(t, 12.65, 12.8));
    const sx = CX + lerp(-315, 315, sel / 3);
    F.B.push(c => {
      c.save(); c.globalAlpha = ia; c.fillStyle = DARK ? 'rgba(255,255,255,.16)' : 'rgba(255,255,255,.55)';
      const hw = 92 + 70 * stretch, hh = 72 - 10 * stretch; c.beginPath(); c.roundRect(sx - hw, y - hh, hw * 2, hh * 2, hh); c.fill(); c.restore();
      xs.forEach((x, i) => {
        const near = cl(1 - Math.abs(sel - i)), tk = near > .5 ? '#2f7cf6' : INK;
        icon(c, ic[i], CX + x, y - 14, 1, tk, ia);
        label(c, nm[i], CX + x, y + 40, 22, tk, ia, 600, 'center');
      });
    });
    F.hud = ['NAVIGATE', 4];
  } else {                                                           // 05 MERGE：收成透镜扫过标题，最后缩成句号
    const u = io(seg(t, 12.8, 13.4)), y0 = CY + 170;
    const keys = [[13.4, CX - 330, CY], [14.9, CX + 330, CY], [15.5, CX + 452, CY + 62]];
    let sh;
    if (t < 13.4) sh = box(lerp(CX, CX - 330, u), lerp(y0, CY, u), lerp(420, 150, u), lerp(92, 150, u), 999);
    else { const r = lerp(150, 22, io(seg(t, 14.95, 15.5))); sh = moving(keys, t, r); }
    F.shapes.push(sh);
    F.A.push(c => text(c, tr('液态玻璃', 'Liquid Glass'), CX - 10, CY, { size: 205, weight: 600, track: .02, fx: enter(t, 13.25, .08) }));
    F.A.push(c => text(c, tr('LIQUID GLASS · STYLE 01', 'STYLE 01 · ULTRAMOTION'), CX, CY + 200, { size: 30, weight: 600, track: .3, color: ink(.6), fx: enter(t, 14.2, .02, .4) }));
    F.mag = 1.16; F.refr = 48; F.hud = ['MERGE', 5];
  }
  const [name, idx] = F.hud; F.B.push(c => hud(c, name, idx, 5));
  return F;
}

function opener(t) {
  const F = { bgT: t - 4, shapes: [], k: 80, refr: 48, mag: 1.16, bev: 48, A: [], B: [] };
  const end = bgOrbs(0), Y = TOP ? 470 : CY, D = TOP ? 85 : 115, SZ = TOP ? 125 : 170, LR = TOP ? 110 : 150, X = TOP ? 250 : 310;
  const keys = [[.5, CX, Y], [.9, CX - X, Y - D], [1.9, CX + X, Y - D], [2.15, CX + X, Y + D], [2.85, CX - X, Y + D]];
  if (t < 2.95) {
    const r = LR * spr(t, .05, .6);
    F.shapes.push(moving(keys, t, Math.max(r, .01)));
  } else {                                                           // 透镜分成背景里的几颗珠子，落点就是 bg 的 t=0
    const u = io(seg(t, 2.95, 3.85)), [x0, y0] = path(keys, 2.95);
    end.forEach((o, i) => {
      const d = i * .04, v = io(seg(t, 2.95 + d, 3.85));
      F.shapes.push(circle(lerp(x0, o.x, v), lerp(y0, o.y, v), lerp(i === 0 ? LR : 60, o.w, v)));
    });
    F.k = lerp(80, 90, u); F.refr = lerp(48, 52, u); F.mag = lerp(1.16, 1.08, u); F.bev = lerp(48, 50, u);
  }
  const ex = (i, n) => { const e = enter(t, .3, .06)(i), v = io(seg(t, 2.7 + i * .03, 3.1 + i * .03)); return { dy: e.dy - v * 120, a: e.a * (1 - v), blur: e.blur + v * 26 }; };
  F.A.push(c => text(c, TITLE[0], CX, Y - D, { size: SZ, weight: 600, track: .02, fx: ex }));
  if (TITLE[1]) F.A.push(c => text(c, TITLE[1], CX, Y + D, { size: SZ, weight: 600, track: .02, fx: (i, n) => { const e = enter(t, .55, .06)(i), v = io(seg(t, 2.8 + i * .03, 3.2 + i * .03)); return { dy: e.dy - v * 120, a: e.a * (1 - v), blur: e.blur + v * 26 }; } }));
  return F;
}
