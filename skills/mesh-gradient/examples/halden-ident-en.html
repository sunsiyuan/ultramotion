<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Halden Film — ink ident (16:9, 9 s)</title>
<style>html,body{margin:0;background:#000}canvas{display:block;width:100vw;height:100vh;object-fit:contain}</style></head>
<body><canvas></canvas>
<script src="../mesh.js"></script>
<script src="../fluid.js"></script>
<script>
// The opening ident for Halden Film, a small documentary company in Copenhagen: it plays before each of their films.
// Clouds of ink drift up through clear water and gather into the wordmark, slow down, and lock into crisp letters;
// "FILM" settles underneath and the letters just begin to bleed again at the end.
// How: the simulation starts with the wordmark as ink and lets it sink and dissolve under gravity; the video plays that
// backwards (sim time runs from 4.6 s down to 0 with an ease-out), then forwards again very slowly for the hold.
const M = Mesh, { seg, ease, env } = M;
const W = 1920, H = 1080, DUR = 8.2;
const S = M.create({ width: W, height: H });

const INK = '#0d1c38', PAPER = '#efeee9';
const word = M.layer('word', W, H);
M.text(word, 'HALDEN', W / 2, H * .565, { font: '"Didot", "Bodoni 72", serif', size: 270, weight: 700, tracking: .06, color: INK });

const F = Fluid.sim({
  width: W, height: H, res: 256, fps: 240, substeps: 1, keep: 120,
  mode: 'ink', curl: 12, gravity: 70, viscosity: .02, turbulence: { amount: .03, scale: 2, speed: .2, seed: 3 },
  start(F) { F.load(word.canvas, { amount: 1.0, mass: 1, grain: .12, grainSize: 140 }); },
});

const LOCK = 5.2, SIM0 = 4.6;
const simTime = t => t < LOCK ? SIM0 * Math.pow(1 - t / LOCK, 1.5)              // backwards, slowing as the letters close
  : .1 * ease.sine(seg(t, LOCK + .6, DUR));                                      // then forwards, barely: the ink starts to breathe

function draw(c, t) {
  F.at(simTime(t));
  F.draw(c, { bg: PAPER, bg2: '#e6e6e1', shade: .22, edge: 30 });
  M.text(c, 'F I L M', W / 2, H * .565 + 92, { font: '"Avenir Next", sans-serif', size: 30, weight: 500, tracking: .5, color: INK, a: .85 * ease.out(seg(t, 5.7, 6.7)) });
  M.finish(c, t, { grain: .018, vignette: .12 });
}

/* a low cello swelling as the ink rises, a piano chord as the word locks, harp under the name */
const notes = [];
const N = (t, m, d, inst, v) => notes.push({ t, m, d, inst, v });
N(0, 38, 5.6, 'cello', .32); N(1.4, 45, 4.2, 'cello', .24); N(2.8, 50, 2.8, 'viola', .2);
[[50, 0], [57, .05], [62, .1], [66, .16], [69, .22]].forEach(([m, d]) => N(LOCK + d, m, 3, "piano", .26 - d * .3));
N(LOCK, 38, 3, "bass", .22);
N(5.8, 74, 2.4, 'harp', .22); N(6.2, 78, 2.2, 'harp', .18); N(6.6, 81, 2.4, 'harp', .15);
N(6.4, 45, 2.6, 'slowstrings', .16); N(6.4, 54, 2.6, 'slowstrings', .14);

window.__scene = M.scene(S, draw, { duration: DUR, background: PAPER,
  music: { notes, dynamics: { cello: [[0, .2], [3, 1], [5.2, .8], [7, .4]] } },
  timeline: [{ t0: 0, t1: LOCK, kind: 'ink', text: 'ink gathers into the word' }, { t0: LOCK, t1: DUR, kind: 'hold', text: 'HALDEN · FILM' }] });
</script>
</body></html>
