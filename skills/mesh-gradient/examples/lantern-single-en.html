<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Lantern — single teaser (9:16, 14 s)</title>
<style>html,body{margin:0;background:#000}canvas{display:block;width:100vw;height:100vh;object-fit:contain}</style></head>
<body><canvas></canvas>
<script src="../mesh.js"></script>
<script src="../fluid.js"></script>
<script>
// A Reels / TikTok teaser for "Lantern", the new single from Mira Sol, an ambient-pop artist in Los Angeles.
// Light rises through dark water from three points at the bottom — amber, rose, a cold blue — curls into eddies,
// meets and mixes where the colours add up, then thins to wisps; one small warm light rises alone under the title.
const M = Mesh, { seg, ease, env } = M;
const W = 1080, H = 1920, DUR = 14;
const S = M.create({ width: W, height: H });

const JETS = [
  { x: .34, c: '#ff9a2e', t0: .1, t1: 5.2, phase: 0, a: 2.4 },
  { x: .52, c: '#ff3d74', t0: .6, t1: 5.6, phase: 2.1, a: 2.4 },
  { x: .68, c: '#2f6bff', t0: 1.1, t1: 6.0, phase: 4.2, a: 2.4 },
  { x: .5, c: '#ffb04a', t0: 7.6, t1: 15, phase: 1, a: 2.2, sway: .012 },               // the lantern: one small warm light under the title
];
const F = Fluid.sim({
  width: W, height: H, res: 240, fps: 30, substeps: 2, keep: 30,
  mode: 'light', curl: 10, gravity: -400,
  viscosity: t => t < 6 ? .03 : .03 + .5 * M.seg(t, 6, 8.5),           // the water settles
  fade: t => .12 + 2.6 * M.seg(t, 5, 7) - 2.5 * M.seg(t, 8.2, 9),     // the first lights die away; the last one stays
  turbulence: { amount: .015, scale: 1.6, speed: .25, seed: 2 },
  step(F, t, dt) {
    for (const j of JETS) {
      if (t < j.t0) continue;
      const k = ease.out(seg(t, j.t0, j.t0 + .6)) * (1 - ease.sine(seg(t, j.t1 - 1.2, j.t1)));
      const sway = (j.sway ?? .03) * Math.sin(t * 1.3 + j.phase);
      F.pour({ x: j.x + sway, y: .965 - .01 * Math.sin(t * .9 + j.phase), r: .016, color: j.c, amount: j.a * k, mass: 14 * k, vy: -1.6, vx: sway * 2, kick: 4 }, dt);
    }
  },
});

// glow: the frame, small and blurred, added back on top — dense light blooms, thin wisps stay crisp
const G = M.layer('glow', W / 4, H / 4);
function glow(c, a, blur) {
  G.clearRect(0, 0, W / 4, H / 4); G.drawImage(c.canvas, 0, 0, W / 4, H / 4);
  c.save(); c.globalCompositeOperation = 'lighter'; c.globalAlpha = a; c.filter = `blur(${blur}px)`; c.drawImage(G.canvas, 0, 0, W, H); c.restore();
}
function draw(c, t) {
  F.at(t);
  F.draw(c, { bg: '#04050a', bg2: '#0a0710', gain: 1.6, shade: 0, spec: 0, vignette: .25 });
  const a = env(t, 9.4, DUR + 1, 1.1, .1);
  M.text(c, 'MIRA SOL', W / 2, H * .09, { font: M.SANS, size: 30, weight: 500, tracking: .5, color: '#f4ece4', a: a * .8, align: 'center' });
  M.text(c, 'Lantern', W / 2, H * .09 + 86, { font: M.SERIF, size: 92, weight: 400, italic: true, color: '#fff7ef', a, align: 'center' });
  M.text(c, 'out Friday', W / 2, H * .09 + 150, { font: M.SANS, size: 28, weight: 400, tracking: .2, color: '#f4ece4', a: a * .7, align: 'center' });
  glow(c, .55, 26);
  M.finish(c, t, { grain: .02, vignette: .1 });
}

/* the song's intro, following the light: electric-piano arpeggios that thicken as the three lights rise, a bass under the
   fullest moment, everything thinning to one held pad as they die, then the hook on a warm piano for the last light */
const notes = [], N = (t, m, d, inst, v) => notes.push({ t, m, d, inst, v });
const E = 60 / 76 / 2, CH = [[45, [57, 64, 67, 71, 72]], [41, [57, 64, 65, 69, 72]], [48, [55, 64, 67, 71, 74]], [43, [55, 62, 66, 69, 71]]];
const ARP = [0, 2, 1, 3, 2, 4, 3, 1];
for (let i = 0; i * E < 8.2; i++) {                                              // arpeggio, eighths, over the rise
  const t = .1 + i * E, bar = Math.floor(i / 8), [root, ch] = CH[bar % 4], k = Math.min(1, .45 + t / 6) * (1 - M.seg(t, 6.2, 8.2));
  N(t, ch[ARP[i % 8]], E * 2.2, 'keys', .24 * k);
  if (i % 8 === 0 && t > 2.4 && t < 7) N(t, root, E * 7.5, 'bass', .13);
}
N(6.2, 57, 4.2, 'pad', .2); N(6.2, 64, 4.2, 'pad', .16); N(6.2, 69, 4.2, 'pad', .12);           // the lights dying: one held chord
const HOOK = [[0, 76, 1], [1, 74, .5], [1.5, 72, .5], [2, 71, 1.5], [4, 72, 1], [5, 71, .5], [5.5, 69, .5], [6, 67, 2]];
HOOK.forEach(([b, m, d]) => N(8.9 + b * E * 1.0, m, d * E * 1.9, 'piano', .3));              // the last light: the hook
[[8.9, CH[0]], [8.9 + 4 * E, CH[1]], [8.9 + 8 * E, CH[2]]].forEach(([t, [root, ch]]) => {
  ch.slice(0, 3).forEach((m, i) => N(t + i * .04, m - 12, E * 4, 'keys', .16)); N(t, root, E * 4, 'bass', .11);
});
const HOOK2 = [[8, 76, .5], [8.5, 74, .5], [9, 72, .5], [9.5, 74, 1], [10.5, 76, 2.5]];
HOOK2.forEach(([b, m, d]) => N(8.9 + b * E, m, d * E * 1.9, 'piano', .26));
N(8.9 + 10.5 * E, 45, E * 6, 'bass', .1); [57, 64].forEach(m => N(9.2, m, 4.8, 'pad', .1)); [57, 64, 69].forEach((m, i) => N(8.9 + 10.5 * E + i * .04, m - 12, E * 6, 'keys', .14));

window.__scene = M.scene(S, draw, { duration: DUR, background: '#04050a',
  music: { notes, dynamics: { pad: [[6.2, .3], [7.2, .9], [9.5, .5], [10.4, 0]] } },
  timeline: [{ t0: 0, t1: 8.6, kind: 'light', text: 'light rises and thins' }, { t0: 9.4, t1: DUR, kind: 'title', text: 'MIRA SOL · Lantern' }] });
</script>
</body></html>
