<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Low Tide — Spotify Canvas loop (vertical, 8 s)</title>
<style>html,body{margin:0;background:#000}canvas{display:block;width:100vw;height:100vh;object-fit:contain}</style></head>
<body><canvas></canvas>
<script src="../mesh.js"></script>
<script>
// An 8-second Spotify Canvas for "Low Tide", the new single from a Portland dream-pop duo. It plays on repeat behind the song,
// so the last frame flows into the first. No words on screen (the app shows the title and artist).
// The single's photo — sunset at Yaquina Head on the Oregon coast — melts into its own colours, drifts for a few seconds as
// pure colour, and condenses back into the photo just before the loop comes round.
// Photo: "Yaquina Head Outstanding Natural Area at sunset", Bureau of Land Management Oregon-Washington, public domain (Wikimedia Commons).
const M = Mesh, { seg, lerp, ease, TAU } = M;
const S = M.create({ width: 1080, height: 1920 }), W = 1080, H = 1920, DUR = 8;
const photo = M.image('media/yaquina-head.jpg');

function draw(c, t) {
  // the photo, breathing in and out a little over the loop (periodic, so it lines up at the seam)
  const g = M.layer('photo', W, H);
  M.cover(g, photo, { z: 1.05 + .025 * Math.sin(TAU * t / DUR), fx: .62, fy: .55 });
  // 0 at the loop point → all colour in the middle → back to the photo before the end
  const a = ease.sine(seg(t, .9, 3.2)) * (1 - ease.sine(seg(t, 4.8, 7.5)));
  M.melt(c, t, g.canvas, a, { loop: DUR, warp: .8, scale: 1.3, zoom: 1.2, blur: .85, sat: 1.25, seed: 5 });
  M.finish(c, t, { grain: .04, vignette: .2 });
}

/* the song's hook, three bars at 90 bpm = 8 s, looping: clean guitar arpeggios, bass, a quiet shaker, a few electric-piano notes */
const notes = [], N = (t, m, d, inst, v) => notes.push({ t, m, d, inst, v });
const bt = 60 / 90, bar = 4 * bt;
const chords = [[43, 55, 59, 62, 67], [40, 55, 59, 64, 67], [36, 55, 60, 64, 67]];           // G  Em  C  → back to G
chords.forEach((ch, b) => {
  const t0 = b * bar;
  N(t0, ch[0], 1.9 * bt, 'bass', .42); N(t0 + 2 * bt, ch[0], .9 * bt, 'bass', .34); N(t0 + 3 * bt, ch[0] + 7, .9 * bt, 'bass', .3);
  [1, 2, 3, 4, 3, 2, 3, 4].forEach((k, i) => N(t0 + i * bt / 2, ch[k], bt * 1.2, 'guitar', i % 2 ? .3 : .38));
  for (let i = 0; i < 8; i++) N(t0 + i * bt / 2, 0, .1, 'shaker', i % 2 ? .12 : .07);
});
[[0, 71, 1.5], [1.5, 69, .5], [2, 67, 1], [4, 71, 1], [5, 74, 1.5], [6.5, 72, .5], [8, 71, 2], [10, 67, 1.5]].forEach(([b, m, d]) => N(b * bt, m, d * bt, 'keys', .2));

window.__scene = M.scene(S, draw, { duration: DUR, loop: true, background: '#1b2433', music: { notes } });
</script>
</body></html>
