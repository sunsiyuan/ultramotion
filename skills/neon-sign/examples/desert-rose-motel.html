<!doctype html>
<meta charset="utf-8">
<title>Desert Rose Motel — the roadside sign at dusk</title>
<style>html, body { margin: 0; background: #000; } canvas { display: block; max-width: 100vw; max-height: 100vh; margin: auto; }</style>
<canvas></canvas>
<script src="../neon.js"></script>
<script>
// Dusk on a desert highway. The motel's pole sign stands in the scrub beside the road, the mountains and the last of the light
// behind it. Cut in close on each part as it strikes — the script, the letters of MOTEL, VACANCY buzzing at one electrode while NO
// stays dark — then cut wide: the whole sign up on its pole, its light on the ground around it, the arrow starting to run toward the office.
// The desert is a photograph (media/desert-dusk.jpg); the sign and its light are drawn into it.
const N = Neon, W = 1920, H = 1080, DUR = 13;
window.__scene = N.scene(async () => {
  const S = N.stage({ width: W, height: H });

  // the plate, placed in the sign's world: horizon at y ≈ 790, the road running off to the left of the sign
  const PL = { x: 90, y: -22, w: 2340, h: 1317 }, HORIZON = 790;
  const plate = await N.photo('media/desert-dusk.jpg', { w: PL.w, h: PL.h });
  const soft = document.createElement('canvas'); soft.width = PL.w; soft.height = PL.h;                 // the same plate, out of focus, for the close-ups
  { const g = soft.getContext('2d'); g.filter = 'blur(6px)'; g.drawImage(plate, 0, 0); }

  const script = await N.text('Desert Rose', { font: '400 134px "SignPainter"', x: 1310, y: 210 });
  const motel = await N.text('MOTEL', { font: '500 104px "Futura"', x: 1310, y: 548, vertical: true, gap: 88 });
  const no = await N.text('NO', { font: '600 66px "Avenir Next Condensed"', x: 1150, y: 856, spacing: 4 });
  const vac = await N.text('VACANCY', { font: '600 66px "Avenir Next Condensed"', x: 1372, y: 856, spacing: 6 });
  const chev = i => { const x = 1236 - i * 40; return [N.line([[x + 13, 940], [x - 9, 962], [x + 13, 984]])]; };   // six chevrons on the arrow, pointing to the office

  const run = N.chase(6, .16, { fill: true, hold: 3, dim: .12 });
  const tubes = [
    N.tube(script, { gas: 'aqua', width: 9, at: 1.25, style: 'stutter', seed: 6, bursts: 3 }),
    ...N.tubes(motel, { gas: 'red', width: 8, at: i => 2.45 + i * .11, style: i => i === 3 ? 'stutter' : 'snap', seed: i => 20 + i }),
    N.tube(no, { gas: 'red', width: 6, at: 999 }),                                   // the NO stays dark
    N.tube(vac, { gas: 'red', width: 6, at: 3.95, style: 'stubborn', trying: 1.4, seed: 9 }),
    ...[0, 1, 2, 3, 4, 5].map(i => N.tube(chev(i), { gas: 'gold', width: 7, at: 6.1 + i * .05, style: 'snap', seed: 30 + i, supports: 0,
      level: t => t < 6.8 ? 1 : run(t - 6.8, i) })),
  ];
  const cream = '#cbbf9f', teal = '#2b7d78', steel = '#4b4f55', navy = '#1f2b33';
  const boards = [[1040, 116, 540, 196, 30, cream, teal], [1236, 312, 148, 478, 8, teal, cream], [1066, 800, 488, 112, 16, navy, cream]];
  const r = N.rng(41), grain = document.createElement('canvas'); grain.width = grain.height = 256;   // enamel and grime, tiled over the sheet metal
  { const g = grain.getContext('2d'), id = g.createImageData(256, 256); for (let i = 0; i < id.data.length; i += 4) { const v = 226 + r() * 29; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; } g.putImageData(id, 0, 0); }
  const sign = N.sign({
    stage: S, tubes, wall: null, res: 2,                                          // the photo shows through everywhere the sign isn't
    backdrop: (c, t, cam) => {
      cam.apply(c, 1);                                                             // the plate is where the sign is: it moves with every cut
      c.drawImage(cam.z > 1.5 ? soft : plate, PL.x, PL.y, PL.w, PL.h);             // close on the sign, the desert behind is out of focus
      c.setTransform(1, 0, 0, 1, 0, 0); c.globalCompositeOperation = 'multiply';   // the light going while we watch
      c.fillStyle = N.rgba(N.mix('#d4d4e4', '#8c90b4', N.seg(t, 0, DUR))); c.fillRect(0, 0, W, H); c.globalCompositeOperation = 'source-over';
    },
    paint: g => {
      const pole = g.createLinearGradient(1292, 0, 1328, 0); pole.addColorStop(0, '#6a6e74'); pole.addColorStop(.3, steel); pole.addColorStop(1, '#25282c');
      g.fillStyle = pole; g.fillRect(1292, 300, 36, 800);                                                             // the pole, round
      for (const y of [316, 778, 912]) { g.fillStyle = '#3a3d42'; g.fillRect(1284, y, 52, 14); g.fillStyle = 'rgba(0,0,0,.45)'; g.fillRect(1284, y + 12, 52, 3); }   // clamps where the boards hang
      const streaks = (x, y, w, h) => { for (let k = 0; k < Math.round(w / 60); k++) {                               // rust run off the rivets and the top seam
        const sx = x + 14 + r() * (w - 28), sy = y + 4 + r() * 6, L = 30 + r() * h * .5, gr = g.createLinearGradient(0, sy, 0, sy + L);
        gr.addColorStop(0, `rgba(96,54,30,${.1 + r() * .14})`); gr.addColorStop(1, 'rgba(96,54,30,0)'); g.fillStyle = gr; g.beginPath(); g.ellipse(sx, sy + L / 2, 1.5 + r() * 3, L / 2, 0, 0, 7); g.fill(); } };
      const board = (x, y, w, h, rr, face, rim) => {
        g.save(); g.beginPath(); g.roundRect(x, y, w, h, rr); g.clip();
        g.fillStyle = rim; g.fillRect(x, y, w, h); g.fillStyle = face; g.beginPath(); g.roundRect(x + 12, y + 12, w - 24, h - 24, Math.max(0, rr - 10)); g.fill();
        g.globalCompositeOperation = 'multiply'; g.fillStyle = g.createPattern(grain, 'repeat'); g.fillRect(x, y, w, h);
        for (let k = 0; k < 5; k++) { const bx = x + r() * w, by = y + h * (.5 + r() * .5), br = 40 + r() * 120, gr = g.createRadialGradient(bx, by, 0, bx, by, br);   // weathered patches
          gr.addColorStop(0, `rgba(150,140,120,${.25 + r() * .2})`); gr.addColorStop(1, 'rgba(150,140,120,0)'); g.fillStyle = gr; g.fillRect(x, y, w, h); }
        g.globalCompositeOperation = 'source-over'; streaks(x, y, w, h);
        const sh = g.createLinearGradient(0, y, 0, y + h); sh.addColorStop(0, 'rgba(255,255,255,.10)'); sh.addColorStop(.5, 'rgba(0,0,0,0)'); sh.addColorStop(1, 'rgba(0,0,0,.3)');
        g.fillStyle = sh; g.fillRect(x, y, w, h);                                                                   // sheet metal: lighter at the top, grimier at the bottom
        g.strokeStyle = 'rgba(0,0,0,.45)'; g.lineWidth = 3; g.beginPath(); g.roundRect(x + 12, y + 12, w - 24, h - 24, Math.max(0, rr - 10)); g.stroke();   // the seam where the face meets the rim
        g.strokeStyle = 'rgba(255,255,255,.22)'; g.lineWidth = 2; g.beginPath(); g.moveTo(x + rr, y + 2); g.lineTo(x + w - rr, y + 2); g.stroke();
        g.restore();
        for (let k = x + 30; k < x + w - 20; k += 70) for (const ky of [y + 6, y + h - 6]) { g.fillStyle = 'rgba(0,0,0,.4)'; g.beginPath(); g.arc(k, ky, 2.8, 0, 7); g.fill(); g.fillStyle = 'rgba(255,255,255,.25)'; g.beginPath(); g.arc(k - .8, ky - .8, 1.1, 0, 7); g.fill(); }
      };
      for (const b of boards) board(...b);
      g.save(); g.beginPath(); g.moveTo(1290, 928); g.lineTo(1040, 928); g.lineTo(990, 962); g.lineTo(1040, 996); g.lineTo(1290, 996); g.closePath();   // the arrow board
      g.fillStyle = navy; g.fill(); g.save(); g.clip(); g.globalCompositeOperation = 'multiply'; g.fillStyle = g.createPattern(grain, 'repeat'); g.fillRect(980, 920, 320, 90); g.restore();
      g.strokeStyle = cream; g.lineWidth = 6; g.stroke(); g.restore(); streaks(1040, 928, 250, 68);
    },
    ambient: t => N.rgba(N.mix('#a2a6c0', '#5c6288', N.seg(t, 0, DUR))),
    spill: 1.5, bloom: .85, shadow: [.2, .8], shadowAlpha: .35, vignette: .35,
  });
  // the pool of light under the sign: each colour by how much of it is lit, multiplied by the ground in the photo
  const pool = document.createElement('canvas'); pool.width = W; pool.height = H; const pg = pool.getContext('2d');
  const lights = [['aqua', 1310, 700, 230, .7], ['red', 1340, 560, 200, 1], ['gold', 1150, 340, 140, .7]];
  function ground(c, t) {
    const st = sign.states(t), m = c.getTransform(), glow = {};
    sign.tubes.forEach((tb, i) => { const k = tb.gas.glow; (glow[k] = glow[k] || [0, 0]); glow[k][0] += st[i].b; glow[k][1]++; });
    pg.setTransform(1, 0, 0, 1, 0, 0); pg.globalCompositeOperation = 'source-over'; pg.fillStyle = '#000'; pg.fillRect(0, 0, W, H);
    pg.setTransform(m); pg.globalCompositeOperation = 'lighter';
    for (const [gas, x, rx, ry, k] of lights) {
      const [on, n] = glow[N.gas(gas).glow] || [0, 1], a = k * on / n; if (a < .01) continue;
      pg.save(); pg.translate(x, 1130); pg.scale(1, ry / rx); const gr = pg.createRadialGradient(0, 0, 0, 0, 0, rx);
      gr.addColorStop(0, N.rgba(N.gas(gas).glow, a)); gr.addColorStop(.45, N.rgba(N.gas(gas).glow, a * .35)); gr.addColorStop(1, N.rgba(N.gas(gas).glow, 0));
      pg.fillStyle = gr; pg.fillRect(-rx, -rx, rx * 2, rx * 2); pg.restore();
    }
    pg.globalCompositeOperation = 'multiply'; pg.drawImage(plate, PL.x, PL.y, PL.w, PL.h);
    pg.globalCompositeOperation = 'destination-out'; const sky = pg.createLinearGradient(0, HORIZON - 10, 0, HORIZON + 60); sky.addColorStop(0, '#000'); sky.addColorStop(1, 'rgba(0,0,0,0)');
    pg.fillStyle = sky; pg.fillRect(0, -500, W * 2, HORIZON + 560);                                                  // the far desert and the sky stay out of it
    c.save(); c.setTransform(1, 0, 0, 1, 0, 0); c.globalCompositeOperation = 'lighter'; for (let k = 0; k < 4; k++) c.drawImage(pool, 0, 0);
    c.setTransform(m); const warm = .5 * (1 - N.seg(t, 0, DUR) * .7);                                              // the west edges, warm from the afterglow
    c.strokeStyle = `rgba(255,160,100,${warm})`; c.lineWidth = 1.5;
    for (const [x, y, , h, rr] of boards) { c.beginPath(); c.moveTo(x + 1, y + rr); c.lineTo(x + 1, y + h - rr); c.stroke(); }
    for (const [y0, y1] of [[790, 800], [912, 928], [996, 1100]]) { c.beginPath(); c.moveTo(1293.5, y0); c.lineTo(1293.5, y1); c.stroke(); }
    c.restore();
  }
  const shots = [
    [0.0, 2.1, { x: 1310, y: 214, z: 3.0 }, { x: 1300, y: 214, z: 3.12 }],          // the script
    [2.1, 3.6, { x: 1310, y: 550, z: 1.95 }, { x: 1310, y: 540, z: 2.02 }],         // MOTEL
    [3.6, 5.9, { x: 1300, y: 856, z: 3.1 }, { x: 1310, y: 856, z: 3.2 }],           // NO VACANCY
    [5.9, DUR, { x: 1020, y: 600, z: 1.08 }, { x: 1030, y: 596, z: 1.11 }],          // wide
  ];
  const cam = t => { const [a, b, A, B] = shots.find(s => t < s[1]) || shots[shots.length - 1]; const u = N.seg(t, a, b); return { x: N.lerp(A.x, B.x, u), y: N.lerp(A.y, B.y, u), z: N.lerp(A.z, B.z, u) }; };
  // a few notes on a guitar once the whole sign is up
  const lick = [[7.2, 52], [7.5, 55], [7.8, 57], [8.4, 59], [9.0, 64]].map(([t, m], i) => ({ t, m, d: i === 4 ? 3 : .9, inst: 'guitar', v: .4 }));
  return {
    duration: DUR,
    draw: t => sign.draw(t, { camera: cam(t), under: ground }),           // under: the afterglow on the west edges, the sign's light on the desert floor
    sounds: [{ kind: 'street', t: 0, dur: DUR, v: .14 }, { kind: 'clack', t: .95, v: .7 }, ...sign.sounds(DUR, { hz: 120 })],
    music: { notes: lick },
  };
});
</script>
