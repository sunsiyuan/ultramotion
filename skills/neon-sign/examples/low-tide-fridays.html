<!doctype html>
<meta charset="utf-8">
<title>Low Tide — Fridays, 9 PM</title>
<style>html, body { margin: 0; background: #000; } canvas { display: block; max-width: 100vw; max-height: 100vh; margin: auto; }</style>
<canvas></canvas>
<script src="../neon.js"></script>
<script>
// Ten to nine in a small bar. On the plank wall behind the stage the trio's sign comes on: the purple script
// warms up slow the way cold argon does, the line of days snaps on, and the wave underneath starts to roll.
// The bass player checks one note.
const N = Neon, W = 1080, H = 1080, DUR = 13;
window.__scene = N.scene(async () => {
  const S = N.stage({ width: W, height: H });

  const name = await N.text('Low Tide', { font: '400 230px "Snell Roundhand"', x: 540, y: 430 });
  const when = await N.text('FRIDAYS 9 PM', { font: '500 64px "Avenir Next Condensed"', x: 540, y: 760, spacing: 10 });
  // the wave: five crests, each its own tube so they can light in turn
  const crest = i => { const p = []; for (let k = 0; k <= 30; k++) { const u = k / 30, x = 250 + (i + u) * 116; p.push([x, 610 - Math.sin(u * Math.PI) * 26]); } return p; };

  const tubes = [
    N.tube(name, { gas: 'purple', width: 12, at: 1.3, style: 'warm', seed: 5 }),
    N.tube(when, { gas: 'aqua', width: 7, at: 2.6, style: 'stutter', seed: 8 }),
    ...[0, 1, 2, 3, 4].map(i => N.tube([crest(i)], { gas: 'ice', width: 8, at: 3.3 + i * .08, style: 'snap',
      level: t => t < 5.2 ? 1 : .25 + .75 * Math.max(0, 1 - Math.abs(((t - 5.2) / .35) % 7 - i)) })),   // a bright crest rolling left to right, the rest low
  ];
  const sign = N.sign({
    stage: S, tubes, ambient: '#4a3a34', spill: 2.2,
    wall: N.wall('wood', { w: W, h: H, vertical: true, plank: 96, color: '#5e3f2a', seed: 4 }),
    paint: g => {                                               // a clear acrylic backer, screwed to the planks
      g.fillStyle = 'rgba(255,255,255,.04)'; g.beginPath(); g.roundRect(170, 230, 740, 600, 24); g.fill();
      g.strokeStyle = 'rgba(255,255,255,.14)'; g.lineWidth = 2; g.beginPath(); g.roundRect(170, 230, 740, 600, 24); g.stroke();
      for (const [x, y] of [[196, 256], [884, 256], [196, 804], [884, 804]]) { g.fillStyle = '#9a9a96'; g.beginPath(); g.arc(x, y, 7, 0, 7); g.fill(); g.fillStyle = 'rgba(0,0,0,.4)'; g.fillRect(x - 5, y - 1, 10, 2); }
    },
    wires: [N.cable([540, 830], [540, H + 40], 0, { width: 7 })],
  });
  const cam = t => N.camera([[0, { x: 540, y: 540, z: 1.0 }], [DUR, { x: 540, y: 520, z: 1.08 }]], t);
  // one soundcheck note on the upright bass, then a quiet chord from the piano: the room, not a score
  const notes = [{ t: 6.6, m: 40, d: 1.6, inst: 'bass', v: .55 }, { t: 8.4, m: 45, d: 1.1, inst: 'bass', v: .5 }, { t: 9.4, m: 43, d: 2.2, inst: 'bass', v: .5 },
                 ...[57, 60, 64, 67].map((m, i) => ({ t: 10.2 + i * .03, m, d: 2.6, inst: 'piano', v: .32 }))];
  return {
    duration: DUR,
    draw: t => sign.draw(t, { camera: cam(t) }),
    sounds: [{ kind: 'clack', t: 1.1, v: .6 }, ...sign.sounds(DUR, { hz: 120, hum: .7 })],
    music: { notes },
  };
});
</script>
