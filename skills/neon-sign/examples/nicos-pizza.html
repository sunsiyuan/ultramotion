<!doctype html>
<meta charset="utf-8">
<title>Nico's Pizza — open late, seen through a wet window</title>
<style>html, body { margin: 0; background: #000; } canvas { display: block; max-width: 100vw; max-height: 100vh; margin: auto; }</style>
<canvas></canvas>
<script src="../neon.js"></script>
<script>
// A rainy weeknight in Queens, looking out of an apartment window at the side wall of the pizza place across the street. The lens is on the drops on the glass; across the street
// the pizza place's sign comes on as a blur — red script, white PIZZA, OPEN LATE in green buzzing at one end before it holds —
// and every drop on the glass holds a tiny upside-down copy of it. Then focus slides off the glass onto the sign.
const N = Neon, W = 1080, H = 1920, DUR = 12, FLOOR = 1520;
window.__scene = N.scene(async () => {
  const S = N.stage({ width: W, height: H });

  const name = await N.text("Nico's", { font: '400 250px "SignPainter"', x: 540, y: 760 });
  const pizza = await N.text('PIZZA', { font: '500 150px "Futura"', x: 540, y: 1000, spacing: 18 });
  const late = await N.text('OPEN LATE', { font: '600 88px "Avenir Next Condensed"', x: 540, y: 1160, spacing: 10 });
  const tubes = [
    N.tube(name, { gas: 'red', width: 12, at: 2.0, style: 'stutter', seed: 2, bursts: 4 }),
    ...N.tubes(pizza, { gas: 'warmwhite', width: 9, at: i => 2.7 + i * .09, style: 'snap' }),
    N.tube(late, { gas: 'green', width: 8, at: 3.3, style: 'stubborn', trying: 1.6, seed: 5 }),
  ];
  const sign = N.sign({
    stage: S, tubes, ambient: '#2a3046',
    wall: N.wall('brick', { w: W, h: H, color: '#6a3324', seed: 21 }),
    floor: N.floor(FLOOR, { w: W, h: H, kind: 'asphalt', puddles: 18, sheen: .4 }),
    reflect: { strength: 1, ripple: 8 },
  });
  // focus: on the glass, then off it onto the sign across the street
  const pull = t => N.io(N.seg(t, 6.6, 8.6));
  return {
    duration: DUR,
    draw: t => {
      sign.draw(t);
      N.rain(S.ctx, t, { n: 260, alpha: .16, color: '#e0e6ff' });
      N.glass(S.ctx, t, { blur: N.lerp(22, 2.5, pull(t)), soft: N.lerp(0, 7, pull(t)), drops: 240, size: 30, runs: 6, fog: .12, seed: 7 });
    },
    // from inside: rain on the pane, the street muffled, the sign's hum too far away to hear
    sounds: [{ kind: 'rain', t: 0, dur: DUR, v: 1 }, { kind: 'street', t: 0, dur: DUR, v: .25 }, ...sign.sounds(DUR, { hz: 120, hum: .15, zap: .25, sizzle: .3 })],
  };
});
</script>
