<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas></canvas>
<script src="../brush.js"></script>
<script>
/* «The Starry Night», landscape 16:9, painted from the original (compare with «starry-night.html», which invents the painting).
   Every stroke takes the original's colour and runs the way its brushwork runs; the two big swirls turn a few degrees and back,
   the sky slides along its own strokes, the cypress sways from its tip. The painting is taller than 16:9, so the camera starts
   on the sky and comes down to the sleeping village. Made by comparing frames with the original (render.py --preview --ref)
   until the colours, the strokes and the village read like Van Gogh's. */
const F = Painterly, W = 1920, H = 1520, CROP = .985;                   // the scan's own frame edge is cut off
window.__scene = F.fromImage('ref/starry-night.jpg', img => {
  const R = F.reference(img, { width: W / CROP, height: H / CROP, smooth: 3.5, detail: .8 }), OX = W * (1 / CROP - 1) / 2, OY = H * (1 / CROP - 1) / 2;
  const VORT = [[930, 520, 330, 1], [1290, 720, 170, -1]];
  const inCypress = (x, y) => x > 230 && x < 640 && y > 120;
  function paint(x, y, t) {
    const sky = y < 960 ? 1 : Math.max(0, 1 - (y - 960) / 120), cyp = inCypress(x, y) ? 1 : 0;
    let sx = x, sy = y;
    for (const [vx, vy, r, d] of VORT) {                                           // turn the swirls a little, then back
      const dx = x - vx, dy = y - vy, k = Math.exp(-(dx * dx + dy * dy) / (r * r)) * sky * (1 - cyp), an = d * .02 * Math.sin(t * .35) * k;
      sx += dx * Math.cos(an) - dy * Math.sin(an) - dx; sy += dx * Math.sin(an) + dy * Math.cos(an) - dy; }
    const tip = cyp ? Math.pow(1 - y / H, 1.5) * Math.sin(t * .8 + y * .01) * 6 : 0;          // the cypress sways most at its tip
    const p = R.at(sx + tip + OX, sy + OY), village = y > 1080 && !cyp;
    const m = (p.c[0] + p.c[1] + p.c[2]) / 3, c = p.c.map(v => v + (v - m) * .25);    // oil reads a little richer than a photo of it
    return { c, a: p.a, pop: village ? p.pop : 0, size: p.size, len: p.coherence > .3 ? 1.5 : 1, flow: sky * (1 - cyp) * (p.coherence > .3 ? 5 : 0) };
  }
  // the village is drawing, not brushwork — small roofs, the church, lit windows: keep the original there, a few strokes over it
  const smooth = (a, b, v) => { const u = F.cl((v - a) / (b - a)); return u * u * (3 - 2 * u); };
  const keep = { image: R.image, ox: OX, oy: OY, mask: (x, y) => smooth(1040, 1130, y) * (1 - smooth(560, 660, x) * (1 - smooth(640, 700, x)) * 0) * (x < 650 ? smooth(560, 650, x) : 1) };
  const P = F.create({ width: W, height: H, view: [1920, 1080], paint, keep, background: '#14306f', underDark: .75, lines: R.lines.filter(l => keep.mask(l.x - OX, l.y - OY) < .3),
    strokes: { size: 1, density: 1, impasto: .85, temperature: .15 }, boil: { rate: 10, share: .08, amount: .25 },
    camera: t => { const u = F.ease(F.seg(t, 0, 18)); return { x: W / 2 + 30 - u * 60, y: 580 + u * 400, zoom: 1.03 }; } });
  // music: D minor nocturne — the piano walks an arpeggio, a cello holds the bass, strings swell as the camera reaches the village,
  // a violin sings above, a celesta when the stars come into view
  const notes = [], N = (t, m, d, inst, v) => notes.push({ t, m, d, inst, v }), beat = 60 / 72;
  const prog = [[38, [50, 57, 62, 65]], [34, [50, 53, 58, 62]], [31, [50, 55, 58, 62]], [33, [49, 52, 57, 61]], [38, [50, 57, 62, 65]]];
  prog.forEach(([b, ch], bar) => { const t0 = bar * beat * 4;
    [0, 1, 2, 3].forEach(k => N(t0 + k * beat, ch[[0, 2, 1, 3][k]] + 12, beat * 1.8, 'piano', (.4 + .12 * (k === 0)) * (.8 + .08 * bar)));
    N(t0, b + 12, beat * 4, 'cello', .4); ch.forEach(m => N(t0, m, beat * 4.2, 'slowstrings', .45)); });
  [[3.4, 69, 2.4], [6.2, 70, 1.6], [7.9, 69, 2.6], [10.6, 67, 1.6], [12.3, 69, 1.2], [13.6, 65, 3.6]].forEach(([t, m, d]) => N(t, m, d, 'violin', .5));
  [86, 81, 89, 84].forEach((m, i) => N(1.5 + i * .22, m - 12, 2.4, 'celesta', .3));
  return F.scene(P, { duration: 18, music: { notes, dynamics: { slowstrings: [[0, .2], [9, .5], [15, .75], [18, .45]], violin: [[0, .45], [12, .7], [18, .55]] } } });
});
</script></body></html>
