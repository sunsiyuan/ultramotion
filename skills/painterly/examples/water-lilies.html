<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas></canvas>
<script src="../brush.js"></script>
<script>
/* Monet, «Water Lilies» (1906), painted from the original in short broken dabs ('dab' touch) — not Van Gogh's long strokes.
   What moves is the light: the sky's reflection drifts slowly across the pond as a paler band, the water shivers in thin
   horizontal touches, the whole picture warms from a cool morning blue towards noon; the pads rock a little on the water.
   The bright touches of the original (the pink and yellow flowers, the glints) are kept on top with `pop`.
   One small life: a dragonfly crosses the pond, hovers, touches the water once, and the ring spreads. */
const F = Painterly, W = 1200, H = 2133;
window.__scene = F.fromImage('ref/water-lilies.jpg', img => {
  const R = F.reference(img, { width: W, height: H, detail: .5 });
  const warm = t => F.ease(F.seg(t, 0, 18));
  function paint(x, y, t) {
    const rock = Math.sin(t * .7 + x * .004 + y * .002) * 3;                       // the pads ride the water a little
    const p = R.at(x + rock, y + Math.sin(t * .9 + x * .005) * 2);
    const band = Math.exp(-Math.pow((y - (300 + t * 70) - Math.sin(x * .004) * 90) / 260, 2));   // the sky's reflection drifting down the pond
    const w = warm(t), b = band * .1, c = p.c.map((v, i) => v * (1 + b) + w * [7, 3, -6][i]);   // the reflection lifts the paint a little; the morning warms it a little
    const water = p.pop < .3 && p.coherence < .5;                                   // open water shivers sideways; pads and flowers stay put
    return { c, a: water ? 0 : p.a, size: p.size, pop: p.pop, flow: water ? 3 + band * 6 : 0 };
  }
  const fly = (c, t) => {                                                     // painted with the same brush, about as big as a lily pad is wide
    const path = [[-120, 640], [360, 740], [640, 1150], [640, 1150], [1000, 940], [1360, 820]], keys = [3, 7, 9.2, 11.2, 14, 17];
    if (t < keys[0] || t > keys[5]) return;
    let i = 0; while (t > keys[i + 1]) i++; const u = F.ease(F.seg(t, keys[i], keys[i + 1]));
    const x = path[i][0] + (path[i + 1][0] - path[i][0]) * u + Math.sin(t * 9) * 8, y = path[i][1] + (path[i + 1][1] - path[i][1]) * u + Math.sin(t * 7) * 6;
    const dip = F.seg(t, 9.9, 10.1) * (1 - F.seg(t, 10.3, 10.6)), yy = y + dip * 24, a = i === 2 ? .15 : Math.atan2(path[i + 1][1] - path[i][1], path[i + 1][0] - path[i][0]);
    const ax = Math.cos(a), ay = Math.sin(a), nx = -ay, ny = ax, flap = Math.sin(t * 50) * .22;
    for (const s of [-1, 1]) for (const [off, len, sw] of [[8, 40, .08], [-6, 36, -.18]]) {          // four glassy wings, each a few pale dabs fanned out from the body
      const wa = a + s * (Math.PI / 2 - sw) + s * flap;
      for (let k = 0; k < 4; k++) { const d = 8 + k * len / 4, wx = x + ax * off + Math.cos(wa) * d, wy = yy + ay * off + Math.sin(wa) * d;
        P.stroke(wx, wy, wa, 7, 9 - k, [218, 230, 238].map(v => v - k * 6), 9e8 + 11 + s * 50 + k + off, .55); } }
    for (let k = 0; k < 5; k++) P.stroke(x - ax * (6 + k * 11), yy - ay * (6 + k * 11), a, 6, 6 - k * .6, [52, 78, 104], 9e8 + 30 + k);   // the long body, segment by segment
    P.stroke(x + ax * 8, yy + ay * 8, a, 7, 10, [36, 54, 78], 9e8 + 1);
  };
  const ring = (c, t) => { const u = F.seg(t, 10, 15); if (u <= 0 || u >= 1) return;
    for (let k = 0; k < 2; k++) { const r = 12 + (u * 220 - k * 50); if (r < 8) continue; const n = Math.round(r / 6);
      for (let j = 0; j < n; j++) { const th = j / n * Math.PI * 2; P.stroke(640 + Math.cos(th) * r, 1174 + Math.sin(th) * r * .32, th + Math.PI / 2, 9, 4, [204, 218, 232], 9e8 + 40 + k * 97 + j, (1 - u) * .9); } } };
  const P = F.create({ width: W, height: H, view: [1080, 1920], paint, background: '#3d4c6a', underDark: .8, after: (c, t) => { ring(c, t); fly(c, t); },
    strokes: { touch: 'dab', size: .7, density: 1.6, impasto: .45, temperature: .6 }, boil: { rate: 10, share: .12, amount: .6 },
    camera: t => { const u = F.ease(F.seg(t, 0, 18)); return { x: W / 2 - u * 50, y: H / 2 + 20 - u * 160, zoom: 1080 / W * (1.04 + u * .12) }; } });
  // music: a slow impressionist wash in D major — harp and flute over soft strings, a celesta when the light comes through
  const notes = [], N = (t, m, d, inst, v) => notes.push({ t, m, d, inst, v }), beat = 60 / 66;
  const prog = [[38, [62, 66, 69, 73]], [43, [62, 67, 71, 74]], [40, [59, 64, 67, 71]], [45, [61, 64, 69, 73]], [38, [62, 66, 69, 74]]];
  prog.forEach(([b, ch], bar) => { const t0 = bar * beat * 4;
    ch.forEach((m, k) => N(t0 + k * beat / 2, m, beat * 3, 'harp', .4)); ch.slice().reverse().forEach((m, k) => N(t0 + (k + 4) * beat / 2, m + 12, beat * 2, 'harp', .3));
    ch.slice(0, 3).forEach(m => N(t0, m - 12, beat * 4.2, 'slowstrings', .35)); N(t0, b, beat * 4, 'bass', .3); });
  [[2.2, 78, 1.6], [4, 76, .8], [4.8, 74, 2.2], [8.4, 79, 1.6], [10.2, 78, .8], [11, 76, 2.8], [14.6, 74, 3]].forEach(([t, m, d]) => N(t, m, d, 'flute', .45));
  [86, 81, 90, 85].forEach((m, i) => N(10 + i * .25, m - 12, 2.4, 'celesta', .3));        // the dragonfly touches the water
  return F.scene(P, { duration: 18, music: { notes, dynamics: { slowstrings: [[0, .3], [9, .5], [18, .4]] } }, sounds: [{ t: 0, dur: 18, kind: 'whoosh', v: .3 }] });
});
</script></body></html>
