<!doctype html>
<meta charset="utf-8">
<title>Maple Oat Latte — menu screen</title>
<style>html,body{margin:0;background:#000}canvas{display:block;max-width:100vw;max-height:100vh}</style>
<canvas></canvas>
<script src="../pixel.js"></script>
<script>
/* ===== change these ===== */
const CONTENT = {
  kicker: 'BACK FOR FALL',
  name: ['MAPLE', 'OAT LATTE'],
  desc: ['Oat milk, real maple', 'syrup and a pinch', 'of cinnamon.'],
  price: '$5.75',
  size: '12 oz  hot or iced',
  shop: 'JUNIPER & RYE COFFEE',
  where: '412 ALDER ST  OPEN 7-3',
};
const COLORS = {
  board: '#1f3b34', board2: '#2c5247', cream: '#f3e6c8', latte: '#d9b48a', caramel: '#c47a3a', rust: '#a3462d',
  maple: '#c8432b', gold: '#e9b44c', brown: '#6b3f2a', dark: '#16110f', white: '#fffaf0',
};
const LOOP = 12, BPM = 80;              // the screen plays it over and over: 12 s, four bars of music
/* ======================== */

const P = Pixel, C = COLORS, GW = 240, GH = 135;
const MUG = { x: 60, y: 64 };
const T = { kicker: .3, name: .75, desc: 1.2, price: 1.7 };   // when the words arrive           // centre of the cup's rim

const LEAF = P.sprite([
  '....a....', '.a..a..a.', '.aa.a.aa.', '..aaaaa..', 'aaaaaaaaa', '.aaaaaaa.', '..aaaaa..', '....s....', '....s....'], { a: COLORS.maple, s: COLORS.brown });
const LEAVES = [COLORS.maple, COLORS.caramel, COLORS.gold, COLORS.rust].map(c => [P.colorize(LEAF, c),
  P.sprite(['..a..', '.aaa.', 'aaaaa', '.aaa.', '..s..', '..s..'], { a: c, s: COLORS.brown }),             // turned, half on
  P.sprite(['.a.', '.a.', 'aaa', '.a.', '.s.'], { a: c, s: COLORS.brown })]);                               // edge on
const HEART = P.sprite(['.cc.cc..', 'ccccccc.', '.ccccc..', '..ccc...', '...c....'].map(r => r.slice(0, 7)), { c: COLORS.cream });

function cup(g, t) {
  const { x, y } = MUG;
  // saucer and its shadow
  P.shape(g, C.dark, c => { c.beginPath(); c.ellipse(x + 3, y + 54, 44, 7, 0, 0, 7); c.fill(); });
  P.shape(g, C.cream, c => { c.beginPath(); c.ellipse(x, y + 50, 42, 7, 0, 0, 7); c.fill(); });
  P.shape(g, C.latte, c => { c.beginPath(); c.ellipse(x, y + 51, 42, 6, 0, 0, Math.PI); c.fill(); });
  // handle
  P.shape(g, C.cream, c => { c.lineWidth = 6; c.beginPath(); c.ellipse(x + 29, y + 20, 11, 12, 0, -1.4, 1.4); c.stroke(); });
  P.shape(g, C.latte, c => { c.lineWidth = 2; c.beginPath(); c.ellipse(x + 31, y + 21, 10, 11, 0, -.9, 1.3); c.stroke(); });
  // body: cream, a shade on the right, a highlight on the left
  P.shape(g, C.cream, c => { c.beginPath(); c.moveTo(x - 30, y); c.lineTo(x + 30, y); c.lineTo(x + 27, y + 38); c.quadraticCurveTo(x + 25, y + 49, x + 12, y + 49); c.lineTo(x - 12, y + 49); c.quadraticCurveTo(x - 25, y + 49, x - 27, y + 38); c.closePath(); c.fill(); });
  P.shape(g, C.latte, c => { c.beginPath(); c.moveTo(x + 20, y); c.lineTo(x + 30, y); c.lineTo(x + 27, y + 38); c.quadraticCurveTo(x + 25, y + 49, x + 12, y + 49); c.lineTo(x + 8, y + 49); c.quadraticCurveTo(x + 19, y + 44, x + 20, y + 30); c.closePath(); c.fill(); });
  P.rect(g, x - 25, y + 6, 1, 26, C.white); P.rect(g, x - 24, y + 33, 1, 4, C.white);
  P.put(g, P.colorize(LEAF, C.rust), x - 4, y + 19);
  // rim and the drink: foam with a leaf poured in it
  P.shape(g, C.white, c => { c.beginPath(); c.ellipse(x, y, 30, 8, 0, 0, 7); c.fill(); });
  P.shape(g, C.caramel, c => { c.beginPath(); c.ellipse(x, y + 1, 27, 6, 0, 0, 7); c.fill(); });
  P.put(g, HEART, x - 4, y - 2);
}
function steam(g, t) {
  // three wisps that rise and sway; drawn at 6 steps a second, thinning out toward the top
  const st = Math.floor(t * 6);
  [[-11, 0], [0, 2.1], [10, 4.3]].forEach(([dx, ph]) => {
    for (let k = 0; k < 34; k++) { const y = MUG.y - 8 - k, x = MUG.x + dx + Math.round(2.5 * Math.sin(k * .22 - st * .55 + ph) * Math.min(1, k / 8));
      const keep = (P.hash(k, st >> 1, dx) + k / 34) < .95 && (k + st) % 7 < 5; if (keep) P.px(g, x, y, k > 22 ? C.board2 : C.latte); } });
}
function leaves(g, t) {
  for (let i = 0; i < 13; i++) { const r = P.rng(i + 3), x0 = r() * (GW + 40) - 20, period = LOOP / (1 + Math.floor(r() * 2)), y = ((t / period + r()) % 1) * (GH + 30) - 15;
    const sway = Math.round(8 * Math.sin((t / period + r()) * Math.PI * 4)), set = LEAVES[i % 4], fr = [0, 1, 2, 1][Math.floor(t * 4 + i) % 4];
    P.put(g, set[fr], Math.round(x0 + sway), Math.round(y), { flip: Math.floor(t * 2 + i) % 2 === 1 }); }
}

// music: D major, slow and quiet — triangle bass, a round pulse tune with space around it, a brushed hat
const beat = 60 / BPM;
function music() { const n = [], prog = [[50, 54, 57, 61], [47, 50, 54, 57], [43, 47, 50, 54], [45, 49, 52, 55]];
  const mel = [[[69, 1.5], [66, .5], [69, 1], [71, 1]], [[69, 2], [0, 1], [66, 1]], [[67, 1.5], [66, .5], [64, 1], [62, 1]], [[64, 3], [0, 1]]];
  prog.forEach((c, b) => { const t0 = b * beat * 4;
    n.push(P.chip.note(t0, c[0] - 12, beat * 1.8, 'tri', .8), P.chip.note(t0 + beat * 2, c[0] - 5, beat * 1.6, 'tri', .7));
    [.5, 1.5, 2.5, 3.5].forEach(k => n.push(P.chip.note(t0 + k * beat, c[1 + (k * 2 % 3)] + 12, beat * .4, 'pulse2', .18, { duty: .5 })));
    n.push(...P.chip.drums(t0, '....h.......h.h.', BPM, 1, .25));
    let t = t0; mel[b].forEach(([m, l]) => { if (m) n.push(P.chip.note(t, m - 7, l * beat * .9, 'pulse', .5, { duty: .5, vib: l >= 2 ? .1 : 0 })); t += l * beat; }); });
  return n; }

window.__scene = P.scene(async () => {
  const sounds = [{ t: T.kicker, kind: 'select', v: .4 }, { t: T.name, kind: 'select', v: .4, pitch: 2 }, { t: T.desc, kind: 'confirm', v: .4 }, { t: T.price, kind: 'coin', v: .45, pitch: -12 }];
  return {
    width: 1920, height: 1080, grid: [GW, GH], duration: LOOP, fps: 12, palette: Object.values(C), sounds, music: { chip: music() },
    draw(g, t) {
      P.rect(g, 0, 0, GW, GH, C.board);
      P.dither(g, 0, 0, GW, GH, null, C.board2, .06);                     // the board's grain
      leaves(g, t);
      cup(g, t); steam(g, t);
      // the words, arriving one by one at the top of each loop
      const x = 112;
      if (t > T.kicker) P.text(g, CONTENT.kicker, x, 14, { font: '3x5', color: C.gold, spacing: 2 });
      if (t > T.name) CONTENT.name.forEach((w, i) => P.text(g, w, x - 1, 24 + i * 17, { font: '5x7', scale: 2, color: C.cream, shadow: { color: C.rust, dx: 1, dy: 1 } }));
      if (t > T.desc) CONTENT.desc.forEach((l, i) => P.text(g, P.typed(l, t, T.desc + i * .35, 40), x, 62 + i * 10, { font: '5x7', color: C.latte }));
      if (t > T.price) { const sw = Math.floor(t * 2) % 2;                     // the tag rocks a pixel
        P.rect(g, x + 3, 96 + sw, 40, 17, C.gold); P.rect(g, x, 99 + sw, 3, 11, C.gold); P.px(g, x + 2, 104 + sw, C.board);
        P.text(g, CONTENT.price, x + 23, 101 + sw, { font: '5x7', color: C.dark, align: 'center' });
        P.text(g, CONTENT.size, x + 50, 102, { font: '3x5', color: C.cream }); }
      // shop line
      P.rect(g, 0, GH - 13, GW, 13, C.dark);
      P.text(g, CONTENT.shop, 6, GH - 9, { font: '3x5', color: C.gold, spacing: 2 });
      P.text(g, CONTENT.where, GW - 6, GH - 9, { font: '3x5', color: C.latte, align: 'right' });
      // build in, build out: the screen loops through the board colour
      P.wipe(g, 'dissolve', 1 - P.seg(t, 0, .45), C.board, { size: 32, seed: 3 });
      P.wipe(g, 'dissolve', P.seg(t, LOOP - .6, LOOP - .1), C.board, { size: 32, seed: 7 });
    },
  };
});
</script>
