<!doctype html>
<meta charset="utf-8">
<title>Bouncing Ball Lyrics — Row, Row, Row Your Boat</title>
<style>html,body{margin:0;background:#000}canvas{display:block;max-width:100vw;max-height:100vh;margin:auto}</style>
<canvas></canvas>
<script src="../lib/karaoke/karaoke.js"></script>
<script>
/* Bouncing Ball Lyrics — the whole verse on screen from the start, so everyone can read ahead; a ball lands on each syllable
   the moment it is sung, arcs to the next and rests on the long notes, and the colour fills in under it.
   To make your own, change SONG (each line: [syllable, length in eighths, MIDI note]; end a syllable with '-' to hyphenate),
   BPM and METER, the chords in BARS, the title and credit lines, and the colours.
   Here: "Row, Row, Row Your Boat" (traditional, first published 1852, public domain) as a classroom or campfire sing-along,
   guitar with a kalimba playing the tune. No recording: the melody times the syllables. */
const K = Karaoke, S = K.create({ width: 1080, height: 1920 }), W = S.W, H = S.H;
const BPM = 288, METER = 6, INTRO = 6;                     // eighth notes at 288 (a dotted quarter at 96), 6/8, one bar of guitar first
const SONG = K.score({ bpm: BPM, meter: METER, start: .5, inst: 'kalimba', v: .55, lines: [
  [{ at: INTRO }, ['Row,', 3, 60], ['row,', 3, 60], ['row', 2, 60], ['your', 1, 62], ['boat,', 3, 64]],
  [['gent-', 2, 64], ['ly', 1, 62], ['down', 2, 64], ['the', 1, 65], ['stream.', 6, 67]],
  [['Mer-', 1, 72], ['ri-', 1, 72], ['ly,', 1, 72], ['mer-', 1, 67], ['ri-', 1, 67], ['ly,', 1, 67]],
  [['mer-', 1, 64], ['ri-', 1, 64], ['ly,', 1, 64], ['mer-', 1, 60], ['ri-', 1, 60], ['ly,', 1, 60]],
  [['life', 2, 67], ['is', 1, 65], ['but', 2, 64], ['a', 1, 62], ['dream.', 6, 60]],
]});
const at = SONG.at, beat = SONG.beat, END = at(INTRO + 48) + 1.6, DUR = END + .4;

const INK = '#173a5e', LIT = '#ff6b4a', SKY0 = '#cdeefa', SKY1 = '#fff6e4', SEA = '#2a8fb5', FONT = '"Arial Rounded MT Bold", "Arial Rounded MT", "Helvetica Neue", Arial, sans-serif';
const UNSUNG = { fill: INK }, SUNG = { fill: LIT };
let LAY = null, TG = null;
// one size for every line: the widest line fits 900 px
const layout = c => { const wide = line => { const r = K.layout(c, line, { font: FONT, weight: 700, size: 100, x: 0, y: 0, hyphen: true }).rows[0]; return r.x1 - r.x0; };
  const size = Math.min(110, Math.floor(100 * 900 / Math.max(...SONG.lines.map(wide))));
  LAY = SONG.lines.map((line, i) => K.layout(c, line, { font: FONT, weight: 700, size, x: 540, y: 700 + i * 176, align: 'center', hyphen: true }));
  TG = LAY.flatMap(L => K.targets(L, 10)); };

// the guitar: a strum on each dotted quarter, the bass on the bar
const BARS = ['C', 'C', 'C', 'G', 'C', 'C', 'C', 'C', 'G', 'C'];          // the intro bar, then eight bars of the verse, then the last chord
const CH = { C: [48, 55, 60, 64, 67], G: [43, 50, 55, 59, 62, 67] };
const notes = [...SONG.notes];
BARS.forEach((nm, b) => { const t0 = at(b * METER); if (t0 > END) return; const ch = CH[nm], last = b === BARS.length - 1;
  (last ? [0] : [0, 3]).forEach(k => ch.forEach((m, j) => notes.push({ t: t0 + k * beat + j * .018, m, d: last ? 2.4 : beat * 2.6, inst: 'guitar', v: (k ? .3 : .38) - j * .02 })));
  notes.push({ t: t0, m: ch[0] - 12, d: beat * 5.5, inst: 'bass', v: .3 }); });

window.__scene = K.scene(S, (c, t) => {
  if (!LAY) layout(c);
  // sky and water, a small paper boat that crosses as the song goes
  const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, SKY0); g.addColorStop(.7, SKY1); c.fillStyle = g; c.fillRect(0, 0, W, H);
  const wave = (y0, amp, len, speed, col) => { c.fillStyle = col; c.beginPath(); c.moveTo(0, H); for (let x = 0; x <= W; x += 12) c.lineTo(x, y0 + Math.sin(x / len + t * speed) * amp); c.lineTo(W, H); c.fill(); };
  const p = K.cl(t / END), bx = 120 + p * 840, by = 1530 + Math.sin(bx / 90 + t * 1.6) * 14, tilt = Math.cos(bx / 90 + t * 1.6) * .08;
  wave(1550, 16, 90, 1.6, '#7cc6dd');
  c.save(); c.translate(bx, by); c.rotate(tilt); c.fillStyle = '#ffffff'; c.strokeStyle = INK; c.lineWidth = 4; c.lineJoin = 'round';
  c.beginPath(); c.moveTo(-70, -10); c.lineTo(70, -10); c.lineTo(46, 26); c.lineTo(-46, 26); c.closePath(); c.fill(); c.stroke();
  c.beginPath(); c.moveTo(0, -12); c.lineTo(0, -92); c.lineTo(48, -20); c.closePath(); c.fillStyle = LIT; c.fill(); c.stroke(); c.restore();
  wave(1585, 12, 70, -1.2, SEA); wave(1640, 10, 120, 1.0, '#1f6f91');

  // the title, small; the count-in dots before the first syllable
  c.font = `700 40px ${FONT}`; c.fillStyle = INK; c.textAlign = 'center'; c.fillText('Row, Row, Row Your Boat', 540, 360);
  c.font = `400 26px ${FONT}`; c.globalAlpha = .6; c.fillText('Traditional · first published 1852 · public domain', 540, 408); c.globalAlpha = 1;
  const dots = K.countdown(t, at(INTRO), beat * 3, 2);                          // one dot per dotted quarter of the intro bar
  for (let i = 0; i < 2; i++) { c.fillStyle = i < dots ? LIT : 'rgba(23,58,94,.15)'; c.beginPath(); c.arc(520 + i * 40, 560, 10, 0, Math.PI * 2); c.fill(); }

  // the verse: every line on screen, the sung part filling in coral under the ball
  LAY.forEach(L => K.sing(c, L, t, { unsung: UNSUNG, sung: SUNG, edge: 2 }));
  const b = K.ball(TG, t, { hop: .34, height: 70, enter: .6, from: { x: 540, y: 540 }, squash: .35 });
  if (b && b.a > 0) { c.save(); c.globalAlpha = b.a; c.translate(b.x, b.y); c.scale(1 + b.squash * .5, 1 - b.squash * .5);
    c.fillStyle = 'rgba(23,58,94,.18)'; c.beginPath(); c.ellipse(4, 26, 20, 5, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = LIT; c.beginPath(); c.arc(0, 0, 22, 0, Math.PI * 2); c.fill(); c.fillStyle = 'rgba(255,255,255,.55)'; c.beginPath(); c.arc(-7, -8, 7, 0, Math.PI * 2); c.fill(); c.restore(); }
}, { duration: DUR, music: { notes } });
</script>
