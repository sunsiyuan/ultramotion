<!doctype html>
<meta charset="utf-8">
<title>Datamosh Transition — one picture dragged into the next</title>
<style>html, body { margin: 0; background: #000; } canvas { display: block; max-width: 100vw; max-height: 100vh; margin: auto; }</style>
<canvas></canvas>
<script src="../lib/glitch/glitch.js"></script>
<script>
// EFFECT: Datamosh Transition (数据融化转场). Hokusai's Great Wave, then at the cut the wave isn't replaced — its pixels are
// dragged along by the movement of the next picture, Red Fuji, until Fuji breaks through in patches and the wave is gone.
// Both prints are from Thirty-six Views of Mount Fuji (c. 1830–32), public domain.
// To use it on your own shots: replace the two pictures (or draw footage) and keep CUT on the cut. A mosh needs two different
// pictures and some movement in the second one (here a slow push and drift). The mosh and its sound come from lib/glitch (see its GUIDE.md).
const G = Glitch, W = 1080, H = 1920, DUR = 6.5, CUT = 2.4;
const SHOTS = [
  ['media/datamosh-transition-great-wave.jpg', 'The Great Wave off Kanagawa'],
  ['media/datamosh-transition-red-fuji.jpg', 'Fine Wind, Clear Morning'],
];
const SANS = '"Helvetica Neue", Arial, sans-serif';

window.__scene = G.scene(async () => {
  await G.fonts([`500 34px ${SANS}`]);
  const pics = await Promise.all(SHOTS.map(([src]) => G.image(src)));
  const glitches = [{ t: CUT, kind: 'mosh', d: 1.6, seed: 5 }];
  return {
    width: W, height: H, duration: DUR,
    draw: (c, t) => {
      const k = t < CUT ? 0 : 1, u = k ? t - CUT : t;
      // each shot moves on its own: the wave pushes in and drifts left, Fuji rises and pushes in faster (that motion is what drags the wave)
      if (k === 0) G.cover(c, pics[0], { x: 0, y: 0, w: W, h: H, fx: .55 - u * .03, fy: .5, zoom: 1.04 + u * .02 });
      else G.cover(c, pics[1], { x: 0, y: 0, w: W, h: H, fx: .5 + u * .02, fy: .62 - u * .05, zoom: 1.12 + u * .035 });
      c.save(); c.font = `500 34px ${SANS}`; c.letterSpacing = '2px'; c.textAlign = 'left';
      c.shadowColor = 'rgba(0,0,0,.55)'; c.shadowBlur = 14; c.fillStyle = '#fbf6ea';
      c.fillText('KATSUSHIKA HOKUSAI', 80, H - 250); c.fillText(SHOTS[k][1], 80, H - 200);
      c.restore();
    },
    glitches,
    look: {},
    sounds: G.sounds(glitches, DUR),
  };
});
</script>
