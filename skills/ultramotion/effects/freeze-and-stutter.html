<!doctype html>
<meta charset="utf-8">
<title>Freeze & Stutter — the picture stops dead, then skips like a stuck disc</title>
<style>html, body { margin: 0; background: #000; } canvas { display: block; max-width: 100vw; max-height: 100vh; margin: auto; }</style>
<canvas></canvas>
<script src="../lib/glitch/glitch.js"></script>
<script>
// EFFECT: Freeze & Stutter (卡帧). On a moment worth stopping on, the picture freezes and the music cuts out with it; later a
// stutter makes the last fraction of a second repeat — picture and sound together, like a skipping disc — before it plays on.
// Here NASA's on-board film from Apollo 4 (Nov 9, 1967, the first Saturn V flight; public domain): a camera inside the second
// stage watches the interstage ring let go and fall away toward the Earth, lit by the engines.
// To use it on your own footage: replace the clip in G.footage('…') (a phone video works), and move the breaks onto
// your moments in BREAKS. freeze / stutter, the footage and their sound come from lib/glitch (see its GUIDE.md).
const G = Glitch, W = 1080, H = 1920, DUR = 9;
const BREAKS = [
  { t: 3.35, kind: 'freeze', d: 1.1 },                 // the brightest frame: everything stops
  { t: 5.6, kind: 'stutter', d: .9, loop: .27 },        // the tumbling ring skips back three times
  { t: 7.2, kind: 'freeze', d: 1.0 },                  // the ring, small against the Earth
];
const SANS = '"Helvetica Neue", Arial, sans-serif';

window.__scene = G.scene(async () => {
  await G.fonts([`600 30px ${SANS}`, `700 64px ${SANS}`]);
  const clip = await G.footage('media/freeze-and-stutter-apollo-4.mp4');      // render.py splits it into frames the first time
  const notes = [];                                    // a low, plain bed: held strings and a piano note on each bar; the breaks cut and skip it
  [[0, [38, 45, 50]], [2.2, [36, 43, 52]], [4.4, [41, 45, 52]], [6.6, [38, 45, 50, 57]]].forEach(([t, ms]) => {
    ms.forEach(m => notes.push({ t, m, d: 2.3, inst: 'slowstrings', v: .3 })); notes.push({ t, m: ms[ms.length - 1] + 12, d: 1.8, inst: 'piano', v: .28 }); });
  return {
    width: W, height: H, duration: DUR,
    draw: async (c, t) => {
      await clip.draw(c, t);
      c.save(); c.shadowColor = 'rgba(0,0,0,.7)'; c.shadowBlur = 16; c.fillStyle = '#f2f0ea'; c.textAlign = 'left';
      c.font = `600 30px ${SANS}`; c.letterSpacing = '4px';
      c.fillText('APOLLO 4  ·  NOV 9, 1967', 72, 150); c.fillText('CAMERA ON THE SECOND STAGE', 72, 194);
      const a = G.io(G.seg(t, 6.9, 7.1));                // the caption, in just before the last freeze so it holds with it
      if (a > 0) { c.globalAlpha = a; c.font = `700 64px ${SANS}`; c.letterSpacing = '0px'; c.fillText('The interstage ring', 72, H - 430); c.fillText('falls away.', 72, H - 356); }
      c.restore();
    },
    glitches: BREAKS,
    look: {},
    sounds: [{ kind: 'rumble', t: 0, dur: DUR, v: .35 }, ...G.sounds(BREAKS, DUR)],
    music: { notes },
  };
});
</script>
