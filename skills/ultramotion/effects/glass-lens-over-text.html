<!doctype html>
<html><head><meta charset="utf-8"><title>Glass Lens Over Text</title>
<style>html,body{margin:0;background:#111;height:100%;display:grid;place-items:center;overflow:hidden}canvas{display:block;height:100vh;width:auto}</style>
</head><body><canvas id="gl" width="1080" height="1920"></canvas>
<script>
/* Glass Lens Over Text — a drop of liquid glass lands on small type and reads through it like a magnifier:
   it slides along the lines, stretching as it moves, the words under it swelling and bending at its rim, and rests on the one that matters.
   Engine: lib/liquid-glass (read its GUIDE.md). Liquid Glass is one page, not a library: this file is its scene.html cut down
   to the drawing code plus one cut, LENS below.
   To put it on your own text: change HEAD, LINES and the credit line, then KEYS — the words the lens stops on, in order (wordX finds them).
   ?theme=light for a light background. */
const Q = new URLSearchParams(location.search);
const W = 1080, H = 1920, CX = W / 2, CY = H / 2;
const FONT = '"SF Pro Display", system-ui, "PingFang SC", sans-serif';
const DARK = Q.get('theme') !== 'light';
const INK = DARK ? '#f4f3fa' : '#1b1b22', ink = a => DARK ? `rgba(244,243,250,${a})` : `rgba(27,27,34,${a})`;
/* ---------- 工具 ---------- */
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => cl((t - a) / (b - a));
const lerp = (a, b, u) => a + (b - a) * u;
const io = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const oc = u => 1 - Math.pow(1 - u, 3);
const spr = (t, a, d = .8) => t <= a ? 0 : 1 - Math.exp(-5 * (t - a) / d) * Math.cos(7.5 * (t - a) / d);   // 带回弹，峰值约 1.12
const TAU = Math.PI * 2;
const box = (x, y, w, h, r, c = [0, 0, 0, 0]) => ({ x, y, w: Math.max(w, .01), h: Math.max(h, .01), r: Math.max(0, Math.min(r, w, h)), c });
const circle = (x, y, r, c) => box(x, y, r, r, r, c);
/* 关键帧路径：[[t, x, y], …]，段内 io 缓动，段间停住 */
function path(keys, t) {
  if (t <= keys[0][0]) return [keys[0][1], keys[0][2]];
  for (let i = 1; i < keys.length; i++) {
    const [t1, x1, y1] = keys[i], [t0, x0, y0] = keys[i - 1];
    if (t <= t1) { const u = io(seg(t, t0, t1)); return [lerp(x0, x1, u), lerp(y0, y1, u)]; }
  }
  const k = keys[keys.length - 1]; return [k[1], k[2]];
}
/* 移动中的玻璃：顺着速度方向拉长、横向收窄 —— 液体感主要靠这一下 */
function moving(keys, t, r) {
  const [x, y] = path(keys, t), [xa, ya] = path(keys, t - .02), [xb, yb] = path(keys, t + .02);
  const vx = (xb - xa) / .04, vy = (yb - ya) / .04, s = cl(Math.hypot(vx, vy) / 2600) * .28;
  const hor = Math.abs(vx) >= Math.abs(vy);
  return hor ? box(x, y, r * (1 + s), r * (1 - s * .45), r * (1 - s * .45)) : box(x, y, r * (1 - s * .45), r * (1 + s), r * (1 - s * .45));
}

/* ---------- 字 ---------- */
/* 一行字逐字动画。fx(i, n) → {dx, dy, a, blur, s}；字放在层 A 就会被玻璃折射 */
function text(ctx, str, x, y, { size = 200, weight = 700, color = INK, track = -.02, fx = null, align = 'center', maxW = 900 } = {}) {
  ctx.save();
  const font = sz => { ctx.font = `${weight} ${sz}px ${FONT}`; ctx.letterSpacing = `${track * sz}px`; };
  font(size); ctx.textBaseline = 'middle'; ctx.fillStyle = color;
  const w0 = ctx.measureText(str).width;
  if (w0 > maxW) font(size * maxW / w0);                             // 一行太长就整行缩到 maxW 宽
  const chars = [...str], total = ctx.measureText(str).width;
  let cx = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
  chars.forEach((ch, i) => {
    const w = ctx.measureText(ch).width;
    const f = fx ? fx(i, chars.length) : {};
    const a = f.a ?? 1;
    if (a > .003) {
      ctx.save(); ctx.globalAlpha = a;
      if (f.blur > .3) ctx.filter = `blur(${f.blur.toFixed(1)}px)`;
      ctx.translate(cx + w / 2 + (f.dx || 0), y + (f.dy || 0)); ctx.scale(f.s ?? 1, f.s ?? 1);
      ctx.textAlign = 'center'; ctx.fillText(ch, 0, 0); ctx.restore();
    }
    cx += w;
  });
  ctx.restore();
  return total;
}
/* 入场：从下面浮上来、由糊变清；出场：往旁边一抹带拖影 */
const enter = (t, t0, step = .05, dur = .5) => (i) => {
  const u = oc(seg(t, t0 + i * step, t0 + i * step + dur));
  return { dy: (1 - u) * 90, a: u, blur: (1 - u) * 18 };
};
const both = (t, t0, t1, step = .05) => (i, n) => {
  const e = enter(t, t0, step)(i), u = io(seg(t, t1 + (n - 1 - i) * .03, t1 + (n - 1 - i) * .03 + .35));
  return { dy: e.dy, dx: u * 160, a: e.a * (1 - u), blur: e.blur + u * 30 };
};
/* ---------- 图标（层 B，画在玻璃上） ---------- */
function icon(ctx, kind, x, y, s, color, a = 1) {
  if (a < .003) return;
  ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = ctx.strokeStyle = color; ctx.lineWidth = 5; ctx.lineCap = ctx.lineJoin = 'round';
  ctx.beginPath();
  if (kind === 'play') { ctx.moveTo(-13, -20); ctx.lineTo(22, 0); ctx.lineTo(-13, 20); ctx.closePath(); ctx.fill(); }
  if (kind === 'heart') {
    ctx.moveTo(0, 20); ctx.bezierCurveTo(-34, -2, -22, -30, 0, -14); ctx.bezierCurveTo(22, -30, 34, -2, 0, 20); ctx.fill();
  }
  if (kind === 'share') {
    ctx.moveTo(-14, -4); ctx.lineTo(-14, 20); ctx.lineTo(14, 20); ctx.lineTo(14, -4);
    ctx.moveTo(0, 8); ctx.lineTo(0, -24); ctx.moveTo(-10, -14); ctx.lineTo(0, -24); ctx.lineTo(10, -14); ctx.stroke();
  }
  if (kind === 'home') { ctx.moveTo(-18, -2); ctx.lineTo(0, -18); ctx.lineTo(18, -2); ctx.moveTo(-13, -6); ctx.lineTo(-13, 17); ctx.lineTo(13, 17); ctx.lineTo(13, -6); ctx.stroke(); }
  if (kind === 'search') { ctx.arc(-4, -4, 13, 0, TAU); ctx.moveTo(6, 6); ctx.lineTo(18, 18); ctx.stroke(); }
  if (kind === 'chart') { for (const [bx, bh] of [[-14, 14], [0, 30], [14, 22]]) { ctx.moveTo(bx, 17); ctx.lineTo(bx, 17 - bh); } ctx.stroke(); }
  if (kind === 'user') { ctx.arc(0, -8, 9, 0, TAU); ctx.moveTo(-17, 19); ctx.quadraticCurveTo(0, -4, 17, 19); ctx.stroke(); }
  if (kind === 'wifi') { for (const r of [8, 18, 28]) { ctx.moveTo(-r * .72, 10 - r * .7); ctx.arc(0, 10, r, -Math.PI * .75, -Math.PI * .25); } ctx.stroke(); ctx.beginPath(); ctx.arc(0, 10, 3.5, 0, TAU); ctx.fill(); }
  if (kind === 'moon') { ctx.arc(0, 0, 16, .9, TAU - .9 + 2 * Math.PI, false); ctx.arc(12, -8, 13, TAU - .9 + .3, .9 + .4, true); ctx.fill(); }
  if (kind === 'note') { ctx.moveTo(-6, 14); ctx.lineTo(-6, -18); ctx.lineTo(16, -22); ctx.lineTo(16, 10); ctx.stroke(); ctx.beginPath(); ctx.arc(-12, 14, 7, 0, TAU); ctx.arc(10, 10, 7, 0, TAU); ctx.fill(); }
  if (kind === 'sun') { ctx.arc(0, 0, 9, 0, TAU); ctx.fill(); ctx.beginPath(); for (let k = 0; k < 8; k++) { const q = k * TAU / 8; ctx.moveTo(Math.cos(q) * 15, Math.sin(q) * 15); ctx.lineTo(Math.cos(q) * 21, Math.sin(q) * 21); } ctx.stroke(); }
  if (kind === 'sound') { ctx.moveTo(-18, -7); ctx.lineTo(-9, -7); ctx.lineTo(2, -17); ctx.lineTo(2, 17); ctx.lineTo(-9, 7); ctx.lineTo(-18, 7); ctx.closePath(); ctx.fill(); ctx.beginPath(); ctx.arc(4, 0, 12, -.8, .8); ctx.stroke(); }
  if (kind === 'torch') { ctx.moveTo(-9, -20); ctx.lineTo(9, -20); ctx.lineTo(6, -6); ctx.lineTo(6, 20); ctx.lineTo(-6, 20); ctx.lineTo(-6, -6); ctx.closePath(); ctx.stroke(); }
  ctx.restore();
}
function label(ctx, str, x, y, size, color, a = 1, weight = 600, align = 'left') {
  if (a < .003) return;
  ctx.save(); ctx.globalAlpha = a; ctx.font = `${weight} ${size}px ${FONT}`; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillText(str, x, y); ctx.restore();
}


/* ---------- the effect ---------- */
// The words of the plaque Apollo 11 left on the Moon (NASA, July 1969 — public domain), set small, read through a lens.
const HEAD = 'APOLLO 11 · THE PLAQUE LEFT ON THE MOON';
const LINES = ['HERE MEN FROM', 'THE PLANET EARTH', 'FIRST SET FOOT', 'UPON THE MOON', 'JULY 1969, A.D.', 'WE CAME IN PEACE', 'FOR ALL MANKIND'];
const SIZE = 80, LH = 176, Y0 = CY - LH * (LINES.length - 1) / 2 + 40, TRACK = .1;
const lineY = i => Y0 + i * LH;
const mc = document.createElement('canvas').getContext('2d');
function wordX(i, word) {                                             // the centre x of a word in line i, as text() lays it out
  mc.font = `600 ${SIZE}px ${FONT}`; mc.letterSpacing = `${TRACK * SIZE}px`;
  const line = LINES[i], k = line.indexOf(word), full = mc.measureText(line).width;
  return CX - full / 2 + mc.measureText(line.slice(0, k)).width + mc.measureText(word).width / 2;
}
// the lens's path: [t, x, y] — it lands on HERE, slides down through the plaque, stops on MOON and 1969, then reads WE CAME IN PEACE and rests on PEACE
const KEYS = () => [[.9, wordX(0, 'HERE'), lineY(0)], [2.3, wordX(1, 'EARTH'), lineY(1)], [3.4, wordX(3, 'MOON'), lineY(3)],
  [4.6, wordX(4, '1969'), lineY(4)], [5.5, wordX(5, 'WE'), lineY(5)], [6.6, wordX(5, 'PEACE'), lineY(5)]];
function LENS(t) {
  const F = { bgT: t, shapes: [], k: 70, refr: 36, mag: 1.38, bev: 54, A: [], B: [] };
  const pop = cl(spr(t, .7, .7), 0, 1.2), HW = 220, HH = 96;                // a pill a word wide; it stretches along its motion
  if (t > .7) { const m = moving(KEYS(), t, 1); F.shapes.push(box(cl(m.x, HW + 40, W - HW - 40), m.y, HW * m.w * pop, HH * m.h * pop, HH * m.h * pop)); }
  F.A.push(c => text(c, HEAD, CX, Y0 - 280, { size: 32, weight: 500, track: .3, color: ink(.5), fx: enter(t, .1, .015) }));
  LINES.forEach((l, i) => F.A.push(c => text(c, l, CX, lineY(i), { size: SIZE, weight: 600, track: TRACK, color: ink(i === 5 ? .95 : .8), fx: enter(t, .1 + i * .07, .02) })));
  F.A.push(c => text(c, 'NEIL A. ARMSTRONG · MICHAEL COLLINS · EDWIN E. ALDRIN, JR.', CX, lineY(LINES.length - 1) + 250, { size: 28, weight: 500, track: .2, color: ink(.45), maxW: 940, fx: enter(t, .6, .008) }));
  return F;
}
const CUTS = { lens: { duration: 8.5, frame: LENS } }, CUT = 'lens';
const arp = [{ t: 6.65, m: 74, d: 2.6, inst: 'harp', v: .3 }, { t: 6.8, m: 81, d: 2.4, inst: 'harp', v: .22 }, { t: 6.95, m: 86, d: 2.2, inst: 'glockenspiel', v: .16 }];
const SOUNDS = [{ t: .7, kind: 'pop', v: .6 }, { t: .95, kind: 'swish', dur: 1.3, v: .25 }, { t: 2.4, kind: 'swish', dur: 1.0, v: .22, pan: .3 },
  { t: 3.5, kind: 'swish', dur: 1.1, v: .22, pan: -.2 }, { t: 4.7, kind: 'swish', dur: .8, v: .2 }, { t: 5.6, kind: 'whoosh', dur: 1.0, v: .3, pan: .3 }, { t: 6.6, kind: 'pop', v: .45, pan: .3 }];

/* ---------- WebGL ---------- */
const MAXS = 12;
const FS = `#version 300 es
precision highp float;
uniform vec2 uRes; uniform float uBT, uK, uRefr, uMag, uBev, uDark;
uniform int uN; uniform vec4 uS[${MAXS}], uP[${MAXS}], uC[${MAXS}];
uniform sampler2D uA, uB;
out vec4 o;
const float TAU = 6.2831853;
float sdBox(vec2 p, vec2 c, vec2 h, float r) { vec2 q = abs(p - c) - (h - r); return length(max(q, 0.)) + min(max(q.x, q.y), 0.) - r; }
float smin(float a, float b, float k) { float h = max(k - abs(a - b), 0.) / k; return min(a, b) - h * h * k * .25; }
float sdf(vec2 p) { float d = 1e5; for (int i = 0; i < ${MAXS}; i++) { if (i >= uN) break; d = smin(d, sdBox(p, uS[i].xy, uS[i].zw, uP[i].x), uK); } return d; }
vec3 blob(vec3 c, vec2 q, vec2 at, float r2, vec3 col, float s) { vec2 d = q - at; return mix(c, col, s * exp(-dot(d, d) / r2)); }
vec3 bgDark(vec2 q, float a) {
  vec3 c = vec3(.055, .05, .095);
  c = blob(c, q, vec2(.03 + .04 * sin(a), -.03), .075, vec3(.30, .19, .62), .9);
  c = blob(c, q, vec2(.30, .12 + .03 * cos(a)), .05, vec3(.17, .17, .40), .7);
  c = blob(c, q, vec2(.60, .30 + .05 * sin(a + 1.)), .06, vec3(.06, .33, .40), .85);
  c = blob(c, q, vec2(.47, .78 + .04 * cos(a)), .05, vec3(.34, .14, .38), .6);
  c = blob(c, q, vec2(.04, .97 + .03 * sin(2. * a)), .08, vec3(.13, .15, .38), .8);
  float band = q.x * .9 + q.y - .62 - .04 * sin(a);
  return mix(c, vec3(.17, .16, .27), .45 * exp(-band * band / .006));
}
vec3 bg(vec2 p) {
  vec2 q = p / uRes.y; float a = TAU * uBT / 16.;
  q += .035 * vec2(sin(q.y * 3.1 + a), cos(q.x * 4.3 - a));
  if (uDark > .5) return bgDark(q, a);
  vec3 c = vec3(.905, .892, .952);
  c = blob(c, q, vec2(.03 + .04 * sin(a), -.03), .075, vec3(.54, .47, .90), .9);
  c = blob(c, q, vec2(.30, .12 + .03 * cos(a)), .05, vec3(.76, .73, .97), .7);
  c = blob(c, q, vec2(.60, .30 + .05 * sin(a + 1.)), .06, vec3(.55, .79, .86), .85);
  c = blob(c, q, vec2(.20 + .05 * cos(a), .56), .04, vec3(.72, .82, .96), .35);
  c = blob(c, q, vec2(.47, .78 + .04 * cos(a)), .05, vec3(.93, .86, .93), .6);
  c = blob(c, q, vec2(.04, .97 + .03 * sin(2. * a)), .08, vec3(.60, .64, .88), .8);
  float band = q.x * .9 + q.y - .62 - .04 * sin(a);
  c = mix(c, vec3(.965, .955, .995), .45 * exp(-band * band / .006));
  return c;
}
vec2 uvOf(vec2 p) { return vec2(p.x / uRes.x, 1. - p.y / uRes.y); }
vec3 scene(vec2 p) { vec4 a = texture(uA, uvOf(p)); return bg(p) * (1. - a.a) + a.rgb; }
float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
void main() {
  vec2 p = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
  vec3 col = scene(p);
  if (uN > 0) {
    float d = sdf(p);
    float ds = sdf(p - vec2(0., 22.));
    col *= 1. - .17 * exp(-max(ds, 0.) / 38.) * smoothstep(-1., 1., d);
    if (d < 2.) {
      vec2 n = normalize(vec2(sdf(p + vec2(1, 0)) - d, sdf(p + vec2(0, 1)) - d) + 1e-6);
      float rim = 1. - clamp(-d / uBev, 0., 1.);
      vec2 c = vec2(0); float ws = 0.; vec4 tint = vec4(0);
      for (int i = 0; i < ${MAXS}; i++) { if (i >= uN) break; float di = sdBox(p, uS[i].xy, uS[i].zw, uP[i].x); float w = 1. / (1. + exp(clamp(di / 16., -30., 30.))); c += w * uS[i].xy; tint += w * uC[i]; ws += w; }
      c /= max(ws, 1e-4); tint /= max(ws, 1e-4);
      vec2 base = c + (p - c) / uMag, off = -n * uRefr * pow(rim, 2.8);
      vec3 g = vec3(scene(base + off * .96).r, scene(base + off).g, scene(base + off * 1.05).b);
      g = mix(g, vec3(1.), (.08 + .12 * rim) * (1. - .45 * uDark));
      g = mix(g, tint.rgb, tint.a);
      vec2 L = normalize(vec2(-.55, -.85));
      g += pow(rim, 3.5) * (.12 + .6 * max(dot(n, L), 0.));
      g *= 1. - pow(rim, 3.) * .14 * max(dot(n, -L), 0.);
      g += .35 * smoothstep(-3.5, -.5, d);
      col = mix(col, g, smoothstep(.9, -.9, d));
    }
  }
  vec4 b = texture(uB, uvOf(p)); col = col * (1. - b.a) + b.rgb;
  col += (hash(p + fract(uBT * 7.) * 97.) - .5) / 255.;
  o = vec4(col, 1.);
}`;
const cv = document.getElementById('gl');
const gl = cv.getContext('webgl2', { preserveDrawingBuffer: true, antialias: false });
function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, `#version 300 es
in vec2 v; void main(){ gl_Position = vec4(v, 0, 1); }`));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'v'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const U = n => gl.getUniformLocation(prog, n);
gl.viewport(0, 0, W, H);
function layer(unit) {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const tex = gl.createTexture(); gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return { c, ctx: c.getContext('2d'), tex, unit };
}
const LA = layer(0), LB = layer(1);
gl.uniform1i(U('uA'), 0); gl.uniform1i(U('uB'), 1); gl.uniform2f(U('uRes'), W, H);
gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true); gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
function upload(L, draws) {
  L.ctx.clearRect(0, 0, W, H); for (const d of draws || []) d(L.ctx);
  gl.activeTexture(gl.TEXTURE0 + L.unit); gl.bindTexture(gl.TEXTURE_2D, L.tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, L.c);
}
function draw(t) {
  const C = CUTS[CUT], F = C.frame(t);
  upload(LA, F.A); upload(LB, F.B);
  const S = new Float32Array(MAXS * 4), P = new Float32Array(MAXS * 4), Cc = new Float32Array(MAXS * 4);
  F.shapes.slice(0, MAXS).forEach((s, i) => { S.set([s.x, s.y, s.w, s.h], i * 4); P[i * 4] = s.r; Cc.set(s.c, i * 4); });
  gl.uniform4fv(U('uS'), S); gl.uniform4fv(U('uP'), P); gl.uniform4fv(U('uC'), Cc);
  gl.uniform1i(U('uN'), Math.min(F.shapes.length, MAXS));
  gl.uniform1f(U('uBT'), F.bgT); gl.uniform1f(U('uK'), F.k ?? 70); gl.uniform1f(U('uRefr'), F.refr ?? 60);
  gl.uniform1f(U('uMag'), F.mag ?? 1.1); gl.uniform1f(U('uBev'), F.bev ?? 46); gl.uniform1f(U('uDark'), DARK ? 1 : 0);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); gl.finish();
}

window.__scene = {
  duration: CUTS[CUT].duration, sounds: SOUNDS, music: { notes: arp },
  ready: document.fonts.load(`600 100px ${FONT}`).then(() => document.fonts.ready),
  seek: t => new Promise(ok => { draw(t); requestAnimationFrame(() => ok()); }),
};
if (!Q.has('rec')) {
  const t0 = performance.now();
  const loop = () => { draw(((performance.now() - t0) / 1000) % CUTS[CUT].duration); requestAnimationFrame(loop); };
  window.__scene.ready.then(loop);
}
</script></body></html>
