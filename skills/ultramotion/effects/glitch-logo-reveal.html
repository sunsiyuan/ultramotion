<!doctype html>
<meta charset="utf-8">
<title>Glitch Logo Reveal — the logo breaks through a bad signal and lands clean</title>
<style>html, body { margin: 0; background: #000; } canvas { display: block; max-width: 100vw; max-height: 100vh; margin: auto; }</style>
<canvas></canvas>
<script src="../lib/glitch/glitch.js"></script>
<script>
// EFFECT: Glitch Logo Reveal (故障 Logo 出场). Black, then two glimpses of the logo torn in for a frame or two, a run of broken
// signal — and the logo is there, clean, on the hit. One tear runs through the wordmark, the line above it decodes out of
// scrambled characters, one small shift, and it holds.
// The logo: Godot, the open-source game engine (logo by Andrea Calabró, CC BY 4.0), as a "made with" splash at the start of a game.
// To use it: replace LOGO with your own logo (SVG or PNG; light on dark, or recolour it), change ABOVE / BELOW, and keep LAND on your
// music's hit. The breaks and their sounds come from lib/glitch (see its GUIDE.md).
const G = Glitch, W = 1080, H = 1920, DUR = 6.6, F = 1 / 30;
const LOGO = 'media/glitch-logo-reveal-godot.svg', ASPECT = 1024 / 414;
const ABOVE = 'MADE WITH', BELOW = 'FREE AND OPEN SOURCE  ·  MIT LICENSE';
const BLUE = '#478cbf', MONO = '"SF Mono", Menlo, monospace', SANS = '"Avenir Next", "Helvetica Neue", sans-serif';
const LAND = 1.5;                                    // the logo is in, clean, from here
const LW = 940, LH = LW / ASPECT, LX = (W - LW) / 2, LY = 820;
let logo = null;

function draw(c, t) {
  c.fillStyle = '#07090e'; c.fillRect(0, 0, W, H);
  if (t < LAND) return;                              // before the hit only the glimpses (flash) show it
  const u = G.seg(t, LAND, LAND + 2.5);
  // a cold glow behind the mark, brightest as it lands and settling
  const g = c.createRadialGradient(LX + LH / 2, LY + LH / 2, 0, LX + LH / 2, LY + LH / 2, 760);
  g.addColorStop(0, `rgba(71,140,191,${.32 - .16 * G.oc(u)})`); g.addColorStop(1, 'rgba(71,140,191,0)'); c.fillStyle = g; c.fillRect(0, 0, W, H);
  c.drawImage(logo, LX, LY, LW, LH);
  c.textAlign = 'center'; c.fillStyle = '#9aa7b8';
  c.font = `500 40px ${MONO}`; c.letterSpacing = '14px';
  c.fillText(G.decode(ABOVE, t, 3.2, .7), W / 2 + 7, LY - 110);
  c.font = `500 30px ${SANS}`; c.letterSpacing = '6px'; c.globalAlpha = G.seg(t, 4.0, 4.6);
  c.fillText(BELOW, W / 2 + 3, LY + LH + 150); c.globalAlpha = 1; c.letterSpacing = '0px';
}

window.__scene = G.scene(async () => {
  logo = await G.image(LOGO);
  await G.fonts([`500 40px ${MONO}`, `500 30px ${SANS}`]);
  const word = { x: LX + LW * .45, y: LY + LH * .2, w: LW * .55, h: LH * .45 };          // the wordmark
  const glitches = [
    { t: .4, kind: 'flash', show: 2.4, d: 2 * F, seed: 2 },                              // a glimpse of what's coming
    { t: .4, kind: 'hit', d: 2 * F, amt: 1.1, seed: 5, sound: false },
    { t: .95, kind: 'flash', show: 2.4, d: 3 * F, seed: 6 },
    { t: .95, kind: 'tear', d: 3 * F, amt: 1.2, seed: 9, sound: false },
    // the break the logo arrives through: blocks, a hit, a tear, a blip — each a few frames, then clean
    { t: LAND - 2 * F, kind: 'blocks', d: 3 * F, amt: 1.1, seed: 13 },
    { t: LAND + 1 * F, kind: 'hit', d: 3 * F, amt: 1.2, seed: 14 },
    { t: LAND + 5 * F, kind: 'tear', d: 2 * F, amt: 1, seed: 15, sound: false },
    { t: LAND + 8 * F, kind: 'blip', seed: 16 },
    { t: 2.4, kind: 'tear', d: 3 * F, amt: .8, seed: 21, area: word },
    { t: 3.2, kind: 'blip', seed: 24, area: { x: 0, y: LY - 170, w: W, h: 90 } },
    { t: 4.3, kind: 'shift', seed: 27 },
  ];
  const notes = [{ t: LAND, m: 33, d: 3.4, inst: 'synthbass', v: .5 }, ...[45, 52, 57, 59, 64].map((m, i) => ({ t: LAND + i * .02, m, d: 4.2, inst: 'pad', v: .3 }))];
  return {
    width: W, height: H, duration: DUR,
    draw, glitches,
    look: { scan: .08, bloom: .25, vignette: .35 },
    sounds: [...G.sounds(glitches, DUR, { music: false }), { t: LAND, kind: 'thud', v: .7 }],
    music: { notes, dynamics: { pad: [[0, .4], [LAND, 1], [DUR, .6]] } },
  };
});
</script>
