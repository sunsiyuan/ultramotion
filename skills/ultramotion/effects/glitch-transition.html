<!doctype html>
<meta charset="utf-8">
<title>Glitch Transition — four cuts, each hidden in a broken signal</title>
<style>html, body { margin: 0; background: #000; } canvas { display: block; max-width: 100vw; max-height: 100vh; margin: auto; }</style>
<canvas></canvas>
<script src="../lib/glitch/glitch.js"></script>
<script>
// EFFECT: Glitch Transition (故障转场). Four cards — four cities and where they are — and every cut between them happens
// inside a few frames of broken signal: the picture tears, the colour channels split, blocks smear, and the next card is there.
// Each cut is a different break (a tear, blocks, a burst) so the transitions don't repeat.
// To use it on your own shots: replace CARDS and card(); keep CUTS on your cuts. A break starts two frames before the cut so the
// old and the new picture are both inside it. The breaks and their sounds come from lib/glitch (see its GUIDE.md).
const G = Glitch, W = 1080, H = 1920, DUR = 6.6, F = 1 / 30;
const SANS = '"Helvetica Neue", "Inter", Arial, sans-serif', MONO = '"SF Mono", Menlo, monospace';
// [city, latitude, longitude, time zone, field colour, ink colour]
const CARDS = [
  ['TOKYO', '35.68° N', '139.69° E', 'UTC+9', '#e8402f', '#111'],
  ['LAGOS', '6.52° N', '3.38° E', 'UTC+1', '#f2c230', '#111'],
  ['REYKJAVÍK', '64.15° N', '21.94° W', 'UTC+0', '#1f3ad6', '#f4f1ea'],
  ['LIMA', '12.05° S', '77.04° W', 'UTC−5', '#efece4', '#111'],
];
const CUTS = [1.5, 3.0, 4.5];                        // card k is on from CUTS[k-1] to CUTS[k]
const which = t => CUTS.filter(c => t >= c).length;

function card(c, t) {
  const k = which(t), [city, lat, lon, tz, bg, ink] = CARDS[k], t0 = k ? CUTS[k - 1] : 0, u = t - t0;
  c.fillStyle = bg; c.fillRect(0, 0, W, H);
  c.fillStyle = ink; c.textBaseline = 'alphabetic'; c.textAlign = 'left';
  // the index and a rule
  c.font = `500 34px ${MONO}`; c.fillText(`0${k + 1} / 04`, 90, 170); c.fillRect(90, 200, 900, 4);
  c.textAlign = 'right'; c.fillText('FOUR CITIES', 990, 170); c.textAlign = 'left';
  // the city, as big as it fits; it creeps a little to the left while the card is on
  let px = 330; c.font = `800 ${px}px ${SANS}`; c.letterSpacing = '-12px';
  const w = c.measureText(city).width; if (w > 960) { px = Math.floor(px * 960 / w); c.font = `800 ${px}px ${SANS}`; }
  c.fillText(city, 70 - u * 14, 1020);
  c.letterSpacing = '0px';
  // the coordinates
  c.font = `500 64px ${MONO}`; c.fillText(lat, 90, 1210); c.fillText(lon, 90, 1290);
  c.fillRect(90, 1700, 900, 4); c.font = `500 34px ${MONO}`; c.fillText(tz, 90, 1760);
}

window.__scene = G.scene(async () => {
  await G.fonts([`800 330px ${SANS}`, `500 64px ${MONO}`]);
  const glitches = [
    { t: CUTS[0] - 2 * F, kind: 'tear', d: 4 * F, amt: 1, seed: 3 },
    { t: CUTS[0] + 2 * F, kind: 'blip', seed: 4 },
    { t: CUTS[1] - 2 * F, kind: 'blocks', d: 5 * F, amt: 1.1, seed: 11 },
    { t: CUTS[1] + 4 * F, kind: 'shift', seed: 12 },
    { t: CUTS[2] - 3 * F, kind: 'burst', d: 8 * F, amt: 1, seed: 15 },        // the last one: everything at once, then the card holds clean
  ];
  return {
    width: W, height: H, duration: DUR,
    draw: card,
    glitches,
    look: {},
    sounds: G.sounds(glitches, DUR),
  };
});
</script>
