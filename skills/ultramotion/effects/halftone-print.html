<!doctype html><html><head><meta charset="utf-8"><title>Halftone Print — the Wright brothers' first flight, in newspaper dots</title>
<style>html,body{margin:0;background:#000}canvas{display:block;max-width:100vw;max-height:100vh;margin:auto}</style></head><body>
<canvas></canvas>
<script src="../lib/news-collage/collage.js"></script>
<script>
/* Halftone Print — a photo printed the way newspapers print it: rows of black dots on a 45° screen, big where the picture is dark,
   small where it is light. It opens so close that the dots are all you see; a roller of ink passes and the dots swell in;
   then the camera pulls back until the dots melt into the picture, on a newsprint clipping with its caption.
   The dots are drawn as shapes every frame (not a scaled bitmap), so they stay sharp at any zoom. The clipping, the camera
   and the paper sounds are lib/news-collage's.
   To make your own, change the photo, its caption, CELL (the dot pitch, in the clipping's pixels) and where the camera starts (START).
   Here: "First flight", Kitty Hawk, N.C., Dec. 17, 1903, photographed by John T. Daniels (Library of Congress, public domain). */
const CELL = 6, START = [.55, .42], CROP = [.18, .14, .8, .64];                       // CROP: the part of the photo printed (x, y, w, h as fractions)                                          // dot pitch; where the camera starts, as a fraction of the photo
window.__scene = Collage.load({ photo: 'media/halftone-print-first-flight.jpg' }, A => {
  const C = Collage.create({ board: 'desk', light: { dx: .4, dy: .9, dark: .4 } }), F = Collage.FONTS, { seg, io, oc } = Collage;
  const PW = 920, PH = Math.round(PW * A.photo.height * CROP[3] / (A.photo.width * CROP[2])), PX = 30, PY = 30, INK = '#141414', PAPER = '#ece6d6';
  // sample the photo once on the dot grid (the grid turned 45°): how dark it is under each dot
  const S = document.createElement('canvas'); S.width = PW; S.height = PH; const sg = S.getContext('2d');
  sg.filter = 'brightness(.97) contrast(1.35)'; sg.drawImage(A.photo, A.photo.width * CROP[0], A.photo.height * CROP[1], A.photo.width * CROP[2], A.photo.height * CROP[3], 0, 0, PW, PH); const px = sg.getImageData(0, 0, PW, PH).data;
  const dots = [], R = Math.hypot(PW, PH), cs = Math.SQRT1_2;
  for (let i = -R / CELL; i <= R / CELL; i++) for (let j = -R / CELL; j <= R / CELL; j++) {
    const x = PW / 2 + (i - j) * CELL * cs, y = PH / 2 + (i + j) * CELL * cs; if (x < 0 || y < 0 || x >= PW || y >= PH) continue;
    const k = ((y | 0) * PW + (x | 0)) * 4, dark = 1 - (px[k] * .3 + px[k + 1] * .59 + px[k + 2] * .11) / 255;
    if (dark > .03) dots.push([x, y, CELL * .72 * Math.sqrt(dark)]); }
  const clip = C.piece({ id: 'clip', x: 540, y: 960, w: PW + 60, h: 'auto', rot: -1.2, paper: PAPER, edge: { top: 'torn', bottom: 'torn', left: 'cut', right: 'cut' }, grain: .12, lift: 5,
    face: (g, w, h, P) => {
      P.span('photo', PX, PY, PW, PH);
      const y = P.text([{ t: 'Kitty Hawk, N.C., Dec. 17, 1903, 10:35 a.m. — ', weight: 700 }, 'Orville Wright at the controls, Wilbur running alongside. The first powered flight: 12 seconds, 120 feet.'],
        { x: PX, y: PY + PH + 58, width: PW, size: 34, lh: 1.32, font: F.serif, color: '#1a1a1a' }).y;
      return P.text('Photograph by John T. Daniels · Library of Congress', { x: PX, y: y + 50, width: PW, size: 24, font: F.typewriter, color: '#555' }).y;
    }, padBottom: 44 });
  // the dots, inked by a roller passing left to right, then left alone
  const ROLL = [.25, 1.35];
  C.draw((c, t) => { const r = seg(t, ROLL[0], ROLL[1]), edge = -120 + r * (PW + 240);
    c.save(); c.beginPath(); c.rect(PX, PY, PW, PH); c.clip(); c.fillStyle = INK; c.beginPath();
    for (const [x, y, rad] of dots) { const k = r >= 1 ? 1 : oc(Collage.cl((edge - x) / 120)); if (k <= 0) continue; const rr = rad * k; c.moveTo(PX + x + rr, PY + y); c.arc(PX + x, PY + y, rr, 0, 6.2832); }
    c.fill(); c.restore(); }, { on: clip, at: 0, dur: 1 });
  const photo = C.bounds('clip.photo'), fx = photo.x + photo.w * START[0], fy = photo.y + photo.h * START[1];
  const close = { x: fx, y: fy, zoom: 14 }, mid = { x: fx, y: fy, zoom: 5 };
  return C.scene({ duration: 8, drift: .4, camera: [[0, close], [1.5, close], [2.4, mid], [5.6, C.frame('clip', { pad: 24, safe: [30, 200, 30, 200] })], [8, C.frame('clip', { pad: 24, safe: [30, 200, 30, 200] })]],
    music: { notes: [[5.4, [50, 57, 62, 66]], [5.5, [74]], [6.2, [78]]].flatMap(([t, ms]) => ms.map(m => ({ t, m, d: 2.4, inst: 'harp', v: .3 }))) },
    sounds: [{ t: ROLL[0], kind: 'rumble', dur: ROLL[1] - ROLL[0] + .2, v: .35 }, { t: ROLL[1] - .05, kind: 'page', v: .4 }, { t: 2.2, kind: 'whoosh', dur: 3.4, v: .3 }] });
});
</script></body></html>
