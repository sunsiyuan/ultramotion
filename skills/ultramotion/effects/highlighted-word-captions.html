<!doctype html><html><head><meta charset="utf-8"><title>Highlighted Word Captions — NASA's Alex Young on the Sun's lifetime</title>
<style>html,body{margin:0;background:#000}canvas{display:block;max-width:100vw;max-height:100vh;margin:auto}</style></head><body>
<canvas width="1080" height="1920"></canvas>
<script>
/* Highlighted Word Captions — the TikTok / Reels caption look where a whole short line sits on screen and a coloured box slides
   from word to word under the one being said; the line pops up when it starts, key words get their own box colour.
   (lib/variety-captions draws word-by-word captions without the box; this page draws the box itself, so it needs no engine.)
   To make your own, change:
     - the clip in footage('…') below: your talking-head clip (vertical, or crop it to 9:16 first); render.py splits it into frames
     - WORDS: the word times from a transcript of it (faster-whisper with word_timestamps), shifted to the clip's start
     - KEYS: the few words the clip is about; the look in STYLE (face, size, where the line sits, the two box colours)
   Here: NASA's "Will the Sun Ever Burn Out? | We Asked a NASA Scientist" (May 13, 2025; NASA, public domain) —
   astrophysicist Dr. Alex Young, 0:55.3–1:03.2, sound loudness-normalised. */
const DUR = 7.9;
const WORDS = [[0.02, 0.18, 'But'], [0.18, 0.44, 'our'], [0.44, 0.9, 'sun'], [0.9, 1.4, 'has'], [1.4, 1.56, 'a'], [1.56, 1.74, 'pretty'], [1.74, 2.22, 'long'], [2.22, 3.02, 'lifetime.'],
  [3.46, 3.62, "It's"], [3.62, 4.1, 'halfway'], [4.1, 4.56, 'through'], [4.56, 5.02, 'its'], [5.02, 5.42, '10'], [5.42, 5.84, 'billion'], [5.84, 6.28, 'year'], [6.28, 6.86, 'lifetime.']];
const KEYS = ['lifetime', '10', 'billion'];
const STYLE = { font: '"Arial Black", "Archivo Black", "Helvetica Neue", sans-serif', weight: 900, size: 96, y: .69, max: 3, gap: .3,
  box: '#ffd23f', key: '#3ee06f', ink: '#ffffff', on: '#111111' };
const W = 1080, H = 1920, ctx = document.querySelector('canvas').getContext('2d');
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), seg = (t, a, b) => cl((t - a) / (b - a)), lerp = (a, b, u) => a + (b - a) * u;
const back = u => u <= 0 ? 0 : u >= 1 ? 1 : 1 + 2.2 * (u - 1) ** 3 + 1.2 * (u - 1) ** 2;
const io = u => u < .5 ? 4 * u ** 3 : 1 - (-2 * u + 2) ** 3 / 2;
const clean = w => w.replace(/[.,!?;:]/g, '').toUpperCase();

// the clip as frames on disk: render.py extracts every footage('…') it finds in this page to <clip>.frames/ (jpgs + index.js)
const img = src => new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = () => no(new Error('cannot load ' + src)); im.src = src; });
const footage = src => Object.assign(new Promise((ok, no) => { const dir = src + '.frames', s = document.createElement('script'); s.src = dir + '/index.js';
  s.onerror = () => no(new Error(`no frames for ${src} — run: python3 render.py frames ${src}`));
  s.onload = () => { const info = window.__frames[dir], cache = new Map();
    ok(i => { i = cl(i, 0, info.count - 1) | 0; if (!cache.has(i)) { cache.set(i, img(`${dir}/${String(i + 1).padStart(5, '0')}.jpg`)); if (cache.size > 60) cache.delete(cache.keys().next().value); } return cache.get(i); }); };
  document.head.appendChild(s); }), { src });

// lines: up to STYLE.max words and no wider than the frame at full size, a new one after punctuation or a pause; each stays until the next starts
const LINES = [], wide = ws => { ctx.font = `${STYLE.weight} ${STYLE.size}px ${STYLE.font}`; return ws.reduce((a, w) => a + ctx.measureText(clean(w[2])).width, 0) + STYLE.size * .42 * (ws.length - 1) > W - 180; };
const group = () => WORDS.forEach((w, i) => { const prev = WORDS[i - 1], cur = LINES[LINES.length - 1];
  if (!cur || cur.words.length >= STYLE.max || wide([...cur.words, w]) || /[.,!?;:]$/.test(prev[2]) || w[0] - prev[1] > STYLE.gap) LINES.push({ words: [w] }); else cur.words.push(w); });
const timeLines = () => LINES.forEach((L, k) => { L.t0 = L.words[0][0]; L.t1 = LINES[k + 1] ? LINES[k + 1].words[0][0] : DUR; });

function caption(t) {
  const L = LINES.find(L => t >= L.t0 - .05 && t < L.t1); if (!L) return;
  // the size: STYLE.size, smaller when a line of long words would run wider than the frame
  ctx.save(); ctx.font = `${STYLE.weight} ${STYLE.size}px ${STYLE.font}`;
  const raw = L.words.reduce((a, w) => a + ctx.measureText(clean(w[2])).width, 0) + STYLE.size * .42 * (L.words.length - 1), size = STYLE.size * Math.min(1, (W - 180) / raw);
  ctx.font = `${STYLE.weight} ${size}px ${STYLE.font}`; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  const sp = size * .42, ws = L.words.map(w => ctx.measureText(clean(w[2])).width), tot = ws.reduce((a, b) => a + b, 0) + sp * (ws.length - 1);
  let x = (W - tot) / 2; const xs = ws.map(w => { const x0 = x; x += w + sp; return x0; }), y = H * STYLE.y;
  // the whole line pops up when it starts
  const u = back(seg(t, L.t0 - .05, L.t0 + .17)), s = .82 + .18 * u;
  ctx.translate(W / 2, y); ctx.scale(s, s); ctx.translate(-W / 2, -y); ctx.globalAlpha = cl(u * 1.6);
  // the box: slides from the last word to the one being said and stretches to its width
  let i = L.words.findIndex(w => t < w[1]); if (i < 0) i = L.words.length - 1; i = Math.max(0, i);
  const on = t >= L.words[0][0], j = Math.max(0, i - 1), m = i === 0 ? 1 : io(seg(t, L.words[i][0], L.words[i][0] + .1));
  const bx = lerp(xs[j], xs[i], m), bw = lerp(ws[j], ws[i], m), pad = size * .2, key = KEYS.includes(clean(L.words[i][2]).toLowerCase());
  if (on) { ctx.save(); ctx.fillStyle = key ? STYLE.key : STYLE.box; ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 6;
    const lift = 1 + .06 * (1 - seg(t, L.words[i][0], L.words[i][0] + .14));
    ctx.translate(bx + bw / 2, y); ctx.rotate(-.025); ctx.scale(lift, lift);
    ctx.beginPath(); ctx.roundRect(-bw / 2 - pad, -size * .62, bw + pad * 2, size * 1.2, size * .2); ctx.fill(); ctx.restore(); }
  // the words: white with a dark edge; the one in the box dark and a touch bigger
  L.words.forEach((w, k) => { const txt = clean(w[2]), act = on && k === i && m > .5, z = act ? 1.06 : 1;
    ctx.save(); ctx.translate(xs[k] + ws[k] / 2, y); ctx.scale(z, z); ctx.textAlign = 'center';
    if (!act) { ctx.lineJoin = 'round'; ctx.lineWidth = size * .16; ctx.strokeStyle = 'rgba(0,0,0,.9)'; ctx.strokeText(txt, 0, 4); ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 14; }
    ctx.fillStyle = act ? STYLE.on : STYLE.ink; ctx.fillText(txt, 0, 4); ctx.restore(); });
  ctx.restore();
}

const clip = footage('media/highlighted-word-captions-sun.mp4');
let frame = null;
const ready = Promise.all([clip, document.fonts ? document.fonts.load(`900 96px ${STYLE.font}`) : null]).then(([f]) => { frame = f; group(); timeLines(); return draw(0); });
async function draw(t) {
  const im = await frame(Math.floor(t * 30 + 1e-6)), k = Math.max(W / im.width, H / im.height);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(im, (W - im.width * k) / 2, (H - im.height * k) / 2, im.width * k, im.height * k);
  const g = ctx.createLinearGradient(0, H * .5, 0, H); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.35)'); ctx.fillStyle = g; ctx.fillRect(0, H * .5, W, H * .5);
  caption(t);
  ctx.font = `500 22px "Helvetica Neue", Arial, sans-serif`; ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('NASA · Dr. Alex Young, "Will the Sun Ever Burn Out?" (2025)', 60, H - 70);
}
window.__scene = { duration: DUR, ready, seek: async t => { await ready; await draw(t); },
  music: { file: clip.src, from: 0, at: 0 } };          // the clip's own voice
</script></body></html>
