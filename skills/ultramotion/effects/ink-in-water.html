<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Ink in Water (9:16, 8 s)</title>
<style>html,body{margin:0;background:#000}canvas{display:block;width:100vw;height:100vh;object-fit:contain}</style></head>
<body><canvas></canvas>
<script src="../lib/mesh-gradient/mesh.js"></script>
<script src="../lib/mesh-gradient/fluid.js"></script>
<script>
/* Ink in Water — macro ink-in-water: drops of ink hit clear water from above, plunge, open into curling clouds and sink in tendrils.
   Engine: lib/mesh-gradient/fluid.js (read lib/mesh-gradient/GUIDE.md). Real fluid, simulated; every frame is a function of t.
   To make it your own, change DROPS (when, where, which colour, how hard) and the colours; put a title over the settled water
   from about 6 s if you need one. Gravity pulls the ink down; viscosity rises late so the clouds slow to a hang at the end. */
const M = Mesh, { seg, lerp } = M;
const W = 1080, H = 1920, DUR = 8;
const S = M.create({ width: W, height: H });
const WATER = '#f9fafa', WATER2 = '#edf1f2';
const INDIGO = '#14205e', CARMINE = '#a5122c', TEAL = '#0c4d55';
const TW = Math.round(W * 1.3), TX = (TW - W) / 2;                     // a tank wider than the frame: the clouds drift out of shot, never into a wall
// [time, x (0..1 of the frame), colour, size, speed]: each drop pours in from the top for a moment and plunges
const DROPS = [[.2, .38, INDIGO, .04, 1.3], [1.4, .66, CARMINE, .034, 1.2], [2.7, .5, TEAL, .03, 1.4]];
const tx = x => (TX + x * W) / TW;

const F = Fluid.sim({
  width: TW, height: H, res: 300, fps: 30, substeps: 4, keep: 30, mode: 'ink',
  curl: 12, gravity: 520, grain: .12, grainSize: 140,
  viscosity: t => lerp(.05, .7, seg(t, 4.5, 7.5)),
  turbulence: { amount: .01, scale: 2.2, speed: .15, seed: 5 },
  step(F, t, dt) {
    for (const [t0, x, color, r, v] of DROPS) {
      const u = (t - t0) / .22; if (u < 0 || u > 1) continue;            // a short burst: the drop and the jet behind it
      F.pour({ x: tx(x) + .004 * Math.sin(t * 9), y: .035 + .05 * u, r: r * (1 - .4 * u), color, amount: 10, mass: 6, vy: v, kick: 10 }, dt);
    }
  },
});

function draw(c, t) {
  F.at(t);
  F.draw(c, { bg: WATER, bg2: WATER2, gain: 1, shade: .26, spec: .12, shine: 40, edge: 30, light: [-.4, .75, .8], rect: [-TX, 0, TW, H] });
  M.finish(c, t, { grain: .014, vignette: .1 });
}

// one harp note as each drop lands, a low string held under the clouds
const notes = [{ t: 0, m: 38, d: 7.8, inst: 'slowstrings', v: .16 }, { t: 1.2, m: 45, d: 6.6, inst: 'slowstrings', v: .12 }];
[[.3, 74], [1.4, 77], [2.6, 81]].forEach(([t, m]) => notes.push({ t, m, d: 3, inst: 'harp', v: .26 }, { t: t + .02, m: m - 12, d: 3, inst: 'harp', v: .14 }));
window.__scene = M.scene(S, draw, { duration: DUR, background: WATER, music: { notes },
  sounds: DROPS.map(([t0], i) => ({ t: t0 + .02, kind: 'tap', v: .35, pan: [-.3, .3, 0][i] })) });
</script>
</body></html>
