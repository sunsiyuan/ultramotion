<!doctype html>
<html><head><meta charset="utf-8"><title>Liquid Glass Logo Reveal</title>
<style>html,body{margin:0;background:#111;height:100%;display:grid;place-items:center;overflow:hidden}canvas{display:block;height:100vh;width:auto}</style>
</head><body><canvas id="gl" width="1080" height="1920"></canvas>
<script>
/* Liquid Glass Logo Reveal — drops of glass pop up around the frame, run together into one jelly drop, and the drop pulls
   itself into the logo: a wordmark made of glass that bends the colours behind it, settles with a wobble, and catches a
   glint of light. Behind it, "hello" in many languages drifts past and bends where the glass is.
   Engine: lib/liquid-glass (read its GUIDE.md). Liquid Glass is one page, not a library: this file is its scene.html cut down
   to the drawing code plus one cut, REVEAL below. The engine's glass is made of boxes and circles; the logo is added here as a
   distance field computed once from the logo drawn on a canvas (LOGO_DRAW), so any shape can be glass.
   To put it on your own logo, change LOGO_DRAW (draw your mark or wordmark in white — an SVG path or an image works too);
   heavy, round shapes make the best glass. Timing: drops 0.2–1.0 s, they run together 1.2–2.2 s, the logo forms 2.45–3.5 s,
   the glint 3.9 s, hold to the end. */
const Q = new URLSearchParams(location.search);
const W = 1080, H = 1920, CX = W / 2, CY = H / 2;
const FONT = '"SF Pro Display", system-ui, "PingFang SC", sans-serif';
const DARK = Q.get('theme') === 'dark';
const INK = DARK ? '#f4f3fa' : '#1b1b22', ink = a => DARK ? `rgba(244,243,250,${a})` : `rgba(27,27,34,${a})`;
/* ---------- 工具 ---------- */
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => cl((t - a) / (b - a));
const lerp = (a, b, u) => a + (b - a) * u;
const io = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const oc = u => 1 - Math.pow(1 - u, 3);
const spr = (t, a, d = .8) => t <= a ? 0 : 1 - Math.exp(-5 * (t - a) / d) * Math.cos(7.5 * (t - a) / d);   // 带回弹，峰值约 1.12
const TAU = Math.PI * 2;
const box = (x, y, w, h, r, c = [0, 0, 0, 0]) => ({ x, y, w: Math.max(w, .01), h: Math.max(h, .01), r: Math.max(0, Math.min(r, w, h)), c });
const circle = (x, y, r, c) => box(x, y, r, r, r, c);
/* 关键帧路径：[[t, x, y], …]，段内 io 缓动，段间停住 */
function path(keys, t) {
  if (t <= keys[0][0]) return [keys[0][1], keys[0][2]];
  for (let i = 1; i < keys.length; i++) {
    const [t1, x1, y1] = keys[i], [t0, x0, y0] = keys[i - 1];
    if (t <= t1) { const u = io(seg(t, t0, t1)); return [lerp(x0, x1, u), lerp(y0, y1, u)]; }
  }
  const k = keys[keys.length - 1]; return [k[1], k[2]];
}
/* 移动中的玻璃：顺着速度方向拉长、横向收窄 —— 液体感主要靠这一下 */
function moving(keys, t, r) {
  const [x, y] = path(keys, t), [xa, ya] = path(keys, t - .02), [xb, yb] = path(keys, t + .02);
  const vx = (xb - xa) / .04, vy = (yb - ya) / .04, s = cl(Math.hypot(vx, vy) / 2600) * .28;
  const hor = Math.abs(vx) >= Math.abs(vy);
  return hor ? box(x, y, r * (1 + s), r * (1 - s * .45), r * (1 - s * .45)) : box(x, y, r * (1 - s * .45), r * (1 + s), r * (1 - s * .45));
}

/* ---------- the logo, as a distance field ---------- */
const LOGO_DRAW = c => {                                              // the mark, white on black, centred at (CX, LY)
  c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.font = `800 330px ${FONT}`; c.letterSpacing = '-8px'; c.fillText('hello', CX, LY);
};
const LY = 900;
function distanceField(draw) {                                        // signed distance in px (< 0 inside), exact (Felzenszwalb)
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H); draw(g);
  const px = g.getImageData(0, 0, W, H).data, inside = new Uint8Array(W * H); for (let i = 0; i < W * H; i++) inside[i] = px[i * 4] > 127;
  const INF = 1e12;
  const edt = mask => {                                               // squared distance to the nearest pixel where mask is 1
    const f = new Float64Array(Math.max(W, H)), d = new Float64Array(Math.max(W, H)), v = new Int32Array(Math.max(W, H)), z = new Float64Array(Math.max(W, H) + 1);
    const out = new Float64Array(W * H); for (let i = 0; i < W * H; i++) out[i] = mask[i] ? 0 : INF;
    const pass = n => { let k = 0; v[0] = 0; z[0] = -INF; z[1] = INF;
      for (let q = 1; q < n; q++) { let s; do { const r = v[k]; s = ((f[q] + q * q) - (f[r] + r * r)) / (2 * q - 2 * r); if (s <= z[k]) k--; else break; } while (k >= 0); k++; v[k] = q; z[k] = s; z[k + 1] = INF; }
      k = 0; for (let q = 0; q < n; q++) { while (z[k + 1] < q) k++; const r = v[k]; d[q] = (q - r) * (q - r) + f[r]; } };
    for (let x = 0; x < W; x++) { for (let y = 0; y < H; y++) f[y] = out[y * W + x]; pass(H); for (let y = 0; y < H; y++) out[y * W + x] = d[y]; }
    for (let y = 0; y < H; y++) { for (let x = 0; x < W; x++) f[x] = out[y * W + x]; pass(W); for (let x = 0; x < W; x++) out[y * W + x] = d[x]; }
    return out; };
  const dOut = edt(inside), dIn = edt(inside.map(v => 1 - v)), sd = new Float32Array(W * H);
  for (let i = 0; i < W * H; i++) sd[i] = Math.max(-300, Math.min(300, Math.sqrt(dOut[i]) - Math.sqrt(dIn[i]) + (inside[i] ? .5 : -.5)));
  // round the creases along the middle of each stroke (a raw distance field folds there, and glass would show the fold)
  const tmp = new Float32Array(W * H), R = 5;
  for (let rep = 0; rep < 2; rep++) {
    for (let y = 0; y < H; y++) { let acc = 0; for (let x = -R; x <= R; x++) acc += sd[y * W + Math.min(W - 1, Math.max(0, x))];
      for (let x = 0; x < W; x++) { tmp[y * W + x] = acc / (2 * R + 1); acc += sd[y * W + Math.min(W - 1, x + R + 1)] - sd[y * W + Math.max(0, x - R)]; } }
    for (let x = 0; x < W; x++) { let acc = 0; for (let y = -R; y <= R; y++) acc += tmp[Math.min(H - 1, Math.max(0, y)) * W + x];
      for (let y = 0; y < H; y++) { sd[y * W + x] = acc / (2 * R + 1); acc += tmp[Math.min(H - 1, y + R + 1) * W + x] - tmp[Math.max(0, y - R) * W + x]; } }
  }
  return sd;
}

/* ---------- the cut ---------- */
const DROPS = [[230, 420, 70, .2], [860, 560, 92, .35], [190, 1350, 84, .5], [900, 1450, 66, .62], [560, 1660, 58, .78], [620, 300, 54, .9]];   // x, y, r, pop time
const HELLOS = 'hello · bonjour · hola · ciao · hallo · olá · 你好 · こんにちは · 안녕하세요 · привет · merhaba · hej · ';
function REVEAL(t) {
  const F = { bgT: t, shapes: [], k: 120, refr: 50, mag: 1.08, bev: 34, A: [], B: [], logo: 0 };
  // behind the glass: "hello" in many languages drifting past in two rows — the glass bends it where it passes
  F.A.push(c => { c.save(); c.font = `500 46px ${FONT}`; c.fillStyle = ink(.3); c.textBaseline = 'middle';
    const w = c.measureText(HELLOS).width;
    [[LY - 70, 1], [LY + 60, -1]].forEach(([y, dir], r) => { const x0 = ((dir * t * 60 + r * 300) % w + w) % w - w; for (let x = x0; x < W; x += w) c.fillText(HELLOS, x, y); });
    c.restore(); });
  const go = io(seg(t, 1.2, 2.2));                                    // the drops run to the middle and join
  DROPS.forEach(([x, y, r, t0], i) => {
    const pop = spr(t, t0, .7); if (pop <= 0) return;
    const keys = [[1.2 + i * .04, x, y], [2.2, CX + (x - CX) * .07, LY + (y - LY) * .05]];
    F.shapes.push(moving(keys, t, r * pop * lerp(1, 1.15, go)));
  });
  // the joined drop pulls itself into the logo: the glass's distance field slides from the drops to the logo's, and springs past it a little
  const m = spr(t, 2.45, 1.1);
  F.logo = Math.max(0, Math.min(1.1, m));
  F.k = lerp(120, 60, cl(m)); F.bev = lerp(34, 20, cl(m));
  F.mag = lerp(1.1, 1.0, cl(m)); F.refr = lerp(50, 46, cl(m));
  F.glint = seg(t, 3.9, 4.8);                                         // a sheen runs across the finished glass
  return F;
}
const CUTS = { reveal: { duration: 7, frame: REVEAL } }, CUT = 'reveal';
const arp = [[2.45, 72], [2.6, 76], [2.75, 79], [2.9, 84], [3.9, 88], [4.05, 91]].map(([t, m]) => ({ t, m, d: 2.2, inst: 'celesta', v: .3 }))
  .concat([60, 64, 67, 71].map(m => ({ t: 2.45, m, d: 4.5, inst: 'pad', v: .16 })));
const SOUNDS = [...DROPS.map(([x, , , t0]) => ({ t: t0, kind: 'pop', v: .55, pan: (x - CX) / CX * .6 })), { t: 1.2, kind: 'whoosh', dur: 1.0, v: .4 }, { t: 2.15, kind: 'pop', v: .5 },
  { t: 2.45, kind: 'swish', dur: .6, v: .35 }, { t: 3.05, kind: 'pop', v: .45 }, { t: 3.9, kind: 'sparkle', v: .4 }];

/* ---------- WebGL ---------- */
const MAXS = 12;
const FS = `#version 300 es
precision highp float;
uniform vec2 uRes; uniform float uBT, uK, uRefr, uMag, uBev, uDark;
uniform int uN; uniform vec4 uS[${MAXS}], uP[${MAXS}], uC[${MAXS}];
uniform sampler2D uA, uB, uL; uniform float uLM, uGl;
out vec4 o;
const float TAU = 6.2831853;
float sdBox(vec2 p, vec2 c, vec2 h, float r) { vec2 q = abs(p - c) - (h - r); return length(max(q, 0.)) + min(max(q.x, q.y), 0.) - r; }
float smin(float a, float b, float k) { float h = max(k - abs(a - b), 0.) / k; return min(a, b) - h * h * k * .25; }
float sdDrops(vec2 p) { float d = 1e5; for (int i = 0; i < ${MAXS}; i++) { if (i >= uN) break; d = smin(d, sdBox(p, uS[i].xy, uS[i].zw, uP[i].x), uK); } return d; }
float sdLogo(vec2 p) { return texture(uL, p / uRes).r; }
float sdf(vec2 p) { return uLM <= 0. ? sdDrops(p) : mix(uN > 0 ? sdDrops(p) : 300., sdLogo(p), uLM); }   // drops → logo
vec3 blob(vec3 c, vec2 q, vec2 at, float r2, vec3 col, float s) { vec2 d = q - at; return mix(c, col, s * exp(-dot(d, d) / r2)); }
vec3 bgDark(vec2 q, float a) {
  vec3 c = vec3(.055, .05, .095);
  c = blob(c, q, vec2(.03 + .04 * sin(a), -.03), .075, vec3(.30, .19, .62), .9);
  c = blob(c, q, vec2(.30, .12 + .03 * cos(a)), .05, vec3(.17, .17, .40), .7);
  c = blob(c, q, vec2(.60, .30 + .05 * sin(a + 1.)), .06, vec3(.06, .33, .40), .85);
  c = blob(c, q, vec2(.47, .78 + .04 * cos(a)), .05, vec3(.34, .14, .38), .6);
  c = blob(c, q, vec2(.04, .97 + .03 * sin(2. * a)), .08, vec3(.13, .15, .38), .8);
  float band = q.x * .9 + q.y - .62 - .04 * sin(a);
  return mix(c, vec3(.17, .16, .27), .45 * exp(-band * band / .006));
}
vec3 bg(vec2 p) {
  vec2 q = p / uRes.y; float a = TAU * uBT / 16.;
  q += .035 * vec2(sin(q.y * 3.1 + a), cos(q.x * 4.3 - a));
  if (uDark > .5) return bgDark(q, a);
  vec3 c = vec3(.905, .892, .952);
  c = blob(c, q, vec2(.03 + .04 * sin(a), -.03), .075, vec3(.54, .47, .90), .9);
  c = blob(c, q, vec2(.30, .12 + .03 * cos(a)), .05, vec3(.76, .73, .97), .7);
  c = blob(c, q, vec2(.60, .30 + .05 * sin(a + 1.)), .06, vec3(.55, .79, .86), .85);
  c = blob(c, q, vec2(.20 + .05 * cos(a), .56), .04, vec3(.72, .82, .96), .35);
  c = blob(c, q, vec2(.47, .78 + .04 * cos(a)), .05, vec3(.93, .86, .93), .6);
  c = blob(c, q, vec2(.04, .97 + .03 * sin(2. * a)), .08, vec3(.60, .64, .88), .8);
  float band = q.x * .9 + q.y - .62 - .04 * sin(a);
  c = mix(c, vec3(.965, .955, .995), .45 * exp(-band * band / .006));
  return c;
}
vec2 uvOf(vec2 p) { return vec2(p.x / uRes.x, 1. - p.y / uRes.y); }
vec3 scene(vec2 p) { vec4 a = texture(uA, uvOf(p)); return bg(p) * (1. - a.a) + a.rgb; }
float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
void main() {
  vec2 p = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
  vec3 col = scene(p);
  if (uN > 0 || uLM > 0.) {
    float d = sdf(p);
    float ds = sdf(p - vec2(0., 22.));
    col *= 1. - .17 * exp(-max(ds, 0.) / 38.) * smoothstep(-1., 1., d);
    if (d < 2.) {
      vec2 n = normalize(vec2(sdf(p + vec2(1, 0)) - d, sdf(p + vec2(0, 1)) - d) + 1e-6);
      float rim = 1. - clamp(-d / uBev, 0., 1.);
      vec2 c = vec2(0); float ws = 0.; vec4 tint = vec4(0);
      for (int i = 0; i < ${MAXS}; i++) { if (i >= uN) break; float di = sdBox(p, uS[i].xy, uS[i].zw, uP[i].x); float w = 1. / (1. + exp(clamp(di / 16., -30., 30.))); c += w * uS[i].xy; tint += w * uC[i]; ws += w; }
      c /= max(ws, 1e-4); tint /= max(ws, 1e-4);
      c = mix(c, p, clamp(uLM, 0., 1.));                              // the logo bends at its edges, no lens zoom
      vec2 base = c + (p - c) / uMag, off = -n * uRefr * pow(rim, 2.8);
      vec3 g = vec3(scene(base + off * .96).r, scene(base + off).g, scene(base + off * 1.05).b);
      g = mix(g, vec3(1.), (.08 + .12 * rim) * (1. - .45 * uDark));
      g = mix(g, tint.rgb, tint.a);
      vec2 L = normalize(vec2(-.55, -.85));
      g += pow(rim, 3.5) * (.12 + .6 * max(dot(n, L), 0.));
      g *= 1. - pow(rim, 3.) * .14 * max(dot(n, -L), 0.);
      g += .35 * smoothstep(-3.5, -.5, d);
      float sweep = (p.x + p.y * .5) / uRes.x - mix(-.6, 2.2, uGl);  // the glint: a band of light crossing the glass
      g += .45 * exp(-sweep * sweep / .004) * step(.001, uGl) * step(uGl, .999);
      col = mix(col, g, smoothstep(.9, -.9, d));
    }
  }
  vec4 b = texture(uB, uvOf(p)); col = col * (1. - b.a) + b.rgb;
  col += (hash(p + fract(uBT * 7.) * 97.) - .5) / 255.;
  o = vec4(col, 1.);
}`;
const cv = document.getElementById('gl');
const gl = cv.getContext('webgl2', { preserveDrawingBuffer: true, antialias: false });
function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, `#version 300 es
in vec2 v; void main(){ gl_Position = vec4(v, 0, 1); }`));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'v'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const U = n => gl.getUniformLocation(prog, n);
gl.viewport(0, 0, W, H);
function layer(unit) {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const tex = gl.createTexture(); gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return { c, ctx: c.getContext('2d'), tex, unit };
}
const LA = layer(0), LB = layer(1);
const LT = gl.createTexture(); gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, LT);
for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, k, v);
gl.uniform1i(U('uA'), 0); gl.uniform1i(U('uB'), 1); gl.uniform1i(U('uL'), 2); gl.uniform2f(U('uRes'), W, H);
gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true); gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
function upload(L, draws) {
  L.ctx.clearRect(0, 0, W, H); for (const d of draws || []) d(L.ctx);
  gl.activeTexture(gl.TEXTURE0 + L.unit); gl.bindTexture(gl.TEXTURE_2D, L.tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, L.c);
}
function draw(t) {
  const C = CUTS[CUT], F = C.frame(t);
  upload(LA, F.A); upload(LB, F.B);
  const S = new Float32Array(MAXS * 4), P = new Float32Array(MAXS * 4), Cc = new Float32Array(MAXS * 4);
  F.shapes.slice(0, MAXS).forEach((s, i) => { S.set([s.x, s.y, s.w, s.h], i * 4); P[i * 4] = s.r; Cc.set(s.c, i * 4); });
  gl.uniform4fv(U('uS'), S); gl.uniform4fv(U('uP'), P); gl.uniform4fv(U('uC'), Cc);
  gl.uniform1i(U('uN'), Math.min(F.shapes.length, MAXS));
  gl.uniform1f(U('uBT'), F.bgT); gl.uniform1f(U('uK'), F.k ?? 70); gl.uniform1f(U('uRefr'), F.refr ?? 60);
  gl.uniform1f(U('uLM'), F.logo || 0); gl.uniform1f(U('uGl'), F.glint || 0);
  gl.uniform1f(U('uMag'), F.mag ?? 1.1); gl.uniform1f(U('uBev'), F.bev ?? 46); gl.uniform1f(U('uDark'), DARK ? 1 : 0);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); gl.finish();
}

window.__scene = {
  duration: CUTS[CUT].duration, sounds: SOUNDS, music: { notes: arp },
  ready: document.fonts.load(`800 100px ${FONT}`).then(() => document.fonts.ready).then(() => {
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, LT); gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false); gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.R16F, W, H, 0, gl.RED, gl.FLOAT, distanceField(LOGO_DRAW));
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true); gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true); }),
  seek: t => new Promise(ok => { draw(t); requestAnimationFrame(() => ok()); }),
};
if (!Q.has('rec')) {
  const t0 = performance.now();
  const loop = () => { draw(((performance.now() - t0) / 1000) % CUTS[CUT].duration); requestAnimationFrame(loop); };
  window.__scene.ready.then(loop);
}
</script></body></html>
