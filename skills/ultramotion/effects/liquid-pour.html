<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Liquid Pour (9:16, 9 s)</title>
<style>html,body{margin:0;background:#000}canvas{display:block;width:100vw;height:100vh;object-fit:contain}</style></head>
<body><canvas></canvas>
<script src="../lib/mesh-gradient/mesh.js"></script>
<script src="../lib/mesh-gradient/fluid.js"></script>
<script>
/* Liquid Pour — a stream of thick paint falls into a cup of paint, plunges, and folds over itself; a second and a third colour follow,
   each one folding into the last. Seen from the side through clear glass, against a plain studio wall.
   Engine: lib/mesh-gradient/fluid.js (read lib/mesh-gradient/GUIDE.md), 'paint' mode: opaque, the newest colour covers.
   To make it your own, change BASE (what's already in the cup) and POURS (when, where, which colour, how hard); the streams above the surface
   are drawn from the same list. Viscosity rises at the end so the folds slow and hold. */
const M = Mesh, { seg, lerp, ease, TAU } = M;
const W = 1080, H = 1920, DUR = 9;
const S = M.create({ width: W, height: H });
const WALL = '#ece7de', WALL2 = '#d9d2c6';
const BASE = '#efe6d3', BASE2 = '#e6dbc3';                                      // cream base paint already in the cup
const SURF = 520;                                                               // the paint's surface (px from the top)
// [start, end, x (0..1 of the frame), colour, how hard it plunges]
const POURS = [[.3, 2.4, .42, '#1e3f9a', 1.15], [2.6, 4.6, .6, '#e0a326', 1.0], [4.8, 6.6, .5, '#b8322a', .9]];
const TW = Math.round(W * 1.3), TX = (TW - W) / 2, TH = H - SURF;
const tx = x => (TX + x * W) / TW;
const wob = (t, k) => .006 * Math.sin(t * 2.3 + k) + .003 * Math.sin(t * 5.1 + 2 * k);   // the stream sways a little as the hand moves

const F = Fluid.sim({
  width: TW, height: TH, res: 300, fps: 30, substeps: 4, keep: 30, mode: 'paint',
  curl: 5, grain: .06, grainSize: 120,
  viscosity: t => lerp(.55, 1.6, seg(t, 6.6, 8.6)),
  turbulence: { amount: .006, scale: 2.4, speed: .2, seed: 3 },
  step(F, t, dt) {
    POURS.forEach(([t0, t1, x, color, v], k) => {
      if (t < t0 || t > t1) return;
      const u = seg(t, t0, t1), on = Math.min(1, (t - t0) / .25) * Math.min(1, (t1 - t) / .3);
      F.pour({ x: tx(x + wob(t, k)), y: .006, r: .022 + .006 * on, color, amount: 120 * on, vy: v * 1.6 * (.85 + .25 * Math.sin(u * 7)), kick: 9 }, dt);
    });
  },
});

// the streams in the air: a ribbon from the top of the frame to the surface, a little narrower as it falls, a hard sheen on one edge
function streams(c, t) {
  POURS.forEach(([t0, t1, x, color], k) => {
    const head = seg(t, t0, t0 + .35), tail = seg(t, t1 - .1, t1 + .4);       // the stream arrives from the top, then breaks off and falls away
    if (head <= 0 || tail >= 1) return;
    const y0 = lerp(0, SURF, tail * tail), y1 = lerp(0, SURF + 6, ease.out(head)), L = [], R = [];
    for (let y = y0; y <= y1; y += 6) {
      const s = y / SURF, cx = (x + wob(t - y / 1400, k)) * W, w = lerp(34, 24, s) * (1 + .06 * Math.sin(y / 40 - t * 14));
      L.push([cx - w / 2, y]); R.push([cx + w / 2, y]);
    }
    if (L.length < 2) return;
    c.save(); c.beginPath(); c.moveTo(...L[0]); L.forEach(p => c.lineTo(...p)); R.slice().reverse().forEach(p => c.lineTo(...p)); c.closePath();
    c.fillStyle = color; c.fill();
    c.beginPath(); L.forEach((p, i) => i ? c.lineTo(p[0] + 5, p[1]) : c.moveTo(p[0] + 5, p[1]));
    c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 3; c.stroke();
    c.restore();
  });
}
function backdrop(c) {
  const g = c.createLinearGradient(0, 0, 0, SURF);
  g.addColorStop(0, WALL2); g.addColorStop(1, WALL);
  c.fillStyle = g; c.fillRect(0, 0, W, SURF);
}
function glass(c) {                                                            // the surface line and the front wall of the cup
  c.save();
  c.fillStyle = 'rgba(255,255,255,.55)'; c.fillRect(0, SURF - 2, W, 3);
  c.fillStyle = 'rgba(80,60,30,.12)'; c.fillRect(0, SURF + 1, W, 6);
  const g = c.createLinearGradient(40, 0, 130, 0); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.5, 'rgba(255,255,255,.22)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = g; c.fillRect(40, SURF, 90, H - SURF);
  c.restore();
}
function draw(c, t) {
  backdrop(c);
  F.at(t);
  F.draw(c, { bg: BASE, bg2: BASE2, gain: 1, shade: .45, spec: .55, shine: 90, edge: 22, light: [-.35, .85, .55], rect: [-TX, SURF, TW, TH] });
  glass(c); streams(c, t);
  M.finish(c, t, { grain: .012, vignette: .12 });
}

// a slow pour: a low cello under it, one plucked note as each colour goes in, the pour itself as a soft rush
const notes = [{ t: 0, m: 38, d: 8.8, inst: 'slowstrings', v: .14 }];
POURS.forEach(([t0], i) => notes.push({ t: t0 + .3, m: [69, 72, 76][i], d: 2.6, inst: 'harp', v: .24 }, { t: t0 + .32, m: [57, 60, 64][i], d: 2.6, inst: 'harp', v: .12 }));
window.__scene = M.scene(S, draw, { duration: DUR, background: WALL, music: { notes },
  sounds: POURS.map(([t0, t1], i) => ({ t: t0 + .2, kind: 'swish', dur: t1 - t0, v: .18, pan: [-.2, .25, 0][i] })) });
</script>
</body></html>
