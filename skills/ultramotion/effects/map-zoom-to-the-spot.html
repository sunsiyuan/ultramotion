<!doctype html><html><head><meta charset="utf-8"><title>Map Zoom to the Spot — the M7.7 Panama earthquake</title>
<style>html,body{margin:0;background:#000}canvas{display:block;max-width:100vw;max-height:100vh;margin:auto}</style></head><body>
<canvas></canvas>
<script src="../lib/event-replay/event.js"></script>
<script>
/* Map Zoom to the Spot — one continuous camera from a continent down to one place on real shaded relief: the map tips back
   as it gets close, the spot lights, the shaking spreads from it and the towns around it light up as it reaches them.
   To make your own, change SPOT (where, what, when), the three views and the relief images (relief.py --box w s e n for each scale),
   the towns and the source line.
   Here: the M7.7 earthquake on Panama's Azuero Peninsula, 9 Oct 2026, 17:56:06 UTC (USGS us6000u18k: epicentre, depth, PAGER towns). */
const R = Replay;
const SPOT = { ll: [-80.769, 7.5868], at: Date.UTC(2026, 9, 9, 17, 56, 6), mag: 'M7.7', where: '12 km WSW of Pitaloza Arriba', depth: '12.6 km deep' };
const TOWNS = [[[-80.4333, 7.9667], 'Chitré', -1], [[-80.2833, 7.7667], 'Las Tablas', 1], [[-80.44, 7.4], 'Tonosí', 1], [[-80.9833, 8.1004], 'Santiago', -1], [[-80.3553, 8.5187], 'Penonomé', 1]];
window.__scene = R.withData(['../templates/disaster-on-the-map/data/countries-110m.json', 'media/map-zoom-americas.jpg', 'media/map-zoom-panama.jpg', 'media/map-zoom-azuero.jpg',
  'media/map-zoom-americas.jpg.json', 'media/map-zoom-panama.jpg.json', 'media/map-zoom-azuero.jpg.json'], ([WORLD, AM, PA, AZ, bAM, bPA, bAZ]) => {
  const W = 1080, H = 1920, O = SPOT.at, RED = '#ff3b30', INK = '#ece8e0', DIM = 'rgba(236,232,224,.55)';
  const box = b => b.box || b;                                                     // relief.py writes the box next to each image
  // a detail map fades into the one under it over a wide margin, so no edge of it is ever seen
  const soft = (img, m = .22) => { const cv = document.createElement('canvas'); cv.width = img.width; cv.height = img.height; const g = cv.getContext('2d');
    g.drawImage(img, 0, 0); g.globalCompositeOperation = 'destination-in';
    const lx = g.createLinearGradient(0, 0, cv.width, 0); lx.addColorStop(0, 'rgba(0,0,0,0)'); lx.addColorStop(m, '#000'); lx.addColorStop(1 - m, '#000'); lx.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = lx; g.fillRect(0, 0, cv.width, cv.height);
    const ly = g.createLinearGradient(0, 0, 0, cv.height); ly.addColorStop(0, 'rgba(0,0,0,0)'); ly.addColorStop(m, '#000'); ly.addColorStop(1 - m, '#000'); ly.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = ly; g.fillRect(0, 0, cv.width, cv.height); return cv; };
  const PAs = soft(PA), AZs = soft(AZ);
  // the clock: the last seconds before, then 18 seconds of shaking stretched over four
  const E = R.create({ width: W, height: H, easeTime: false, time: [[0, O - 20e3], [5.4, O], [9.8, O + 18e3]] });
  const V0 = { center: [-78, 6], scale: 13, W, H }, V1 = { center: [-80.3, 8.1], scale: 125, W, H, tilt: 18 },
        V2 = { center: [-80.62, 7.72], scale: 760, W, H, tilt: 46, rotate: -5, dy: 140 };
  const BORDERS = R.topo(WORLD, 'countries').filter(p => p.ring.every(([lon]) => lon > -170 && lon < -25));   // the Americas only (no rings across the date line)
  const km = (a, b) => Math.hypot((a[0] - b[0]) * Math.cos(a[1] * Math.PI / 180), a[1] - b[1]) * 111.2;
  const ring = (P, pts) => { c.beginPath(); pts.forEach((p, i) => { const [x, y] = P(p); i ? c.lineTo(x, y) : c.moveTo(x, y); }); c.closePath(); };
  let c;
  const draw = (ctx, t) => {
    c = ctx; const now = E.realAt(t), sec = (now - O) / 1000;
    const V = R.lerpView(R.lerpView(V0, V1, R.io(R.seg(t, .8, 3.6))), V2, R.io(R.seg(t, 3.4, 6.4))), P = R.proj(V);
    c.save(); c.filter = `brightness(${R.lerp(2.3, 1.6, R.seg(V.scale, 13, 90)).toFixed(2)}) contrast(1.15)`;   // the wide view lifted so the continents read
    R.basemap(c, AM, box(bAM), P);                                                   // one relief for the whole frame at the widest view
    c.globalAlpha = R.seg(V.scale, 30, 70); R.basemap(c, PAs, box(bPA), P);
    c.globalAlpha = R.seg(V.scale, 240, 420); R.basemap(c, AZs, box(bAZ), P);
    c.restore();
    // borders, faint, only while the view is wide enough for their detail
    const ba = 1 - R.seg(V.scale, 90, 220);
    if (ba > 0) { c.save(); c.globalAlpha = ba; c.lineJoin = 'round'; BORDERS.forEach(p => { ring(P, p.ring); c.strokeStyle = p.props.name === 'Panama' ? 'rgba(236,232,224,.6)' : 'rgba(236,232,224,.16)'; c.lineWidth = p.props.name === 'Panama' ? 2.2 : 1.2; c.stroke(); }); c.restore(); }
    // the spot: a marker that finds it on the way down, then the shaking spreading out from it
    const [x, y] = P(SPOT.ll), find = R.seg(t, 1.2, 2.0) * (1 - R.seg(t, 5.2, 5.5));
    if (find > 0) { c.save(); c.globalAlpha = find; c.strokeStyle = RED; c.lineWidth = 3; const r = 26 + 10 * Math.sin(t * 4); c.beginPath(); c.arc(x, y, r, 0, R.TAU); c.stroke(); c.restore(); }
    if (sec >= 0) {
      R.wave(c, P, O, SPOT.ll, now, { speed: 6.5, color: 'rgba(236,232,224,.45)', width: 2, fade: 1500 });
      R.wave(c, P, O, SPOT.ll, now, { speed: 3.5, color: RED, width: 4, fade: 1500 });
      const k = R.pop(t, 5.4, .5); c.save(); c.fillStyle = RED; c.shadowColor = RED; c.shadowBlur = 36; c.beginPath(); c.arc(x, y, 13 * k, 0, R.TAU); c.fill(); c.restore();
      R.text(c, SPOT.mag, x - 28, y - 30, { size: 100, weight: 800, font: R.SANS, color: INK, align: 'right', a: R.seg(t, 5.5, 5.9) });
      R.text(c, SPOT.where, x - 28, y + 16, { size: 26, weight: 600, color: INK, align: 'right', a: R.seg(t, 5.8, 6.2) });
      R.text(c, SPOT.depth, x - 28, y + 50, { size: 26, color: DIM, align: 'right', a: R.seg(t, 5.9, 6.3) });
    }
    // the towns light up as the S wave reaches them
    TOWNS.forEach(([ll, name, side]) => { const at = km(SPOT.ll, ll) / 3.5; R.place(c, P, ll, name, { size: 34, a: R.seg(sec, at, at + 2) * R.seg(V.scale, 400, 650), color: INK, side }); });
    // where and when, at the top
    R.text(c, 'Azuero Peninsula, Panama', 80, 220, { size: 52, weight: 700, color: INK, a: R.seg(t, 3.2, 3.8) });
    R.text(c, 'Friday, Oct. 9, 2026 · 12:56:06 PM local time', 80, 276, { size: 30, weight: 500, color: DIM, a: R.seg(t, 3.4, 4.0) });
    if (sec >= 0) R.text(c, `${Math.floor(sec)} s after the rupture`, 80, 330, { size: 30, weight: 600, color: RED });
    R.source(c, 'Source: USGS, event us6000u18k (epicentre, depth, PAGER towns) · relief: AWS Terrain Tiles', { x: 80, y: 1800, color: 'rgba(236,232,224,.4)' });
    R.finish(c, t);
  };
  // a low pad under the descent, whooshes as the camera drops, an impact and a rumble at the rupture
  const notes = [[38, 45, 50, 57], [36, 43, 50, 55]].flatMap((ch, k) => ch.map(m => ({ t: k * 2.7, m, d: 3, inst: 'pad', v: .2 })));
  notes.push({ t: 5.4, m: 26, d: 3.8, inst: 'timpani', v: .45 }, ...[38, 45, 50, 53].map(m => ({ t: 5.4, m, d: 4.2, inst: 'slowstrings', v: .22 })));
  const sounds = [{ t: .8, kind: 'whoosh', dur: 2.6, v: .35 }, { t: 3.4, kind: 'whoosh', dur: 2.8, v: .4 }, ...R.ticks(E, { every: 1000, from: 0, to: 5.35, v: .4 }),
    { t: 5.4, kind: 'impact', v: .8 }, { t: 5.4, kind: 'rumble', dur: 4.2, v: .9 }];
  return R.scene(E, draw, { duration: 9.8, music: { notes }, sounds });
});
</script></body></html>
