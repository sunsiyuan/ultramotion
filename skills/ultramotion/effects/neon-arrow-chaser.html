<!doctype html>
<meta charset="utf-8">
<title>Neon Arrow Chaser — an arrow of chevrons running toward where to go</title>
<style>html, body { margin: 0; background: #000; } canvas { display: block; max-width: 100vw; max-height: 100vh; margin: auto; }</style>
<canvas></canvas>
<script src="../lib/neon-sign/neon.js"></script>
<script>
// EFFECT: Neon Arrow Chaser (霓虹箭头跑马). A long arrow of chevrons climbs the whole frame from the bottom-left corner to the word
// at the top. It lights all at once with the sign; once everything holds, the chevrons start running — one in three lit,
// the lit ones stepping toward the tip — with a relay ticking under the hum. The word and the script never move.
// To put it on something else: change WORD and LINE, FROM / TO (where the arrow starts and points), N_CHEV and STEP (the running speed).
// The strike timing, the glass, the wall's light and the hum come from lib/neon-sign (see its GUIDE.md: chase(), level).
const N = Neon, W = 1080, H = 1920, DUR = 8.5;
const WORD = 'ROOFTOP', LINE = 'this way';
const FROM = [170, 1730], TO = [830, 830], N_CHEV = 7, RUN = 3.9, STEP = .15;
window.__scene = N.scene(async () => {
  const S = N.stage({ width: W, height: H });

  const word = await N.text(WORD, { font: '700 230px "DIN Condensed"', x: 540, y: 420, mode: 'outline', inset: 7, spacing: 14 });
  const line = await N.text(LINE, { font: '400 200px "SignPainter"', x: 640, y: 660 });
  // the chevrons: each a bent tube pointing along FROM → TO
  const dx = TO[0] - FROM[0], dy = TO[1] - FROM[1], len = Math.hypot(dx, dy), u = [dx / len, dy / len], v = [-u[1], u[0]], a = 96;
  const chev = Array.from({ length: N_CHEV }, (_, i) => {
    const p = [FROM[0] + u[0] * len * i / (N_CHEV - 1), FROM[1] + u[1] * len * i / (N_CHEV - 1)];
    return N.line([[p[0] - a * u[0] - a * v[0], p[1] - a * u[1] - a * v[1]], p, [p[0] - a * u[0] + a * v[0], p[1] - a * u[1] + a * v[1]]], 5);
  });
  const run = (t, i) => t < RUN ? 1 : ((Math.floor((t - RUN) / STEP) - i) % 3 + 3) % 3 === 0 ? 1 : 0;   // one in three, stepping toward the tip
  const tubes = [
    ...N.tubes(word, { gas: 'aqua', width: 9, at: i => 1.45 + i * .08, style: i => i === 4 ? 'stubborn' : 'stutter', trying: .8, seed: i => 3 + i }),
    N.tube(line, { gas: 'pink', width: 9, at: 2.55, style: 'stutter', seed: 17 }),
    ...chev.map((c, i) => N.tube([c], { gas: 'gold', width: 16, at: 2.95, style: 'snap', seed: 40 + i, supports: 0, level: t => run(t, i) })),
  ];
  const sign = N.sign({
    stage: S, tubes, ambient: '#2f3a5a', spill: 2.3, bloom: .85,
    wall: N.wall('brick', { w: W, h: H, seed: 9, color: '#6a4a3e' }),
    paint: g => {                                                              // a steel door frame bottom right, the way up behind it
      g.fillStyle = '#121418'; g.fillRect(820, 1240, 260, 680); g.fillStyle = '#3c4048'; g.fillRect(806, 1226, 14, 694); g.fillRect(806, 1226, 274, 14);
    },
    wires: [N.cable([W - 30, 120], tubes[WORD.length - 1].ends[1], 40, { width: 6 })],
  });
  const cam = t => N.camera([[0, { x: 540, y: 980, z: 1.0 }], [DUR, { x: 560, y: 930, z: 1.05 }]], t);
  const steps = []; for (let t = RUN; t < DUR; t += STEP) steps.push({ kind: 'tick', t, v: .07, pan: .2 });
  return {
    duration: DUR,
    draw: t => sign.draw(t, { camera: cam(t) }),
    sounds: [{ kind: 'street', t: 0, dur: DUR, v: .5 }, { kind: 'clack', t: 1.15, v: .75, pan: .3 }, { kind: 'clack', t: RUN - .05, v: .35, pan: .2 }, ...steps,
             ...sign.sounds(DUR, { hz: 120, hum: .9, sizzle: .8, zap: .7 })],
  };
});
</script>
