<!doctype html>
<html><head><meta charset="utf-8"><title>Pen Circle — Social Security's 2027 COLA</title>
<style>html,body{margin:0;background:#111}canvas{display:block;width:100vw;max-width:540px;margin:auto}</style></head>
<body><canvas></canvas>
<script src="../lib/news-collage/collage.js"></script>
<script>
/* Pen Circle — close on a real letter, a red pen circles the number in one loop that doesn't quite close,
   then underlines who it is for; the camera pulls back to show the whole page.
   To make your own, change CONTENT: the document's own words, verbatim, with the number to circle and the phrase to underline as { t, id } runs,
   and the source line. */
const CONTENT = {
  from: 'SOCIAL SECURITY ADMINISTRATION',
  title: 'Just Announced! Cost-of-Living Adjustment (COLA) for 2027',
  date: 'Date: Wednesday, October 14, 2026',
  hello: 'Dear Colleague,',
  p1: ['Today, we announced that monthly Social Security benefits and Supplemental Security Income payments for ',
    { t: '76 million Americans', id: 'who' }, ' will increase by ', { t: '3.6 percent', id: 'num' }, ' in 2027.'],
  p2: 'Visit our blog for details about the COLA and other important updates. Individuals who create a my Social Security account can access their personal COLA online up to three weeks earlier than by mail if they sign up for digital notices by November 18, 2026.',
  source: 'Source: Social Security Administration, letter to advocates, Oct. 14, 2026 (ssa.gov)',
};

window.__scene = Collage.load({}, () => {
  const C = Collage.create({ board: 'kraft', light: { dx: -.45, dy: .85, dark: .4 } });
  const F = Collage.FONTS, INK = '#191a1c', RED = '#cf1f1f', BLUE = '#1f3c6e';
  const T = { circle: 1.5, under: 3.0, dur: 7.6 };

  const M = 66, body = { size: 40, lh: 1.45, font: F.sans, color: '#26272a' };
  const doc = C.piece({ id: 'doc', x: 540, y: 980, w: 880, h: 'auto', rot: 1.8, paper: '#ffffff', edge: 'clean', lift: 5, padBottom: 90, enter: { at: 0, from: 'none' },
    face: (g, w, h, P) => {
      g.fillStyle = BLUE; g.fillRect(0, 0, w, 14);
      P.text(CONTENT.from, { x: M, y: 96, size: 26, font: F.sans, weight: 700, color: BLUE, tracking: .12 });
      const a = P.text(CONTENT.title, { x: M, y: 186, width: w - M * 2, size: 50, lh: 1.15, font: F.serif, weight: 700, color: INK });
      P.text(CONTENT.date, { x: M, y: a.y + 70, size: 30, font: F.sans, color: '#5e6065' });
      P.text(CONTENT.hello, { x: M, y: a.y + 170, ...body });
      const b = P.text(CONTENT.p1, { x: M, y: a.y + 250, width: w - M * 2, ...body });
      return P.text(CONTENT.p2, { x: M, y: b.y + 80, width: w - M * 2, ...body }).y;
    } });

  C.circle('doc.num', { at: T.circle, dur: .75, color: RED, pad: 16, width: 6 });
  C.underline('doc.who', { at: T.under, dur: .7, color: RED, width: 5 });

  const close = { safe: [60, 420, 60, 560], maxZoom: 2.2 };
  const both = C.frame(['doc.who', 'doc.num'], { ...close, maxZoom: 1.9 });
  const num = C.frame('doc.num', { ...close, maxZoom: 1.75, dx: -170 });
  const cam = [
    [0, num],
    [2.5, num],
    [3.2, both],
    [4.4, both],
    [6.0, C.frame(doc, { pad: 60, safe: [40, 220, 40, 320] })],
    [T.dur, C.frame(doc, { pad: 60, safe: [40, 220, 40, 320] })],
  ];

  // plucked strings, light; a low note when the circle closes
  const notes = [], ch = [[45, 52, 57, 60, 64], [41, 48, 53, 57, 60], [43, 50, 55, 59, 62]];
  for (let k = 0; k < 14; k++) { const c = ch[Math.min(2, Math.floor(k / 5))]; notes.push({ t: .2 + k * .42, m: c[[1, 3, 2, 4][k % 4]] + 12, d: .5, inst: 'pizzicato', v: k % 2 ? .28 : .38 }); }
  notes.push({ t: T.circle + .75, m: 45, d: 1.2, inst: 'bass', v: .2 }, { t: 5.8, m: 45, d: 2, inst: 'piano', v: .3 }, { t: 5.85, m: 52, d: 2, inst: 'piano', v: .26 }, { t: 5.9, m: 57, d: 2, inst: 'piano', v: .24 });
  return C.scene({ duration: T.dur, camera: cam, music: { notes },
    overlay: (ctx, t) => Collage.source(ctx, CONTENT.source, { a: Collage.sm((t - 6.0) / .5), size: 22, y: 1640 }) });
});
</script></body></html>
