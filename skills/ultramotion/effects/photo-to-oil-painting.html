<!doctype html><html><head><meta charset="utf-8"><title>Photo to Oil Painting (9:16, 7.5 s)</title>
<style>html,body{margin:0;background:#000}canvas{display:block;height:100vh;width:auto;margin:0 auto}</style></head><body>
<canvas></canvas>
<script src="../lib/painterly/brush.js"></script>
<script>
/* Photo to Oil Painting — a photograph, then a brush sweeps across it and every pass leaves oil paint behind: thick strokes in the
   photo's own colours, running the way its forms run, until the whole picture is a painting; then the painting lives — the
   sky's strokes slide, the leaves stir, the surface breathes the way a hand-painted film does.
   Here: Courthouse Towers in Arches National Park with the cottonwoods in fall colour (National Park Service photo, public domain).
   Engine: lib/painterly/brush.js (read lib/painterly/GUIDE.md, "Painting from the original") — the painting takes its colour and
   stroke direction from the photo (Painterly.reference). The photo itself is laid over it (overlay) and wiped away by brush-shaped
   strokes that follow the same directions, big ones first along a diagonal sweep, then the gaps.
   To use your own photo: change PHOTO (and W, H to its proportions), where the trees are (LEAVES) and what counts as sky in paint().
   Timing: photo 0–0.8 s, the brush passes 0.8–3.8 s, the painting lives to the end. */
const F = Painterly, PHOTO = 'media/photo-to-oil-painting-arches.jpg', W = 1280, H = 1924, DUR = 7.5;
const LEAVES = (x, y) => y > 1050;                                                   // the cottonwoods
window.__scene = F.fromImage(PHOTO, img => {
  const R = F.reference(img, { width: W, height: H });
  function paint(x, y, t) {
    let sx = x, sy = y;
    if (LEAVES(x, y)) sx += (y - 1050) / 870 * (5 * Math.sin(t * 1.7 + y * .012) + 3 * Math.sin(t * 2.9 + x * .02));   // the leaves stir
    const p = R.at(sx, sy), sky = p.c[2] > p.c[0] + 20 && p.c[0] + p.c[1] + p.c[2] > 430 && y < 900;   // light blue up top: sky (not the blue shadows on the rock)
    return { c: p.c, a: sky ? .12 + .25 * Math.sin(x * .004 + y * .006) : p.a, size: sky ? 1.25 : p.size, len: sky ? 1.9 : 1, pop: LEAVES(x, y) ? p.pop : 0, flow: sky ? 8 : p.coherence > .4 ? 4 : 0 };   // long strokes across the sky
  }
  const cam = t => ({ x: W / 2, y: H / 2, zoom: Math.max(1080 / W, 1920 / H) * (1 + .05 * F.ease(F.seg(t, 0, DUR))) });

  // the photo on top, wiped away by brush passes. Each pass is a stroke of the painting's own direction; when it comes
  // depends on where it is along the sweep (top left → bottom right) — big strokes first, small ones fill the gaps
  const pass = []; { let s = 3;
    const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
    for (const [cell, big] of [[64, 1], [30, 0]]) for (let y = -cell; y < H + cell; y += cell) for (let x = -cell; x < W + cell; x += cell) {
      const px = x + r() * cell, py = y + r() * cell, along = (px / W * .45 + py / H * .55);
      pass.push({ x: px, y: py, a: R.at(Math.min(W - 1, Math.max(0, px)), Math.min(H - 1, Math.max(0, py))).a, T: .8 + along * 2.2 + (big ? 0 : .45) + r() * .35,
        L: big ? 70 + r() * 50 : 34 + r() * 22, w: big ? 30 + r() * 16 : 16 + r() * 10 }); } }
  const ov = document.createElement('canvas'); ov.width = 1080; ov.height = 1920; const g = ov.getContext('2d');
  function overlay(out, t) {
    if (t > 4.4) return;
    const c = cam(t), z = c.zoom;
    g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'source-over'; g.clearRect(0, 0, 1080, 1920);
    g.setTransform(z, 0, 0, z, 540 - c.x * z, 960 - c.y * z); g.drawImage(img, 0, 0, W, H);
    g.globalCompositeOperation = 'destination-out'; g.lineCap = 'round'; g.strokeStyle = '#000';
    for (const p of pass) { const u = F.cl((t - p.T) / .18); if (u <= 0) continue;          // a pass is dragged in over a fifth of a second
      const dx = Math.cos(p.a) * p.L, dy = Math.sin(p.a) * p.L; g.lineWidth = p.w;
      g.beginPath(); g.moveTo(p.x - dx, p.y - dy); g.lineTo(p.x - dx + 2 * dx * u, p.y - dy + 2 * dy * u); g.stroke(); }
    out.save(); out.setTransform(1, 0, 0, 1, 0, 0); out.drawImage(ov, 0, 0); out.restore();
  }
  const P = F.create({ width: W, height: H, view: [1080, 1920], paint, background: '#4a3424', lines: R.lines, camera: cam, overlay });

  /* the brush: a soft swish for each sweep; strings and a warm piano under it; a bright chord when the painting is whole */
  const notes = [], N = (t, m, d, inst, v) => notes.push({ t, m, d, inst, v });
  [[.8, 57], [1.6, 60], [2.4, 64], [3.2, 67]].forEach(([t, m]) => { N(t, m, 1.8, 'piano', .3); N(t, m - 12, 1.8, 'pizzicato', .25); });
  N(.8, 45, 3.2, 'slowstrings', .2); N(.8, 52, 3.2, 'slowstrings', .16);
  [57, 64, 69, 72, 76].forEach((m, i) => N(3.9 + i * .06, m, 3.4, 'harp', .26)); N(3.9, 45, 3.4, 'slowstrings', .2); N(3.9, 57, 3.4, 'slowstrings', .16);
  return F.scene(P, { duration: DUR, music: { notes }, sounds: [{ t: .8, dur: 1.2, kind: 'swish', v: .35 }, { t: 1.9, dur: 1.2, kind: 'swish', v: .3, pan: .3 }, { t: 3.0, dur: 1, kind: 'swish', v: .25, pan: -.3 }] });
});
</script></body></html>
