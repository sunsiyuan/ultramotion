<!doctype html>
<meta charset="utf-8">
<title>Pixel Dialog Box — a line typed out in an RPG text box</title>
<style>html,body{margin:0;background:#000}canvas{display:block;max-width:100vw;max-height:100vh}</style>
<canvas></canvas>
<script src="../lib/pixel/pixel.js"></script>
<script>
// EFFECT: Pixel Dialog Box (像素对话框打字). The RPG way to say something: a text box opens in three steps under the scene, the
// speaker's name sits on its edge, the words type out one character at a time with a blip each, an arrow blinks when the page is done,
// and a confirm turns the page. Here Dorothy on the yellow brick road, with her lines from L. Frank Baum's The Wonderful Wizard of Oz
// (1900, public domain), quoted as written.
// To use it: change WHO and PAGES (break lines by hand, about 25 characters a line), and the scene in drawScene().
// textbox(), typed(), figure() and the chip sounds come from lib/pixel (see its GUIDE.md).
const P = Pixel, GW = 180, GH = 320, DUR = 9.2;
const WHO = 'DOROTHY';
const PAGES = [
  { t0: 1.5, cps: 30, text: 'No matter how dreary and\ngray our homes are, we\npeople of flesh and blood\nwould rather live there...' },
  { t0: 6.0, cps: 18, text: 'There is no place like\nhome.' },
];
const SOURCE = 'THE WONDERFUL WIZARD OF OZ\nL. FRANK BAUM, 1900';
const BOX = { x: 7, y: 198, w: 166, h: 60 }, OPEN = 1.0;
const C = { ink: '#16122a', sky: '#7ec8f0', skyLow: '#d8f1ff', hill: '#4bb35a', hillDark: '#2e7a3c', road: '#f2c531', roadDark: '#b8891c',
            city: '#2fd08a', cityDark: '#17885a', cream: '#fff6dc', blue: '#4a78d8', skin: '#e8b48a', hair: '#5a3018', red: '#e0283a' };

const DOROTHY = { head: [20, 8], neck: [20, 12], hip: [20, 24], far: { sh: [16, 14], el: [14, 19], ha: [14, 24], kn: [18, 31], ft: [17, 38] },
                  near: { sh: [24, 14], el: [26, 19], ha: [27, 23], kn: [22, 31], ft: [23, 38] } };
const STEP2 = { ...DOROTHY, far: { ...DOROTHY.far, kn: [21, 31], ft: [24, 38] }, near: { ...DOROTHY.near, kn: [19, 31], ft: [15, 38] } };
const LOOK = { skin: C.skin, hair: [C.hair, C.hair, '#3a1e0e'], top: C.blue, bottom: C.blue, shoes: C.red };
let GIRL;

function drawScene(g, t) {
  P.gradient(g, 0, 0, GW, 140, [C.sky, C.skyLow]);
  // the Emerald City on the horizon, its towers stepping up
  for (const [x, w, h] of [[96, 8, 30], [104, 10, 46], [114, 8, 38], [122, 12, 58], [134, 8, 34], [142, 10, 42]]) {
    P.rect(g, x, 140 - h, w, h, C.city); P.rect(g, x + w - 2, 140 - h, 2, h, C.cityDark); P.rect(g, x + w / 2 - 1, 140 - h - 4, 2, 4, C.city); }
  P.shape(g, C.hillDark, c => { c.beginPath(); c.ellipse(30, 160, 90, 34, 0, 0, 7); c.fill(); });
  P.shape(g, C.hill, c => { c.beginPath(); c.rect(0, 140, GW, GH); c.fill(); });
  // the yellow brick road, narrowing toward the city
  P.shape(g, C.road, c => { c.beginPath(); c.moveTo(20, GH); c.lineTo(122, 142); c.lineTo(132, 142); c.lineTo(150, GH); c.fill(); });
  for (let k = 0; k < 14; k++) { const u = Math.pow(k / 14, 1.8), y = Math.round(142 + u * (GH - 142)), x0 = Math.round(122 - u * 102), x1 = Math.round(132 + u * 18);
    P.rect(g, x0, y, x1 - x0, 1, C.roadDark);
    const off = k % 2 ? 0 : Math.max(3, Math.round(u * 14)) / 2; for (let x = x0 + off; x < x1; x += Math.max(3, Math.round(u * 14))) P.rect(g, Math.round(x), y, 1, Math.max(1, Math.round(u * 8)), C.roadDark); }
  // clouds drifting, a step at a time
  P.shape(g, C.cream, c => { c.beginPath(); for (const [x, y, r] of [[30, 40, 9], [40, 37, 12], [52, 41, 8], [140, 70, 7], [150, 66, 10]]) { const dx = (P.step(t, 2) * 3) % 220; c.moveTo(x + r - dx, y); c.arc(x - dx, y, r, 0, 7); } c.fill(); });
  // Dorothy, small, walking up the road toward the city
  const x = Math.round(P.lerp(78, 100, P.seg(t, 0, DUR))), walk = P.anim(GIRL, t, 6);
  P.put(g, walk, x, 150 - Math.round(P.lerp(0, 18, P.seg(t, 0, DUR))));
  P.text(g, SOURCE, 8, 8, { font: '3x5', color: C.ink, lead: 3 });
}

window.__scene = P.scene(async () => {
  GIRL = [P.figure(DOROTHY, LOOK), P.figure(STEP2, LOOK)];
  const page = t => t >= PAGES[1].t0 - .2 ? 1 : 0;
  return {
    width: 1080, height: 1920, grid: [GW, GH], duration: DUR, fps: 15, palette: null, look: { scan: .08 },
    draw(g, t) {
      drawScene(g, t);
      if (t < OPEN) return;
      const h = [12, 32, BOX.h][Math.min(2, Math.floor((t - OPEN) * 15))];          // the box opens in three steps
      const k = page(t), p = PAGES[k], y = BOX.y + (BOX.h - h);
      P.textbox(g, { x: BOX.x, y, w: BOX.w, h, text: h < BOX.h ? '' : p.text, t, t0: p.t0, cps: p.cps, font: '5x7', color: C.cream, bg: C.ink, border: C.cream, arrow: true, pad: 7, lead: 3 });
      if (h === BOX.h) { P.rect(g, BOX.x + 6, BOX.y - 6, WHO.length * 6 + 7, 11, C.cream); P.text(g, WHO, BOX.x + 10, BOX.y - 4, { font: '5x7', color: C.ink }); }
    },
    sounds: [{ t: OPEN, kind: 'door', v: .5 }, { t: PAGES[1].t0 - .25, kind: 'confirm', v: .7 },
             ...PAGES.flatMap(p => P.typeSounds(p.text, p.t0, p.cps, { every: 2, v: .4 }))],
    music: { notes: [[0, 67], [.5, 72], [1, 76], [2, 74], [2.5, 72], [3, 71], [4, 72], [5.5, 67], [6, 72], [6.5, 76], [7.5, 79], [8, 77], [8.4, 76]]
      .map(([t, m]) => ({ t, m, d: .9, inst: 'musicbox', v: .3 })).concat([[0, 48], [2, 53], [4, 55], [6, 48], [8, 48]].map(([t, m]) => ({ t, m, d: 1.8, inst: 'harp', v: .25 }))) },
  };
});
</script>
