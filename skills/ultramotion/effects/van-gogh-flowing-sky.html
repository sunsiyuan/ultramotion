<!doctype html><html><head><meta charset="utf-8"><title>Van Gogh Flowing Sky (9:16, 8 s)</title>
<style>html,body{margin:0;background:#000}canvas{display:block;height:100vh;width:auto;margin:0 auto}</style></head><body>
<canvas></canvas>
<script src="../lib/painterly/brush.js"></script>
<script>
/* Van Gogh Flowing Sky — «The Starry Night» (1889, MoMA; public domain) painted from the original in oil strokes, and its sky set moving:
   strokes slide along their own direction, the great swirl and its small neighbour turn, the cypress licks upwards; the camera drifts
   from the cypress across the swirl to the moon.
   Engine: lib/painterly/brush.js (read lib/painterly/GUIDE.md). The original is ../templates/van-gogh/ref/starry-night.jpg.
   For another painting: change the image, VORT (where its swirls are, in the image's own pixels), inCypress (the part that sways)
   and the camera; keep `flow` on the parts whose brushwork has a clear direction. */
const F = Painterly, K = 4 / 3;                                          // the painting at 2560 × 2027, so a 9:16 frame fits inside its height
const W = 1920 * K, H = 1520 * K, CROP = .985, DUR = 8;
window.__scene = F.fromImage('../templates/van-gogh/ref/starry-night.jpg', img => {
  const R = F.reference(img, { width: W / CROP, height: H / CROP, smooth: 3.5, detail: .8 }), OX = W * (1 / CROP - 1) / 2, OY = H * (1 / CROP - 1) / 2;
  const VORT = [[930, 520, 330, 1], [1290, 720, 170, -1]].map(([x, y, r, d]) => [x * K, y * K, r * K, d]);   // the two big swirls
  const inCypress = (x, y) => x > 230 * K && x < 640 * K && y > 120 * K;
  function paint(x, y, t) {
    const sky = y < 960 * K ? 1 : Math.max(0, 1 - (y - 960 * K) / (120 * K)), cyp = inCypress(x, y) ? 1 : 0;
    let sx = x, sy = y;
    for (const [vx, vy, r, d] of VORT) {                                 // the swirls keep turning, faster near their centres
      const dx = x - vx, dy = y - vy, k = Math.exp(-(dx * dx + dy * dy) / (r * r)) * sky * (1 - cyp), an = d * .055 * Math.sin(t * .5) * k;
      sx += dx * Math.cos(an) - dy * Math.sin(an) - dx; sy += dx * Math.sin(an) + dy * Math.cos(an) - dy; }
    const tip = cyp ? Math.pow(1 - y / H, 1.5) * Math.sin(t * 1.1 + y * .008) * 10 : 0;            // the cypress sways most at its tip
    const p = R.at(sx + tip + OX, sy + OY), village = y > 1080 * K && !cyp;
    const m = (p.c[0] + p.c[1] + p.c[2]) / 3, c = p.c.map(v => v + (v - m) * .25);
    return { c, a: p.a, pop: village ? p.pop : 0, size: p.size, len: p.coherence > .3 ? 2.4 : 1.4,
             flow: cyp ? (p.coherence > .3 ? 4 : 0) : sky * (p.coherence > .25 ? 11 : 3) };
  }
  const smooth = (a, b, v) => { const u = F.cl((v - a) / (b - a)); return u * u * (3 - 2 * u); };
  const keep = { image: R.image, ox: OX, oy: OY, mask: (x, y) => smooth(1040 * K, 1130 * K, y) * (x < 650 * K ? smooth(560 * K, 650 * K, x) : 1) };
  const P = F.create({ width: W, height: H, view: [1080, 1920], paint, keep, background: '#14306f', underDark: .75,
    lines: R.lines.filter(l => keep.mask(l.x - OX, l.y - OY) < .3),
    strokes: { size: 1.7, density: 1, impasto: .85, temperature: .15 }, boil: { rate: 10, share: .08, amount: .25 },
    camera: t => { const u = F.ease(F.seg(t, 0, DUR)); return { x: 860 * K + u * 520 * K, y: H / 2 - 20 + u * 30, zoom: 1.02 }; } });
  // a D-minor nocturne, light: piano arpeggios and one held cello note, a celesta as the moon comes in
  const notes = [], N = (t, m, d, inst, v) => notes.push({ t, m, d, inst, v }), beat = 60 / 72;
  [[38, [50, 57, 62, 65]], [34, [50, 53, 58, 62]], [38, [50, 57, 62, 65]]].forEach(([b, ch], bar) => { const t0 = bar * beat * 4;
    [0, 1, 2, 3].forEach(k => N(t0 + k * beat, ch[[0, 2, 1, 3][k]] + 12, beat * 1.8, 'piano', .26 + .08 * (k === 0)));
    N(t0, b + 12, beat * 4, 'cello', .15); });
  [86, 81, 89].forEach((m, i) => N(5.6 + i * .24, m - 12, 2.2, 'celesta', .22));
  return F.scene(P, { duration: DUR, music: { notes } });
});
</script></body></html>
