<!doctype html>
<meta charset="utf-8">
<title>VHS Bad Signal — an old tape that won't track</title>
<style>html, body { margin: 0; background: #000; } canvas { display: block; max-width: 100vw; max-height: 100vh; margin: auto; }</style>
<canvas></canvas>
<script src="../lib/glitch/glitch.js"></script>
<script>
// EFFECT: VHS Bad Signal (录像带信号不良). The picture plays like a worn tape: colour bleeding sideways, a band of tracking
// noise crawling down the frame, and the signal stuck in a bad state that holds for a few frames and jumps to another —
// bands sliding, rows repeating, the colour channels apart — with a clean stretch now and then.
// The picture: the first Space Shuttle launch, Columbia, STS-1, 12 April 1981 (NASA photo S81-30498, public domain),
// with the camcorder's PLAY and date over it.
// To use it on your own picture: replace PIC and the date/time lines; the bad signal is the `unstable` span, the screen is `look`.
// The breaks come from lib/glitch (see its GUIDE.md); the tracking band is drawn here in tracking().
const G = Glitch, W = 1080, H = 1920, DUR = 7;
const PIC = 'media/vhs-bad-signal-sts-1.jpg', DATE = 'APR.12 1981', T0 = 7 * 3600 + 5;     // the clock starts at 7:00:05 AM, just after liftoff
const MONO = '"VCR OSD Mono", "Andale Mono", "Courier New", monospace';

const clock = t => { const s = Math.floor(T0 + t), h = Math.floor(s / 3600) % 12 || 12, m = Math.floor(s / 60) % 60, x = s % 60;
  return `${h}:${String(m).padStart(2, '0')}:${String(x).padStart(2, '0')} AM`; };
function osd(c, str, x, y, align = 'left') {               // camcorder on-screen text: white, blocky, a hard dark edge
  c.font = `400 58px ${MONO}`; c.textAlign = align; c.lineWidth = 6; c.strokeStyle = 'rgba(0,0,0,.6)'; c.strokeText(str, x, y); c.fillStyle = '#f2f2ea'; c.fillText(str, x, y);
}
// a band of tracking noise that crawls down the frame and wraps; deterministic from the frame number
function tracking(c, t) {
  const f = Math.floor(t * 30), y0 = ((t * 260) % (H + 400)) - 200, r = G.rng(f * 7 + 3);
  for (let y = y0; y < y0 + 90; y += 3) {
    if (r() < .35) continue;
    const x = r() * W, w = 40 + r() * 420, a = .25 + r() * .5;
    c.fillStyle = `rgba(235,235,235,${a})`; c.fillRect(x, y, w, 2 + r() * 3);
  }
  c.fillStyle = 'rgba(0,0,0,.18)'; c.fillRect(0, y0 + 30, W, 30);
}

window.__scene = G.scene(async () => {
  await G.fonts([`400 58px ${MONO}`]);
  const pic = await G.image(PIC);
  const glitches = [
    { t: 0, kind: 'unstable', d: DUR, amt: .75, hold: [4, 12], rest: .35, seed: 9,
      fx: { rgb: 10, tear: .5, bands: 24, repeat: .4, jitter: 18, crush: .2 } },
    { t: 2.3, kind: 'roll', d: .5, dir: 1, amt: .5 },          // the picture rolls once when the tape slips
    { t: 4.6, kind: 'tear', d: .2, amt: 1, seed: 21 },
  ];
  return {
    width: W, height: H, duration: DUR,
    draw: (c, t) => {
      // a slow push, the frame drifting so the shuttle rises in it
      G.cover(c, pic, { x: 0, y: 0, w: W, h: H, fx: .6, fy: .5 + t * .025, zoom: 1.08 + t * .02 });
      c.fillStyle = 'rgba(20,30,60,.08)'; c.fillRect(0, 0, W, H);           // the tape's cold cast
      tracking(c, t);
      osd(c, 'PLAY ▶', 80, 170); osd(c, 'SP', W - 80, 170, 'right');
      osd(c, DATE, 80, H - 300); osd(c, clock(t), 80, H - 225);
    },
    glitches,
    look: { scan: .14, scanPx: 4, ghost: .5, chroma: 3, bloom: .2, vignette: .3, grain: .08 },
    sounds: [{ kind: 'static', t: 0, dur: DUR, v: .06 }, { kind: 'rumble', t: 0, dur: DUR, v: .22 }, ...G.sounds(glitches, DUR)],
  };
});
</script>
