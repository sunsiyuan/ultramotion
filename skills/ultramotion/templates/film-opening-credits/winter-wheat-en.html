<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Winter Wheat — opening credits</title>
<style>html,body{margin:0;background:#000}canvas{display:block;width:100vw;height:100vh;object-fit:contain}</style></head>
<body><canvas></canvas>
<script src="../../lib/title-sequence/title.js"></script>
<script>
// Opening credits of a small independent film set on a North Dakota farm, late October.
// A new shot every card or two: the sky, the elevator, the gravel road, the stubble against the sun; the title on the widest, emptiest field; night and the first snow at the lit window.
// Small serif capitals with wide tracking, one name at a time, placed where the picture is quiet; cards on the piano's bars.
const T = Title, { seg, lerp, env, ease, bar, TAU } = T;
const S = T.create({ width: 1920, height: 1080 }), W = 1920, H = 1080;
const BPM = 72, B = bar(BPM);                                         // a bar is 3.33 s
const INK = '#f3ece0', DIM = 'rgba(243,236,224,.62)';
const SERIF = '"Baskerville", "Big Caslon", "Libre Baskerville", serif';
const cards = T.schedule([
  { role: 'presents', name: 'HOLLOW CREEK PICTURES', x: 960, y: 470, at: 1 },
  { name: 'DALE OKAFOR', x: 560, y: 400 },
  { name: 'INGRID SOLBERG', x: 960, y: 380 },
  { pre: 'and', name: 'WALT HENNING', x: 1380, y: 330 },
  { title: true, name: 'WINTER WHEAT', x: 960, y: 470, hold: 3.5, gap: .75, fadeIn: .4, fadeOut: 2.2 },
  { role: 'written and directed by', name: 'RUTH ANN MADSEN', x: 600, y: 520, gap: .5 },
], { bpm: BPM, hold: 1.4, gap: .6, fadeIn: 1.1, fadeOut: 1.1 });
const TT = cards.find(k => k.title), LAND = TT.t0 + 2.0;            // every letter of the title is in: the low note lands
const DUR = cards[cards.length - 1].t1 + 2.6;

// ---- the shots: a farm at dusk into night, drawn in code. One or two cards per shot. ----
const VIS = [138, 942];                                               // what the 2.39 letterbox leaves visible
function skyFill(c, hor, cols, glowX = 1300, glowA = .3) {
  const g = c.createLinearGradient(0, VIS[0] - 80, 0, hor); cols.forEach(([k, col]) => g.addColorStop(k, col));
  c.fillStyle = g; c.fillRect(-300, -100, W + 600, hor + 102);
  if (glowA) { T.glow(c, glowX, hor + 30, 950, '#ff9a4d', glowA); T.glow(c, glowX, hor + 8, 260, '#ffd7a0', glowA * .8); }
}
const DUSK = [[0, '#121927'], [.55, '#30364a'], [.85, '#8a5a45'], [1, '#d08a4f']];
function ground(c, hor, col = '#120f12', bumps = 5, seed = 1) {
  c.fillStyle = col; c.beginPath(); c.moveTo(-300, hor);
  for (let x = -300; x <= W + 300; x += 30) c.lineTo(x, hor - bumps * (T.noise(x * .004, seed) + 1));
  c.lineTo(W + 300, H + 100); c.lineTo(-300, H + 100); c.fill();
}
function stalks(c, t, { n, y0, y1, h0, h1, x0 = -300, x1 = W + 300, seed, rimX = 1300, rim = 1, blur = 0, wmul = 1 }) {
  const r = T.rand(seed); c.save(); c.lineCap = 'round'; if (blur) c.filter = `blur(${blur}px)`;
  for (let i = 0; i < n; i++) {
    const x = x0 + r() * (x1 - x0), d = r(), y = lerp(y0, y1, d * d), h = lerp(h0, h1, d * d), gust = T.noise(t * .35 - x * .0016, 2) * .5 + .5;
    const lean = (gust * .9 + .25 * Math.sin(t * 1.1 - x * .0015)) * h * .35, k = rim * Math.max(0, 1 - d * 1.6) * Math.max(0, 1 - Math.abs(x - rimX) / 1600);
    c.strokeStyle = `rgb(${Math.round(lerp(13, 125, k))},${Math.round(lerp(10, 72, k))},${Math.round(lerp(10, 42, k))})`;
    c.lineWidth = (.8 + d * 2.2) * wmul; c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x + lean * .3, y - h * .6, x + lean, y - h); c.stroke();
  }
  c.restore();
}
function cloudBands(c, t, hor) {                                      // thin clouds lit from below by the set sun
  const r = T.rand(4);
  for (let i = 0; i < 7; i++) {
    const y = lerp(260, hor - 120, r()), x = r() * W + t * (3 + 4 * r()), w = 300 + r() * 700, h = 6 + r() * 14, k = (y - 200) / (hor - 200);
    const g = c.createLinearGradient(0, y - h, 0, y + h); g.addColorStop(0, 'rgba(40,40,58,0)'); g.addColorStop(.5, `rgba(${Math.round(lerp(70, 210, k))},${Math.round(lerp(64, 120, k))},${Math.round(lerp(80, 80, k))},${.25 + .3 * k})`); g.addColorStop(1, 'rgba(40,40,58,0)');
    c.save(); c.filter = 'blur(6px)'; c.fillStyle = g; c.beginPath(); c.ellipse(((x % (W + 800)) + W + 800) % (W + 800) - 400, y, w / 2, h, 0, 0, T.TAU); c.fill(); c.restore();
  }
}
function elevator(c, x, base, s, col) {                               // a grain elevator: head house with cupola, round bins, a spout
  c.save(); c.translate(x, base); c.scale(s, s); c.fillStyle = c.strokeStyle = col;
  c.fillRect(0, -164, 46, 164); c.beginPath(); c.moveTo(-6, -164); c.lineTo(23, -182); c.lineTo(52, -164); c.fill(); c.fillRect(12, -192, 22, 14);
  [[46, 30, 104], [78, 30, 104], [110, 30, 104], [-42, 34, 84]].forEach(([bx, w, h]) => { c.fillRect(bx, -h, w, h); c.beginPath(); c.ellipse(bx + w / 2, -h, w / 2, 6, 0, Math.PI, T.TAU); c.fill(); });
  c.lineWidth = 3; c.beginPath(); c.moveTo(38, -146); c.lineTo(168, -36); c.stroke(); c.fillRect(164, -36, 16, 36); c.restore();
}
function house(c, x, base, s, lit = 1) {
  c.save(); c.translate(x, base); c.scale(s, s); c.fillStyle = '#120f13';
  c.fillRect(0, -40, 74, 40); c.beginPath(); c.moveTo(-8, -40); c.lineTo(37, -66); c.lineTo(82, -40); c.fill();
  c.fillStyle = '#ffc274'; c.globalAlpha = lit; c.fillRect(20, -30, 8, 9); c.restore();
  T.glow(c, x + 24 * s, base - 26 * s, 26 * s, '#ffb35c', .5 * lit);
}

const shots = T.reel([
  { cards: [0], cam: { from: { y: 30 }, to: { y: -20, z: 1.03 } },                    // the sky, nothing else
    draw: (c, t) => { const hor = 900; skyFill(c, hor, DUSK, 1100, .25); cloudBands(c, t, hor); ground(c, hor, '#100d10', 3, 6); } },
  { cards: [1], cam: { from: { z: 1, cx: 1400, cy: 700 }, to: { z: 1.07, cx: 1400, cy: 700 } },   // the elevator, close
    draw: (c, t) => { const hor = 840; skyFill(c, hor, DUSK, 900, .32); ground(c, hor, '#120f12', 3, 2); elevator(c, 1250, hor + 4, 2.7, '#141116');
      T.glow(c, 1250 + 23 * 2.7, hor - 192 * 2.7, 30, '#ff3b2a', .35 + .25 * Math.sin(t * 1.3)); } },
  { cards: [2], cam: { from: { z: 1, cx: 960, cy: 690 }, to: { z: 1.09, cx: 960, cy: 690 } },     // the gravel road and the poles going away
    draw: (c, t) => {
      const hor = 690, vx = 960; skyFill(c, hor, [[0, '#151b2a'], [.6, '#3a3c50'], [.9, '#8f6048'], [1, '#c98650']], 820, .22); ground(c, hor, '#130f11', 2, 8);
      const road = c.createLinearGradient(0, hor, 0, H); road.addColorStop(0, '#3d322f'); road.addColorStop(1, '#100d0c');
      c.fillStyle = road; c.beginPath(); c.moveTo(vx - 4, hor); c.lineTo(vx + 4, hor); c.lineTo(vx + 760, H); c.lineTo(vx - 760, H); c.fill();
      c.fillStyle = 'rgba(0,0,0,.35)'; [-.45, .45].forEach(k => { c.beginPath(); c.moveTo(vx + k * 2, hor); c.lineTo(vx + k * 760 + 50, H); c.lineTo(vx + k * 760 - 50, H); c.fill(); });   // wheel ruts
      stalks(c, t, { n: 500, y0: hor + 10, y1: H + 40, h0: 4, h1: 50, seed: 3, rimX: 820, rim: .6, x1: vx - 200 });
      stalks(c, t, { n: 500, y0: hor + 10, y1: H + 40, h0: 4, h1: 50, seed: 5, rimX: 820, rim: .6, x0: vx + 200 });
      c.strokeStyle = '#100c0f'; const P = [0, 1, 2, 3, 4, 5, 6].map(i => { const z = 1 / (1 + i * .9), x = vx + 1100 * z, h = 520 * z; return [x, hor + (H - hor) * z * .55, h, z]; });
      P.forEach(([x, y, h, z]) => { c.lineWidth = 5 * z + .6; c.beginPath(); c.moveTo(x, y); c.lineTo(x, y - h); c.stroke(); c.beginPath(); c.moveTo(x - h * .14, y - h * .92); c.lineTo(x + h * .14, y - h * .92); c.stroke(); });
      c.lineWidth = 1.2; for (let i = 0; i < P.length - 1; i++) { const [x1, y1, h1] = P[i], [x2, y2, h2] = P[i + 1]; [-1, 1].forEach(sd => { c.beginPath(); c.moveTo(x1 + sd * h1 * .12, y1 - h1 * .92); c.quadraticCurveTo((x1 + x2) / 2 + sd * (h1 + h2) * .06, (y1 - h1 * .92 + y2 - h2 * .92) / 2 + 18, x2 + sd * h2 * .12, y2 - h2 * .92); c.stroke(); }); }
    } },
  { cards: [3], cam: { from: { x: 40, z: 1.04 }, to: { x: -50, z: 1.04 } },          // the stubble, from down low, against the sun
    draw: (c, t) => { const hor = 640; skyFill(c, hor, [[0, '#1b2030'], [.5, '#4a4050'], [.85, '#b06e48'], [1, '#e7a060']], 760, .45); ground(c, hor, '#17110f', 2, 3);
      stalks(c, t, { n: 700, y0: hor + 6, y1: hor + 160, h0: 10, h1: 60, seed: 7, rimX: 760, rim: 1 });
      stalks(c, t, { n: 160, y0: 880, y1: 1010, h0: 230, h1: 400, seed: 17, rimX: 760, rim: .5, wmul: 1.6 });       // the near stubble standing against the sky
      T.motes(c, t, { n: 70, seed: 8, box: [300, 300, 1100, 380], size: [1, 2.4], color: '#ffd9a8', a: .6, fall: -3, wind: 9, sway: 20 });
      stalks(c, t, { n: 120, y0: H - 60, y1: H + 120, h0: 220, h1: 420, seed: 9, rimX: 760, rim: .25, blur: 7, wmul: 3.2 }); } },
  { cards: [4], in: 'black', dur: 1.6, cam: { from: { z: 1 }, to: { z: 1.025 } },     // the title: the widest, emptiest one
    draw: (c, t) => { const hor = 770; skyFill(c, hor, [[0, '#0d1220'], [.6, '#272c40'], [.9, '#6d4a40'], [1, '#a8704a']], 1250, .18); ground(c, hor, '#0f0c0f', 3, 5); house(c, 1560, hor - 1, .8); } },
  { cards: [5], dur: 1.6, cam: { from: { z: 1, cx: 1300, cy: 520 }, to: { z: 1.05, cx: 1300, cy: 520 } },   // night: the lit window, the first snow
    draw: (c, t) => {
      c.fillStyle = '#0d0b0d'; c.fillRect(-100, -100, W + 200, H + 200);
      c.fillStyle = 'rgba(255,255,255,.025)'; for (let y = 0; y < H; y += 34) c.fillRect(0, y, W, 2);           // clapboard
      const x0 = 1150, y0 = 330, w = 300, h = 380; T.glow(c, x0 + w / 2, y0 + h / 2, 520, '#ff9c4a', .16);
      const g = c.createLinearGradient(x0, y0, x0 + w, y0 + h); g.addColorStop(0, '#f1b56d'); g.addColorStop(1, '#a8622f'); c.fillStyle = g; c.fillRect(x0, y0, w, h);
      c.fillStyle = '#2a1a12'; c.fillRect(x0 + w / 2 - 6, y0, 12, h); c.fillRect(x0, y0 + h / 2 - 6, w, 12);
      c.save(); c.filter = 'blur(10px)'; c.fillStyle = 'rgba(60,30,18,.75)'; c.beginPath(); c.moveTo(x0 + w - 90, y0); c.quadraticCurveTo(x0 + w - 40, y0 + h / 2, x0 + w - 70, y0 + h); c.lineTo(x0 + w, y0 + h); c.lineTo(x0 + w, y0); c.fill(); c.restore();
      c.strokeStyle = '#0d0b0d'; c.lineWidth = 18; c.strokeRect(x0 - 9, y0 - 9, w + 18, h + 18);
      T.motes(c, t, { n: 160, seed: 12, size: [1.5, 3.4], color: '#e9eef5', a: .55 * T.seg(t, shots.shots[5].t0, shots.shots[5].t0 + 3), fall: 38, wind: 10, sway: 26, depth: .35, twinkle: .1 });
    } },
], { cards, duration: DUR, dur: 1.3, weave: 1.1 });

function card(c, k, t) {
  const a = k.a(t); if (a <= 0) return;
  if (k.title) {
    const u = seg(t, k.t0, LAND), open = ease.linger(seg(t, k.t0, k.t1));
    T.text(c, k.name, k.x, k.y, { font: SERIF, size: 56, tracking: lerp(.62, .5, open), align: 'center', color: INK, a,
      reveal: { u, mode: 'random', spread: .85, seed: 3, blur: 3 }, glow: { color: 'rgba(255,200,150,.3)', blur: 24 } });
    return;
  }
  const rows = [];
  if (k.pre) rows.push({ text: k.pre, size: 20, italic: true, color: DIM, tracking: .08 });
  rows.push({ text: k.name, size: 25, tracking: .3, color: INK, gap: 10 });
  if (k.role && k.role === 'presents') rows.push({ text: k.role, size: 20, italic: true, color: DIM, tracking: .08, gap: 12 });
  else if (k.role) rows.unshift({ text: k.role, size: 20, italic: true, color: DIM, tracking: .08 });
  T.block(c, rows, k.x, k.y, { font: SERIF, align: 'center', valign: 'middle', a });
}

function draw(c, t) {
  shots.draw(c, t);
  T.leak(c, t, { side: 'right', a: .16, speed: .06, seed: 5, colors: ['#ff5a1f', '#ffae4a', '#ff7a33'] });
  cards.forEach(k => card(c, k, t));
  const black = Math.max(seg(t, DUR - 2.3, DUR - .3), 1 - seg(t, 0, 2.2)); if (black) { c.fillStyle = `rgba(0,0,0,${black})`; c.fillRect(0, 0, W, H); }
  T.dust(c, t, { amount: .5, seed: 2 });
  T.finish(c, t, { grade: { lift: [.035, .03, .04], gamma: 1.05, contrast: .94, saturation: .85, shadows: '#2c4a5a', highlights: '#ffc489', split: .45 },
    grain: .05, grainSize: 1.8, vignette: .5, halation: .5, bloom: .2, aberration: .25 });
  T.letterbox(c, 2.39);
}

// ---- score: piano, 72 bpm, E minor. One repeated note on the beat, the chord moving under it; a cello joins;
// one beat of silence before the title, then a low E and strings as its last letter lands ----
const notes = [], N = (t, m, d, inst, v) => notes.push({ t, m, d, inst, v }), beat = B / 4;
const prog = [[40, 55, 59, 62], [36, 55, 59, 64], [43, 55, 59, 62], [42, 54, 57, 62]];      // Em · C · G · D/F#
const high = [71, 71, 71, 69];
const stop = TT.t0 - beat, resume = LAND + B;
for (let b = 0; b * B < DUR - 2; b++) {
  const t0 = b * B + .6, ch = prog[b % 4];
  if (t0 + B > stop && t0 < resume) continue;
  const soft = t0 > resume ? .75 : 1;
  N(t0, ch[0], B * 1.1, 'piano', .42 * soft); ch.slice(1).forEach((m, j) => N(t0 + .02 * j, m, B * .9, 'piano', .22 * soft));
  for (let q = 0; q < 4; q++) N(t0 + q * beat, high[b % 4] - (q === 3 && b % 2 ? 2 : 0), beat * 1.2, 'piano', (q ? .24 : .3) * soft);
  if (b >= 6 && t0 < stop) N(t0, ch[0] + 12, B, 'cello', .32);
}
N(LAND - .05, 40, 9, 'bass', .28); N(LAND, 40, 8, 'piano', .5); T.chord(LAND + .03, [52, 59, 62, 66, 71], { d: 7, v: .32, roll: .08 }).forEach(n => notes.push(n));
[40, 52, 59, 62, 66].forEach(m => N(LAND - .4, m, resume - LAND + 2 * B, 'slowstrings', .42));
const dynamics = { slowstrings: [[LAND - .4, .2], [LAND + 1.2, .7], [resume + B, .45], [resume + 2 * B, 0]] };

window.__scene = T.scene(S, draw, { duration: DUR, background: '#000', music: { notes, dynamics },
  timeline: cards.map(k => ({ t0: k.t0, t1: k.t1, kind: k.title ? 'title' : 'card', text: k.name })) });
</script>
</body></html>
