<!doctype html>
<meta charset="utf-8">
<title>Harbor Lights — Long Way Over (lyric card)</title>
<style>html, body { margin: 0; background: #000; } canvas { display: block; max-width: 100vw; max-height: 100vh; margin: auto; }</style>
<canvas></canvas>
<script src="../../lib/glitch/glitch.js"></script>
<script>
// A vertical lyric card for a band's single, made like a DIY camcorder video: home-movie Kodachrome of San Francisco, 1941
// (the harbor, then the drive across the Bay Bridge; media/bay-1941.mp4, Prelinger Archives, public domain), played back
// from a worn VHS tape. The 640×480 film is cropped to the vertical frame at tape resolution, and the crop follows the action.
// The tape is drawn on the canvas: soft picture, colour bleeding to the right, lines wobbling, a tracking band rolling up,
// head-switching noise along the bottom, the VCR's PLAY and the camcorder's date stamp. The breaks are the tape:
// the picture rolls in on the first beat, rolls across the edit between the shots, drops out on "gone",
// rolls into the band and song, pauses, and the deck is stopped to a blue screen.
const G = Glitch, W = 1080, H = 1920;
const BPM = 80, BEAT = 60 / BPM, T0 = .75, B = n => T0 + n * BEAT;      // the song's beats: every break sits on one
const CPS = 14;                                                          // the title generator types 14 characters a second
const CUT = B(8), GONE = B(12), CARD = B(16), PAUSE = B(19), STOP = B(20), DUR = STOP + 1;
// the lyric, typed onto the tape: [when it starts typing, row, text]; "GONE" lands on the beat at GONE
const LINES = [[B(1), 0, 'WE DROVE ALL NIGHT'], [B(4), 1, 'TO SEE THE BAY'],
               [B(9), 0, 'AND THE BAY'], [GONE - 4 / CPS, 1, 'WAS GONE BY DAY']];
const BAND = 'HARBOR LIGHTS', SONG = 'LONG WAY OVER', NOTE = 'NEW SINGLE';
const STAMP = ['AUG 17 1994', 5 * 3600 + 52 * 60 + 14];                // the camcorder's date stamp and the clock it starts at (5:52:14 AM)
const MONO = 'Menlo, "Andale Mono", "Courier New", monospace';
const LX = 96, ROWS = [1250, 1360], FS = 74;                             // lyric: left column, two rows, clear of the bottom fifth and the right edge

// footage time and crop for each moment: the harbor plays from 0, the bridge from 5.6 (the shot changes at 5.5)
const clipT = t => t < CUT ? (t - T0) * .9 : 5.6 + (t - CUT) * 1.15;
// fx (0 = left edge … 1 = right edge of the 640×480 film) at footage times: on the net rising up the mast, then the tower and the car ahead
const CROP = [[0, .42], [2.5, .62], [5.4, .7], [5.6, 0], [11, .02], [12, .04], [13, .01], [14, .1], [15, .18], [16.4, .1]];
const cropAt = ft => { for (let i = 1; i < CROP.length; i++) { const [a, fa] = CROP[i - 1], [b, fb] = CROP[i];
  if (ft < b) return b - a < .5 ? fb : G.lerp(fa, fb, G.sm(G.seg(ft, a, b))); } return CROP[CROP.length - 1][1]; };

window.__scene = G.scene(async () => {
  await G.fonts([`700 ${FS}px ${MONO}`]);
  const clip = await G.footage('media/bay-1941.mp4');
  const mk = (w, h) => { const cv = document.createElement('canvas'); cv.width = w; cv.height = h; return [cv, cv.getContext('2d')]; };
  const [lo, lc] = mk(270, 480), [ch, cc] = mk(60, 480), [pic, pc] = mk(W, H), [snow, sc] = mk(512, 256);
  { const id = sc.createImageData(512, 256), r = G.rng(5);                // a tile of static, shown at a new offset every frame
    for (let i = 0; i < id.data.length; i += 4) { const v = r() ** 1.6 * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
    sc.putImageData(id, 0, 0); }
  const h = (...a) => G.hash(...a);

  const glitches = [
    { t: B(0), kind: 'roll', d: .5, seed: 3 },                                      // the picture rolls in on the first beat
    ...LINES.map(([t0, row], i) => ({ t: t0, kind: 'tear', amt: .45, seed: 20 + i, sound: false,
                                      area: { x: 0, y: ROWS[row] - 90, w: W, h: 130 } })),   // a tracking flicker across each new line
    { t: B(6) + BEAT / 2, kind: 'shift', amt: .5, seed: 8 },
    { t: CUT, kind: 'roll', d: .45, seed: 4 },                                      // the camcorder's edit between harbor and bridge
    { t: CUT, kind: 'tear', d: .2, seed: 5, sound: false },
    { t: GONE, kind: 'drop', d: 7 / 30, seed: 6 },                                  // the tape drops out on "gone"
    { t: B(14) + BEAT / 2, kind: 'shift', amt: .5, seed: 9 },
    { t: CARD, kind: 'roll', d: .4, dir: -1, seed: 10 },                            // rolls down into the band and the song
    { t: CARD, kind: 'tear', d: .17, seed: 11, sound: false },
    { t: STOP, kind: 'drop', d: 5 / 30, seed: 12 },                                 // stopped: a burst of snow, then the deck's blue screen
  ];
  const sounds = [...G.sounds(glitches, DUR),
    ...LINES.map(([t0]) => ({ kind: 'static', t: t0, dur: .1, v: .22 })),
    { kind: 'cut', t: CUT, dur: .12 },
    { kind: 'clack', t: PAUSE, v: .5 }, { kind: 'clack', t: STOP, v: .6 },
    { kind: 'cut', t: STOP, dur: DUR - STOP },
    ...typing()];

  // the clean tape at t: picture, colour bleed, typed titles
  function osd(c, s, x, y, size, color = '#f2f2ee') {                   // VCR / title-generator lettering: blocky mono, hard black shadow
    c.font = `700 ${size}px ${MONO}`; c.letterSpacing = `${Math.round(size * .08)}px`;
    c.fillStyle = 'rgba(0,0,0,.8)'; c.fillText(s, x + size * .07, y + size * .07);
    c.fillStyle = color; c.fillText(s, x, y); c.letterSpacing = '0px';
  }
  const typedLine = (s, t, t0) => { const out = G.typed(s, t, t0, CPS);           // with a block cursor while it types
    return out.length < s.length && t >= t0 ? out + (G.fr(t) % 8 < 5 ? '█' : '') : out; };
  const clock = t => { const s = STAMP[1] + Math.floor(t), hh = Math.floor(s / 3600) % 12 || 12, mm = Math.floor(s / 60) % 60, ss = s % 60;
    return `${hh}:${String(mm).padStart(2, '0')}:${String(ss).padStart(2, '0')} AM`; };

  async function tape(t) {
    const ft = Math.min(clipT(Math.min(t, PAUSE)), clip.duration - .05);
    lc.filter = 'saturate(1.3) contrast(.88) brightness(1.12)';
    await clip.draw(lc, ft, { x: 0, y: 0, w: 270, h: 480, fx: cropAt(ft), fy: .5, zoom: 1.04 });
    lc.filter = 'none';
    lc.globalCompositeOperation = 'soft-light'; lc.fillStyle = 'rgba(255,170,90,.4)'; lc.fillRect(0, 0, 270, 480);   // warm, faded
    lc.globalCompositeOperation = 'lighten'; lc.fillStyle = '#1c1420'; lc.fillRect(0, 0, 270, 480);                // blacks lifted, never quite black
    lc.globalCompositeOperation = 'source-over';
    cc.drawImage(lo, 0, 0, 60, 480);                                     // the colour, at a quarter of the width
    pc.imageSmoothingQuality = 'high';
    pc.drawImage(lo, 0, 0, W, H);
    pc.globalCompositeOperation = 'color'; pc.globalAlpha = .9; pc.drawImage(ch, 14, 0, W, H);   // bleeding to the right
    pc.globalCompositeOperation = 'source-over'; pc.globalAlpha = 1;
    const g = pc.createLinearGradient(0, H * .55, 0, H * .78);            // a little shade under the lyric
    g.addColorStop(0, 'rgba(10,0,20,0)'); g.addColorStop(1, 'rgba(10,0,20,.35)'); pc.fillStyle = g; pc.fillRect(0, H * .55, W, H * .45);
    pc.textBaseline = 'alphabetic';
    if (t < CARD) {
      for (const [t0, row, s] of LINES) {
        const shown = (t0 < CUT) === (t < CUT);                             // first two lines on the harbor, the last two on the bridge
        if (shown && t >= t0) osd(pc, typedLine(s, t, t0), LX, ROWS[row], FS);
      }
    } else {
      pc.fillStyle = 'rgba(8,0,16,.45)'; pc.fillRect(0, 0, W, H);
      osd(pc, typedLine(BAND, t, CARD + BEAT * .5), LX, 900, 92);
      osd(pc, typedLine(SONG, t, B(17) + BEAT * .5), LX, 1010, 64, '#ffc24a');
      if (t >= B(18)) osd(pc, NOTE, LX, 1110, 40);
    }
  }

  return {
    width: W, height: H, duration: DUR,
    draw: async (c, t) => {
      const f = G.fr(t), f2 = Math.floor(f / 2);
      if (t < B(0) || t >= STOP + .12) {                                  // the deck's blue screen, before PLAY and after STOP
        c.fillStyle = '#1730c8'; c.fillRect(0, 0, W, H);
        osd(c, t < B(0) ? 'PLAY ▶' : 'STOP ■', LX, 260, 64);
        if (t < B(0)) osd(c, '0:00:00', LX, 340, 44);
        return;
      }
      await tape(t);
      // play it back: each 4-px line wobbles a little; a tracking band rolls up the frame every few seconds
      const paused = t >= PAUSE, bandY = H + 200 - ((t * 520) % (H + 900)), bandH = 150;
      const vy = paused ? Math.round((h(f, 71) - .5) * 8) : 0;              // a paused deck shakes the frame up and down
      for (let y = 0; y < H; y += 4) {
        const inBand = Math.abs(y - bandY) < bandH / 2, k = inBand ? 1 - Math.abs(y - bandY) / (bandH / 2) : 0;
        let dx = (h(f2, y >> 5, 1) - .5) * 3 + Math.sin(y * .011 + t * 3) * 1.2 + k * k * (h(f, y >> 3, 2) - .3) * 36;
        const hs = y - (H - 44); if (hs > 0) dx += (hs / 44) ** 2 * 46 + (h(f, y, 3) - .5) * 10;   // head switching at the very bottom
        c.drawImage(pic, 0, y - vy, W, 4, dx, y, W, 4);
      }
      // noise riding the tracking band, the head-switching strip, and a few dropout specks
      c.globalCompositeOperation = 'screen';
      const streaks = (y0, y1, n, a, seed) => { for (let i = 0; i < n; i++) { const r = j => h(f, i, seed, j);
        const y = y0 + r(1) * (y1 - y0), x = r(2) * W - 100, w = 40 + r(3) * 360, hh = 2 + Math.floor(r(4) * 3);
        c.globalAlpha = a * (.4 + .6 * r(5)); c.drawImage(snow, r(6) * 400, r(7) * 240, 100, 4, x, y, w, hh); } };
      streaks(bandY - bandH * .3, bandY + bandH * .3, 26, .9, 4);
      c.globalAlpha = .55; c.drawImage(snow, h(f, 8) * 300, h(f, 9) * 200, 200, 14, 0, H - 30, W, 30);
      streaks(0, H, 3, .8, 5);
      if (paused) { const py = 1460 + (h(f2, 72) - .5) * 30;                  // the pause bar
        c.globalAlpha = .8; c.drawImage(snow, h(f, 73) * 300, h(f, 74) * 200, 180, 20, -20, py, W + 40, 70); }
      c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
      // the deck's on-screen display and the camcorder's date stamp, top left
      osd(c, paused ? 'PAUSE ❚❚' : 'PLAY ▶', LX, 260, 64);
      osd(c, clock(t), LX, 340, 40, '#ffc24a');
      osd(c, STAMP[0], LX, 396, 40, '#ffc24a');
    },
    glitches,
    look: { scan: .1, scanPx: 4, ghost: .55, bloom: .18, chroma: 2, vignette: .12, grain: .05 },
    sounds,
    music: { notes: song() },
  };
});

// a soft tick for each character the title generator types
function typing() {
  const out = [];
  for (const [t0, , s] of LINES) [...s].forEach((ch, i) => ch !== ' ' && out.push({ kind: 'tick', t: t0 + i / CPS, v: .07 }));
  [[BAND, CARD + BEAT * .5], [SONG, B(17) + BEAT * .5]].forEach(([s, t0]) => [...s].forEach((ch, i) => ch !== ' ' && out.push({ kind: 'tick', t: t0 + i / CPS, v: .07 })));
  return out;
}

// the song underneath: bedroom pop at 80 bpm in D — a drum machine, electric piano in sevenths, bass, a clean guitar line;
// the drums stop when the deck is paused and the last chord rings until it is stopped
function song() {
  const n = [], bar = BEAT * 4;
  const CH = [[55, 59, 62, 66], [54, 57, 61, 64], [52, 55, 59, 62], [57, 61, 64, 67], [55, 59, 62, 66]], ROOT = [43, 42, 40, 45, 43];
  for (let b = 0; b < 5; b++) {
    const t = T0 + b * bar, last = b === 4;
    CH[b].forEach((m, i) => n.push({ t: t + i * .025, m, d: last ? STOP - t : bar * .92, inst: 'keys', v: .42 }));
    n.push({ t, m: ROOT[b], d: last ? STOP - t : BEAT * 1.6, inst: 'bass', v: .6 });
    if (!last) n.push({ t: t + BEAT * 2.5, m: ROOT[b] + 12, d: BEAT * .4, inst: 'bass', v: .4 }, { t: t + BEAT * 3, m: ROOT[b] + 7, d: BEAT * .9, inst: 'bass', v: .45 });
    for (let k = 0; k < 8; k++) {
      const s = t + k * BEAT / 2; if (s >= PAUSE) break;
      n.push({ t: s, m: 42, d: .1, inst: 'hat', v: k % 2 ? .18 : .26 });
      if (k === 0 || k === 5) n.push({ t: s, m: 36, d: .2, inst: 'kick', v: .55 });
      if (b > 0 && (k === 2 || k === 6)) n.push({ t: s, m: 38, d: .2, inst: 'snare', v: .38 });
    }
  }
  const MEL = [[4, 69, 1.2], [5.5, 66, .5], [6, 64, 1], [7, 66, 1], [8, 67, 1.4], [9.5, 66, .5], [10, 64, 1], [11, 62, 1],
               [12.5, 64, 1], [13.5, 66, .5], [14, 69, 1.5], [16, 71, 1.4], [17.5, 69, .5], [18, 66, 2]];
  MEL.forEach(([bt, m, d]) => n.push({ t: B(bt), m, d: d * BEAT, inst: 'guitar', v: .4 }));
  return n;
}
</script>
