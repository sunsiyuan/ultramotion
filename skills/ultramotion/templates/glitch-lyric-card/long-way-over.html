<!doctype html>
<meta charset="utf-8">
<title>Marlowe Street — The Long Way Over (lyric card)</title>
<style>html, body { margin: 0; background: #000; } canvas { display: block; max-width: 100vw; max-height: 100vh; margin: auto; }</style>
<canvas></canvas>
<script src="../../lib/glitch/glitch.js"></script>
<script>
// A lyric card for a band's new single, cut from the band's own footage: home-movie Kodachrome of San Francisco, 1941
// (the harbor, then the drive across the Bay Bridge; media/bay-1941.mp4, Prelinger Archives, public domain).
// Played on an old set: it switches on, the cut between the two shots is moshed, the picture stops on "home",
// and the set is switched off at the end.
const G = Glitch, W = 1080, H = 1350, DUR = 15;
const SERIF = 'Baskerville, "Big Caslon", Georgia, serif', SANS = 'Futura, "Avenir Next", sans-serif';
const CUT = 5.5, FREEZE = 10.15, CARD = 11.4, OFF = 14.0;
const LINES = [[1.0, 3.0, 'I kept the radio low'], [3.0, CUT, 'so you could sleep through the harbor'],
               [6.6, 8.6, 'every light on the bridge'], [8.6, CARD, 'was somebody else going home']];

window.__scene = G.scene(async () => {
  await G.fonts([`italic 400 60px ${SERIF}`, `500 64px ${SANS}`]);
  const clip = await G.footage('media/bay-1941.mp4');
  const glitches = [
    { t: 0, kind: 'on', d: .5 },
    { t: CUT, kind: 'mosh', d: 1.1, seed: 4 },                          // the cut between harbor and bridge
    { t: FREEZE, kind: 'freeze', d: .6, seed: 7 },                      // the picture stops on "home"
    { t: CARD, kind: 'tear', seed: 12 },
    { t: OFF, kind: 'off', d: .65 },
  ];
  return {
    width: W, height: H, duration: DUR,
    draw: async (c, t) => {
      await clip.draw(c, Math.min(t, clip.duration - .05), { x: 0, y: 0, w: W, h: H, fx: .5 });
      const g = c.createLinearGradient(0, H * .62, 0, H); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.55)');
      c.fillStyle = g; c.fillRect(0, 0, W, H);
      c.textAlign = 'left'; c.shadowColor = 'rgba(0,0,0,.55)'; c.shadowBlur = 18;
      if (t < CARD) {
        for (const [t0, t1, s] of LINES) if (t >= t0 && t < t1) { c.globalAlpha = G.seg(t, t0, t0 + .18) * (1 - G.seg(t, t1 - .12, t1)); c.fillStyle = '#f4efe6'; c.font = `italic 400 60px ${SERIF}`; c.fillText(s, 90, 1150); }
      } else {
        c.fillStyle = 'rgba(10,8,6,.45)'; c.fillRect(0, 0, W, H);
        c.fillStyle = '#f4efe6'; c.font = `500 64px ${SANS}`; c.letterSpacing = '14px'; c.fillText('MARLOWE STREET', 90, 1040); c.letterSpacing = '0px';
        c.font = `italic 400 58px ${SERIF}`; c.fillText('The Long Way Over', 90, 1120);
        c.globalAlpha = G.seg(t, CARD + .6, CARD + .8); c.font = `400 34px ${SANS}`; c.fillStyle = 'rgba(244,239,230,.75)'; c.fillText('new single — out Friday', 90, 1190);
      }
      c.globalAlpha = 1; c.shadowBlur = 0;
    },
    glitches,
    look: { scan: .14, scanPx: 4, curve: .12, vignette: .35, ghost: .35, bloom: .2, chroma: 1.2 },
    sounds: G.sounds(glitches, DUR),
    music: { notes: song() },
  };
});

// the song underneath, kept small: electric piano and upright bass in D, 76 bpm; it skips on the freeze and dies with the set
function song() {
  const beat = 60 / 76, bar = beat * 4, n = [];
  const CH = [[62, 66, 69], [59, 62, 66], [55, 59, 62], [57, 61, 64]], ROOT = [38, 35, 43, 45];
  const MEL = [[0, 74], [1.5, 73], [2, 71], [3, 69], [4, 71], [6, 69], [6.5, 66], [8, 67], [9.5, 69], [10, 71], [12, 69], [13.5, 66], [14, 64]];
  for (let b = 0; b * bar < OFF; b++) {
    const t = .5 + b * bar, k = b % 4;
    CH[k].forEach((m, i) => n.push({ t: t + i * .03, m, d: bar * .95, inst: 'keys', v: .4 }));
    n.push({ t, m: ROOT[k], d: beat * 1.8, inst: 'bass', v: .55 }, { t: t + beat * 2.5, m: ROOT[k] + 7, d: beat, inst: 'bass', v: .45 });
  }
  MEL.forEach(([bt, m]) => { const t = .5 + bar + bt * beat; if (t < OFF) n.push({ t, m, d: beat * 1.2, inst: 'vibraphone', v: .35 }); });
  return n;
}
</script>
