<!doctype html>
<meta charset="utf-8">
<title>后台进程 · 第 58 期 — 播客片头</title>
<style>html, body { margin: 0; background: #000; } canvas { display: block; max-width: 100vw; max-height: 100vh; margin: auto; }</style>
<canvas></canvas>
<script src="../../lib/glitch/glitch.js"></script>
<script>
// 一档讲工程事故的中文播客，这期的嘉宾删过生产库。片头先是终端里敲下那条命令，回车那一下画面坏掉、音乐断掉；
// 一句「等等」之后，旧画面被拖进这期的标题卡（datamosh），然后一直干净。纸白底、黑字，没有扫描线。
const G = Glitch, W = 1920, H = 1080, DUR = 10.5;
const PAPER = '#eeece4', INK = '#17181b', GREY = '#8b8a84', BLUE = '#2546d8';
const MONO = 'Menlo, "SF Mono", monospace', SANS = '"PingFang SC", "Hiragino Sans GB", sans-serif';
const CMD = 'mysql -e "DROP DATABASE orders;"', CPS = 24, T_TYPE = .7, ENTER = 2.5, NOTE_T = 3.55, MOSH = 4.6;
const NOTE = '# 等等……这台是生产库';

function terminal(c, t) {
  c.fillStyle = PAPER; c.fillRect(0, 0, W, H);
  const x = 250, y = 470, lh = 64; c.font = `400 40px ${MONO}`; c.textAlign = 'left';
  const prompt = 'ops@prod-db-03:~$ ', pw = c.measureText(prompt).width;
  c.fillStyle = GREY; c.fillText(prompt, x, y);
  const typed = G.typed(CMD, t, T_TYPE, CPS); c.fillStyle = INK; c.fillText(typed, x + pw, y);
  let cx = x + pw + c.measureText(typed).width, cy = y;
  if (t >= ENTER + .1) {
    c.fillStyle = INK; c.fillText('Query OK, 0 rows affected (0.41 sec)', x, y + lh);
    c.fillStyle = GREY; c.fillText(prompt, x, y + lh * 2); cx = x + pw; cy = y + lh * 2;
    const note = G.typed(NOTE, t, NOTE_T, 9); c.font = `400 40px ${MONO}, ${SANS}`; c.fillStyle = GREY; c.fillText(note, cx, cy); cx += c.measureText(note).width;
  }
  const typing = (t > T_TYPE && t < T_TYPE + CMD.length / CPS) || (t > NOTE_T && t < NOTE_T + [...NOTE].length / 9);
  if (typing || Math.floor(t / .5) % 2 === 0) { c.fillStyle = INK; c.fillRect(cx + 4, cy - 34, 22, 44); }
}
function card(c, t) {
  c.fillStyle = PAPER; c.fillRect(0, 0, W, H);
  c.textAlign = 'left';
  c.fillStyle = INK; c.font = `600 40px ${SANS}`; c.fillText('后台进程', 160, 170);
  c.fillStyle = GREY; c.font = `400 34px ${SANS}`; c.fillText('第 58 期', 345, 170);
  c.fillStyle = INK; c.fillRect(160, 205, 1600, 3);
  c.font = `600 132px ${SANS}`; c.fillText('删库之后的', 160, 520);
  c.fillStyle = BLUE; c.fillText('72', 160 + c.measureText('删库之后的').width + 24, 520);
  c.fillStyle = INK; c.fillText('小时', 160 + c.measureText('删库之后的72').width + 64, 520);
  const a = G.seg(t, 6.3, 6.55); c.globalAlpha = a;
  c.font = `400 44px ${SANS}`; c.fillStyle = INK; c.fillText('嘉宾  周宁', 160, 660);
  c.fillStyle = GREY; c.fillText('前电商平台 SRE 负责人', 400, 660);
  c.globalAlpha = G.seg(t, 7.2, 7.45); c.font = `400 32px ${SANS}`; c.fillStyle = GREY; c.textAlign = 'right';
  c.fillText('10 月 16 日上线 · 小宇宙 / Apple 播客', 1760, 960); c.globalAlpha = 1;
}

// 配乐：电钢琴 + 合成贝斯 + 很轻的踩镲，100 bpm；回车那一下全停（只剩敲键盘），标题卡出来再进和弦
const beat = .6, notes = [];
const CH = [[57, 60, 64, 67], [53, 57, 60, 64], [60, 64, 67, 71], [55, 59, 62, 65]], ROOT = [45, 41, 48, 43];
for (let i = 0; i * beat / 2 < DUR; i++) {
  const t = .2 + i * beat / 2, bar = Math.floor(i / 8) % 4, s = i % 8;
  if (t > DUR - 1) break;
  if (t < ENTER || t > MOSH + .95) { if (s === 0 || s === 3 || s === 6) notes.push({ t, m: ROOT[bar], d: beat * .45, inst: 'synthbass', v: .55 }); if (s % 2 === 1) notes.push({ t, m: 42, d: .05, inst: 'hat', v: .22 }); }
  if (t > MOSH + .95 && s % 4 === 0) CH[bar].forEach((m, k) => notes.push({ t: t + k * .02, m, d: beat * 1.8, inst: 'keys', v: .38 }));
}

window.__scene = G.scene(async () => {
  await G.fonts([`400 40px ${MONO}`, `600 132px ${SANS}`, `400 44px ${SANS}`]);
  const glitches = [
    { t: ENTER, kind: 'blocks', seed: 3, amt: 1.1 },                     // 回车
    { t: MOSH, kind: 'mosh', d: 1.0, seed: 8 },                         // 终端被拖进标题卡
    { t: 8.4, kind: 'shift', area: { x: 830, y: 400, w: 190, h: 150 }, amt: .7, seed: 6 },   // 「72」轻轻一错
  ];
  const keys = [...CMD].map((_, i) => ({ kind: 'tap', t: T_TYPE + i / CPS, v: .12 + .06 * G.hash(i) }))
    .concat([...NOTE].map((_, i) => ({ kind: 'tap', t: NOTE_T + i / 9, v: .1 })));
  return {
    width: W, height: H, duration: DUR,
    draw: (c, t) => t < MOSH ? terminal(c, t) : card(c, t),
    glitches,
    sounds: [...G.sounds(glitches, DUR), ...keys, { kind: 'tap', t: ENTER, v: .45 }, { kind: 'cut', t: ENTER, dur: MOSH - ENTER }],
    music: { notes },
  };
});
</script>
