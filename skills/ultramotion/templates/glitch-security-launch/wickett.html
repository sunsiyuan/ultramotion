<!doctype html>
<meta charset="utf-8">
<title>Wickett — launch short</title>
<style>html, body { margin: 0; background: #000; } canvas { display: block; max-width: 100vw; max-height: 100vh; margin: auto; }</style>
<canvas></canvas>
<script src="../../lib/glitch/glitch.js"></script>
<script>
// A square launch post for Wickett, sign-in protection for small teams. A list of this morning's sign-ins, all normal —
// except one row, and only that row keeps breaking up. When Wickett blocks it, the row goes still. The rest of the frame never glitches.
const G = Glitch, W = 1080, H = 1080, DUR = 11.5;
const BG = '#0b1020', TXT = '#e8ecf4', DIM = '#6f7a95', LINE = '#1d2640', ORANGE = '#ff7a1a';
const SANS = '"Avenir Next", "Helvetica Neue", sans-serif', MONO = 'Menlo, monospace';
const ROWS = [
  ['09:12', 'maria@northpine.co', 'Portland, US', 'MacBook'],
  ['09:14', 'devon@northpine.co', 'Portland, US', 'ThinkPad'],
  ['09:15', 'maria@northpine.co', 'Portland, US', 'iPhone'],
  ['09:17', 'priya@northpine.co', 'Seattle, US', 'MacBook'],
  ['09:21', 'maria@northpine.co', 'Kaunas, LT', 'Windows'],
];
const ROW_T = i => 1.5 + i * .42, Y0 = 430, LH = 92, BAD = 4, BLOCK = 6.3, END = 8.6;
const rowBox = { x: 60, y: Y0 + BAD * LH - 52, w: 960, h: 76 };
const COLS = [80, 210, 570, 850];

function list(c, t) {
  c.fillStyle = BG; c.fillRect(0, 0, W, H);
  c.textAlign = 'left'; c.fillStyle = TXT; c.font = `600 62px ${SANS}`;
  if (t >= .3) { c.globalAlpha = G.seg(t, .3, .5); c.fillText(t < 4.4 ? 'Every sign-in looks like' : 'Except one.', 80, 190); if (t < 4.4) c.fillText('your team.', 80, 262); c.globalAlpha = 1; }
  c.font = `500 24px ${SANS}`; c.fillStyle = DIM;
  ['TIME', 'ACCOUNT', 'FROM', 'DEVICE'].forEach((h, k) => c.fillText(h, COLS[k], Y0 - 70));
  c.fillStyle = LINE; c.fillRect(60, Y0 - 50, 960, 2);
  ROWS.forEach((r, i) => {
    if (t < ROW_T(i)) return;
    const y = Y0 + i * LH; c.globalAlpha = G.seg(t, ROW_T(i), ROW_T(i) + .1);
    c.font = `400 30px ${MONO}`; c.fillStyle = i === BAD && t >= BLOCK ? ORANGE : TXT;
    r.forEach((v, k) => c.fillText(v, COLS[k], y));
    c.fillStyle = LINE; c.fillRect(60, y + 34, 960, 1);
    if (i === BAD && t >= BLOCK) {
      c.strokeStyle = ORANGE; c.lineWidth = 3; c.strokeRect(rowBox.x, rowBox.y, rowBox.w, rowBox.h);
      c.fillStyle = ORANGE; c.fillRect(rowBox.x + rowBox.w - 170, rowBox.y - 20, 170, 40);
      c.fillStyle = BG; c.font = `700 22px ${SANS}`; c.textAlign = 'center'; c.fillText('BLOCKED', rowBox.x + rowBox.w - 85, rowBox.y + 8); c.textAlign = 'left';
    }
    c.globalAlpha = 1;
  });
  if (t >= BLOCK + .5) {
    c.globalAlpha = G.seg(t, BLOCK + .5, BLOCK + .7); c.fillStyle = DIM; c.font = `400 28px ${SANS}`;
    c.fillText('Right password. Wrong laptop, wrong country,', 80, 950); c.fillText('six minutes after Maria signed in from Portland.', 80, 990); c.globalAlpha = 1;
  }
}
function endCard(c, t) {
  c.fillStyle = BG; c.fillRect(0, 0, W, H); c.textAlign = 'left';
  c.fillStyle = TXT; c.font = `700 120px ${SANS}`; c.fillText('Wickett', 80, 520);
  c.fillStyle = ORANGE; c.fillRect(80, 560, 90, 8);
  c.globalAlpha = G.seg(t, END + .4, END + .6); c.fillStyle = TXT; c.font = `400 40px ${SANS}`; c.fillText('Sign-in protection for teams of 5 to 500.', 80, 650);
  c.fillStyle = DIM; c.font = `500 32px ${SANS}`; c.fillText('Public beta opens November 4', 80, 920); c.globalAlpha = 1;
}

// music: a held pad and a quiet bass pulse in E minor; the bad row cuts it, the block brings it back fuller
const notes = [], beat = 60 / 108;
for (let t = .2; t < DUR - 1; t += beat / 2) {
  const quiet = t > 3.3 && t < BLOCK;
  if (!quiet || Math.round((t - .2) / (beat / 2)) % 4 === 0) notes.push({ t, m: t < END ? 40 : 36, d: beat * .4, inst: 'synthbass', v: quiet ? .28 : .4 });
}
[[.2, [52, 59, 64]], [3.0, [52, 59, 62]], [BLOCK, [48, 55, 60, 64]], [END, [48, 55, 60, 67]]].forEach(([t, ch]) => ch.forEach(m => notes.push({ t, m, d: t === END ? 2.6 : 3, inst: 'pad', v: .38 })));
notes.push({ t: BLOCK, m: 64, d: 1.6, inst: 'keys', v: .35 }, { t: END + .4, m: 67, d: 2, inst: 'keys', v: .35 }, { t: END + .4, m: 60, d: 2, inst: 'keys', v: .3 });

window.__scene = G.scene(async () => {
  await G.fonts([`600 62px ${SANS}`, `400 30px ${MONO}`, `700 120px ${SANS}`]);
  const row = rowBox, glitches = [
    { t: ROW_T(BAD), kind: 'blip', area: row, amt: .6, seed: 2 },     // arrives slightly wrong
    { t: 4.05, kind: 'tear', area: row, seed: 5, amt: .8 },
    { t: 4.95, kind: 'blocks', area: row, seed: 11 },
    { t: 5.6, kind: 'hit', area: row, seed: 17, amt: 1.2 },
  ];
  return {
    width: W, height: H, duration: DUR,
    draw: (c, t) => t < END ? list(c, t) : endCard(c, t),
    glitches,
    sounds: [...G.sounds(glitches, DUR), ...ROWS.map((_, i) => ({ kind: 'tick', t: ROW_T(i), v: .18 })), { kind: 'thud', t: BLOCK, v: .55 }, { kind: 'tap', t: BLOCK, v: .4 }],
    music: { notes },
  };
});
</script>
