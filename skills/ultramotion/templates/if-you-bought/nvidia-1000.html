<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>$1,000 in Nvidia, 2015–2024, against the S&amp;P 500</title>
<style>
@font-face { font-family: 'Source Serif Display'; font-weight: 600; src: url(fonts/SourceSerif4Display-Semibold-latin.woff2) format('woff2'); }
html,body{margin:0;background:#FFF1E5}canvas{display:block;width:100vw;height:100vh;object-fit:contain}
</style></head>
<body><canvas></canvas>
<script src="../../lib/data-story/trend.js"></script>
<script>
document.fonts.load('600 60px "Source Serif Display"');                       // the canvas doesn't ask for it, so ask before the first frame
const T = Trend, { seg, oc, io, lerp, date } = T;
window.__scene = T.withData(['data/nvda-daily.json', 'data/sp500tr-daily.json'], ([D, M]) => {
  // the same $1,000 in both on the first day both have, held to the last; Nvidia's dividends bought more shares at the ex-date close
  const W = 1080, H = 1920, t0 = Math.max(D.series[0][0], M.series[0][0]), tEnd = Math.min(D.series[D.series.length - 1][0], M.series[M.series.length - 1][0]);
  const PX = D.series.filter(([t]) => t >= t0 && t <= tEnd), DIV = new Map(D.dividends), P0 = PX[0][1], PEnd = PX[PX.length - 1][1];
  let shares = 1000 / P0;
  const NV = PX.map(([t, p]) => { if (DIV.has(t)) shares += shares * DIV.get(t) / p; return [t, shares * p]; });
  const MX = M.series.filter(([t]) => t >= t0 && t <= tEnd), M0 = MX[0][1], MEnd = MX[MX.length - 1][1], SP = MX.map(([t, v]) => [t, 1000 * v / M0]);
  const nvEnd = NV[NV.length - 1][1], spEnd = SP[SP.length - 1][1];

  // FT markets chart: salmon page, dark grey type, the line in oxford blue, the comparison muted
  const PAPER = '#FFF1E5', INK = '#33302E', GREY = '#66605C', QUIET = '#8F8780', GRID = '#E3D3C4', BLUE = '#0F5499', CLARET = '#990F3D', MUTE = '#C48A9C', MUTE_TXT = '#A5627A';
  const SERIF = '"Source Serif Display", Georgia, serif', SANS = '"Helvetica Neue", Helvetica, Arial, sans-serif';

  const at = d => { const i = NV.findIndex(([t]) => t >= date(d)); return { t: NV[i][0], v: NV[i][1], chg: NV[i][1] / NV[i - 1][1] - 1 }; };
  const fall = (S, a, b) => { const r = S.filter(([t]) => t >= date(a) && t <= date(b)), hi = r.reduce((p, q) => q[1] > p[1] ? q : p), lo = r.filter(([t]) => t >= hi[0]).reduce((p, q) => q[1] < p[1] ? q : p); return { hi, lo, pct: lo[1] / hi[1] - 1, days: (lo[0] - hi[0]) / 864e5 }; };
  const worst = S => { let pk = 0, w = 0; S.forEach(([, v]) => { pk = Math.max(pk, v); w = Math.min(w, v / pk - 1); }); return w; };
  const F18 = fall(NV, '2018-06-01', '2019-06-01'), COV = fall(SP, '2020-01-01', '2020-06-01'), F22 = fall(NV, '2021-06-01', '2023-01-01');
  const GPT = at('2022-11-30'), MAY = at('2023-05-25'), TOP = at('2024-06-18');
  const pct = x => `${x > 0 ? '+' : '−'}${Math.round(Math.abs(x) * 100)}%`, usd = v => '$' + Math.round(v).toLocaleString('en-US');
  const round = (v, to) => '$' + (Math.round(v / to) * to).toLocaleString('en-US');
  const fdate = ms => new Date(ms).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
  const sdate = ms => new Date(ms).toLocaleDateString('en-GB', { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' });

  const E = T.create({ width: W, height: H, time: [
    [0, t0], [1.2, t0], [4.5, date('2017-01-01')], [7.0, F18.hi[0]], [9.4, F18.lo[0]], [11.0, F18.lo[0]],
    [12.4, COV.hi[0]], [13.8, COV.lo[0]], [15.0, COV.lo[0]], [17.6, F22.hi[0]], [20.0, F22.lo[0]], [21.2, F22.lo[0]],
    [22.4, GPT.t], [23.8, GPT.t], [25.2, MAY.t], [26.6, MAY.t], [28.6, TOP.t], [33.4, TOP.t], [36.4, tEnd], [44, tEnd]] });
  const LOG = t => io(seg(t, 31.0, 32.8));

  // vertical: title and deck at the top, the chart in the middle, source and credit above the bottom fifth; nothing in the right 120 px
  const box = [72, 700, 836, 1330], RIGHT = 960;
  const beats = [
    { t: [0, 3.8], l: [`$1,000 on ${fdate(t0)}`, 'in Nvidia, and in the S&P 500, dividends reinvested'] },
    { t: [7.2, 11.0], l: ['2018: the crypto-mining boom ends', `Nvidia ${pct(F18.pct)} in under three months`], down: true },
    { t: [12.2, 15.0], l: [`${new Date(COV.lo[0]).toLocaleDateString('en-US', { month: 'long', year: 'numeric', timeZone: 'UTC' })}: Covid`, `the S&P 500 ${pct(COV.pct)} in ${Math.round(COV.days / 7)} weeks`], down: true },
    { t: [17.8, 21.2], l: ['2022: the chip slump', `${pct(F22.pct)}: ${usd(F22.hi[1])} falls back to ${usd(F22.lo[1])}`], down: true },
    { t: [21.6, 23.9], l: [fdate(GPT.t), 'OpenAI launches ChatGPT'] },
    { t: [24.9, 26.7], l: [fdate(MAY.t), `Nvidia ${pct(MAY.chg)} in one day on an AI-driven forecast`] },
    { t: [27.8, 30.8], l: [fdate(TOP.t), 'Nvidia is, briefly, the world’s most valuable company'] },
    { t: [31.0, 34.6], l: ['On a log scale, each step is ×10', 'and the S&P 500’s climb can be read again'] },
    { t: [36.6, 44], l: [`Nvidia ×${Math.round(nvEnd / 1000)}, the S&P 500 ×${(spEnd / 1000).toFixed(1)}`, `Nvidia fell by more than half twice; the market’s worst: ${pct(worst(SP))}`] },
  ];
  const beatA = (b, t) => seg(t, b.t[0], b.t[0] + .4) * (1 - seg(t, b.t[1] - .3, b.t[1]));
  // the two things the chart keeps: FT annotations, small text with a thin leader to the day on the line
  // each sits where the chart leaves room in that stretch of the video: [from, to, dx, dy, align] in px from the day's point; between stretches it fades out and back in
  const notes = [
    { t: F18.lo[0], l: ['Crypto-mining bust', `${pct(F18.pct)} in three months`], places: [[9.2, 11.0, 26, 96, 'left'], [19.0, 30.8, -110, -190, 'left'], [32.6, 99, -110, -200, 'left']] },
    { t: GPT.t, l: ['ChatGPT', sdate(GPT.t)], places: [[22.2, 27.4, -14, 110, 'right'], [32.6, 99, -14, 112, 'right']] },
  ];
  const placeAt = (n, t) => { for (const [a, b, dx, dy, align] of n.places) if (t >= a && t < b) return { dx, dy, align, a: oc(seg(t, a, a + .4)) * (1 - seg(t, b - .4, b)) }; return null; };

  const ctxFont = (c, w, s, f) => { c.font = `${w} ${s}px ${f}`; };
  const wrap = (c, s, width) => { const out = []; let line = ''; s.split(' ').forEach(w => { const tr = line ? line + ' ' + w : w; if (c.measureText(tr).width > width && line) { out.push(line); line = w; } else line = tr; }); out.push(line); return out; };
  const TITLE = [`Nvidia turned $1,000 into ${round(nvEnd, 1000)} in ten years.`, `The S&P 500 made it ${round(spEnd, 100)}`];

  const draw = (c, t) => {
    const now = E.realAt(t), L = LOG(t);
    // the window follows the data: time stretches as it arrives (room on the right for the line labels), the top follows the highest value so far
    const span = Math.max(now - t0, 500 * 864e5), [, hi] = T.extent(NV, now);
    const F = T.frame({ box, t: [t0 - span * .02, t0 + span * 1.3], v: L > 0 ? [600, lerp(hi * 1.15, hi * 1.9, L)] : [0, hi * 1.15], log: L });

    // header: a short rule, the finding in the serif, the measure and the unit under it
    c.fillStyle = INK; c.fillRect(72, 196, 84, 8);
    ctxFont(c, 600, 66, SERIF); c.fillStyle = INK; c.textBaseline = 'alphabetic';
    TITLE.flatMap(s => wrap(c, s, RIGHT - 72)).forEach((l, i) => c.fillText(l, 72, 290 + i * 76));
    const sub = 'Value of $1,000 invested, $';
    T.text(c, sub, 72, 548, { size: 32, weight: 400, font: SANS, color: GREY });
    ctxFont(c, 400, 32, SANS); T.text(c, ', log scale', 72 + c.measureText(sub).width, 548, { size: 32, weight: 400, font: SANS, color: GREY, a: L });
    beats.forEach(b => { const a = beatA(b, t); if (a <= 0) return;
      T.text(c, b.l[0], 72, 616, { size: 34, weight: 700, font: SANS, color: b.down ? CLARET : INK, a, rise: 10 });
      T.text(c, b.l[1], 72, 660, { size: 29, weight: 400, font: SANS, color: GREY, a, rise: 10 }); });

    // the chart: the year faint behind it, gridlines on the value axis only, labels on the right
    const y0 = new Date(t0).getUTCFullYear();
    T.year(c, now - t0 < 60 * 864e5 ? Date.UTC(y0, 0, 1) : now, { x: 420, y: 1290, size: 300, color: 'rgba(51,48,46,.05)', font: SERIF, weight: 600 });
    T.grid(c, F, { format: v => v >= 1000 ? (v / 1000).toLocaleString('en-US') + 'k' : String(v), side: 'out', size: 26, color: GRID, label: GREY, minGap: 70, width: 2, zero: false });
    const [x0, , x1, y1] = box;
    c.fillStyle = INK; c.fillRect(x0, y1 - 1, x1 - x0, 2);
    T.timeAxis(c, F, { every: 1, format: v => { const y = new Date(v).getUTCFullYear(); return y === y0 || span < 5 * 365 * 864e5 ? String(y) : String(y).slice(2); }, color: GREY, size: 26, upto: Math.min(now + 2e10, tEnd) });

    T.drawdown(c, NV, now, F, { min: -.5, color: 'rgba(153,15,61,.07)', edge: 'rgba(153,15,61,.35)' });
    T.line(c, SP, now, F, { color: MUTE, width: 4, head: null });
    T.line(c, NV, now, F, { color: BLUE, width: 5, head: null });

    notes.forEach(n => { const P = placeAt(n, t); if (!P || P.a <= 0 || now < n.t) return;
      // a ring on the day, a thin vertical leader down to the side of the text, or up into it
      const px = F.X(n.t), py = F.Y(T.at(NV, n.t)), up = P.dy < 0, a = P.a;
      const tx = Math.max(x0 + 4, px + P.dx), top = py + P.dy - (up ? 58 : 0), edge = up ? top + 66 : P.align === 'right' ? top + 14 : top - 10;
      c.save(); c.globalAlpha = a; c.strokeStyle = INK; c.lineWidth = 1.5;
      c.beginPath(); c.arc(px, py, 7, 0, T.TAU); c.stroke(); c.beginPath(); c.moveTo(px, py + (up ? -7 : 7)); c.lineTo(px, edge); c.stroke(); c.restore();
      T.text(c, n.l[0], P.align === 'right' ? px + P.dx : tx, top + 22, { size: 26, weight: 700, font: SANS, color: INK, align: P.align, a });
      T.text(c, n.l[1], P.align === 'right' ? px + P.dx : tx, top + 54, { size: 24, weight: 400, font: SANS, color: GREY, align: P.align, a }); });

    // each line named at its end, with what the $1,000 is worth on the clock's day; no legend
    {
      const hx = F.X(now), nh = { x: hx, y: F.Y(T.at(NV, now)) }, mh = { x: hx, y: F.Y(T.at(SP, now)) };   // on the first day both sit at $1,000
      [[nh, BLUE], [mh, MUTE]].forEach(([h, col]) => { c.fillStyle = col; c.beginPath(); c.arc(h.x, h.y, 7, 0, T.TAU); c.fill(); });
      let yn = nh.y, ys = mh.y; const gap = 92;
      if (ys - yn < gap) { const m = (yn + ys) / 2; yn = Math.min(m - gap / 2, nh.y); ys = yn + gap; }
      ys = Math.min(ys, y1 - 40); yn = Math.min(yn, ys - gap);
      [[nh, yn, BLUE, 'Nvidia', T.at(NV, now)], [mh, ys, MUTE_TXT, 'S&P 500', T.at(SP, now)]].forEach(([h, y, col, name, v]) => {
        const lx = h.x + 18;
        T.text(c, name, lx, y - 8, { size: 26, weight: 700, font: SANS, color: col });
        T.counter(c, Math.round(v), { x: lx, y: y + 32, size: 36, weight: 600, font: SANS, color: col, prefix: '$' }); });
    }

    // under the chart: the rule behind the numbers, the source, the publisher — all above the bottom fifth
    const end = seg(t, 37.4, 38.0);
    T.text(c, 'Total return: dividends reinvested, before tax and fees', 72, 1446, { size: 23, weight: 400, font: SANS, color: GREY, a: 1 - end });
    T.text(c, `Nvidia: $1,000 ÷ $${P0} = ${Math.round(1000 / P0).toLocaleString('en-US')} shares, ${Math.round(shares).toLocaleString('en-US')} with dividends, × $${PEnd} = ${usd(nvEnd)}`, 72, 1418, { size: 22, weight: 400, font: SANS, color: GREY, a: end });
    T.text(c, `S&P 500 TR: $1,000 × ${MEnd.toLocaleString('en-US')} ÷ ${M0.toLocaleString('en-US')} = ${usd(spEnd)}; before tax and fees`, 72, 1446, { size: 22, weight: 400, font: SANS, color: GREY, a: end });
    T.text(c, 'Source: CNBC; Nasdaq; S&P Dow Jones Indices (S&P 500 Total Return)', 72, 1484, { size: 23, weight: 400, font: SANS, color: GREY });
    T.text(c, `${sdate(t0)} – ${sdate(tEnd)}, daily closes, split-adjusted`, 72, 1512, { size: 23, weight: 400, font: SANS, color: GREY });
    T.text(c, '© The Ledger', RIGHT, 1512, { size: 23, weight: 700, font: SANS, color: GREY, align: 'right' });
    T.finish(c, t, { grain: .035, vignette: 0 });
  };

  // a quiet piano figure that follows the money; it thins to cello in the falls, a timpani on each bottom, a bell on ChatGPT, one chord at the end
  const score = [], chords = [[0, [50, 57, 62, 66]], [4.5, [47, 54, 59, 62]], [7.0, [43, 50, 55, 59]], [11.0, [45, 52, 57, 61]], [12.4, [40, 47, 52, 55]],
    [15.0, [50, 57, 62, 66]], [17.6, [43, 50, 55, 59]], [21.2, [47, 54, 59, 62]], [22.4, [43, 50, 55, 62]], [25.2, [45, 52, 57, 64]], [28.6, [50, 57, 62, 69]],
    [31.0, [47, 54, 59, 66]], [33.4, [43, 50, 55, 62]], [36.4, [50, 57, 62, 66]], [44, null]];
  const falls = [[7.2, 11.0], [12.4, 15.0], [17.8, 21.2]], inFall = t => falls.some(([a, b]) => t >= a && t < b);
  chords.forEach(([c0, ch], i) => { if (!ch) return; const c1 = chords[i + 1][0];
    ch.slice(0, 3).forEach(m => score.push({ t: c0, m: m - 12 * (m > 52), d: c1 - c0 + .4, inst: inFall(c0 + .1) ? 'cello' : 'slowstrings', v: .26 }));
    if (c0 >= 36.4) return;
    for (let x = c0; x < c1 - .01; x += .3) { if (inFall(x)) continue; const k = Math.round((x - c0) / .3); score.push({ t: x, m: ch[[1, 2, 3, 2][k % 4]] + 12, d: .5, inst: 'piano', v: k % 2 ? .26 : .36 }); } });
  [[9.4, 31], [13.8, 28], [20.0, 31]].forEach(([tt, m]) => score.push({ t: tt, m, d: 2.4, inst: 'timpani', v: .42 }));
  score.push({ t: 22.4, m: 86, d: 2.5, inst: 'celesta', v: .32 }, { t: 28.6, m: 81, d: 2.5, inst: 'celesta', v: .3 });
  score.push(...[50, 57, 62, 66, 74].map((m, i) => ({ t: 36.4 + i * .04, m, d: 6, inst: 'piano', v: .42 - i * .03 })), { t: 37.6, m: 81, d: 4, inst: 'celesta', v: .3 });
  return T.scene(E, draw, { duration: 44, background: PAPER,
    music: { notes: score, dynamics: { slowstrings: [[0, .35], [28, .55], [36.4, .7], [43, .25]], piano: [[0, .7], [28, .85], [36, .9]] } },
    sounds: [...T.tick(E, { every: 'year', v: .25 }), { t: 31.0, kind: 'whoosh', dur: 1.8, v: .25 }] });
});
</script></body></html>
