<!doctype html>
<meta charset="utf-8">
<title>Seventh-inning stretch — Take Me Out to the Ball Game (scoreboard sing-along)</title>
<style>html,body{margin:0;background:#000}canvas{display:block;max-width:100vw;max-height:100vh}</style>
<canvas></canvas>
<script src="../../lib/karaoke/karaoke.js"></script>
<script>
/* The board at a ballpark in the middle of the seventh: the organist plays “Take Me Out to the Ball Game” (Norworth / Von Tilzer, 1908)
   and the whole park sings, following a baseball that bounces from syllable to syllable. “Home team” is sung as the club's name.
   No recording: the melody times the syllables and is also the organ part. Two lines a page; the page turns in one stroke.
   A fine LED grid over everything, the way the video board shows it. */
const K = Karaoke, S = K.create({ width: 1920, height: 1080 });
const BPM = 168, INTRO = 4;                                  // 3/4; four bars of organ first
const L = (...a) => a;
const SONG = K.score({ bpm: BPM, meter: 3, start: .4, inst: 'hammond', v: .5, lines: [
  L({ at: INTRO * 3 }, ['Take', 1, 60], ['', 1], ['me', 1, 72], ['out', 1, 69], ['to', 1, 67], ['the', 1, 64], ['ball', 3, 67], ['game,', 3, 62]),
  L(['Take', 1, 60], ['', 1], ['me', 1, 72], ['out', 1, 69], ['with', 1, 67], ['the', 1, 64], ['crowd;', 6, 67]),
  L(['Buy', 1, 69], ['me', 1, 68], ['some', 1, 69], ['pea-', 1, 64], ['nuts', 1, 65], ['and', 1, 67], ['Crack-', 2, 69], ['er', 1, 65], ['Jack,', 3, 62]),
  L(['I', 2, 69], ['don\'t', 1, 69], ['care', 1, 69], ['if', 1, 71], ['I', 1, 72], ['nev-', 1, 74], ['er', 1, 71], ['get', 1, 69], ['back.', 1, 67]),
  L(['Let', 1, 64], ['me', 1, 62], ['root,', 1, 60], ['', 1], ['root,', 1, 72], ['root', 1, 69], ['for', 1, 67], ['the', 1, 64], ['Bay', 3, 67], ['Hawks!', 2, 62]),
  L(['If', 1, 64], ['they', 2, 60], ['don\'t', 1, 62], ['win,', 1, 64], ['it\'s', 1, 65], ['a', 1, 67], ['shame.', 4, 69]),
  L(['For', 1, 69], ['it\'s', 1, 71], ['one,', 1, 72], ['', 2], ['two,', 1, 72], ['', 2], ['three', 1, 72], ['strikes,', 1, 71], ['you\'re', 1, 69], ['out', 1, 67]),
  L(['at', 1, 66], ['the', 1, 67], ['old', 3, 69], ['ball', 3, 71], ['game!', 4, 72], ['', 2]),
]});
// the organ: melody in the middle of the keyboard, oom-pah-pah under it
const at = SONG.at, beat = SONG.beat;
const CH = { C: [48, 60, 64, 67], Am: [45, 60, 64, 69], G7: [43, 59, 62, 65], G: [43, 59, 62, 67], A7: [45, 61, 64, 67], Dm: [50, 62, 65, 69],
             D7: [50, 60, 62, 66], C7: [48, 58, 64, 67], F: [41, 60, 65, 69], 'D7/F#': [42, 60, 62, 66] };
const BARS = ['C', 'Am', 'G7', 'G7', 'C', 'Am', 'G', 'G', 'A7', 'A7', 'Dm', 'Dm', 'D7', 'D7', 'G', 'G',
              'C', 'Am', 'G7', 'G7', 'C', 'C7', 'F', 'F', 'F', 'D7/F#', 'C', 'A7', 'Dm', 'G7', 'C', 'C'];
const notes = SONG.notes.map(n => ({ ...n, v: .52 }));
const pah = (bar, ch, v = 1) => { const [b, ...up] = CH[ch], t = at(bar * 3);
  notes.push({ t, m: b, d: beat * .9, inst: 'hammond', v: .42 * v });
  [1, 2].forEach(k => up.forEach(m => notes.push({ t: at(bar * 3 + k), m: m - 12, d: beat * .55, inst: 'hammond', v: .2 * v }))); };
BARS.forEach((ch, i) => pah(INTRO + i, ch));
// intro: the organist's vamp — the last line's tune, then a held dominant
[[69, 3], [71, 3], [72, 3], [67, 3]].reduce((b, [m, d]) => { notes.push({ t: at(b), m, d: d * beat * .95, inst: 'hammond', v: .5 }); return b + d; }, 0);
['F', 'G7', 'C', 'G7'].forEach((ch, i) => pah(i, ch, .9));
const END = at((INTRO + 32) * 3);
notes.push(...[48, 60, 64, 67, 72].map(m => ({ t: END, m, d: 2.6, inst: 'hammond', v: .38 })));
const DUR = END + 3.2;

const LINES = SONG.lines;
const CREAM = '#fffaf0', NAVY = '#10265a', RED = '#e8333f', GOLD = '#ffd23f';
const FONT = '"Avenir Next Condensed", "Avenir Next", "Helvetica Neue", sans-serif';
const ROWY = [530, 710];
// one size per page: as big as 132 px, small enough that both lines fit the board
const SIZE = pg => Math.min(...pg.map(line => K.layout(S.ctx, line, { font: FONT, weight: 800, size: 132, hyphen: true, tracking: 2, maxWidth: 1720, fit: true }).size));

// the LED grid: a dark lattice with round openings, 6 px pitch
const led = (() => { const p = document.createElement('canvas'); p.width = p.height = 6; const g = p.getContext('2d');
  g.fillStyle = 'rgba(0,0,0,.3)'; g.fillRect(0, 0, 6, 6); g.globalCompositeOperation = 'destination-out'; g.beginPath(); g.arc(3, 3, 2.3, 0, K.TAU); g.fill(); return p; })();

function baseball(c, x, y, r, rot, squash) {
  c.save(); c.translate(x, y + r * squash * .5); c.scale(1 + squash * .25, 1 - squash * .25); c.rotate(rot);
  c.shadowColor = 'rgba(255,240,200,.6)'; c.shadowBlur = 18;
  c.fillStyle = '#fbf8f1'; c.beginPath(); c.arc(0, 0, r, 0, K.TAU); c.fill(); c.shadowBlur = 0;
  c.strokeStyle = RED; c.lineWidth = r * .09;
  [-1, 1].forEach(s => { c.beginPath(); c.arc(s * r * 1.32, 0, r * .9, Math.PI - .78, Math.PI + .78); if (s > 0) { c.beginPath(); c.arc(s * r * 1.32, 0, r * .9, -.78 + Math.PI, .78 + Math.PI, false); } c.save(); if (s < 0) c.scale(-1, 1); c.beginPath(); c.arc(r * 1.32, 0, r * .9, Math.PI - .78, Math.PI + .78); c.stroke();
    for (let k = -3; k <= 3; k++) { const a = Math.PI + k * .2, px = r * 1.32 + Math.cos(a) * r * .9, py = Math.sin(a) * r * .9; c.beginPath(); c.moveTo(px - r * .1, py - r * .06); c.lineTo(px + r * .02, py + r * .06); c.stroke(); }
    c.restore(); });
  c.restore();
}

window.__scene = K.scene(S, (c, t) => {
  // board ground: navy with a soft lift in the middle
  c.fillStyle = NAVY; c.fillRect(0, 0, S.W, S.H);
  const g = c.createRadialGradient(960, 560, 100, 960, 560, 1100); g.addColorStop(0, 'rgba(40,80,150,.55)'); g.addColorStop(1, 'rgba(40,80,150,0)');
  c.fillStyle = g; c.fillRect(0, 0, S.W, S.H);

  // header
  const hi = K.ease.out(K.seg(t, .1, .7));
  c.save(); c.globalAlpha = hi; c.fillStyle = RED; c.fillRect(0, 70, S.W, 128);
  c.font = `800 92px ${FONT}`; c.letterSpacing = '6px'; c.textAlign = 'center'; c.fillStyle = CREAM; c.fillText('7TH INNING STRETCH', 960, 166);
  c.restore();
  // before the singing: “everybody sing” with the count of bars
  const first = LINES[0].t0, cue = K.cl(Math.min((t - .8) / .3, (first - .4 - t) / .3));
  if (cue > 0) {
    c.save(); c.globalAlpha = cue; c.textAlign = 'center'; c.fillStyle = GOLD; c.font = `800 150px ${FONT}`; c.letterSpacing = '4px';
    c.fillText('EVERYBODY SING!', 960, 640); c.restore();
  }

  // the page: two lines; the page turns with one sweep
  const P = K.pages(SONG, t, { per: 2, lead: .9, fade: .18, hold: 1.2 });
  const tg = [];
  if (P) {
    P.page.forEach((line, r) => {
      const laid = K.layout(c, line, { font: FONT, weight: 800, size: SIZE(P.page), x: 960, y: ROWY[r], align: 'center', hyphen: true, tracking: 2 });
      c.save(); c.globalAlpha = P.a;
      K.sing(c, laid, t, { unsung: { fill: CREAM }, sung: { fill: GOLD }, edge: 0 });
      c.restore();
    });
  }
  // the ball follows every syllable of the song, across pages
  if (!window.__targets) {
    window.__targets = [];
    const all = K.pages(SONG, 0, { per: 2 }).all;
    all.forEach(pg => pg.forEach((line, r) => {
      const laid = K.layout(c, line, { font: FONT, weight: 800, size: SIZE(pg), x: 960, y: ROWY[r], align: 'center', hyphen: true, tracking: 2 });
      window.__targets.push(...K.targets(laid, 16));
    }));
  }
  const b = K.ball(window.__targets, t, { hop: .3, height: 80, enter: .6, from: { x: 300, y: 300 } });
  if (b && b.a > 0) { c.save(); c.globalAlpha = b.a; baseball(c, b.x, b.y - 30, 30, t * 5, b.squash); c.restore(); }

  // bottom strip: the game
  c.save(); c.fillStyle = 'rgba(0,0,0,.35)'; c.fillRect(0, 930, S.W, 90);
  c.font = `700 52px ${FONT}`; c.letterSpacing = '3px'; c.fillStyle = CREAM; c.textAlign = 'left';
  c.fillText('SEA  3', 520, 993); c.fillStyle = GOLD; c.fillText('BAY  4', 820, 993); c.fillStyle = CREAM; c.fillText('▲ 7TH', 1160, 993);
  c.restore();

  // the board's LED grid
  c.fillStyle = c.createPattern(led, 'repeat'); c.fillRect(0, 0, S.W, S.H);
}, {
  duration: DUR, background: NAVY,
  music: { notes },
  timeline: LINES.map(l => ({ t0: l.t0, t1: l.t1, text: l.text })),
});
</script>
