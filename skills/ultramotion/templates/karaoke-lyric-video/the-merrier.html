<!doctype html>
<meta charset="utf-8">
<title>The Merrier — Josh Woodward (lyric video)</title>
<style>html,body{margin:0;background:#000}canvas{display:block;max-width:100vw;max-height:100vh}</style>
<canvas></canvas>
<script src="../../lib/karaoke/karaoke.js"></script>
<script>
/* An indie songwriter's lyric video for YouTube: the first chorus of “The Merrier”, a song about the family getting bigger.
   The recording is real; the word times come from lyrics.py (media/the-merrier-chorus.json).
   Light, warm paper; big left-aligned type that scrolls up a line at a time; each word darkens as it is sung, with a soft edge,
   and rises a few pixels. The two halves of the chorus get different paper. */
const K = Karaoke, S = K.create({ width: 1920, height: 1080 });
const INK = '#2a1d16', FONT = '"Avenir Next", "Helvetica Neue", sans-serif';
let T, laid, offs;
const ready = K.load('media/the-merrier-chorus.json').then(d => {
  T = d;
  const c = S.ctx;
  laid = T.lines.map(l => K.layout(c, l, { font: FONT, weight: 700, size: 104, x: 0, y: 0, maxWidth: 1420, leading: 1.1, tracking: -1.5 }));
  offs = []; let y = 0;                                   // each line's top, stacked with a gap; wrapped lines take more room
  laid.forEach((L, i) => { offs.push(y); y += L.height + 70 + (T.lines[i + 1] && T.lines[i + 1].t0 - T.lines[i].t1 > 2 ? 60 : 0); });
});
// two papers: first half of the chorus, second half
const PAPER = [[241, 233, 220], [233, 226, 238]];
const mix = (a, b, k) => a.map((v, i) => Math.round(v + (b[i] - v) * k));

window.__scene = K.scene(S, (c, t) => {
  const half = K.ease.io(K.seg(t, 16.2, 18.2));
  const p = mix(PAPER[0], PAPER[1], half);
  c.fillStyle = `rgb(${p})`; c.fillRect(0, 0, S.W, S.H);
  // a broad, slow wash of light from the upper right
  const g = c.createRadialGradient(1500 + 120 * Math.sin(t * .11), 160, 50, 1500, 200, 1300);
  g.addColorStop(0, 'rgba(255,250,240,.75)'); g.addColorStop(1, 'rgba(255,250,240,0)'); c.fillStyle = g; c.fillRect(0, 0, S.W, S.H);

  // where the lyrics have scrolled to: interpolate between line tops
  const pos = K.scroll(T, t, { move: .7 }), i0 = Math.floor(pos), f = pos - i0;
  const top = K.lerp(offs[i0], offs[Math.min(i0 + 1, offs.length - 1)], f);
  const X = 190, Y = 470;                                 // the line being sung sits here
  const intro = K.ease.out(K.seg(t, .3, 1.6));
  laid.forEach((L0, i) => {
    const y = Y + offs[i] - top + L0.ascent + (1 - intro) * 40;
    if (y < -200 || y > S.H + 200) return;
    const L = K.moved(L0, X, y), d = i - pos;
    // past lines fade away upward, upcoming lines wait faint below
    const a = intro * (d < 0 ? K.cl(1 + d * 1.6) * .55 : K.cl(1 - (d - 1) * .75)) * K.cl((S.H - 150 - y) / 160);
    c.save(); c.globalAlpha = a;
    K.sing(c, L, t, {
      unsung: { fill: 'rgba(42,29,22,.2)' },
      sung: { fill: INK },
      edge: 80, lift: 3, liftTime: .35,
    });
    c.restore();
  });

  // credits: the song's own, small, on the left edge; the licence line at the bottom
  c.save(); c.globalAlpha = intro * (1 - K.seg(t, 31.6, 33));
  c.font = `600 22px ${FONT}`; c.letterSpacing = '5px'; c.fillStyle = 'rgba(42,29,22,.55)';
  c.fillText('JOSH WOODWARD', X, 120); const jw = c.measureText('JOSH WOODWARD  ').width; c.fillStyle = 'rgba(42,29,22,.35)'; c.fillText('THE MERRIER', X + jw + 18, 120);
  c.font = `500 19px ${FONT}`; c.letterSpacing = '0.5px'; c.fillStyle = 'rgba(42,29,22,.42)';
  c.fillText('Music: “The Merrier” by Josh Woodward · joshwoodward.com · CC BY 4.0', X, S.H - 70);
  c.restore();
}, {
  duration: 33, background: '#f1e9dc', ready: [ready],
  music: { file: 'media/the-merrier-chorus.mp3', from: 0, at: 0, fadeIn: .2, fadeOut: 1.6 },
});
</script>
