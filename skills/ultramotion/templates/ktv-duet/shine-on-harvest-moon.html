<!doctype html>
<meta charset="utf-8">
<title>Shine On, Harvest Moon · duet for Jack & Nora</title>
<style>html,body{margin:0;background:#000}canvas{display:block;max-width:100vw;max-height:100vh}</style>
<canvas></canvas>
<script src="../../lib/karaoke/karaoke.js"></script>
<script>
/* "Shine On, Harvest Moon" (Nora Bayes and Jack Norworth, 1908, public domain), the chorus, as a phone duet in the manner of
   Smule: the screen split top and bottom, Jack's half above and Nora's below, each a coloured panel with the singer's name and
   a live level meter. The half whose singer is singing glows; on the lines they sing together both glow.
   He sings the opening, she answers with the months, he takes the snow-time couplet, and they sing the last two lines together.
   No lead vocal: the timing comes from the melody, which is also the guide (clarinet for him, flute for her, both together with
   the clarinet a third below) and what moves the meters. The chorus walks the ragtime circle E7 - A7 - D7 - G7 - C.
   Vertical for Reels, TikTok and Shorts: everything that matters stays above the bottom fifth and left of the right edge. */
const K = Karaoke, S = K.create({ width: 1080, height: 1920 });
const BPM = 78, INTRO = 2;                                  // C major
const SONG = K.score({ bpm: BPM, meter: 4, start: .6, inst: 'flute', v: .5, lines: [
  [{ at: INTRO * 4, voice: 'm' }, ['Shine', 1.5, 68], ['on,', .5, 69], ['shine', 1.5, 68], ['on', .5, 69], ['har-', .5, 71], ['vest', .5, 69], ['moon', 3, 68]],
  [['up', 1, 64], ['in', 1, 66], ['the', 1, 68], ['sky', 4, 71], ['', 1]],
  [{ voice: 'f' }, ['', 1], ['I', .5, 73], ['ain\'t', .5, 74], ['had', 1, 73], ['no', 1, 69], ['lov-', 1, 67], ['in\'', 1, 69], ['since', 2, 73]],
  [['Jan-', .5, 76], ['u-', .5, 73], ['ar-', .5, 69], ['y,', .5, 67], ['Feb-', .5, 76], ['ru-', .5, 73], ['ar-', .5, 69], ['y,', .5, 67],
   ['June', 1, 69], ['or', .5, 72], ['Ju-', .5, 73], ['ly', 2, 73]],
  [{ voice: 'm' }, ['Snow', 1.5, 74], ['time', .5, 72], ['ain\'t', 1, 69], ['no', 1, 66], ['time', 1, 69], ['to', 1, 72], ['stay', 2, 74]],
  [['out-', 1, 74], ['doors', 1, 72], ['and', 1, 69], ['spoon', 4, 66], ['', .5]],
  [{ voice: 'm+f' }, ['So', .5, 67], ['shine', 1, 71], ['on,', .5, 72], ['shine', 1.5, 71], ['on', .5, 72], ['har-', .5, 74], ['vest', .5, 72], ['moon,', 3, 71]],
  [['for', 1, 74], ['me', 1, 71], ['and', 1, 67], ['my', 1, 65], ['gal', 4, 64]],
]});
const L = SONG.lines, beat = SONG.beat, at = b => SONG.at(b);

/* ---- the backing: nylon guitar arpeggios; soft strings and piano under the chorus; the guide melody ---- */
const SCALE = [0, 2, 4, 5, 7, 9, 11];                       // C major pitch classes
const thirdBelow = m => { let n = m - 1; let steps = 0; while (steps < 2) { if (SCALE.includes(((n % 12) + 12) % 12)) steps++; if (steps < 2) n--; } return n; };
const notes = [];
for (const n of SONG.notes) {
  if (n.voice === 'm') notes.push({ ...n, inst: 'clarinet', v: .5 });
  else if (n.voice === 'f') notes.push({ ...n, inst: 'flute', v: .5 });
  else { notes.push({ ...n, inst: 'flute', v: .46 }); notes.push({ ...n, m: thirdBelow(n.m), inst: 'clarinet', v: .36 }); }
}
const CH = { E7: [40, 47, 52, 56, 62], A7: [45, 52, 55, 61, 64], D7: [38, 45, 50, 54, 60], G7: [43, 50, 55, 59, 65], C: [36, 48, 52, 55, 60] };
const HARM = ['G7', 'C', 'E7', 'E7', 'E7', 'E7', 'A7', 'A7', 'A7', 'A7', 'D7', 'D7', 'D7', 'D7', 'G7', 'G7', 'G7', 'C', 'C'];
const PAT = [0, 2, 3, 4, 1, 3, 4, 3];
HARM.forEach((h, i) => {
  const b0 = i * 4, ch = CH[h], chorus = i >= 10 && i < 18, last = i === HARM.length - 1;
  if (last) { ch.forEach((m, k) => notes.push({ t: at(b0) + k * .06, m, d: 3.6, inst: 'guitar', v: .34 })); return; }
  PAT.forEach((k, e) => notes.push({ t: at(b0 + e / 2), m: ch[k], d: beat * (e === 0 ? 2 : .9), inst: 'guitar', v: (e === 0 ? .36 : .25) + (e % 2 ? 0 : .03) }));
  if (chorus) {
    notes.push({ t: at(b0), m: ch[0] - 12 >= 28 ? ch[0] - 12 : ch[0], d: SONG.bar * .95, inst: 'piano', v: .3 });
    ch.slice(1, 4).forEach(m => notes.push({ t: at(b0), m: m + 12, d: SONG.bar, inst: 'slowstrings', v: .16 }));
  }
});
// intro melody on the guitar's top: for me and my gal, then into the first line
[[74, 1], [71, 1], [67, 1], [65, 1], [64, 2], [71, 2]].reduce((b, [m, d]) => { notes.push({ t: at(b), m, d: d * beat * .95, inst: 'guitar', v: .4 }); return b + d; }, 0);
const END = at(HARM.length * 4 - 4), DUR = END + 5;

/* ---- the singers: one half each; colour, name, where their panel and its contents sit ---- */
const FONT = K.SANS;
const SINGERS = {
  m: { name: 'Jack', initial: 'J', part: 'HIM', color: '#3fb4ff', rgb: '63,180,255', bg: ['#081226', '#0e2142'], y0: 0, y1: 960, cy: 330 },
  f: { name: 'Nora', initial: 'N', part: 'HER', color: '#ff5c9d', rgb: '255,92,157', bg: ['#220a1a', '#3a1029'], y0: 960, y1: 1920, cy: 1410 },
};
const BOTH = { name: 'Jack + Nora', color: '#ffd23f', rgb: '255,210,63' };    // the lines they sing together
const VOICES = { m: SINGERS.m.color, f: SINGERS.f.color, 'm+f': BOTH.color };
const who = v => SINGERS[v] || BOTH;
const SAFE_R = 900;                                         // nothing that matters right of this (the apps' buttons); nothing below 1536

// how much a singer's half glows at t: on while a line they sing is being sung, easing in just before and out just after
function glow(v, t) {
  let g = 0;
  for (const l of L) if (K.voiceNames(l.voice).includes(v)) g = Math.max(g, Math.min(K.ease.sine(K.seg(t, l.t0 - .45, l.t0 - .05)), 1 - K.ease.sine(K.seg(t, l.t1 + .15, l.t1 + .6))));
  return g;
}
// the singer's live level: the guide notes they sing, each with an attack, a settle and a release, and a little life in it
const VNOTES = { m: SONG.notes.filter(n => K.voiceNames(n.voice).includes('m')), f: SONG.notes.filter(n => K.voiceNames(n.voice).includes('f')) };
function level(v, t) {
  let a = 0;
  for (const n of VNOTES[v]) {
    if (t < n.t - .02 || t > n.t + n.d + .25) continue;
    const u = t - n.t, att = K.seg(u, 0, .05), settle = 1 - .3 * K.ease.out(K.seg(u, .05, .4)), rel = 1 - K.ease.out(K.seg(t, n.t + n.d, n.t + n.d + .22));
    a = Math.max(a, att * settle * rel * (.78 + (n.m - 62) * .015));
  }
  return K.cl(a * (.9 + .1 * K.noise(t * 11, v === 'm' ? 1 : 2)) + .025 * (1 + K.noise(t * 7, v === 'm' ? 3 : 4)) * .5);
}
const peak = (v, t) => { let p = 0; for (let k = 0; k <= 12; k++) p = Math.max(p, level(v, t - k * .06) - k * .012); return p; };

/* ---- a half of the screen ---- */
function panel(c, v, t) {
  const P = SINGERS[v], g = glow(v, t), h = P.y1 - P.y0, lv = level(v, t);
  c.save(); c.beginPath(); c.rect(0, P.y0, S.W, h); c.clip();
  const bg = c.createLinearGradient(0, P.y0, 0, P.y1); bg.addColorStop(0, P.bg[0]); bg.addColorStop(1, P.bg[1]);
  c.fillStyle = bg; c.fillRect(0, P.y0, S.W, h);
  // slow soft lights drifting in the panel; brighter while the singer sings
  for (let k = 0; k < 4; k++) {
    const x = S.W * (.15 + .7 * K.hash(k * 3 + (v === 'm' ? 1 : 9))) + 120 * Math.sin(t * .07 + k * 1.7);
    const y = P.y0 + h * (.15 + .7 * K.hash(k * 5 + (v === 'm' ? 2 : 8))) + 80 * Math.cos(t * .05 + k * 2.3), r = 260 + 140 * K.hash(k + 20);
    const b = c.createRadialGradient(x, y, 0, x, y, r); b.addColorStop(0, `rgba(${P.rgb},${.07 + .13 * g})`); b.addColorStop(1, `rgba(${P.rgb},0)`);
    c.fillStyle = b; c.fillRect(x - r, y - r, r * 2, r * 2);
  }
  // the glow: a wash of the singer's colour from their name outwards, and a lit rim round the half
  if (g > 0) {
    const w = c.createRadialGradient(170, P.cy, 40, 170, P.cy, 1000); w.addColorStop(0, `rgba(${P.rgb},${.5 * g})`); w.addColorStop(.55, `rgba(${P.rgb},${.16 * g})`); w.addColorStop(1, `rgba(${P.rgb},${.05 * g})`);
    c.fillStyle = w; c.fillRect(0, P.y0, S.W, h);
    c.save(); c.globalAlpha = g; c.strokeStyle = P.color; c.lineWidth = 10; c.shadowColor = P.color; c.shadowBlur = 60;
    c.strokeRect(5, P.y0 + 5, S.W - 10, h - 10); c.strokeRect(5, P.y0 + 5, S.W - 10, h - 10); c.restore();
  }
  c.restore();

  // the singer: a coloured disc with the initial, the name, the part, the meter
  const dim = .55 + .45 * g, R = 92, cx = 170, cy = P.cy;
  c.save();
  for (let k = 0; k < 2; k++) {                             // rings that open with the voice
    const a = lv * g * (k ? .25 : .45); if (a <= .01) continue;
    c.strokeStyle = `rgba(${P.rgb},${a})`; c.lineWidth = 6 - k * 2;
    c.beginPath(); c.arc(cx, cy, R + 14 + k * 18 + lv * (18 + k * 16), 0, K.TAU); c.stroke();
  }
  c.globalAlpha = dim;
  c.shadowColor = P.color; c.shadowBlur = 50 * g;
  const disc = c.createLinearGradient(cx - R, cy - R, cx + R, cy + R); disc.addColorStop(0, P.color); disc.addColorStop(1, `rgba(${P.rgb},.55)`);
  c.fillStyle = disc; c.beginPath(); c.arc(cx, cy, R, 0, K.TAU); c.fill(); c.shadowBlur = 0;
  c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 5; c.stroke();
  c.fillStyle = '#fff'; c.font = `700 104px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(P.initial, cx, cy + 6);
  c.textAlign = 'left'; c.textBaseline = 'alphabetic';
  c.font = `700 96px ${FONT}`; c.fillStyle = '#fff'; c.fillText(P.name, 300, cy - 4);
  const nw = c.measureText(P.name).width;
  c.font = `600 26px ${FONT}`; c.letterSpacing = '4px'; c.fillStyle = `rgba(${P.rgb},1)`; c.fillText(P.part, 300 + nw + 26, cy - 8);
  c.letterSpacing = '0px'; c.restore();
  // the meter: segments lit up to the level, white at the top end, a peak mark that falls back
  const N = 24, x0 = 300, x1 = SAFE_R, sw = (x1 - x0) / N, my = cy + 40, mh = 34, lit = lv * N, pk = Math.min(N - 1, Math.floor(peak(v, t) * N));
  for (let k = 0; k < N; k++) {
    const on = K.cl(lit - k), hot = k > N * .78;
    c.fillStyle = `rgba(255,255,255,${.09 * dim})`; c.beginPath(); c.roundRect(x0 + k * sw, my, sw - 6, mh, 5); c.fill();
    if (on > 0) { c.save(); c.globalAlpha = on; c.fillStyle = hot ? '#fff' : P.color; c.shadowColor = P.color; c.shadowBlur = 14; c.beginPath(); c.roundRect(x0 + k * sw, my, sw - 6, mh, 5); c.fill(); c.restore(); }
  }
  if (pk > 1 && pk >= lit) { c.fillStyle = `rgba(255,255,255,${.7 * dim})`; c.fillRect(x0 + pk * sw, my - 6, sw - 6, 4); }
}

/* ---- the lyrics card across the seam: the line being sung, the next one below, the last one fading above ---- */
const CARD = { x: 40, y: 548, w: 900, h: 720, r: 44 };
const LX = 84, SIZE = 94, WRAP = 820;
// line j sits at (j − pos) from the line being sung: where its centre is, how big, how visible; a sung line slides up and goes
const SLOTS = [[-2, 470, .7, 0], [-1, 650, .7, 0], [0, 845, 1, 1], [1, 1092, .7, .86], [2, 1300, .7, 0]];
function slot(d) {
  if (d <= -2) return SLOTS[0].slice(1); if (d >= 2) return SLOTS[4].slice(1);
  const i = Math.floor(d) + 2, u = d - Math.floor(d), A = SLOTS[i], B = SLOTS[Math.min(4, i + 1)];
  return [1, 2, 3].map(k => K.lerp(A[k], B[k], u));
}
// a line on at most two rows: a long one is set a little smaller rather than broken into three
function lay(c, line) {
  for (let size = SIZE; ; size -= 4) {
    const laid = K.layout(c, line, { font: FONT, weight: 700, size, x: LX, y: 0, maxWidth: WRAP, leading: 1.16 });
    if (laid.rows.length <= 2 || size <= 64) return laid;
  }
}
const UNSUNG = w => ({ fill: `rgba(${who(w.voice).rgb},.5)` });
const SUNG = w => ({ shadow: { color: `rgba(${who(w.voice).rgb},.85)`, blur: 22 } });
function tag(c, voice, x, y, a = 1) {                      // who sings the line: a small pill in their colour
  const s = who(voice), label = s.name.toUpperCase();
  c.save(); c.globalAlpha *= a; c.font = `700 30px ${FONT}`; c.letterSpacing = '4px';
  const w = c.measureText(label).width + 36;
  c.fillStyle = s.color; c.beginPath(); c.roundRect(x, y - 42, w, 52, 26); c.fill();
  c.fillStyle = '#0b0b14'; c.fillText(label, x + 19, y - 6); c.restore();
  return w;
}

window.__scene = K.scene(S, (c, t) => {
  panel(c, 'm', t); panel(c, 'f', t);
  c.fillStyle = '#04050a'; c.fillRect(0, 957, S.W, 6);       // the seam

  // the card: frosted glass over the two halves
  c.save(); c.beginPath(); c.roundRect(CARD.x, CARD.y, CARD.w, CARD.h, CARD.r); c.clip();
  c.filter = 'blur(28px)'; c.drawImage(c.canvas, 0, 0); c.filter = 'none';
  c.fillStyle = 'rgba(6,7,16,.62)'; c.fillRect(CARD.x, CARD.y, CARD.w, CARD.h);
  c.restore();
  c.save(); c.strokeStyle = 'rgba(255,255,255,.12)'; c.lineWidth = 2; c.beginPath(); c.roundRect(CARD.x, CARD.y, CARD.w, CARD.h, CARD.r); c.stroke(); c.restore();
  c.save(); c.font = `600 26px ${FONT}`; c.letterSpacing = '4px'; c.fillStyle = 'rgba(255,255,255,.5)';
  c.fillText('♪  SHINE ON, HARVEST MOON', LX, CARD.y + 62); c.restore();

  // title in the intro
  const ti = K.ease.sine(K.seg(t, .3, 1.2)) * (1 - K.ease.sine(K.seg(t, L[0].t0 - 3.9, L[0].t0 - 3.3)));
  if (ti > 0) {
    c.save(); c.globalAlpha = ti; c.fillStyle = '#fff'; c.font = `700 112px ${FONT}`;
    c.fillText('Shine On,', LX, 850); c.fillText('Harvest Moon', LX, 980);
    c.font = `500 38px ${FONT}`; c.fillStyle = 'rgba(255,255,255,.75)'; c.fillText('a duet for', LX, 1080);
    let x = LX + c.measureText('a duet for ').width + 6; x += tag(c, 'm', x, 1090) + 14; tag(c, 'f', x, 1090);
    c.font = `500 28px ${FONT}`; c.fillStyle = 'rgba(255,255,255,.5)'; c.fillText('Nora Bayes & Jack Norworth, 1908', LX, 1170);
    c.restore();
  }

  // the lines: they come in a little before the first is sung, scroll a line at a time, and give way to the end card
  const pos = K.scroll(SONG, t, { move: .5 }), inA = K.seg(t, L[0].t0 - 3.2, L[0].t0 - 2.6), outA = 1 - K.seg(t, END + .8, END + 1.4);
  c.save(); c.beginPath(); c.roundRect(CARD.x, CARD.y + 84, CARD.w, CARD.h - 84, CARD.r); c.clip();
  L.forEach((line, j) => {
    const [yc, sc, a0] = slot(j - pos), a = a0 * inA * outA; if (a <= .01) return;
    const laid = lay(c, line);
    const cy0 = (-laid.ascent + laid.rows.at(-1).y + laid.descent) / 2;
    c.save(); c.globalAlpha = a; c.translate(LX, yc); c.scale(sc, sc); c.translate(-LX, -cy0);
    K.sing(c, laid, t, { unsung: UNSUNG, sung: SUNG, voices: VOICES, edge: 6, glow: { blur: 16, alpha: .6 } });
    const tw = tag(c, line.voice, LX, -laid.ascent - 26);
    if (j === 0) {                                          // count-in: four dots in Jack's colour, one goes out on each beat
      const n = K.countdown(t, line.t0, beat, 4);
      for (let k = 0; k < n; k++) { c.fillStyle = who(line.voice).color; c.beginPath(); c.arc(LX + tw + 34 + k * 40, -laid.ascent - 42, 12, 0, K.TAU); c.fill(); }
    }
    c.restore();
  });
  c.restore();

  // end card: the two of them, and the song's credit
  const ea = K.ease.sine(K.seg(t, END + 1.4, END + 2.2));
  if (ea > 0) {
    c.save(); c.globalAlpha = ea; c.font = `700 104px ${FONT}`;
    c.fillStyle = SINGERS.m.color; c.fillText('Jack', LX, 860);
    const w1 = c.measureText('Jack ').width; c.fillStyle = '#fff'; c.fillText('&', LX + w1, 860);
    const w2 = c.measureText('& ').width; c.fillStyle = SINGERS.f.color; c.fillText('Nora', LX + w1 + w2, 860);
    c.font = `600 44px ${FONT}`; c.fillStyle = '#fff'; c.fillText('Shine On, Harvest Moon', LX, 960);
    c.font = `500 30px ${FONT}`; c.fillStyle = 'rgba(255,255,255,.6)';
    c.fillText('Nora Bayes & Jack Norworth, 1908', LX, 1030); c.fillText('public domain  ·  duet backing track', LX, 1074);
    c.restore();
  }
}, {
  duration: DUR, background: '#04050a',
  music: { notes },
  timeline: L.map(l => ({ t0: l.t0, t1: l.t1, text: l.text, voice: l.voice })),
});
</script>
