<!doctype html>
<meta charset="utf-8">
<title>Shine On, Harvest Moon · KTV duet backing track</title>
<style>html,body{margin:0;background:#000}canvas{display:block;max-width:100vw;max-height:100vh}</style>
<canvas></canvas>
<script src="../../lib/karaoke/karaoke.js"></script>
<script>
/* "Shine On, Harvest Moon" (Nora Bayes and Jack Norworth, 1908, public domain), the chorus, as a KTV duet backing track:
   he sings the opening, she answers with the months, he takes the snow-time couplet, and they sing the last two lines together.
   No lead vocal: the timing comes from the melody, which is also the guide (clarinet for him, flute for her, both together with
   the clarinet a third below). The chorus walks the ragtime circle E7 - A7 - D7 - G7 - C.
   Same picture as the template: the apartment block across the street at night, the stairwell lights climbing as she sings,
   a kitchen lighting up, and the camera pulling back as the windows come on. */
const K = Karaoke, S = K.create({ width: 1920, height: 1080 });
const BPM = 78, INTRO = 2;                                  // C major
const SONG = K.score({ bpm: BPM, meter: 4, start: .6, inst: 'flute', v: .5, lines: [
  [{ at: INTRO * 4, voice: 'm' }, ['Shine', 1.5, 68], ['on,', .5, 69], ['shine', 1.5, 68], ['on', .5, 69], ['har-', .5, 71], ['vest', .5, 69], ['moon', 3, 68]],
  [['up', 1, 64], ['in', 1, 66], ['the', 1, 68], ['sky', 4, 71], ['', 1]],
  [{ voice: 'f' }, ['', 1], ['I', .5, 73], ['ain\'t', .5, 74], ['had', 1, 73], ['no', 1, 69], ['lov-', 1, 67], ['in\'', 1, 69], ['since', 2, 73]],
  [['Jan-', .5, 76], ['u-', .5, 73], ['ar-', .5, 69], ['y,', .5, 67], ['Feb-', .5, 76], ['ru-', .5, 73], ['ar-', .5, 69], ['y,', .5, 67],
   ['June', 1, 69], ['or', .5, 72], ['Ju-', .5, 73], ['ly', 2, 73]],
  [{ voice: 'm' }, ['Snow', 1.5, 74], ['time', .5, 72], ['ain\'t', 1, 69], ['no', 1, 66], ['time', 1, 69], ['to', 1, 72], ['stay', 2, 74]],
  [['out-', 1, 74], ['doors', 1, 72], ['and', 1, 69], ['spoon', 4, 66], ['', .5]],
  [{ voice: 'm+f' }, ['So', .5, 67], ['shine', 1, 71], ['on,', .5, 72], ['shine', 1.5, 71], ['on', .5, 72], ['har-', .5, 74], ['vest', .5, 72], ['moon,', 3, 71]],
  [['for', 1, 74], ['me', 1, 71], ['and', 1, 67], ['my', 1, 65], ['gal', 4, 64]],
]});
const L = SONG.lines, beat = SONG.beat, bar = SONG.bar, at = b => SONG.at(b);

/* ---- the backing: nylon guitar arpeggios; soft strings and piano under the chorus; the guide melody ---- */
const SCALE = [0, 2, 4, 5, 7, 9, 11];                       // C major pitch classes
const thirdBelow = m => { let n = m - 1; let steps = 0; while (steps < 2) { if (SCALE.includes(((n % 12) + 12) % 12)) steps++; if (steps < 2) n--; } return n; };
const notes = [];
for (const n of SONG.notes) {
  if (n.voice === 'm') notes.push({ ...n, inst: 'clarinet', v: .5 });
  else if (n.voice === 'f') notes.push({ ...n, inst: 'flute', v: .5 });
  else { notes.push({ ...n, inst: 'flute', v: .46 }); notes.push({ ...n, m: thirdBelow(n.m), inst: 'clarinet', v: .36 }); }
}
const CH = { E7: [40, 47, 52, 56, 62], A7: [45, 52, 55, 61, 64], D7: [38, 45, 50, 54, 60], G7: [43, 50, 55, 59, 65], C: [36, 48, 52, 55, 60] };
const HARM = ['G7', 'C', 'E7', 'E7', 'E7', 'E7', 'A7', 'A7', 'A7', 'A7', 'D7', 'D7', 'D7', 'D7', 'G7', 'G7', 'G7', 'C', 'C'];
const PAT = [0, 2, 3, 4, 1, 3, 4, 3];
HARM.forEach((h, i) => {
  const b0 = i * 4, ch = CH[h], chorus = i >= 10 && i < 18, last = i === HARM.length - 1;
  if (last) { ch.forEach((m, k) => notes.push({ t: at(b0) + k * .06, m, d: 3.6, inst: 'guitar', v: .34 })); return; }
  PAT.forEach((k, e) => notes.push({ t: at(b0 + e / 2), m: ch[k], d: beat * (e === 0 ? 2 : .9), inst: 'guitar', v: (e === 0 ? .36 : .25) + (e % 2 ? 0 : .03) }));
  if (chorus) {
    notes.push({ t: at(b0), m: ch[0] - 12 >= 28 ? ch[0] - 12 : ch[0], d: bar * .95, inst: 'piano', v: .3 });
    ch.slice(1, 4).forEach(m => notes.push({ t: at(b0), m: m + 12, d: bar, inst: 'slowstrings', v: .16 }));
  }
});
// intro melody on the guitar's top: for me and my gal, then into the first line
[[74, 1], [71, 1], [67, 1], [65, 1], [64, 2], [71, 2]].reduce((b, [m, d]) => { notes.push({ t: at(b), m, d: d * beat * .95, inst: 'guitar', v: .4 }); return b + d; }, 0);
const END = at(HARM.length * 4 - 4), DUR = END + 5;

/* ---- the building across the street ---- */
const VOICES = { m: '#2f6dff', f: '#ff3f7a' }, TOGETHER = '#16b866';     // KTV: him blue, her red, both green
const colorOf = v => VOICES[v] || TOGETHER;
const MARK = { m: 'HIM', f: 'HER', 'm+f': 'BOTH' };
const FLOORS = 14, FH = 230, FW = 2600, WALL_TOP = 260;      // world: x 0..FW, y grows downward; floor 1 at the bottom
const floorY = f => WALL_TOP + (FLOORS - f) * FH;           // top of floor f
const HOME = 9;                                             // the floor they live on
// one floor's windows, the same on every floor: [x, w, h, kind]; the stairwell is between the two flats
const ROW = [[120, 300, 140, 'living'], [500, 150, 140, 'bed'], [720, 110, 110, 'kitchen'], [1010, 300, 140, 'living'], [1390, 150, 140, 'bed'],
  [1610, 110, 110, 'kitchen'], [1900, 300, 140, 'living'], [2280, 150, 140, 'bed']];
const STAIR_X = 900, STAIR_W = 60;                          // narrow stairwell windows at half-floor heights
const H = (...a) => K.hash(a.reduce((s, v, i) => s + v * (i * 31.7 + 7.3), 0));
const WIN = [];
for (let f = 1; f <= FLOORS; f++) ROW.forEach(([x, w, h, kind], j) => {
  const r = H(f, j), r2 = H(f, j, 3);
  // who is home: some lit from the start, more come on during the chorus, the rest stay dark
  const on = r < .26 ? -1 : r < .72 ? L[4].t0 + r2 * (END - L[4].t0 - 2) : Infinity;
  WIN.push({ f, j, x, y: floorY(f) + 46, w, h, kind, on, cool: H(f, j, 5) < .22, curtain: H(f, j, 7), ac: kind !== 'kitchen' && H(f, j, 9) < .45 });
});
const homeKitchen = WIN.find(w => w.f === HOME && w.j === 2); homeKitchen.on = L[3].words[2].t0;   // June
WIN.filter(w => w.f === HOME && w.j < 2).forEach(w => { w.on = Infinity; });
WIN.find(w => w.f === HOME && w.j === 0).on = L[4].t0 + .5;
// stairwell: the sound-activated lights go on floor by floor while her first line is sung, and off again a while later
const climb0 = L[2].t0 - .2, climbStep = (L[2].words.at(-1).t0 + .3 - climb0) / HOME;
const stairOn = f => climb0 + (f - 1) * climbStep, stairOff = f => f === HOME ? L[5].t0 + 2 : stairOn(f) + 7;

function camera(t) {                                        // which part of the building is on screen: centre (world) and zoom
  const yFloor = f => floorY(f) + FH * .5;
  const keys = [
    [0, FW * .36, yFloor(2) - 40, 1.0],
    [L[2].t0 - .5, FW * .36, yFloor(3), 1.0],
    [L[2].words.at(-1).t0 + .4, FW * .33, yFloor(HOME) + 60, 1.12],
    [L[4].t0 - .3, FW * .32, yFloor(HOME) + 40, 1.18],
    [END + 2, FW * .5, floorY(FLOORS) + 420, .76],               // back far enough to see the upper floors and the roof, never past the wall's edges
  ];
  let k = 0; while (k < keys.length - 2 && t > keys[k + 1][0]) k++;
  const [t0, x0, y0, z0] = keys[k], [t1, x1, y1, z1] = keys[k + 1], u = K.ease.sine(K.seg(t, t0, t1));
  return { x: K.lerp(x0, x1, u), y: K.lerp(y0, y1, u), z: Math.exp(K.lerp(Math.log(z0), Math.log(z1), u)) };
}

function windowGlass(c, w, lit, t) {
  const { x, y, w: ww, h } = w;
  if (lit <= 0) {                                          // dark: the night sky reflected
    const g = c.createLinearGradient(x, y, x + ww * .6, y + h); g.addColorStop(0, '#1d2742'); g.addColorStop(1, '#0d1220');
    c.fillStyle = g; c.fillRect(x, y, ww, h); return;
  }
  const warm = w.cool ? ['#cfe0ff', '#86a6dc'] : w.kind === 'kitchen' ? ['#fff1c9', '#f3c46e'] : ['#ffd89a', '#e9a24c'];
  c.save(); c.globalAlpha = lit;
  c.shadowColor = w.cool ? 'rgba(150,185,255,.5)' : 'rgba(255,180,90,.55)'; c.shadowBlur = 40;
  const g = c.createLinearGradient(x, y, x, y + h); g.addColorStop(0, warm[0]); g.addColorStop(1, warm[1]);
  c.fillStyle = g; c.fillRect(x, y, ww, h); c.shadowBlur = 0;
  if (w.kind !== 'kitchen') {                              // curtains drawn part-way, a shade darker
    const k = w.curtain; c.fillStyle = w.cool ? 'rgba(60,80,130,.45)' : 'rgba(150,80,30,.42)';
    if (k < .5) c.fillRect(x, y, ww * (.18 + k * .5), h); else c.fillRect(x + ww * (1.12 - k * .6), y, ww * (k * .6 - .12), h);
  } else {                                                 // kitchen: a range hood's shadow and a shelf line
    c.fillStyle = 'rgba(120,70,20,.25)'; c.fillRect(x, y, ww, h * .22); c.fillRect(x, y + h * .62, ww, 3);
  }
  c.restore();
}

function building(c, t) {
  const cam = camera(t);
  c.save();
  c.translate(S.W / 2, S.H / 2); c.scale(cam.z, cam.z); c.translate(-cam.x, -cam.y);
  // sky above the roof
  const sky = c.createLinearGradient(0, WALL_TOP - 900, 0, WALL_TOP); sky.addColorStop(0, '#070b18'); sky.addColorStop(1, '#1a2340');
  c.fillStyle = sky; c.fillRect(-2000, WALL_TOP - 1600, FW + 4000, 1600);
  // the wall, lit faintly orange from the street below
  const wall = c.createLinearGradient(0, WALL_TOP, 0, floorY(0));
  wall.addColorStop(0, '#22252f'); wall.addColorStop(.75, '#2b2c33'); wall.addColorStop(1, '#4a3a30');
  c.fillStyle = wall; c.fillRect(0, WALL_TOP, FW, FLOORS * FH + 40);
  c.fillStyle = '#0b0d14'; c.fillRect(-2000, WALL_TOP, 2000, FLOORS * FH + 400); c.fillRect(FW, WALL_TOP, 2000, FLOORS * FH + 400);
  c.fillStyle = '#30323b'; c.fillRect(-20, WALL_TOP - 24, FW + 40, 26);       // roof parapet
  for (let f = 1; f <= FLOORS; f++) { c.fillStyle = 'rgba(255,255,255,.035)'; c.fillRect(0, floorY(f) + FH - 10, FW, 10); }   // floor slabs
  // stairwell column
  c.fillStyle = 'rgba(0,0,0,.18)'; c.fillRect(STAIR_X - 40, WALL_TOP, STAIR_W + 80, FLOORS * FH);
  for (let f = 1; f <= FLOORS; f++) {
    const y = floorY(f) + FH * .55, on = Math.min(K.seg(t, stairOn(f), stairOn(f) + .12), 1 - K.seg(t, stairOff(f), stairOff(f) + .3));
    windowGlass(c, { x: STAIR_X, y, w: STAIR_W, h: 120, kind: 'stair', cool: false }, f <= HOME ? on : 0, t);
    if (f <= HOME && on > 0) { c.save(); c.globalAlpha = on * .9; c.fillStyle = '#fff3d6'; c.fillRect(STAIR_X + 22, y + 10, 16, 8); c.restore(); }
    c.strokeStyle = '#3b3e48'; c.lineWidth = 6; c.strokeRect(STAIR_X, y, STAIR_W, 120);
  }
  // flats
  for (const w of WIN) {
    const lit = w.on === -1 ? 1 : K.ease.out(K.seg(t, w.on, w.on + .35));
    windowGlass(c, w, lit, t);
    c.strokeStyle = '#3b3e48'; c.lineWidth = 8; c.strokeRect(w.x, w.y, w.w, w.h);
    c.lineWidth = 5; c.beginPath(); c.moveTo(w.x + w.w / 2, w.y); c.lineTo(w.x + w.w / 2, w.y + w.h); c.stroke();
    if (w.kind === 'living') { c.strokeStyle = '#464955'; c.lineWidth = 4; for (let k = 0; k < 2; k++) { c.beginPath(); c.moveTo(w.x - 14, w.y + w.h + 18 + k * 22); c.lineTo(w.x + w.w + 14, w.y + w.h + 18 + k * 22); c.stroke(); } }
    if (w.ac) {                                            // air-conditioner box under the window
      const ax = w.x + w.w - 120, ay = w.y + w.h + 62;
      c.fillStyle = '#3d3f47'; c.fillRect(ax, ay, 110, 70); c.strokeStyle = '#2c2e35'; c.lineWidth = 3;
      c.beginPath(); c.arc(ax + 72, ay + 35, 24, 0, K.TAU); c.stroke();
      for (let k = 0; k < 4; k++) { c.beginPath(); c.moveTo(ax + 10, ay + 14 + k * 14); c.lineTo(ax + 40, ay + 14 + k * 14); c.stroke(); }
    }
  }
  c.restore();
}

/* ---- lyrics ---- */
const FONT = K.SANS, SIZE = 80;
const ROWS = [{ x: 260, y: 890, align: 'left' }, { x: 1700, y: 1010, align: 'right' }];
const UNSUNG = { fill: '#fbfaf6', stroke: 'rgba(12,12,18,.92)', strokeWidth: 6, shadow: { color: 'rgba(0,0,0,.5)', blur: 10, y: 3 } };
const SUNG = { stroke: '#ffffff', strokeWidth: 6 };
function mark(c, voice, x, y, a = 1) {                     // a small label: who sings from here
  c.save(); c.globalAlpha *= a; c.fillStyle = colorOf(voice); c.strokeStyle = '#fff'; c.lineWidth = 3;
  const w = markW(c, voice);
  c.beginPath(); c.roundRect(x, y - 52, w, 58, 12); c.fill(); c.stroke();
  c.font = `700 28px ${FONT}`; c.letterSpacing = '2px'; c.fillStyle = '#fff'; c.textAlign = 'center'; c.fillText(MARK[voice], x + w / 2 + 1, y - 13); c.restore();
}
function markW(c, voice) {                                 // the label's width: the word plus padding
  c.save(); c.font = `700 28px ${FONT}`; c.letterSpacing = '2px'; const w = c.measureText(MARK[voice]).width + 30; c.restore(); return Math.max(58, w);
}

window.__scene = K.scene(S, (c, t) => {
  building(c, t);
  K.vignette(c, .5);
  K.scrim(c, 810, 1050, .5, 110);

  // title card in the intro: song, who sings which colour
  const ti = K.ease.sine(K.seg(t, .3, 1.4)) * (1 - K.ease.sine(K.seg(t, L[0].t0 - 3.4, L[0].t0 - 2.5)));
  if (ti > 0) {
    c.save(); c.globalAlpha = ti; c.lineJoin = 'round';
    c.font = `700 124px ${FONT}`; c.letterSpacing = '4px';
    c.strokeStyle = 'rgba(12,12,18,.9)'; c.lineWidth = 12; c.strokeText('Shine On, Harvest Moon', 260, 430); c.fillStyle = '#fbfaf6'; c.fillText('Shine On, Harvest Moon', 260, 430);
    c.font = `500 36px ${FONT}`; c.letterSpacing = '2px'; c.lineWidth = 6;
    const sub = 'Duet  ·  backing track      Nora Bayes & Jack Norworth, 1908';
    c.strokeText(sub, 266, 510); c.fillText(sub, 266, 510);
    let mx = 266; ['m', 'f', 'm+f'].forEach(v => { mark(c, v, mx, 610); mx += markW(c, v) + 24; });
    c.restore();
  }

  // count-in: four dots in the first voice's colour, one goes out on each beat
  const n = K.countdown(t, L[0].t0, beat, 4);
  if (n > 0) for (let k = 0; k < n; k++) {
    c.save(); c.fillStyle = colorOf(L[0].voice); c.strokeStyle = '#fff'; c.lineWidth = 4;
    c.beginPath(); c.arc(ROWS[0].x + 22 + k * 46, ROWS[0].y - SIZE - 22, 13, 0, K.TAU); c.fill(); c.stroke(); c.restore();
  }

  // two rows, taking turns; a mark at the start of every line and wherever the voice changes
  for (const s of K.ktv(SONG, t, { lead: 3.2, after: .4, hold: 2 })) {
    const R = ROWS[s.row], laid = K.layout(c, s.line, { font: FONT, weight: 600, size: SIZE, x: R.x, y: R.y, align: R.align, tracking: 6 });
    c.save(); c.globalAlpha = s.a;
    K.sing(c, laid, t, { unsung: UNSUNG, sung: SUNG, voices: VOICES, together: TOGETHER, edge: 3 });
    let prev = null;
    for (const w of laid.rows[0].words) {
      if (w.voice !== prev) mark(c, w.voice, w.x - markW(c, w.voice) - 22, R.y + 4);
      prev = w.voice;
    }
    c.restore();
  }
}, {
  duration: DUR, background: '#070a12',
  music: { notes },
  timeline: L.map(l => ({ t0: l.t0, t1: l.t1, text: l.text, voice: l.voice })),
});
</script>
