<!doctype html>
<meta charset="utf-8">
<title>Fade &amp; Co. — the shopfront photo, the sign switched on for the first time</title>
<style>html, body { margin: 0; background: #000; } canvas { display: block; max-width: 100vw; max-height: 100vh; margin: auto; }</style>
<canvas></canvas>
<script src="../../lib/neon-sign/neon.js"></script>
<script>
// A neighbourhood barbershop in Bushwick, the owner's own photo of the front at dusk: brick, the pole, the lit chairs inside all as shot.
// The blank black panel over the door and the window gets the new sign: "Fade" jumps on first, "& Co." only flickers at its electrode for a while before it catches, BARBERS comes on last in one go.
// The phone sits across the street and doesn't move; a fine drizzle, a pink streak appears on the wet sidewalk.
const N = Neon, W = 1080, H = 1440, DUR = 12;
window.__scene = N.scene(async () => {
  const S = N.stage({ width: W, height: H });
  const plate = await N.photo('media/shopfront.jpg', { w: W, h: H, focus: [.5, .25] });   // the owner's own photo; the dark panel over the door and window is where the sign goes

  const fade = await N.text('Fade', { font: '400 184px "SignPainter"', x: 392, y: 346 });
  const co = await N.text('& Co', { font: '400 184px "SignPainter"', x: 708, y: 346 });
  const sub = await N.text('BARBERS', { font: '200 44px "Avenir Next"', x: 542, y: 446, spacing: 30 });
  const tubes = [
    ...[fade, [...co.paths, N.circle(850, 392, 4)]].map((w, i) => N.tube(w, { gas: 'pink', width: 8, at: [2.0, 2.3][i], style: i === 1 ? 'stubborn' : 'stutter', trying: 1.6, seed: 4 + i, supports: 120 })),
    ...N.tubes(sub, { gas: 'warmwhite', width: 5, at: 4.3, style: 'snap', supports: 0 }),
  ];
    const sign = N.sign({
    stage: S, tubes, wall: plate, res: 1,
    ambient: '#e8ebf2',                                                        // the photo is already dusk: leave it nearly as it is
    floor: N.floor(1196, { w: W, h: H, bare: true, sheen: .5, puddles: 10 }),  // the photo's wet sidewalk, below the doorstep
    reflect: { light: true, strength: .8, ripple: 4, squash: .3 },
    wires: [N.cable([856, 300], [846, -20], 0, { width: 5, color: '#1a1a1c' }), N.cable([856, 300], [826, 352], 10, { width: 4, color: '#1a1a1c' })],   // up the brick to the transformer on the floor above
    spill: 3, bloom: .9, shadowAlpha: .3, vignette: .25,
  });
  return {
    duration: DUR,
    draw: t => { sign.draw(t); N.rain(S.ctx, t, { n: 110, alpha: .1, length: 30, speed: 1600, color: '#cfd6e6' }); },
    sounds: [{ kind: 'street', t: 0, dur: DUR, v: .3 }, { kind: 'rain', t: 0, dur: DUR, v: .25 }, { kind: 'clack', t: 1.6, v: .7, pan: .2 },
             ...sign.sounds(DUR, { hz: 100, hum: .8 })],
    // someone inside tries a few notes on a guitar once the sign is lit
    music: { notes: [55, 59, 62, 66, 64].map((m, i) => ({ t: 6.6 + i * .42, m, d: 2.4, inst: 'guitar', v: .34 })).concat([{ t: 9.0, m: 52, d: 2.6, inst: 'guitar', v: .3 }, { t: 9.02, m: 59, d: 2.6, inst: 'guitar', v: .26 }]) },
  };
});
</script>
