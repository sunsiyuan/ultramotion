<!doctype html>
<meta charset="utf-8">
<title>金記冰室 — 落雨夜，招牌通電</title>
<style>html, body { margin: 0; background: #000; } canvas { display: block; max-width: 100vw; max-height: 100vh; margin: auto; }</style>
<canvas></canvas>
<script src="../../lib/neon-sign/neon.js"></script>
<script>
// 落雨的夜晚，一條舊街。冰室裏面早就開著燈，門口的豎招牌這時才通電：外框先跳，四個字一個個打著，
// 「冰」字那根管子老了，只在電極那頭閃了一陣才整根亮起；積水的路面上倒出一片紅綠。
const N = Neon, W = 1080, H = 1920, WW = 1080, HH = 1920, DUR = 14, FLOOR = 1430;
window.__scene = N.scene(async () => {
  const S = N.stage({ width: W, height: H });
  const P = { x: 310, y: 120, w: 460, h: 1000 };                                   // the sign's steel backing

  const name = await N.text('金記冰室', { font: '400 205px "Weibei TC"', x: 540, y: 560, vertical: true, gap: 218, mode: 'outline', inset: 6 });
  const en = await N.text('KAM KEE CAFE', { font: '500 46px "Futura"', x: 540, y: 1052, spacing: 4 });

  const tubes = [
    N.tube([N.rect(P.x + 24, P.y + 24, P.w - 48, P.h - 48, 18)], { gas: 'green', width: 10, at: 2.0, style: 'stutter', seed: 3 }),
    ...N.tubes(name, { gas: 'red', width: 8, at: i => [2.4, 2.6, 2.65, 2.85][i], style: i => i === 2 ? 'stubborn' : 'stutter', trying: 1.7, seed: i => 11 + i }),
    N.tube(en, { gas: 'warmwhite', width: 6, at: 3.6, style: 'snap' }),
  ];
  const box = { x: P.x + 300, y: P.y - 100, w: 110, h: 76 };
  const sign = N.sign({
    stage: S, size: [WW, HH], tubes, ambient: '#2d3650',
    wall: N.wall('tile', { w: WW, h: HH, tile: 24, colors: ['#cfc8ab', '#bdb89c', '#a9b7a2', '#c4c9b6'], grout: '#6d695e', seed: 8 }),
    floor: N.floor(FLOOR, { w: WW, h: HH, kind: 'asphalt', puddles: 16, sheen: .22 }),
    paint: g => {
      // the shopfront under the sign: a lintel, then dark glass down to the pavement
      N.panel(g, { x: 0, y: 1190, w: WW, h: 44, radius: 0, color: '#3a3430' });
      g.fillStyle = '#15191c'; g.fillRect(40, 1234, WW - 80, FLOOR - 1234);
      for (const x of [40, 380, 700, WW - 40]) { g.fillStyle = '#2c2f31'; g.fillRect(x - 8, 1234, 16, FLOOR - 1234); }
      g.fillStyle = 'rgba(255,255,255,.05)'; for (const x of [120, 450, 760]) { g.beginPath(); g.moveTo(x, 1234); g.lineTo(x + 90, 1234); g.lineTo(x + 30, FLOOR); g.lineTo(x - 60, FLOOR); g.fill(); }
      // two steel arms holding the sign off the wall
      for (const y of [P.y + 60, P.y + P.h - 60]) { g.fillStyle = 'rgba(0,0,0,.5)'; g.fillRect(0, y + 10, P.x, 18); g.fillStyle = '#3c3f42'; g.fillRect(0, y, P.x, 16); g.fillStyle = 'rgba(255,255,255,.18)'; g.fillRect(0, y, P.x, 3); }
      N.panel(g, { x: P.x, y: P.y, w: P.w, h: P.h, radius: 6, color: '#241b1b', screws: true });
    },
    box, wires: [N.cable([box.x + 20, box.y + box.h], [P.x + 280, P.y + 30], 6, { width: 7 })],
    reflect: { strength: .95, ripple: 7 },
  });
  const cam = t => N.camera([[0, { x: 540, y: 960, z: 1.0 }], [DUR, { x: 540, y: 880, z: 1.08 }]], t);
  return {
    duration: DUR,
    draw: t => { sign.draw(t, { camera: cam(t) }); N.rain(S.ctx, t, { n: 320, color: '#d6dcff', alpha: .2 }); },
    sounds: [{ kind: 'rain', t: 0, dur: DUR, v: .7 }, { kind: 'street', t: 0, dur: DUR, v: .4 }, { kind: 'clack', t: 1.7, v: .8 }, ...sign.sounds(DUR, { hz: 100 })],
  };
});
</script>
