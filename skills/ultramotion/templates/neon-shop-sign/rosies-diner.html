<!doctype html>
<meta charset="utf-8">
<title>Rosie's Diner — the OPEN sign that takes its time</title>
<style>html, body { margin: 0; background: #000; } canvas { display: block; max-width: 100vw; max-height: 100vh; margin: auto; }</style>
<canvas></canvas>
<script src="../../lib/neon-sign/neon.js"></script>
<script>
// A roadside diner a little before 5 a.m.: the cook throws the switch, the script and DINER come up,
// and the N of OPEN, on a tired electrode, buzzes at one end for two seconds before it catches.
const N = Neon, W = 1920, H = 1080, DUR = 12;
window.__scene = N.scene(async () => {
  const S = N.stage({ width: W, height: H });

  const rosie = await N.text("Rosie's", { font: '400 300px "SignPainter"', x: 760, y: 300 });
  const diner = await N.text('DINER', { font: '700 210px "Futura"', x: 800, y: 640, mode: 'outline', inset: 9, spacing: 18 });
  const open = await N.text('OPEN', { font: '500 118px "Avenir Next"', x: 1580, y: 600, spacing: 6 });
  const swoosh = N.line([[420, 455], [700, 470], [1000, 450], [1230, 405]], 60);   // the tail under the script

  const tubes = [
    N.tube(rosie, { gas: 'pink', width: 14, at: 1.2, style: 'stutter', seed: 4 }),             // a script word is one bent tube
    N.tube([swoosh], { gas: 'pink', width: 14, at: 1.45, style: 'faulty', seed: 9, every: 3.2 }),
    ...N.tubes(diner, { gas: 'ice', width: 9, at: i => 2.35 + i * .09, style: 'snap' }),
    N.tube([N.rect(1385, 500, 390, 200, 46)], { gas: 'blue', width: 10, at: 3.25, style: 'warm', seed: 2 }),
    ...N.tubes(open, { gas: 'red', width: 11, at: i => i === 3 ? 3.95 : 3.65 + i * .1, style: i => i === 3 ? 'stubborn' : 'snap', trying: 2.1, seed: i => 20 + i }),
  ];
  const first = tubes[0].ends[0], box = { x: 70, y: 560, w: 120, h: 170 };
  const sign = N.sign({
    stage: S, tubes, ambient: '#2b3552', 
    wall: N.wall('brick', { w: W, h: H, color: '#6e3426', seed: 5 }),
    paint: g => {                                           // the steel band over the storefront, where the awning hangs
      N.panel(g, { x: -20, y: 930, w: W + 40, h: 170, radius: 0, color: '#1e2626', edge: 'rgba(255,255,255,.08)' });
      for (let x = 30; x < W; x += 110) { g.fillStyle = 'rgba(255,255,255,.18)'; g.beginPath(); g.arc(x, 952, 4, 0, 7); g.fill(); }
    },
    box, wires: [N.cable([box.x + box.w, box.y + 40], first, 120), N.cable([box.x + box.w, box.y + 120], [1385, 640], 160)],
  });
  const cam = t => N.camera([[0, { x: 960, y: 540, z: 1 }], [DUR, { x: 1040, y: 560, z: 1.07 }]], t);
  return {
    duration: DUR,
    draw: t => sign.draw(t, { camera: cam(t) }),
    sounds: [{ kind: 'street', t: 0, dur: DUR, v: .8 }, { kind: 'clack', t: 1.0, v: .9 }, ...sign.sounds(DUR, { hz: 120 })],
    music: null,
  };
});
</script>
