<!doctype html>
<meta charset="utf-8">
<title>还没睡 — 新歌封面的那块灯牌，贴着灯管拍</title>
<style>html, body { margin: 0; background: #000; } canvas { display: block; max-width: 100vw; max-height: 100vh; margin: auto; }</style>
<canvas></canvas>
<script src="../../lib/neon-sign/neon.js"></script>
<script>
// 一首叫《还没睡》的新歌，封面就是排练室墙上那块手写体灯牌。镜头斜着贴近灯管：近处的「还」大而清楚，越往右越远越虚。
// 蓝色的管子是氩气，慢慢亮起来；「睡」那根接触不好，只在一头闪，焦点这时慢慢移过去等它；最后右上角的小月亮亮了，焦点再往远处挪一点，把月亮也带进来。
const N = Neon, W = 1080, H = 1080, DUR = 11;
window.__scene = N.scene(async () => {
  const S = N.stage({ width: W, height: H });

  // lay it out flat, then turn the wall away from the camera: the left end is near, the right end far
  const title = await N.text('还没睡', { font: '400 260px "Hannotate SC"', x: 500, y: 590, spacing: 24 });
  const moon = N.circle(950, 400, 46, -2.2, 1.6);
  const flat = [60, 340, 1000, 420], quad = [[30, 250], [1050, 390], [1050, 710], [30, 890]];
  const t3 = N.warp(title, quad, flat), m3 = N.warp([moon], quad, flat), mk = t3.map.scale(950, 400);

  const tubes = [
    ...N.tubes(t3, { gas: 'blue', width: i => 12 * t3.chars[i].k, at: i => [1.3, 1.9, 2.4][i], style: i => ['warm', 'stutter', 'stubborn'][i], trying: 2.0, seed: i => 3 + i, supports: i => 170 * t3.chars[i].k }),
    N.tube(m3, { gas: 'warmwhite', width: 9 * mk, at: 5.6, style: 'snap', supports: 0 }),
  ];
  const sign = N.sign({
    stage: S, tubes, ambient: '#262a36',
    wall: N.wall('concrete', { w: W, h: H, color: '#6f6d6a', panel: [W * 2, H * 2], seed: 12 }),   // a bare rehearsal-room wall
    spill: 2.2, bloom: 1.1, shadow: [.15, 1.4], vignette: .45,
  });
  const cam = t => { const u = N.oc(t / DUR); return { x: 450 + 210 * u, y: 575 - 15 * u, z: 1.42 + .1 * u }; };   // close on the glass, sliding along the word, slowing
  // what the lens is focused on: 还, pulled over to 睡 while it struggles, then a little further, onto 睡 and the moon together (world x → screen x)
  const [c0, , c2] = t3.chars.map(c => c.box.cx), cm = N.bbox(m3).cx;
  const fx = t => { const wx = N.lerp(N.lerp(c0, c2, N.io(N.seg(t, 2.6, 3.8))), (c2 + cm) / 2, N.io(N.seg(t, 6.2, 7.6))), c = cam(t); return W / 2 + (wx - c.x) * c.z; };
  const keys = [[6.4, [50, 57, 62, 64]], [8.6, [48, 55, 60, 64]]].flatMap(([t, ch]) => ch.map((m, i) => ({ t: t + i * .05, m, d: 2.4, inst: 'keys', v: .3 })));
  return {
    duration: DUR,
    draw: t => { sign.draw(t, { camera: cam(t) }); N.focus(S.ctx, { at: [fx(t), H / 2], angle: 0, sharp: 80, falloff: 620, max: 32 }); },
    sounds: [{ kind: 'clack', t: 1.0, v: .55 }, ...sign.sounds(DUR, { hz: 100, hum: 1.1 })],
    music: { notes: keys },
  };
});
</script>
