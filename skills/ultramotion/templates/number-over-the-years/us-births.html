<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Births per year in the United States · 1950–2024</title>
<style>html,body{margin:0;background:#f2eee6}canvas{display:block;width:100vw;height:100vh;object-fit:contain}</style></head>
<body><canvas></canvas>
<script src="../../lib/data-story/trend.js"></script>
<script>
const T = Trend, { seg, oc, io, cl, lerp } = T;
window.__scene = T.withData(['data/births-us.json'], ([D]) => {
  const S = D.series, B = Object.fromEntries(S), W = 1080, H = 1920;
  const PAPER = '#f2eee6', INK = '#1b1a18', GREY = '#c4bcae', RED = '#c8372d', MUTE = 'rgba(27,26,24,.5)', SERIF = '"Iowan Old Style", "Georgia", "Times New Roman", serif';
  // a year of data per column; the column for year y grows while the clock runs from y to y + 1
  const E = T.create({ width: W, height: H, time: [
    [0, 1950.0], [2.6, 1950.5], [5.0, 1953.6], [8.0, 1957.0], [10.0, 1958.0], [12.0, 1958.0],
    [13.6, 1972.8], [15.0, 1974.0], [16.6, 1991.0], [18.4, 1991.0], [20.6, 2007.2], [21.8, 2008.0], [23.6, 2008.0], [28.0, 2025.0], [36, 2025.0]] });
  const box = [100, 700, 905, 1590];
  const DE = D.deaths, Dd = Object.fromEntries(DE), P = Object.fromEntries(D.population);  // every number on screen comes from here
  const M = v => (v / 1e6).toFixed(2), K = v => `${Math.round(v / 1e3).toLocaleString('en-US')},000`;
  const maxIn = (a, b) => S.filter(([y]) => y >= a && y <= b).reduce((p, q) => q[1] > p[1] ? q : p);
  const minIn = (a, b) => S.filter(([y]) => y >= a && y <= b).reduce((p, q) => q[1] < p[1] ? q : p);
  const last = S[S.length - 1], top = maxIn(1950, last[0]);                                  // the all-time high
  const boom = maxIn(1950, 1969), bust = minIn(1965, 1985), echo = maxIn(1975, 2000);       // the baby-boom peak, the bust, the echo
  const boomYears = S.filter(([y, v]) => y < boom[0] && v >= 4e6).map(([y]) => y), first4 = boomYears[0];
  const gap = S.filter(([y]) => y > top[0]).reduce((p, q) => q[1] - Dd[q[0]] < p[1] - Dd[p[0]] ? q : p); // the narrowest margin of births over deaths
  const fall = Math.round((1 - B[2020] / top[1]) * 100);
  const below = S.filter(([y, v]) => y < last[0] && v < last[1]).map(([y]) => y);         // earlier years with fewer births than the last
  const before = S.find(([y]) => !below.includes(y) && y < last[0])[0];                    // the first year: more were born then than now
  const beats = [
    { t: [0, 4.6], text: 'How many babies are born\nin the US each year, since 1950' },
    { t: [5.5, 9.3], text: `The baby boom:\n${first4} is the first year over 4 million`, years: boomYears },
    { t: [9.5, 12.8], text: `${boom[0]}: ${M(boom[1])} million born,\nthe baby-boom peak`, years: [boom[0]] },
    { t: [13.0, 15.8], text: `The baby bust: by ${bust[0]},\njust ${M(bust[1])} million`, years: [bust[0]] },
    { t: [16.0, 19.6], text: `${echo[0]}, an echo boom:\nthe boomers have children`, years: [echo[0]] },
    { t: [20.0, 23.4], text: `${top[0]}: ${M(top[1])} million,\nthe all-time high`, years: [top[0]] },
    { t: [23.6, E.tAt(gap[0]) - .1], text: `After the 2008 crash,\n${fall}% fewer by 2020`, years: S.filter(([y]) => y > top[0] && y <= 2020).map(([y]) => y) },
    { t: [E.tAt(gap[0]), 28.0], text: `${gap[0]}, the COVID year: only\n${K(gap[1] - Dd[gap[0]])} more births than deaths`, years: [gap[0]] },
    { t: [28.2, 36], text: `${last[0]}: ${M(last[1])} million,\n${K(top[1] - last[1])} fewer than ${top[0]}`, years: [last[0]] },
  ];
  const beatA = (b, t) => seg(t, b.t[0], b.t[0] + .45) * (1 - seg(t, b.t[1] - .35, b.t[1]));
  const flags = [
    { y: first4, text: `${first4} · ${M(B[first4])}M`, at: 7.0, out: 9.4, side: 1, dy: -150 },
    { y: boom[0], text: `${boom[0]} · ${M(boom[1])}M`, sub: 'baby-boom peak', at: 10.0, out: 36, side: 1, dy: -70, keep: .55 },
    { y: echo[0], text: `${echo[0]} · ${M(B[echo[0]])}M`, at: 16.6, out: 19.8, side: 1, dy: -80 },
    { y: top[0], text: `${top[0]} · ${M(top[1])}M`, sub: 'all-time high', at: 21.8, out: 36, side: -1, dy: -110, keep: .55 },
    { y: last[0], text: `${last[0]} · ${M(last[1])}M`, at: 28.0, out: 36, side: -1, dy: -60 },
  ];
  // longer lines get a smaller size, not a new layout: fit the widest line into the column of text
  const fit = (c, lines, size, font, weight, maxW = 880) => { c.save(); c.font = `${weight} ${size}px ${font}`; const w = Math.max(...lines.map(l => c.measureText(l).width)); c.restore(); return w > maxW ? size * maxW / w : size; };
  const kept = new Set([boom[0], top[0]]);

  const draw = (c, t) => {
    const now = E.realAt(t);
    // the axis follows what is standing: the top grows as the tallest column grows
    let tallest = 0; S.forEach(([y, v]) => { tallest = Math.max(tallest, v * oc(cl(now - y))); });
    const F = T.frame({ box, t: [1949.4, 2024.6], v: [0, Math.max(4.2e6, tallest * 1.1)] });
    const lit = new Set(); beats.forEach(b => { if (b.years && beatA(b, t) > .5) b.years.forEach(y => lit.add(y)); });
    const end = seg(t, 29.4, 31.4);                                           // the closing comparison: 1957, 2007 and 2024
    const keptAt = y => (y === boom[0] && t > 12.8) || (y === top[0] && t > 23.4);

    const cur = T.current(S, now);
    c.save(); T.camera(c, { cx: 540, cy: 1590, z: 1 + .045 * io(seg(t, 0, 36)) });              // a slow push in, the whole way
    T.year(c, cur.t + cl(now - cur.t, 0, .999), { x: 500, y: 1520, size: 400, color: 'rgba(27,26,24,.05)' });
    T.grid(c, F, { format: v => v ? `${v / 1e6}M` : '0', color: 'rgba(27,26,24,.1)', label: 'rgba(27,26,24,.42)', size: 24, minGap: 150, side: 'out' });
    T.columns(c, S, now, F, { width: .74, color: (y) => lit.has(y) || (end > 0 && (kept.has(y) || y === last[0])) ? RED : keptAt(y) ? '#b0a796' : GREY });
    // deaths, as a thin dark line over the columns: how close it comes to them is the margin of births over deaths
    const dh = T.line(c, DE, now, F, { color: 'rgba(27,26,24,.75)', width: 3, head: '#1b1a18', glow: false, clip: false });
    if (dh) T.text(c, 'Deaths', dh.x + 12, dh.y - 12, { size: 26, weight: 700, color: INK });
    T.timeAxis(c, F, { values: [1950, 1960, 1970, 1980, 1990, 2000, 2010, 2020], color: 'rgba(27,26,24,.45)', size: 26 });

    // the line at 2024's level, drawn back across every year
    if (t > 29.4) { const y = F.Y(last[1]), x1 = F.X(last[0]), x0 = lerp(x1, F.X(1950) - 8, io(seg(t, 29.4, 31.4)));
      c.save(); c.strokeStyle = RED; c.lineWidth = 3; c.setLineDash([10, 9]); c.beginPath(); c.moveTo(x1, y); c.lineTo(x0, y); c.stroke(); c.restore(); }

    flags.forEach(f => { const a = oc(seg(t, f.at, f.at + .4)) * (1 - seg(t, f.out - .3, f.out) * (1 - (f.keep || 0))); if (a <= 0) return;
      T.flag(c, F, f.y, B[f.y], { text: f.text, sub: f.sub, side: f.side, dy: f.dy, a, size: 30, color: keptAt(f.y) && end <= 0 ? '#8d8576' : RED, dot: 0 }); });
    c.restore();

    // the number: births in the year the clock is on
    const yr = cur.t, v = cur.v;
    T.text(c, 'UNITED STATES · BIRTHS PER YEAR', 100, 172, { size: 30, weight: 700, color: RED });
    const w = T.counter(c, v / 1e6, { x: 96, y: 330, size: 168, color: INK, font: T.SANS, weight: 800, decimals: 2 });
    T.text(c, 'million', 116 + w, 328, { size: 46, weight: 600, color: INK });
    T.text(c, `born in ${Math.max(1950, yr)}`, 100, 392, { size: 30, weight: 500, color: MUTE });

    beats.forEach(b => { const a = beatA(b, t); if (a <= 0) return; const ls = b.text.split('\n'), sz = fit(c, ls, 54, SERIF, 700); ls.forEach((l, i) => T.text(c, l, 100, 520 + i * 70, { size: sz, weight: 700, font: SERIF, color: INK, a, rise: 14 })); });
    const a2 = seg(t, 31.0, 31.6);
    if (a2 > 0) { T.text(c, `Fewer than in ${before}, with ${(P[last[0]] / P[before]).toFixed(1)}× as many Americans`, 100, 1712, { size: fit(c, [`Fewer than in ${before}, with ${(P[last[0]] / P[before]).toFixed(1)}× as many Americans`], 40, T.TEXT, 700), weight: 700, color: RED, a: a2, rise: 10 });
      T.text(c, `Deaths that year: ${M(Dd[last[0]])} million, only ${K(last[1] - Dd[last[0]])} fewer than births`, 100, 1772, { size: fit(c, [`Deaths that year: ${M(Dd[last[0]])} million, only ${K(last[1] - Dd[last[0]])} fewer than births`], 40, T.TEXT, 700), weight: 700, color: INK, a: seg(t, 31.8, 32.4), rise: 10 }); }
    T.source(c, 'Data: CDC National Center for Health Statistics (births, deaths); US Census Bureau (population)', { y: 1850, color: 'rgba(27,26,24,.4)' });
    T.finish(c, t, { grain: .05, vignette: .12 });
  };

  // the data plays the tune: each year's column sounds a note, higher for more births (A minor pentatonic), merged when the years fly by
  const lo = bust[1] - .25 * (top[1] - bust[1]), hi = top[1];
  const scale = [0, 3, 5, 7, 10], pitch = v => { const k = Math.round((v - lo) / (hi - lo) * 14); return 57 + 12 * Math.floor(k / 5) + scale[k % 5]; };
  const notes = []; let lastT = -1;
  S.forEach(([y, v]) => { const tt = E.tAt(y + .02); if (tt - lastT < .11) return; lastT = tt; notes.push({ t: tt, m: pitch(v), d: .9, inst: 'piano', v: .42 }); });
  // a quiet bed: low sustained chords, one under each part of the story
  [[0, 45, 52, 57], [5.0, 41, 48, 57], [9.6, 48, 55, 64], [13.0, 45, 52, 60], [16.0, 43, 50, 59], [20.0, 41, 48, 57], [23.6, 40, 47, 55], [E.tAt(gap[0]), 38, 45, 53], [31.2, 33, 45, 52]]
    .forEach(([t0, ...ms], i, A) => ms.forEach(m => notes.push({ t: t0, m, d: (A[i + 1] ? A[i + 1][0] : 36) - t0 + .4, inst: 'slowstrings', v: .22 })));
  notes.push({ t: 10.05, m: 81, d: 2.2, inst: 'celesta', v: .35 }, { t: 28.1, m: 57, d: 3, inst: 'piano', v: .5 }, { t: 31.1, m: 45, d: 4.5, inst: 'piano', v: .45 });
  return T.scene(E, draw, { duration: 36, background: PAPER,
    music: { notes, dynamics: { slowstrings: [[0, .5], [10, .7], [24, .55], [30, .8], [35, .3]] } },
    sounds: [{ t: 29.4, kind: 'whoosh', dur: 2, v: .25 }] });
});
</script></body></html>
