<!doctype html>
<meta charset="utf-8">
<title>Paper Cut — New Year Greeting</title>
<style>html, body { margin: 0; background: #000; } canvas { display: block; max-width: 100vw; max-height: 100vh; margin: auto; }</style>
<canvas></canvas>
<script src="../../lib/paper/paper.js"></script>
<script>
/* ======== 换内容改这里 ======== */
const CONTENT = {
  tiles: ['2', '0', '2', '7'],              // cut out of the four diamonds: the year
  blessing: 'Peace and plenty',             // first line on the red strip
  signoff: 'Year of the Goat · the Chen family', // second line on the red strip
  tileFont: '"Weibei SC"', signFont: '"Kaiti SC"',
  red: '#c0171d', redBack: '#cc463d',        // 红纸正面 / 背面（背面浅一点）
  gold: '#dcb565', wall: '#efe3cc',           // 金字 / 底下那张宣纸
};
/* ============================== */

// 腊月里，桌上一张折了三折的红纸。一折一折打开，是一朵团花；四个斗方落下来，最后一条落款滑进来。
// 下午的太阳慢慢挪，影子跟着走。竖屏，给家里人和朋友群发。
const P = Paper, W = 1080, H = 1920, DUR = 13.5, C = CONTENT;
window.__scene = P.scene(async () => {
  const S = P.stage({ width: W, height: H, background: '#2a2420', light: { from: 30, height: 34, soft: .09, ambient: .38, color: '#fff3df' } });
  S.sheet({ w: 1500, h: 2500, x: W / 2, y: H / 2, color: C.wall, paper: 'rice', edge: 'clean', cast: false });

  // ---- 团花：一张圆纸折成八层剪出来的花样（P.radial 画一瓣，自动转 + 镜像成八瓣）
  const R = 370, pol = (r, a) => [r * Math.cos(a), r * Math.sin(a)], A = Math.PI / 4, mid = A / 2;
  const wedge = g => {
    const red = P.css(C.red), hole = (fn) => { g.globalCompositeOperation = 'destination-out'; g.fillStyle = '#000'; fn(); g.globalCompositeOperation = 'source-over'; g.fillStyle = red; };
    // 锯齿纹一圈
    for (let i = 0; i < 7; i++) { const a = (i + .5) * A / 7, da = A / 7 * .36;
      hole(() => P.poly(g, [pol(316, a - da), pol(316, a + da), pol(345, a)])); }
    hole(() => { g.beginPath(); g.arc(0, 0, 306, .012, A - .012); g.arc(0, 0, 298, A - .012, .012, true); g.closePath(); g.fill(); });
    // 月牙
    for (const a of [mid, 0]) { const [x, y] = pol(258, a), [x2, y2] = pol(270, a);
      hole(() => { g.beginPath(); g.arc(x, y, 32, 0, 7); g.fill(); }); g.beginPath(); g.arc(x2, y2, 29, 0, 7); g.fill(); }
    // 花瓣
    for (const a of [mid, 0]) {
      const [ix, iy] = pol(122, a), [ox, oy] = pol(222, a), [l1x, l1y] = pol(175, a - .14), [r1x, r1y] = pol(175, a + .14);
      hole(() => { g.beginPath(); g.moveTo(ix, iy); g.quadraticCurveTo(l1x, l1y, ox, oy); g.quadraticCurveTo(r1x, r1y, ix, iy); g.fill(); });
      const [dx, dy] = pol(240, a); hole(() => { g.beginPath(); g.arc(dx, dy, 7, 0, 7); g.fill(); });
    }
    for (const a of [A * .25, A * .75]) { const [x, y] = pol(196, a); hole(() => { g.beginPath(); g.ellipse(x, y, 20, 7, a, 0, 7); g.fill(); }); }
    // 中心一圈
    hole(() => { g.beginPath(); g.arc(0, 0, 104, .03, A - .03); g.arc(0, 0, 94, A - .03, .03, true); g.closePath(); g.fill(); });
    { const [x, y] = pol(66, mid); hole(() => { g.beginPath(); g.arc(x, y, 13, 0, 7); g.fill(); }); }
    hole(() => { g.beginPath(); g.arc(0, 0, 22, 0, 7); g.fill(); });
  };
  const at = S.at, X0 = W / 2, Y0 = 740;
  const slideIn = at(.2, 1.0, { ease: 'oc', sound: 'slide', v: .7 });
  const u3 = at(1.9, .9, { ease: 'io', sound: 'flap', v: .8 }), u2 = at(3.0, .9, { ease: 'io', sound: 'flap', v: .8 }), u1 = at(4.1, 1.0, { ease: 'io', sound: 'flap', v: .9 });
  // 打开后纸还记着折痕：留几度没摊平
  const flower = S.fold({ w: 2 * R, h: 2 * R, x: X0, y: t => Y0 + 260 * (1 - slideIn(t)), z: 2, rz: t => -8 * (1 - slideIn(t)),
      color: C.red, back: C.redBack, paper: 'rice', edge: 'knife', thick: 1.2,
      draw: (g, w, h) => { P.circle(g, w, h); P.radial(g, R, R, 4, wedge); } },
    [{ line: [[R, 0], [R, 2 * R]], move: [1.5 * R, R], angle: t => P.lerp(180, 4, u1(t)) },
     { line: [[0, R], [R, R]], move: [R / 2, 1.5 * R], angle: t => P.lerp(180, 3, u2(t)) },
     { line: [[R, R], [0, 0]], move: [R * .3, R * .8], angle: t => P.lerp(180, 2.5, u3(t)) }]);

  // ---- 四个斗方：红纸转 45°，字镂空
  const tiles = C.tiles.map((ch, i) => {
    const t0 = 6.0 + i * .42, drop = at(t0, .75, { ease: 'land', sound: 'land', v: .9 }), sz = 150, x = W / 2 + (i - 1.5) * 228, y = 1300;
    return S.sheet({ w: sz, h: sz, x, y: t => y - 30 * (1 - drop(t)), z: t => 6 + 300 * (1 - P.cl(drop(t) * 1.2)), rz: t => 45 + (i % 2 ? 9 : -9) * (1 - drop(t)),
      show: t => t > t0 - .02, color: C.red, back: C.redBack, paper: 'rice', edge: 'knife',
      draw: (g, w, h) => { g.fillRect(0, 0, w, h); P.cut(g, g => { g.translate(w / 2, h / 2); g.rotate(-Math.PI / 4); g.font = `400 124px ${C.tileFont}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(ch, 0, 6); }); } });
  });
  // ---- 落款：一条红纸，金字
  const sl = at(8.2, 1.0, { ease: 'oc', sound: 'slide', v: .8 });
  S.sheet({ w: 700, h: 150, x: t => W / 2 - 900 * (1 - sl(t)), y: 1560, z: 5, rz: t => -1.2 * (1 - sl(t)), color: C.red, back: C.redBack, paper: 'rice', edge: 'cut',
    print: (g, w, h) => { g.fillStyle = P.css(C.gold); g.textAlign = 'center'; g.textBaseline = 'middle';
      g.font = `400 58px ${C.signFont}`; g.fillText(C.blessing, w / 2, h * .36);
      g.font = `400 34px ${C.signFont}`; g.fillText(C.signoff, w / 2, h * .74); } });

  // ---- 古筝：每打开一折一个音，斗方落下一串，落款时一个刮奏
  const notes = [], n = (t, m, d = 1.4, v = .7, inst = 'guzheng') => notes.push({ t, m, d, inst, v });
  n(.3, 62, 2.2, .5); n(.3, 50, 2.6, .4); n(1.25, 66, 1.4, .4);
  n(2.65, 69); n(3.75, 71); n(4.95, 74, 2); n(4.95, 50, 3, .5);
  for (let k = 0, t = 5.9; t < 12.4; k++, t += .5) n(t, [50, 57, 62, 57][k % 4], .8, .26);      // a low figure under the rest
  C.tiles.forEach((_, i) => n(6.0 + i * .42 + .32, [62, 66, 69, 74][i], 1.2, .6));
  [62, 64, 66, 69, 71, 74, 76].forEach((m, i) => n(8.25 + i * .045, m, 1.5, .45));
  n(9.3, 74, .8, .55); n(9.75, 71, .6, .5); n(10.1, 69, 1.2, .55); n(10.9, 66, .7, .5); n(11.3, 69, 2.4, .6); n(11.3, 50, 3, .45); n(11.3, 57, 3, .35);
  return {
    stage: S, duration: DUR,
    camera: t => { const u = P.io(P.seg(t, 1.6, 5.6)); return { x: P.lerp(X0 - 150, W / 2, u), y: P.lerp(Y0 - 140, 1010, u) + (t - 5.6) * 4 * (t > 5.6), zoom: P.lerp(1.75, 1.0, u) + t * .002, vignette: .22 }; },
    light: t => ({ from: 30 + 22 * P.sm(P.seg(t, 5, DUR)), height: 34 + 5 * P.sm(P.seg(t, 5, DUR)) }),
    sounds: S.sounds(),
    music: { notes },
  };
});
</script>
