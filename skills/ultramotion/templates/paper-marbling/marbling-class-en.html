<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Paper Marbling Workshop · Fern &amp; Folio (vertical 9:16, 17 s)</title>
<style>html,body{margin:0;background:#000}canvas{display:block;width:100vw;height:100vh;object-fit:contain}</style></head>
<body><canvas></canvas>
<script src="mesh.js"></script>
<script src="../../lib/mesh-gradient/fluid.js"></script>
<script>
// A Saturday paper marbling workshop at Fern & Folio, a bookbinding studio in Portland, Oregon — vertical teaser.
// The picture is a basin seen from above: paint lands drop by drop and spreads, pushing earlier drops into rings; a row of
// styluses draws a zig-zag, a fine comb pulls it into feathers; the water stops and the class details fade in on the dark water.
// Colours of old marbled endpapers: cream for most of the ground, indigo and ochre in patches, oxblood in the rings.
const M = Mesh, { seg, ease, env } = M;
const W = 1080, H = 1920, Y = H / W, DUR = 17;
const S = M.create({ width: W, height: H });

// cream · oxblood · indigo · ochre · pale indigo · dark ochre · aged cream
const COLS = ['#ece2c8', '#6f1d22', '#243566', '#c58f32', '#4d6390', '#8c5e26', '#cfc09c'];
const WATER = '#15171c';
const R = M.rand(11);

// Paint: first a brush flicks colour over the whole basin (a cell pattern), then concentric rings at three spots
const drops = [], cells = [];
for (let j = 0; j < 12; j++) for (let i = 0; i < 7; i++) cells.push([(i + .5 + (j % 2) * .5 - .25) / 7 + (R() - .5) * .06, (j + .5) / 12 * (Y + .1) - .05 + (R() - .5) * .05]);
cells.sort(() => R() - .5);
const BASE = [0, 0, 6, 0, 2, 0, 6, 5, 2, 0, 1, 6];
cells.forEach(([x, y], i) => drops.push({ t: .3 + i * .036, x, y, r: .085 + R() * .03, c: BASE[Math.floor(R() * BASE.length)] }));
[[.3, .42, [2, 0, 1, 0, 3, 2]], [.72, .86, [1, 0, 2, 0, 4, 0]], [.34, 1.24, [2, 0, 3, 0, 1, 0]]].forEach(([x, y, cs], j) =>
  cs.forEach((c, k) => drops.push({ t: 3.6 + j * .5 + k * .09, x, y, r: .09 - k * .011, c })));
const NB = cells.length;

const GEL = [5.3, 7.1], FEATHER = [7.9, 9.7], END = 10.2;
function ops(t) {
  const o = [];
  for (const d of drops) if (t > d.t) o.push(Fluid.drop(d.x, d.y, d.r * Fluid.grow(t, d.t, .9), d.c));
  // Stylus: a row of pins draws top to bottom, neighbours alternating up and down
  if (t > GEL[0]) o.push(Fluid.tine({ x: 0, y: -.2, angle: Math.PI / 2, shift: .07, falloff: .009, spacing: .075, alternate: true, head: -.2 + (Y + .6) * ease.sine(seg(t, ...GEL)), soft: .25 }));
  // Fine comb: pulled left to right
  if (t > FEATHER[0]) o.push(Fluid.tine({ x: -.2, y: 0, angle: 0, shift: .04, falloff: .006, spacing: .034, head: -.2 + 1.45 * ease.sine(seg(t, ...FEATHER)), soft: .2 }));
  // Once it stops, the water still breathes very slowly
  const k = seg(t, END - 1, END + 2);
  o.push(Fluid.wave({ angle: Math.PI / 2, amp: .006 * k * Math.sin(t * .7), wavelength: .9, phase: t * .25 }));
  o.push(Fluid.wave({ angle: 0, amp: .004 * k * Math.cos(t * .5), wavelength: 1.3, phase: -t * .2 }));
  return o;
}

function draw(c, t) {
  Fluid.marble(c, t, ops(t), { colors: COLS, base: WATER, aa: 3, texture: .07, grain: 70, rim: .1 });
  const a = env(t, 11.2, DUR + 1, .9, .1);
  if (a > 0) {
    const g = c.createLinearGradient(0, H * .66, 0, H);
    g.addColorStop(0, 'rgba(14,15,19,0)'); g.addColorStop(.42, 'rgba(14,15,19,.84)'); g.addColorStop(1, 'rgba(14,15,19,.9)');
    c.save(); c.globalAlpha = a; c.fillStyle = g; c.fillRect(0, H * .66, W, H * .34); c.restore();
    const y0 = H * .825;
    M.text(c, 'Paper Marbling', W / 2, y0, { font: M.SERIF, size: 76, weight: 500, tracking: .08, color: '#efe8d6', a, align: 'center' });
    M.text(c, 'A Saturday workshop at Fern & Folio, Portland, Oregon', W / 2, y0 + 62, { font: M.SERIF, italic: true, size: 32, weight: 400, tracking: .02, color: '#e3dac6', a: a * .9, align: 'center' });
    [['Saturday, November 14  ·  1–4 PM', 0], ['2210 SE Division St', 1], ['$65, materials included', 2]].forEach(([s, i]) =>
      M.text(c, s, W / 2, y0 + 128 + i * 44, { font: M.SANS, size: 29, weight: 300, tracking: .1, color: '#d9d2c2', a: a * .85, align: 'center' }));
  }
  M.finish(c, t, { grain: .015, vignette: .18 });
}

/* Piano picks out notes as paint falls, slow strings under stylus and comb, a chord when it settles */
const notes = [], N = (t, m, d, inst, v) => notes.push({ t, m, d, inst, v });
const PENTA = [62, 64, 66, 69, 71, 74, 76, 78, 81];
drops.slice(0, NB).forEach((d, i) => { if (i % 7 === 0) N(d.t, PENTA[(i * 5 + 2) % PENTA.length], 1.6, 'piano', .2 + .1 * ((i * 7) % 3) / 2); });
drops.slice(NB).forEach((d, i) => { if (i % 2 === 0) N(d.t, [74, 78, 81][(i / 2) % 3] - Math.floor(i / 6) * 3, 1.4, 'harp', .26); });
N(GEL[0], 50, 4.6, 'slowstrings', .2); N(GEL[0], 57, 4.6, 'slowstrings', .17); N(GEL[0] + .1, 66, 4.4, 'slowstrings', .13);
N(FEATHER[0], 47, 2.6, 'slowstrings', .18); N(FEATHER[0], 54, 2.6, 'slowstrings', .15); N(FEATHER[0] + .1, 62, 2.6, 'slowstrings', .12);
[[38, 0], [50, .05], [57, .1], [62, .16], [66, .22], [69, .3]].forEach(([m, d]) => N(END + d, m, 5.5, 'piano', .3 - d * .4));
N(END, 50, 6, 'slowstrings', .14); N(END, 57, 6, 'slowstrings', .12);
[[11.4, 74], [12.2, 76], [13.0, 73], [14.6, 74]].forEach(([t, m]) => N(t, m, 2.2, 'piano', .22));

window.__scene = M.scene(S, draw, { duration: DUR, background: WATER,
  music: { notes, dynamics: { slowstrings: [[0, .2], [5.3, .5], [7, .9], [9.7, .7], [12, .5], [17, .3]] } },
  timeline: [{ t0: 0, t1: 5.2, kind: 'drops', text: 'paint' }, { t0: GEL[0], t1: GEL[1], kind: 'stylus', text: 'stylus' }, { t0: FEATHER[0], t1: FEATHER[1], kind: 'comb', text: 'comb' }, { t0: 11.2, t1: DUR, kind: 'text', text: 'Paper Marbling · Saturday' }] });
</script>
</body></html>
