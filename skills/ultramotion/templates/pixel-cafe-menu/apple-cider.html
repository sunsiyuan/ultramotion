<!doctype html>
<meta charset="utf-8">
<title>Hot Apple Cider — menu screen</title>
<style>html,body{margin:0;background:#000}canvas{display:block;max-width:100vw;max-height:100vh}</style>
<canvas></canvas>
<script src="../../lib/pixel/pixel.js"></script>
<script>
/* ===== change these ===== */
const CONTENT = {
  shop: 'HOLLOW OAK',
  sub: 'BAKERY · ASHEVILLE',
  items: [                                            // sprite: one of the drawn items below (bread, cider, scone)
    { name: 'Pumpkin bread', price: '$4.00', sprite: 'bread' },
    { name: 'Hot apple cider', price: '$3.50', sprite: 'cider' },
    { name: 'Maple pecan scone', price: '$3.75', sprite: 'scone' },
  ],
  featured: 1,                                        // which item the cursor picks
  ribbon: 'NEW THIS FALL',
  title: ['HOT APPLE', 'CIDER'],                      // the featured name, big, at most 9 letters a line
  desc: ['Local apples, mulled', 'with cinnamon, clove', 'and orange peel.'],
};
const COLORS = {
  ink: '#3a1d10', wood: '#b4622a', woodD: '#7c3c1a', woodL: '#dc9448', woodH: '#f4c470',
  parch: '#fbe2a6', parchD: '#e6b46c', parchL: '#fff4d2', text: '#5a2b12',
  coin: '#f6bf2a', coinD: '#c27612', coinL: '#fff19a', red: '#c4362a', redD: '#8e2420',
  orange: '#e0702a', rust: '#a8402a', gold: '#e8b036', green: '#7d9a36', greenD: '#55702a',
  sky: '#9ccde4', sky2: '#c9e4dc', haze: '#f8e8bc', hill: '#d6a462', cloud: '#fff8e8',
};
const LOOP = 15, BPM = 96;              // the screen plays it over and over: 15 s, six bars of music
/* ======================== */

const P = Pixel, C = COLORS, GW = 216, GH = 384;
// layout on the 216×384 grid (×5): everything that matters stays above y 307 (the bottom fifth) and left of x 186
const SIGN = { x: 14, y: 26, w: 166, h: 44 }, LIST = { x: 8, y: 80, w: 178, h: 98 }, CARD = { x: 8, y: 186, w: 178, h: 114 };
const ROW = i => LIST.y + 7 + i * 28;                                       // top of each item row
const T = { sign: .25, list: .9, rows: 1.3, hand: 2.0, tour: [2.0, 2.8, 3.6, 4.4], click: 5.0, card: 5.3, ribbon: 5.65, mug: 5.8, name: 6.1, price: 7.0, desc: 7.4,
  close: 13.6 };                                                            // when things happen; everything builds out by LOOP - .4
const NAME_CPS = 14, DESC_CPS = 26;

const SPRITES = {
  bread: P.sprite(['................', '................', '................', '....oooooooo....', '...oBBhhhhBBo...', '..oBhhsBBhhBBo..', '..oBhBBBsBBBBo..',
    '.oBBBsBBBBBsBCo.', '.oBBBBBBBBBBBCo.', '.oCBBBBBBBBBBCo.', '.oCBBBBBBBBBCCo.', '.oCCBBBBBBBCCCo.', '..oCCCCCCCCCCo..', '...oooooooooo...', '................', '................'],
    { o: C.ink, B: C.orange, h: C.woodL, s: C.parchL, C: C.rust }),
  cider: P.sprite(['........kk......', '.......kk.......', '..oooookkooo....', '.oMMMMkkMMMMo...', '.oMaaaaaAaaMo...', '.oWMMMMMMMMMooo.', '.oWMMMMMMMMMoMMo',
    '.oWMMRRgRMMMo.Mo', '.oWMRRRRRRMMo.Mo', '.oWMRRRRRRMMo.Mo', '.oWMMRRRRMMMoMMo', '.oWMMMMMMMMSooo.', '.oWMMMMMMMSSo...', '..oSSSSSSSSo....', '...oooooooo.....', '................'],
    { o: C.ink, k: C.woodD, M: C.parch, W: C.parchL, S: C.parchD, a: C.wood, A: C.woodH, R: C.red, g: C.green }),
  scone: P.sprite(['................', '................', '................', '...oo...........', '...oGoo.........', '...oGGGoo.......', '...oGwGGGoo.....',
    '...oGGwwGGGoo...', '...oGGGpwwGGGoo.', '...oGGppGGwwGGo.', '...oDGGGGGGGwGo.', '...oDDGGGGGGGGo.', '...oDDDDDDDDDDo.', '....oooooooooo..', '................', '................'],
    { o: C.ink, G: C.woodL, D: C.wood, w: C.parchL, p: C.woodD }),
};
const HAND = P.sprite(['..oooo........', '.oWWWWoooooo..', 'oWWWWWWWWWWWWo', 'oWWWWWWWWWWWWo', 'oWWWWWWoooooo.', 'oWWWWWWWo.....', 'oWWWWWoo......',
  'oWWWWWWWo.....', 'oSWWWWoo......', '.oSSSSo.......', '..oooo........'], { o: C.ink, W: C.parchL, S: C.parchD });
const COIN = P.sprite(['..ooo..', '.oLYYo.', 'oLYYYDo', 'oYYYYDo', 'oYYYDDo', '.oYDDo.', '..ooo..'], { o: C.ink, L: C.coinL, Y: C.coin, D: C.coinD });
const LEAF = c => [P.sprite(['...a...', '.a.a.a.', '.aaaaa.', 'aaaaaaa', '.aaaaa.', '..aaa..', '...s...'], { a: c, s: C.woodD }),   // an oak leaf, tumbling
  P.sprite(['..a..', '.aaa.', 'aaaaa', '.aaa.', '..s..'], { a: c, s: C.woodD }), P.sprite(['.a.', 'aaa', '.a.', '.s.'], { a: c, s: C.woodD })];
const LEAVES = [C.orange, C.rust, C.gold, C.red].map(LEAF);
const PUMPKIN = P.sprite(['......gg.....', '...oooogooo..', '..oOHODOODOo.', '.oOHOODOOODOo', '.oOHOODOOODOo', '.oOOOODOOODOo', '.oDOOODOOODDo', '..oDDDDDDDDo.', '...ooooooo...'],
  { o: C.ink, O: C.orange, H: C.gold, D: C.rust, g: C.greenD });

/* ---------- the world behind the menu ---------- */
function world(g, t) {
  P.gradient(g, 0, 0, GW, 250, [C.sky, C.sky2, C.haze]);
  for (let k = 0; k < 4; k++) for (let y = 0; y < 250; y++) {           // soft daylight: rays falling from the top left
    const x0 = 20 + k * 46 - y * .55, w = 10 + k * 3; P.dither(g, x0, y, w, 1, null, C.cloud, .22 - y / 1600); }
  [[30, 70, 1], [120, 40, 2], [170, 110, 1]].forEach(([x0, y, sp], i) => {  // clouds drift right, whole pixels, once around per loop
    const x = Math.round(((x0 + t / LOOP * (GW + 60) * sp) % (GW + 60)) - 40);
    P.shape(g, C.cloud, c => { c.beginPath(); c.ellipse(x, y, 16, 5, 0, 0, 7); c.ellipse(x - 8, y - 3, 8, 5, 0, 0, 7); c.ellipse(x + 5, y - 5, 9, 6, 0, 0, 7); c.fill(); });
    P.rect(g, x - 15, y + 3, 30, 2, C.sky2); });
  P.shape(g, C.hill, c => { c.beginPath(); c.moveTo(0, 262); for (let x = 0; x <= GW; x += 4) c.lineTo(x, 236 + 10 * Math.sin(x * .03) + 6 * Math.sin(x * .071 + 1)); c.lineTo(GW, 300); c.lineTo(0, 300); c.fill(); });
  for (let i = 0; i < 16; i++) { const r = P.rng(i + 40), x = i * 15 + r() * 8, y = 262 + r() * 10, rr = 9 + r() * 5;      // the tree line
    P.circle(g, x, y, rr, [C.rust, C.orange, C.gold][i % 3]); P.circle(g, x - 3, y - 3, rr * .45, [C.orange, C.gold, C.parchD][i % 3]); }
  P.rect(g, 0, 286, GW, GH - 286, C.green);
  P.dither(g, 0, 286, GW, 6, null, C.greenD, .5);
  for (let i = 0; i < 70; i++) { const r = P.rng(i + 90); P.rect(g, r() * GW, 296 + r() * 88, 1, 2, C.greenD); }                // tufts
  for (let x = 4; x < GW; x += 22) { P.rect(g, x, 300, 4, 22, C.ink); P.rect(g, x + 1, 301, 2, 20, C.wood); P.rect(g, x + 1, 301, 1, 20, C.woodL); }   // the fence
  P.rect(g, 0, 305, GW, 3, C.ink); P.rect(g, 0, 306, GW, 1, C.woodL);
  P.rect(g, 0, 313, GW, 3, C.ink); P.rect(g, 0, 314, GW, 1, C.wood);
  for (let i = 0; i < 40; i++) { const r = P.rng(i + 7); P.px(g, r() * GW, 326 + r() * 58, [C.orange, C.rust, C.gold][i % 3]); }   // leaves on the grass
  [[14, 338, 2], [36, 348, 1], [8, 362, 1], [60, 356, 2]].forEach(([x, y, s]) => P.put(g, PUMPKIN, x, y, { scale: s }));
  oak(g, t);
}
function oak(g, t) {
  // the hollow oak on the right, its branch holding the sign
  P.rect(g, 190, 0, 30, 330, C.ink); P.rect(g, 192, 0, 26, 330, C.woodD); P.rect(g, 193, 0, 3, 330, C.wood);
  for (let y = 4; y < 330; y += 9) P.rect(g, 199 + (y * 7 % 11), y, 1, 5, C.ink);
  P.shape(g, C.ink, c => { c.beginPath(); c.ellipse(204, 250, 6, 10, 0, 0, 7); c.fill(); });
  P.rect(g, 0, 10, 200, 6, C.ink); P.rect(g, 0, 11, 200, 4, C.woodD); P.rect(g, 0, 11, 200, 1, C.wood);
  for (let i = 0; i < 14; i++) { const r = P.rng(i + 200), x = 216 - r() * 120, y = r() * 22 - 2, rr = 8 + r() * 6;
    P.circle(g, x, y, rr, [C.rust, C.orange, C.gold][i % 3]); P.circle(g, x - 2, y - 2, rr * .4, [C.orange, C.gold, C.parchD][i % 3]); }
}
function leaves(g, t, front) {
  // carried on the wind from the oak, right to left, falling; each one comes round a whole number of times per loop
  const n = front ? 4 : 14;
  for (let i = 0; i < n; i++) { const r = P.rng(i * 7 + (front ? 101 : 3)), period = LOOP / (1 + Math.floor(r() * 3)), u = (t / period + r()) % 1;
    const x = 230 - u * 270, y0 = front ? 310 + r() * 40 : r() * 240, y = y0 + u * (front ? 30 : 90) + 6 * Math.sin(u * Math.PI * 6 + i);
    const set = LEAVES[i % 4], fr = [0, 1, 2, 1][Math.floor(t * 4 + i) % 4];
    P.put(g, set[fr], Math.round(x), Math.round(y), { flip: Math.floor(t * 2 + i) % 2 === 1 }); }
}

/* ---------- the menu ---------- */
function panel(g, x, y, w, h) {
  // a wooden frame: dark outline, a lighter bevel on top, shade at the bottom, cream parchment inside
  P.dither(g, x + 2, y + 3, w, h, null, C.ink, .5);
  P.rect(g, x + 1, y, w - 2, h, C.ink); P.rect(g, x, y + 1, w, h - 2, C.ink);
  P.rect(g, x + 2, y + 1, w - 4, h - 2, C.wood); P.rect(g, x + 1, y + 2, w - 2, h - 4, C.wood);
  P.rect(g, x + 2, y + 1, w - 4, 1, C.woodH); P.rect(g, x + 1, y + 2, 1, h - 4, C.woodL); P.rect(g, x + 2, y + 2, w - 4, 1, C.woodL);
  P.rect(g, x + 2, y + h - 2, w - 4, 1, C.woodD); P.rect(g, x + w - 2, y + 2, 1, h - 4, C.woodD);
  for (let i = 0; i < w / 9; i++) { const gx = x + 4 + Math.floor(P.hash(i, x, y) * (w - 12)); P.rect(g, gx, y + 3, 3, 1, C.woodD); P.rect(g, gx + 2, y + h - 4, 3, 1, C.woodD); }
  if (h > 12) { P.rect(g, x + 5, y + 5, w - 10, h - 10, C.ink); P.rect(g, x + 6, y + 6, w - 12, h - 12, C.parch);
    P.rect(g, x + 6, y + 6, w - 12, 1, C.parchD); P.rect(g, x + 6, y + 6, 1, h - 12, C.parchD); }
  [[x + 2, y + 2], [x + w - 4, y + 2], [x + 2, y + h - 4], [x + w - 4, y + h - 4]].forEach(([a, b]) => { P.px(g, a, b, C.woodH); P.px(g, a + 1, b + 1, C.ink); });
}
// a panel pops open from its middle in hard steps and folds shut the same way; returns true when it is fully open
function popPanel(g, b, t, t0, t1) {
  const u = Math.min(P.seg(t, t0, t0 + .3), 1 - P.seg(t, t1, t1 + .3)), k = Math.floor(u * 4 + 1e-6) / 4;
  if (k <= 0) return false;
  const h = Math.max(10, Math.round(b.h * k)); panel(g, b.x, Math.round(b.y + (b.h - h) / 2), b.w, h); return k >= 1;
}
function sign(g, t) {
  // the shop's board, hanging from the oak's branch; drops in, bounces, and is pulled up at the end
  const down = P.glide(t, T.sign, T.sign + .35, -80, 0, 'linear') + P.hop(t, T.sign + .35, .25, 4), up = P.glide(t, T.close + .7, T.close + 1, 0, -80, 'linear');
  const y = SIGN.y + down + up, { x, w, h } = SIGN;
  if (y + h < 0) return;
  [x + 18, x + w - 20].forEach(rx => { P.rect(g, rx, 14, 2, y - 13, C.ink); P.rect(g, rx, 14, 1, y - 13, C.parchD); });
  P.dither(g, x + 2, y + 3, w, h, null, C.ink, .5);
  P.rect(g, x + 1, y, w - 2, h, C.ink); P.rect(g, x, y + 1, w, h - 2, C.ink);
  P.rect(g, x + 1, y + 1, w - 2, h - 2, C.wood);
  [14, 29].forEach(py => { P.rect(g, x + 1, y + py, w - 2, 1, C.woodD); P.rect(g, x + 1, y + py + 1, w - 2, 1, C.woodL); });   // planks
  P.rect(g, x + 1, y + 1, w - 2, 1, C.woodH); P.rect(g, x + 1, y + h - 2, w - 2, 1, C.woodD);
  for (let i = 0; i < 12; i++) P.rect(g, x + 4 + Math.floor(P.hash(i, 9) * (w - 12)), y + 4 + Math.floor(P.hash(i, 4) * (h - 8)), 4, 1, C.woodD);
  [[x + 18, y + 3], [x + w - 20, y + 3]].forEach(([a, b]) => { P.rect(g, a, b, 2, 2, C.ink); P.px(g, a, b, C.woodH); });
  P.text(g, CONTENT.shop, x + w / 2, y + 8, { font: '5x7', scale: 2, color: C.parchL, outline: C.ink, shadow: { color: C.ink, dx: 1, dy: 1 }, align: 'center' });
  P.text(g, CONTENT.sub, x + w / 2, y + 31, { font: '5x7', color: C.coin, outline: C.ink, align: 'center' });
}
function row(g, i, t, hover, picked) {
  const it = CONTENT.items[i], y = ROW(i), x = LIST.x + 7, w = LIST.w - 14;
  const flash = picked && t < T.click + .4 && Math.floor((t - T.click) * 10) % 2 === 0;
  P.rect(g, x, y, w, 26, hover ? C.woodL : C.parchD);
  P.rect(g, x + 1, y + 1, w - 2, 24, flash ? C.woodH : hover ? C.parchL : C.parch);
  P.rect(g, x + 3, y + 3, 20, 20, C.woodD); P.rect(g, x + 4, y + 4, 18, 18, C.parchD); P.rect(g, x + 4, y + 4, 18, 1, C.wood);   // the item slot
  P.put(g, SPRITES[it.sprite], x + 5, y + 5);
  P.text(g, it.name, x + 28, y + 4, { font: '5x7', color: C.text });                 // the name on top, the price under it on the right
  P.text(g, it.price, x + w - 14, y + 15, { font: '5x7', color: C.redD, align: 'right' });
  P.put(g, COIN, x + w - 11, y + 15);
}
function hand(g, t) {
  // the pointing hand walks the rows, settles on the new item, presses it, then rests there bobbing
  if (t < T.hand || t > T.close + .3) return;
  let i = 0, y = ROW(0);
  T.tour.forEach((t0, k) => { if (t >= t0) { const from = k ? [0, 1, 2, 1][k - 1] : 0, to = [0, 1, 2, CONTENT.featured][k]; i = to; y = P.glide(t, t0, t0 + .17, ROW(from), ROW(to)); } });
  const press = t > T.click && t < T.click + .25 ? 2 : 0, bob = Math.floor(t * 3) % 2;
  P.put(g, HAND, 1 + bob + press, y + 8);
}
function card(g, t) {
  // the featured item, opened like an item tooltip: ribbon, the drink large and steaming, the name, the price, a few words
  if (!popPanel(g, CARD, t, T.card, T.close)) return;
  const x = CARD.x, y = CARD.y, bx = x + 48;
  if (t > T.mug) { const my = y + 22 + P.hop(t, T.mug, .3, 6);
    P.rect(g, x + 9, y + 55, 30, 1, C.parchD);
    P.put(g, SPRITES.cider, x + 8, my, { scale: 2 }); steam(g, t, x + 22, my + 4); }
  if (t > T.name) { let left = Math.max(0, Math.floor((t - T.name) * NAME_CPS + 1e-6));
    CONTENT.title.forEach((l, k) => { const s = l.slice(0, left); left -= l.length; P.text(g, s, bx, y + 12 + k * 18, { font: '5x7', scale: 2, color: C.text, shadow: { color: C.parchD, dx: 1, dy: 1 } }); }); }
  if (t > T.price) { const it = CONTENT.items[CONTENT.featured], [sx, sy] = P.shake(t, T.price, .25, 1);
    const pw = P.text(g, it.price, bx + sx, y + 52 + sy, { font: '5x7', scale: 2, color: C.redD, shadow: { color: C.parchD, dx: 1, dy: 1 } }).w;
    P.put(g, COIN, bx + pw + 4, y + 53 + sy, { scale: 2 }); }
  if (t > T.desc) { P.rect(g, x + 10, y + 71, CARD.w - 30, 1, C.parchD);
    CONTENT.desc.forEach((l, k) => P.text(g, P.typed(l, t, T.desc + k * .75, DESC_CPS), x + 10, y + 76 + k * 10, { font: '5x7', color: C.text })); }
  if (t > T.ribbon) { const w = P.measure(CONTENT.ribbon, { font: '5x7' }).w + 10, ry = y - 6 + P.hop(t, T.ribbon, .2, 3);   // a red ribbon over the frame
    P.rect(g, bx - 1, ry, w + 2, 12, C.ink); P.rect(g, bx, ry + 1, w, 10, C.red); P.rect(g, bx, ry + 1, w, 1, C.orange); P.rect(g, bx, ry + 10, w, 1, C.redD);
    P.text(g, CONTENT.ribbon, bx + 5, ry + 2, { font: '5x7', color: C.parchL }); }
}
function steam(g, t, x, y) {
  // three wisps over the cup, stepping at 6 a second, thinning toward the top
  const st = Math.floor(t * 6);
  [[-6, 0], [2, 2.1], [10, 4.3]].forEach(([dx, ph]) => {
    for (let k = 0; k < 16; k++) { const xx = x + dx + Math.round(1.5 * Math.sin(k * .35 - st * .6 + ph) * Math.min(1, k / 5));
      if ((P.hash(k, st >> 1, dx) + k / 16) < .95 && (k + st) % 6 < 4) P.px(g, xx, y - 4 - k, k > 9 ? C.parchD : C.woodL); } });
}

// music: F major, an easy autumn walk — fingerpicked guitar, a triangle bass, a round pulse tune with room around it
const beat = 60 / BPM, bar = beat * 4;
function music() {
  const chip = [], notes = [], prog = [[53, 57, 60], [57, 60, 64], [58, 62, 65], [53, 57, 60], [55, 58, 62], [48, 52, 55]];
  const mel = [[[72, 1], [69, .5], [67, .5], [65, 1], [69, 1]], [[69, 1.5], [72, .5], [76, 1], [74, 1]], [[74, 1], [72, .5], [70, .5], [69, 1], [65, 1]],
    [[67, 1.5], [69, .5], [65, 2]], [[70, 1], [69, .5], [67, .5], [70, 1], [74, 1]], [[72, 2], [0, 1], [67, 1]]];
  prog.forEach((c, b) => { const t0 = b * bar;
    chip.push(P.chip.note(t0, c[0] - 12, beat * 1.8, 'tri', .75), P.chip.note(t0 + beat * 2, c[0] - 5, beat * 1.6, 'tri', .65));
    [0, 2, 1, 2, 0, 2, 1, 2].forEach((k, s) => notes.push({ t: t0 + s * beat / 2, m: c[k] + (s % 2 ? 12 : 0), d: beat * 1.2, inst: 'guitar', v: s % 4 ? .32 : .42 }));
    chip.push(...P.chip.drums(t0, '....h.......h...', BPM, 1, .2));
    let t = t0; mel[b].forEach(([m, l]) => { if (m) chip.push(P.chip.note(t, m, l * beat * .9, 'pulse', .32, { duty: .5, vib: l >= 2 ? .1 : 0 })); t += l * beat; }); });
  return { chip, notes };
}

window.__scene = P.scene(async () => {
  const f = CONTENT.items[CONTENT.featured], nameChars = CONTENT.title.join(' ');
  const sounds = [{ t: T.sign + .35, kind: 'land', v: .5 }, { t: T.list, kind: 'select', v: .35, pitch: -5 },
    ...CONTENT.items.map((_, i) => ({ t: T.rows + i * .15, kind: 'select', v: .25, pitch: i * 2 })),
    ...T.tour.map((t, k) => ({ t, kind: 'select', v: .4, pitch: [0, 2, 4, 2][k] })),
    { t: T.click, kind: 'confirm', v: .5 }, { t: T.card, kind: 'select', v: .35, pitch: -5 }, { t: T.ribbon, kind: 'land', v: .3, pitch: 5 },
    { t: T.mug, kind: 'jump', v: .3 }, ...P.typeSounds(CONTENT.title.join(''), T.name, NAME_CPS, { every: 2, v: .3 }),
    { t: T.price, kind: 'coin', v: .5 }, { t: T.close, kind: 'cancel', v: .3 }, { t: T.close + .7, kind: 'jump', v: .2, pitch: -5 }];
  return {
    width: 1080, height: 1920, grid: [GW, GH], duration: LOOP, fps: 12, palette: Object.values(C), sounds, music: music(),
    draw(g, t) {
      world(g, t);
      leaves(g, t, false);
      sign(g, t);
      if (popPanel(g, LIST, t, T.list, T.close + .35)) CONTENT.items.forEach((_, i) => {
        if (t < T.rows + i * .15) return;
        const on = t >= T.hand ? T.tour.reduce((a, t0, k) => t >= t0 ? [0, 1, 2, CONTENT.featured][k] : a, 0) : -1;
        row(g, i, t, i === on, i === CONTENT.featured && t >= T.click); });
      card(g, t);
      hand(g, t);
      leaves(g, t, true);
    },
  };
});
window.__scene.loop = true;
</script>
