<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Night Shift — podcast opening (vertical)</title>
<style>html,body{margin:0;background:#000}canvas{display:block;width:100vw;height:100vh;object-fit:contain}</style></head>
<body><canvas></canvas>
<script src="../../lib/title-sequence/title.js"></script>
<script>
// The opening of a Chicago podcast about people who work through the night, cut vertical for Reels and Shorts.
// Three of the people, one line each; then a thin flare slides across the dark and the name appears where it has passed;
// the lights of the river below come slowly into focus. Light sans, very wide tracking.
const T = Title, { seg, lerp, env, ease, bar } = T;
const S = T.create({ width: 1080, height: 1920 }), W = 1080, H = 1920;
const BPM = 70, B = bar(BPM);
const SANS = '"Avenir Next", "Helvetica Neue", "Inter", sans-serif';
const INK = '#eef3f8', DIM = 'rgba(238,243,248,.6)';
const lines = T.schedule(['the nurse on the fourth floor', 'the man who raises the bridge', 'the baker on Devon Avenue'], { bpm: BPM, start: .5, hold: 1, gap: .25, fadeIn: .7, fadeOut: .6 });
const FLARE = { t0: lines[2].t1 + B / 4, d: 2.6 };                         // the flare crosses from left to right in d seconds
const flareX = t => lerp(-200, W + 200, ease.io(seg(t, FLARE.t0, FLARE.t0 + FLARE.d)));
const LAND = FLARE.t0 + FLARE.d * .78;                                   // the flare has passed the last letter
const END = LAND + 2 * B, DUR = END + 1.8;

function draw(c, t) {
  // the river at night, far below and out of focus; it sharpens after the title
  const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#04060a'); g.addColorStop(.6, '#070b12'); g.addColorStop(1, '#0b1018'); c.fillStyle = g; c.fillRect(0, 0, W, H);
  const focus = lerp(1, .3, ease.sine(seg(t, LAND, END)));
  c.save(); T.camera(c, { y: lerp(30, -30, t / DUR), z: 1.04 });
  T.bokeh(c, t, { n: 22, seed: 21, box: [-60, 1320, W + 120, 260], size: [12, 56], colors: ['#9ec9ff', '#e8f1ff', '#ffb36b', '#ffd59c'], a: .32, drift: 3, focus });
  T.bokeh(c, t, { n: 7, seed: 4, box: [-60, 1560, W + 120, 200], size: [40, 110], colors: ['#ffb36b', '#9ec9ff'], a: .1, drift: 2, focus: Math.min(1, focus * 1.5) });
  c.restore();

  lines.forEach(k => T.text(c, k.text, W / 2, 900, { font: SANS, size: 34, weight: 400, italic: false, tracking: lerp(.12, .2, seg(t, k.t0, k.t1)), color: DIM, align: 'center', a: k.a(t) }));

  // the title, revealed by the flare as it passes
  const fx = flareX(t), title = { font: SANS, size: 70, weight: 200, color: INK, align: 'center', caps: true };
  if (t > FLARE.t0) {
    const tr = lerp(.34, .48, ease.linger(seg(t, FLARE.t0, END))), w = T.measure(c, 'NIGHT SHIFT', { ...title, tracking: tr }), x0 = W / 2 - w / 2;
    const u = (fx - x0) / w, a = 1 - seg(t, END - 1.2, END);
    T.text(c, 'Night Shift', W / 2, 960, { ...title, tracking: tr, a, reveal: { u: T.cl(u), mode: 'wipe', soft: .12, blur: 8 }, glow: { color: 'rgba(160,205,255,.35)', blur: 30 } });
    T.text(c, 'stories from the people who work while Chicago sleeps', W / 2, 1040, { font: SANS, size: 26, weight: 400, tracking: .14, color: DIM, align: 'center', a: env(t, LAND + .4, END, 1.4, 1.2) });
    T.block(c, [{ text: 'EPISODE 4', size: 20, tracking: .5, color: 'rgba(238,243,248,.45)' }, { text: 'The Bridge Tender', size: 34, tracking: .06, gap: 14 }], W / 2, 1700,
      { font: SANS, weight: 400, color: INK, align: 'center', a: env(t, LAND + B, END, 1.2, 1.2) });
  }
  T.streak(c, fx, 925, { len: 1400, color: '#a9d4ff', a: env(t, FLARE.t0, FLARE.t0 + FLARE.d, .5, .7) * .9, thick: 3, core: 70 });

  const black = seg(t, END - .3, END + 1.2); if (black) { c.fillStyle = `rgba(0,0,0,${black})`; c.fillRect(0, 0, W, H); }
  T.finish(c, t, { grade: { lift: [.01, .015, .03], contrast: 1.04, saturation: .9, shadows: '#1d3d66', highlights: '#ffe2c0', split: .3 },
    grain: .05, grainSize: 1.5, vignette: .55, halation: .25, bloom: .35, aberration: .4 });
}

// score: electric piano chords on the bar, a soft bass; under the flare a whoosh and a held low note; a pad after the title
const notes = [], N = (t, m, d, inst, v) => notes.push({ t, m, d, inst, v });
const prog = [[45, 57, 60, 64, 67], [41, 57, 60, 64, 65], [48, 55, 60, 64, 67], [43, 55, 59, 62, 67]];     // Am7 · Fmaj7 · C · G
for (let b = 0; b * B < END; b++) {
  const t0 = .4 + b * B, ch = prog[b % 4]; if (t0 > FLARE.t0 - .2 && t0 < LAND) continue;
  T.chord(t0, ch.slice(1), { inst: 'keys', d: B * .95, v: .3, roll: .03 }).forEach(n => notes.push(n)); N(t0, ch[0], B, 'bass', .24);
  const motif = b % 2 ? [ch[3], ch[2]] : [ch[2], ch[4], ch[3]];        // a few notes in the middle register
  motif.forEach((m, j) => N(t0 + B / 2 + j * B / 8 * 1.5, m, B / 3, 'vibraphone', .2));
}
lines.forEach(k => N(k.t0 + .1, 69, 1.5, 'vibraphone', .22));
N(LAND, 45, 6, 'bass', .32); T.chord(LAND, [57, 64, 67, 72], { inst: 'keys', d: 5, v: .32, roll: .05 }).forEach(n => notes.push(n));
[57, 64, 69].forEach(m => N(LAND - .5, m, END - LAND + 2, 'pad', .35));
const dynamics = { pad: [[LAND - .5, .2], [LAND + 1.5, .6], [DUR, 0]] };

window.__scene = T.scene(S, draw, { duration: DUR, background: '#04060a', music: { notes, dynamics },
  sounds: [{ t: FLARE.t0 + .3, kind: 'whoosh', dur: FLARE.d * .9, v: .45 }],
  timeline: [...lines.map(k => ({ t0: k.t0, t1: k.t1, kind: 'line', text: k.text })), { t0: FLARE.t0, t1: END, kind: 'title', text: 'Night Shift' }] });
</script>
</body></html>
