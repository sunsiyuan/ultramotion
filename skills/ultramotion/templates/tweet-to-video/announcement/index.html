<!doctype html>
<meta charset="utf-8">
<title>"heading to the World Series" — what it took</title>
<style>html,body{margin:0;background:#fff}canvas{display:block;max-width:100vw;max-height:100vh}</style>
<canvas width="1080" height="1920"></canvas>
<script src="../../../lib/social-post/post.js"></script>
<script src="data/summary.js"></script>
<script>
/* ===== change these ===== */
// the post and every year and score come from data/summary.js (data/fetch_post.mjs + MLB Stats API → data/summary.py)
const COPY = {
  wait: g => `${g} years`, since: y => `since their last World Series (${y})`,
  last: 'Last October', now: 'This October',
  first: y => `First World Series since ${y}.`, nl: 'First pennant as a National League team.',
  next: 'Next: the World Series.',
};
const COLORS = { bg: '#ffffff', text: '#0f1419', mute: '#536471', line: '#cfd9de', navy: '#12284b', gold: '#ffc52f', red: '#e0245e', win: '#00ba7c' };
const FONT = '-apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif';
/* ======================== */

const D = window.DATA, C = COLORS, W = 1080, H = 1920, ctx = document.querySelector('canvas').getContext('2d');
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), seg = (t, a, b) => cl((t - a) / (b - a));
const oc = u => 1 - (1 - u) ** 3, io = u => u < .5 ? 4 * u ** 3 : 1 - (-2 * u + 2) ** 3 / 2, back = u => 1 + 2.7 * (u - 1) ** 3 + 1.7 * (u - 1) ** 2;
const S = { post: 0, time: 3.4, flip: 11, first: 17, end: 22, dur: 26.5 };
function txt(s, x, y, size, col, { align = 'left', weight = 400, alpha = 1 } = {}) { ctx.save(); ctx.globalAlpha *= alpha; ctx.font = `${weight} ${size}px ${FONT}`; ctx.fillStyle = col; ctx.textAlign = align; ctx.fillText(s, x, y); ctx.restore(); }
const fade = (t, a, b) => seg(t, a, a + .3) * (1 - seg(t, b, b + .35));
const lcs = y => D.lcs.find(s => s.year === y);
const lastLoss = D.lcs.filter(s => s.year < D.now && s.w < s.l).pop(), thisOne = lcs(D.now);
const nlBefore = D.lcs.filter(s => s.round === 'NLCS' && s.year < D.now && s.w > s.l).length;

function draw(t) {
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  // 1 · the post
  if (t < S.time + .6) { const a = fade(t, S.post, S.time), u = oc(seg(t, .2, .9));
    ctx.globalAlpha = a; Post.card(ctx, D.post, 60, 640 + (1 - u) * 400, { theme: 'light', u: seg(t, .6, 2.6), avatarA: C.navy, avatarB: C.gold }); ctx.globalAlpha = 1; }
  // 2 · the postseason years, top to bottom; a long gap between two of them becomes its own line
  if (t >= S.time && t < S.flip + .4) { const a = fade(t, S.time, S.flip), l = t - S.time;
    const yrs = Object.keys(D.years).map(Number), rows = [];
    yrs.forEach((y, i) => { if (i && y - yrs[i - 1] > 8) rows.push({ gap: y - yrs[i - 1] - 1 }); rows.push({ y }); });
    const y0 = 400, step = Math.min(110, 1380 / (rows.length - 1)), shown = Math.floor(rows.length * io(seg(l, .4, 5.4)));
    ctx.globalAlpha = a;
    const head = rows.slice(0, Math.max(1, shown)).filter(r => r.y).pop()?.y || D.first, gone = Math.max(0, Math.min(D.gap, head - D.lastWS.year));
    txt(COPY.wait(gone), W / 2, 190, 110, C.navy, { align: 'center', weight: 900, alpha: seg(l, 1.6, 2) });
    txt(COPY.since(D.lastWS.year), W / 2, 260, 40, C.mute, { align: 'center', alpha: seg(l, 1.6, 2) });
    ctx.fillStyle = C.line; ctx.fillRect(150, y0, 4, Math.max(0, shown - 1) * step);
    rows.slice(0, shown).forEach((r, i) => { const y = y0 + i * step;
      if (r.gap) { txt(`${r.gap} seasons without October`, 200, y + 12, 36, C.mute, { weight: 500 }); ctx.fillStyle = C.line; for (let k = -1; k <= 1; k++) ctx.fillRect(146, y + k * 14 - 2, 12, 4); return; }
      const ps = D.years[r.y], ws = ps.find(s => s.round === 'World Series'), lc = ps.find(s => /LCS/.test(s.round)), last = ps[ps.length - 1], big = ws || r.y === D.now;
      const col = big ? C.gold : lc ? (lc.w > lc.l ? C.win : C.red) : C.navy;
      ctx.fillStyle = col; ctx.beginPath(); ctx.arc(152, y, big ? 18 : 11, 0, 7); ctx.fill();
      txt(String(r.y), 200, y + 14, 40, C.text, { weight: 800 });
      txt(`${last.round} · ${last.opp} ${last.w}–${last.l}`, 320, y + 14, big ? 42 : 36, big ? C.navy : col === C.navy ? C.mute : col, { weight: big ? 800 : 600 }); });
    ctx.globalAlpha = 1; }
  // 3 · last October, this October: the same four games, the other way round
  if (t >= S.flip && t < S.first + .4) { const a = fade(t, S.flip, S.first), l = t - S.flip;
    ctx.globalAlpha = a;
    [[lastLoss, COPY.last, 330], [thisOne, COPY.now, 1030]].forEach(([s, head, y], k) => { const t0 = k ? 2.2 : .2;
      txt(`${head} · ${s.year} ${s.round}`, W / 2, y, 50, C.mute, { align: 'center', weight: 700, alpha: seg(l, t0, t0 + .3) });
      txt(`${s.w > s.l ? 'Brewers' : s.opp} ${Math.max(s.w, s.l)}, ${s.w > s.l ? s.opp : 'Brewers'} ${Math.min(s.w, s.l)}`, W / 2, y + 110, 80, s.w > s.l ? C.win : C.red, { align: 'center', weight: 900, alpha: seg(l, t0 + .2, t0 + .5) });
      const games = [...Array(s.w + s.l)].map((_, i) => i < s.w ? 'W' : 'L');
      games.forEach((g, i) => { const u = back(seg(l, t0 + .6 + i * .3, t0 + .9 + i * .3)), x = W / 2 + (i - (games.length - 1) / 2) * 190, yy = y + 260;
        ctx.save(); ctx.translate(x, yy); ctx.scale(u, u); ctx.fillStyle = g === 'W' ? C.win : C.red; ctx.beginPath(); ctx.roundRect(-75, -75, 150, 150, 20); ctx.fill();
        txt(g, 0, 32, 96, '#fff', { align: 'center', weight: 900 }); ctx.restore(); }); });
    ctx.globalAlpha = 1; }
  // 4 · what it means
  if (t >= S.first && t < S.end + .4) { const a = fade(t, S.first, S.end), l = t - S.first;
    ctx.globalAlpha = a; ctx.fillStyle = C.navy; ctx.fillRect(0, 0, W, H);
    const s = back(seg(l, .1, .6)); ctx.save(); ctx.translate(W / 2, 820); ctx.scale(s, s); txt(String(D.gap), 0, 120, 420, C.gold, { align: 'center', weight: 900 }); ctx.restore();
    txt('years', W / 2, 1040, 70, '#fff', { align: 'center', weight: 700, alpha: seg(l, .5, .9) });
    txt(COPY.first(D.lastWS.year), W / 2, 1240, 54, '#fff', { align: 'center', weight: 800, alpha: seg(l, 1.4, 1.8) });
    if (!nlBefore) txt(COPY.nl, W / 2, 1330, 44, C.gold, { align: 'center', weight: 600, alpha: seg(l, 2.4, 2.8) });
    ctx.globalAlpha = 1; }
  // 5 · back to the post
  if (t >= S.end) { const a = seg(t, S.end, S.end + .3) * (1 - seg(t, S.dur - .4, S.dur));
    ctx.globalAlpha = a; Post.card(ctx, D.post, 150, 520, { theme: 'light', scale: .8, avatarA: C.navy, avatarB: C.gold });
    txt(COPY.next, W / 2, 1180, 72, C.navy, { align: 'center', weight: 900, alpha: seg(t, S.end + .6, S.end + 1) });
    txt(D.source, W / 2, 1850, 26, C.mute, { align: 'center' });
    ctx.globalAlpha = 1; }
}

const sounds = [{ t: .2, kind: 'swish', dur: .4, v: .4 }];
Object.keys(D.years).forEach((y, i, all) => { const yr = +y, tt = S.time + .4 + 5 * (i + 1.5) / (all.length + 1); sounds.push({ t: tt, kind: D.years[y].some(s => s.round === 'World Series') || yr === D.now ? 'ding' : 'tick', v: .3 }); });
for (let k = 0; k < 8; k++) sounds.push({ t: S.flip + (k < 4 ? .8 : 2.8) + (k % 4) * .3, kind: 'pop', v: .4, pitch: k < 4 ? -4 : 4 });
sounds.push({ t: S.first + .1, kind: 'impact', v: .5 }, { t: S.end + .6, kind: 'tada', v: .5 });
window.__scene = { duration: S.dur, sounds, music: { style: 'piano', bpm: 100, lift: [S.flip + 2.2] }, ready: document.fonts.ready, async seek(t) { draw(t); } };
if (!/rec=1/.test(location.search)) { const t0 = performance.now(); (function f() { draw(((performance.now() - t0) / 1000) % S.dur); requestAnimationFrame(f); })(); }
</script>
